<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phillies</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            background: #f5f5f5;
            color: #1d1d1f;
        }

        /* =========================
           Header
        ========================= */

        .header {
            width: 100%;
            background: #e81828;
            color: #ffffff;
            border-bottom: 4px solid #002d72;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .site-title-mark {
            width: 42px;
            height: 42px;

            border: 3px solid #ffffff;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 800;
        }

        .site-title-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* =========================
           Main
        ========================= */

        main {
            max-width: 1200px;
            min-height: calc(100vh - 82px);
            margin: 0 auto;

            padding: 40px 24px;
        }

        /* =========================
           Empty Content Area
        ========================= */

        .content-area {
            min-height: 500px;

            background: #ffffff;

            border-radius: 14px;

            border: 1px solid #e1e1e1;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.05);
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 600px) {

            .header-inner {
                padding: 15px 18px;
            }

            .site-title-mark {
                width: 36px;
                height: 36px;

                font-size: 15px;
            }

            .site-title-text {
                font-size: 20px;
            }

            main {
                padding: 24px 14px;
            }

            .content-area {
                min-height: 600px;
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="header-inner">

            <div class="site-title">

                <div class="site-title-mark">
                    P
                </div>

                <div class="site-title-text">
                    PHILLIES
                </div>

            </div>

        </div>

    </header>


    <main>

        <div class="content-area">
        </div>

    </main>

</body>
</html>
