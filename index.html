<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
>
<title>Phillies</title>
<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>
<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>
<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --navy:
        #07152b;
    --navy-2:
        #0b1c38;
    --red:
        #e31937;
    --white:
        #ffffff;
    --muted:
        #64748b;
    --line:
        rgba(255,255,255,.075);
}
/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color:
        transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background:
        var(--navy);
}
body {
    color:
        var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =========================================================
   HEADER
   schedule.html と完全統一
========================================================= */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    overflow: hidden;
    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );
    box-shadow:
        0 7px 22px
        rgba(0,0,0,.30);
}
.header::before {
    content: "";
    position: absolute;
    top: -120px;
    right: -55px;
    width: 300px;
    height: 300px;
    transform:
        rotate(27deg);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.015)
        );
    border-left:
        1px solid
        rgba(255,255,255,.16);
    pointer-events:
        none;
}
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,.35) 45%,
            rgba(255,255,255,.28) 72%,
            transparent 100%
        );
    pointer-events:
        none;
}
.header-navy-shape {
    position: absolute;
    top: -20px;
    left: 43%;
    width: 130px;
    height: 130px;
    transform:
        rotate(25deg);
    background:
        rgba(7,21,43,.16);
    pointer-events:
        none;
}
.header-line-one {
    position: absolute;
    left: -20px;
    bottom: 14px;
    width: 55%;
    height: 2px;
    transform:
        skewX(-35deg);
    background:
        rgba(255,255,255,.34);
    pointer-events:
        none;
}
.header-line-two {
    position: absolute;
    left: 4%;
    bottom: 8px;
    width: 35%;
    height: 1px;
    transform:
        skewX(-35deg);
    background:
        rgba(255,255,255,.18);
    pointer-events:
        none;
}
.header-light {
    position: absolute;
    top: -85px;
    right: 20px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,.06) 35%,
            transparent 72%
        );
    pointer-events:
        none;
}
/* =========================================================
   MAIN
========================================================= */
main {
    min-height:
        100vh;
    padding-top:
        72px;
}
.page {
    width: 100%;
    padding:
        21px 14px 35px;
}
/* =========================================================
   PAGE HEADING
   schedule.html と完全統一
========================================================= */
.page-heading {
    margin-bottom:
        17px;
}
.page-heading h1 {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        31px;
    font-weight:
        800;
    line-height:
        .95;
    letter-spacing:
        -.5px;
}
.page-heading p {
    margin-top:
        6px;
    color:
        var(--muted);
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        1.4px;
}
/* =========================================================
   HOME CONTENT
========================================================= */
.home-content {
    width:
        100%;
    min-height:
        300px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border:
        1px solid
        var(--line);
    border-radius:
        16px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );
    box-shadow:
        0 8px 24px
        rgba(0,0,0,.12);
}
.home-placeholder {
    text-align:
        center;
}
.home-placeholder strong {
    display:
        block;
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        24px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.home-placeholder span {
    display:
        block;
    margin-top:
        7px;
    color:
        var(--muted);
    font-size:
        9px;
    font-weight:
        700;
    letter-spacing:
        1.2px;
}
/* =========================================================
   BOTTOM NAV
   schedule.html と完全統一
========================================================= */
.bottom-nav {
    position:
        fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index:
        999;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 5px
        env(safe-area-inset-bottom);
    display:
        flex;
    align-items:
        flex-start;
    justify-content:
        space-between;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
.nav-item {
    flex:
        1;
    min-width:
        0;
    height:
        60px;
    display:
        flex;
    flex-direction:
        column;
    align-items:
        center;
    justify-content:
        center;
    gap:
        5px;
    text-decoration:
        none;
    color:
        #64748b;
    border-radius:
        13px;
    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}
.nav-item:active {
    transform:
        scale(.94);
}
.nav-item.active {
    color:
        #ffffff;
    background:
        rgba(227,25,55,.13);
}
.nav-icon {
    width:
        25px;
    height:
        25px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        18px;
    font-weight:
        700;
    line-height:
        1;
}
.nav-item.active
.nav-icon {
    color:
        #e31937;
}
.nav-label {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        10px;
    font-weight:
        700;
    line-height:
        1;
    letter-spacing:
        .45px;
    white-space:
        nowrap;
}
/* =========================================================
   SMALL IPHONE
   schedule.html と統一
========================================================= */
@media (
    max-width: 360px
) {
    .header {
        height:
            68px;
    }
    main {
        padding-top:
            68px;
    }
    .page {
        padding-left:
            11px;
        padding-right:
            11px;
    }
    .nav-label {
        font-size:
            9px;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     HEADER
===================================================== -->
<header class="header">
    <div class="header-navy-shape"></div>
    <div class="header-line-one"></div>
    <div class="header-line-two"></div>
    <div class="header-light"></div>
</header>
<!-- =====================================================
     MAIN
===================================================== -->
<main>
<section class="page">
    <div class="page-heading">
        <h1>
            Phillies
        </h1>
        <p>
            PHILADELPHIA PHILLIES
        </p>
    </div>
    <div class="home-content">
        <div class="home-placeholder">
            <strong>
                HOME
            </strong>
            <span>
                NEWS WILL BE ADDED LATER
            </span>
        </div>
    </div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
     schedule.html と同一
===================================================== -->
<nav class="bottom-nav">
    <!-- 1 SCHEDULE -->
    <a
        href="schedule.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
    <!-- 2 SCORE -->
    <a
        href="score.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ●
        </div>
        <div class="nav-label">
            SCORE
        </div>
    </a>
    <!-- 3 HOME -->
    <a
        href="index.html"
        class="nav-item active"
    >
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <!-- 4 PLAYER -->
    <a
        href="player.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <!-- 5 STATS -->
    <a
        href="stats.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
</nav>
</body>
</html>
