<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>PHILLIES</title>

<style>

/* ========================================
   COLOR
======================================== */

:root {
    --navy: #07152b;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
}


/* ========================================
   RESET
======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}


html,
body {

    width: 100%;
    min-height: 100%;

    background: var(--navy);
}


body {

    color: var(--white);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}


/* ========================================
   HEADER
======================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    height: 92px;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    padding-left: 22px;

    background:
        linear-gradient(
            135deg,
            #e31937 0%,
            #d91634 55%,
            #c8102e 100%
        );

    border-bottom:
        1px solid
        rgba(255,255,255,0.16);

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.22);

    overflow: hidden;
}


/* ========================================
   HEADER LIGHT
======================================== */

.header::before {

    content: "";

    position: absolute;

    top: -70px;
    right: -70px;

    width: 230px;
    height: 230px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.07);

    pointer-events: none;
}


/* ========================================
   HEADER BOTTOM LINE
======================================== */

.header::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.22),
            rgba(255,255,255,0.04),
            rgba(255,255,255,0.18)
        );

    opacity: .7;

    pointer-events: none;
}


/* ========================================
   PHILLIES
   下部タブと同じ字体
======================================== */

.logo {

    position: relative;

    z-index: 2;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 48px;

    font-weight: 700;

    font-style: italic;

    line-height: 1;

    color: var(--white);

    white-space: nowrap;
}


/* ========================================
   MAIN
======================================== */

main {

    min-height: 100vh;

    padding-top: 92px;
}


/* ========================================
   BOTTOM NAVIGATION
======================================== */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 200;

    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    padding:
        7px 5px
        env(safe-area-inset-bottom);

    display: flex;

    align-items: flex-start;

    justify-content:
        space-between;

    background:
        rgba(5,16,34,0.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}


/* ========================================
   NAV ITEM
======================================== */

.nav-item {

    flex: 1;

    min-width: 0;

    height: 60px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    text-decoration: none;

    color: var(--muted);

    border-radius: 13px;

    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}


.nav-item:active {

    transform:
        scale(.94);
}


/* ========================================
   NAV ICON
======================================== */

.nav-icon {

    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    font-weight: 700;
}


/* ========================================
   NAV LABEL
======================================== */

.nav-label {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .45px;

    white-space: nowrap;
}


/* ========================================
   ACTIVE TAB
======================================== */

.nav-item.active {

    color: var(--white);

    background:
        rgba(227,25,55,0.13);
}


.nav-item.active .nav-icon {

    color: var(--red);
}


/* ========================================
   SMALL IPHONE
======================================== */

@media (max-width: 360px) {

    .header {

        height: 88px;

        padding-left: 18px;
    }


    main {

        padding-top: 88px;
    }


    .logo {

        font-size: 42px;
    }


    .nav-label {

        font-size: 9px;
    }

}

</style>
</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header class="header">

    <div class="logo">
        PHILLIES
    </div>

</header>


<!-- ========================================
     MAIN
     現在は空
======================================== -->

<main>
</main>


<!-- ========================================
     BOTTOM NAVIGATION
======================================== -->

<nav class="bottom-nav">


    <!-- SCHEDULE -->

    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ▣
        </div>

        <div class="nav-label">
            SCHEDULE
        </div>

    </a>


    <!-- SCORE -->

    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ●
        </div>

        <div class="nav-label">
            SCORE
        </div>

    </a>


    <!-- HOME -->

    <a href="#"
       class="nav-item active">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            HOME
        </div>

    </a>


    <!-- PLAYER -->

    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ♟
        </div>

        <div class="nav-label">
            PLAYER
        </div>

    </a>


    <!-- STATS -->

    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ▥
        </div>

        <div class="nav-label">
            STATS
        </div>

    </a>

</nav>


<script>

/* ========================================
   TAB ACTIVE
======================================== */

const navItems =
    document.querySelectorAll(".nav-item");


navItems.forEach(item => {

    item.addEventListener(
        "click",
        () => {

            navItems.forEach(nav => {

                nav.classList.remove(
                    "active"
                );

            });


            item.classList.add(
                "active"
            );

        }
    );

});

</script>


</body>
</html>
