<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Phillies Reader</title>


<style>

/* =========================================================
   BASE
========================================================= */

:root{

    --navy:#07152b;
    --navy2:#0b1b34;
    --navy3:#102544;

    --red:#e31937;
    --red-dark:#b9142d;

    --white:#ffffff;

    --gray:#91a0b8;
    --gray2:#61718a;

    --line:rgba(255,255,255,.08);

    --gold:#ffd447;
}


*{
    box-sizing:border-box;

    margin:0;
    padding:0;

    -webkit-tap-highlight-color:transparent;
}


html,
body{

    width:100%;
    min-height:100%;

    background:var(--navy);

}


body{

    color:var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom:
        calc(
            78px +
            env(safe-area-inset-bottom)
        );

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:fixed;

    z-index:100;

    top:0;
    left:0;
    right:0;

    height:72px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #e31937 0%,
            #c91531 100%
        );

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

}


.header::before{

    content:"";

    position:absolute;

    width:160%;
    height:130px;

    left:-30%;
    top:-62px;

    transform:
        rotate(-7deg);

    border-top:
        2px solid
        rgba(255,255,255,.13);

    border-bottom:
        2px solid
        rgba(255,255,255,.08);

}


.logo{

    position:relative;

    z-index:2;

    color:#fff;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

    font-size:43px;

    font-style:italic;

    letter-spacing:-1px;

    text-transform:uppercase;

    text-shadow:
        2px 2px 0 rgba(0,0,0,.12);

}


/* =========================================================
   MAIN
========================================================= */

main{

    padding-top:72px;

}


.page{

    width:100%;

    padding:
        22px 14px 35px;

}


/* =========================================================
   PAGE TITLE
========================================================= */

.page-title{

    margin-bottom:17px;

}


.page-title h1{

    font-size:30px;

    line-height:1;

    font-weight:850;

    letter-spacing:-.6px;

}


.page-title p{

    margin-top:6px;

    color:var(--gray);

    font-size:9px;

    font-weight:800;

    letter-spacing:1.4px;

}


/* =========================================================
   FILTER AREA
========================================================= */

.filters-wrap{

    width:100%;

    overflow-x:auto;

    overflow-y:hidden;

    margin-bottom:10px;

    scrollbar-width:none;

}


.filters-wrap::-webkit-scrollbar{

    display:none;

}


.filters{

    display:flex;

    gap:7px;

    width:max-content;

}


/* =========================================================
   SELECT
========================================================= */

.filter-box{

    position:relative;

    width:120px;

    flex-shrink:0;

}


.filter-box select{

    width:100%;

    height:38px;

    padding:
        0 28px
        0 11px;

    border:
        1px solid
        var(--line);

    border-radius:10px;

    background:
        rgba(255,255,255,.045);

    color:#fff;

    outline:none;

    appearance:none;

    -webkit-appearance:none;

    font-family:inherit;

    font-size:10px;

    font-weight:800;

}


.filter-box select option{

    background:var(--navy2);

    color:#fff;

}


.filter-box::after{

    content:"⌄";

    position:absolute;

    right:10px;

    top:7px;

    color:
        rgba(255,255,255,.55);

    font-size:16px;

    pointer-events:none;

}


/* =========================================================
   COUNT
========================================================= */

.news-info{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;

}


.news-label{

    color:
        rgba(255,255,255,.35);

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;

}


.news-count{

    color:
        rgba(255,255,255,.45);

    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;

    font-size:11px;

    font-weight:800;

}


/* =========================================================
   NEWS LIST
========================================================= */

.news-list{

    display:flex;

    flex-direction:column;

    gap:11px;

}


/* =========================================================
   NEWS CARD
========================================================= */

.news-card{

    position:relative;

    overflow:hidden;

    width:100%;

    border:
        1px solid
        var(--line);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);

    transition:
        opacity .15s ease,
        transform .15s ease;

}


.news-card::before{

    content:"";

    position:absolute;

    left:0;

    top:0;
    bottom:0;

    width:4px;

    background:var(--red);

}


.news-card.read{

    opacity:.52;

}


.news-card:active{

    transform:scale(.985);

}


/* =========================================================
   NEWS LINK
========================================================= */

.news-link{

    display:block;

    padding:
        14px
        14px
        13px
        18px;

    color:#fff;

    text-decoration:none;

}


/* =========================================================
   CARD TOP
========================================================= */

.card-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    padding-right:76px;

    margin-bottom:8px;

}


.meta{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:0;

}


.source{

    color:var(--red);

    font-size:9px;

    font-weight:900;

    letter-spacing:.7px;

    white-space:nowrap;

}


.type{

    color:
        rgba(255,255,255,.38);

    font-size:8px;

    font-weight:800;

    white-space:nowrap;

}


.date{

    color:
        rgba(255,255,255,.32);

    font-size:8px;

    white-space:nowrap;

}


/* =========================================================
   TITLE
========================================================= */

.news-title{

    font-size:18px;

    line-height:1.27;

    font-weight:850;

    letter-spacing:-.25px;

}


.news-card.read
.news-title{

    color:
        rgba(255,255,255,.65);

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{

    margin-top:7px;

    color:
        rgba(255,255,255,.47);

    font-size:10px;

    line-height:1.5;

}


/* =========================================================
   CARD FOOTER
========================================================= */

.card-footer{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:11px;

    padding-top:9px;

    border-top:
        1px solid
        rgba(255,255,255,.045);

}


.status{

    color:
        rgba(255,255,255,.32);

    font-size:8px;

    font-weight:900;

    letter-spacing:.7px;

}


.news-card.read
.status{

    color:
        rgba(255,255,255,.55);

}


.arrow{

    color:var(--red);

    font-size:19px;

    font-weight:800;

    line-height:1;

}


/* =========================================================
   FAVORITE
========================================================= */

.favorite-button{

    position:absolute;

    z-index:10;

    top:9px;
    right:9px;

    width:34px;
    height:34px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.35);

    font-size:20px;

    cursor:pointer;

}


.favorite-button.active{

    color:var(--gold);

    background:
        rgba(255,212,71,.10);

}


/* =========================================================
   READ BUTTON
========================================================= */

.read-button{

    position:absolute;

    z-index:10;

    top:11px;
    right:48px;

    height:30px;

    padding:
        0 8px;

    border:0;

    border-radius:8px;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.45);

    font-family:inherit;

    font-size:8px;

    font-weight:900;

    cursor:pointer;

}


.read-button.read{

    color:#fff;

    background:
        rgba(227,25,55,.16);

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    padding:
        55px 20px;

    text-align:center;

    color:var(--gray);

    font-size:11px;

    line-height:1.7;

}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    z-index:200;

    left:0;
    right:0;
    bottom:0;

    height:
        calc(
            78px +
            env(safe-area-inset-bottom)
        );

    padding:
        6px 7px
        env(safe-area-inset-bottom);

    display:flex;

    align-items:flex-start;

    justify-content:space-around;

    background:
        rgba(5,16,34,.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,.08);

}


.nav{

    flex:1;

    max-width:100px;

    height:61px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    border-radius:13px;

    color:var(--gray);

    text-decoration:none;

}


.nav.active{

    color:#fff;

    background:
        rgba(227,25,55,.13);

}


.nav-icon{

    height:23px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

}


.nav-name{

    font-size:9px;

    font-weight:850;

    letter-spacing:.5px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:360px){

    .page{

        padding-left:11px;
        padding-right:11px;

    }


    .logo{

        font-size:39px;

    }


    .news-title{

        font-size:17px;

    }


    .filter-box{

        width:112px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="logo">
        PHILLIES
    </div>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main>

<section class="page">


    <!-- TITLE -->

    <div class="page-title">

        <h1>
            Phillies News
        </h1>

        <p>
            LATEST PHILADELPHIA PHILLIES
        </p>

    </div>


    <!-- ===================================================
         4 FILTERS
         横並び・横スクロール
    ==================================================== -->

    <div class="filters-wrap">

        <div class="filters">


            <!-- 状態 -->

            <div class="filter-box">

                <select id="statusFilter">

                    <option value="all">
                        すべて
                    </option>

                    <option value="unread">
                        未読
                    </option>

                    <option value="read">
                        既読
                    </option>

                    <option value="favorite">
                        お気に入り
                    </option>

                </select>

            </div>


            <!-- 記事種類 -->

            <div class="filter-box">

                <select id="typeFilter">

                    <option value="all">
                        すべて
                    </option>

                    <option value="GAME">
                        GAME
                    </option>

                    <option value="NEWS">
                        NEWS
                    </option>

                    <option value="ANALYSIS">
                        ANALYSIS
                    </option>

                    <option value="TRANSACTION">
                        TRANSACTION
                    </option>

                    <option value="INJURY">
                        INJURY
                    </option>

                    <option value="OTHER">
                        その他
                    </option>

                </select>

            </div>


            <!-- 媒体 -->

            <div class="filter-box">

                <select id="sourceFilter">

                    <option value="all">
                        すべて
                    </option>

                </select>

            </div>


            <!-- 期間 -->

            <div class="filter-box">

                <select id="periodFilter">

                    <option value="all">
                        すべて
                    </option>

                    <option value="24">
                        24時間
                    </option>

                    <option value="3">
                        3日
                    </option>

                    <option value="7">
                        7日
                    </option>

                    <option value="30">
                        30日
                    </option>

                </select>

            </div>


        </div>

    </div>


    <!-- NEWS INFO -->

    <div class="news-info">

        <span class="news-label">
            NEWS
        </span>

        <span
            id="newsCount"
            class="news-count"
        >
            0 ARTICLES
        </span>

    </div>


    <!-- NEWS -->

    <div
        id="newsList"
        class="news-list"
    >

        <div class="empty">
            ニュースを読み込んでいます…
        </div>

    </div>


</section>

</main>


<!-- =======================================================
     BOTTOM NAV
======================================================= -->

<nav class="bottom-nav">


    <a
        href="schedule.html"
        class="nav"
    >

        <div class="nav-icon">
            ▣
        </div>

        <div class="nav-name">
            SCHEDULE
        </div>

    </a>


    <a
        href="score.html"
        class="nav"
    >

        <div class="nav-icon">
            ●
        </div>

        <div class="nav-name">
            SCORE
        </div>

    </a>


    <a
        href="index.html"
        class="nav active"
    >

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-name">
            HOME
        </div>

    </a>


    <a
        href="player.html"

    >

        <div class="nav-icon">
            ♟
        </div>

        <div class="nav-name">

        </div>

    <a
        href="stats.html"

    >

        <div class="nav-icon">
            ▥
        </div>

        <div class="nav-name">
            STATS
        </div>

</nav>


<script>

/* =========================================================
   DATA
========================================================= */

const NEWS_URL =
    "data/news.json";


/* =========================================================
   LOCAL STORAGE
========================================================= */

const READ_KEY =
    "phillies_reader_read";

const FAVORITE_KEY =
    "phillies_reader_favorite";


/* =========================================================
   STATE
========================================================= */

let articles = [];

let statusFilter = "all";

let typeFilter = "all";

let sourceFilter = "all";

let periodFilter = "all";


/* =========================================================
   DOM
========================================================= */

const newsList =
    document.getElementById(
        "newsList"
    );


const newsCount =
    document.getElementById(
        "newsCount"
    );


const statusSelect =
    document.getElementById(
        "statusFilter"
    );


const typeSelect =
    document.getElementById(
        "typeFilter"
    );


const sourceSelect =
    document.getElementById(
        "sourceFilter"
    );


const periodSelect =
    document.getElementById(
        "periodFilter"
    );


/* =========================================================
   STORAGE HELPERS
========================================================= */

function loadStorage(
    key
){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    key
                ) || "[]"
            );


        return Array.isArray(data)
            ? data
            : [];

    }

    catch(error){

        return [];

    }

}


function saveStorage(
    key,
    data
){

    localStorage.setItem(
        key,
        JSON.stringify(
            data
        )
    );

}


let readIds =
    loadStorage(
        READ_KEY
    );


let favoriteIds =
    loadStorage(
        FAVORITE_KEY
    );


/* =========================================================
   ARTICLE ID
========================================================= */

function getId(
    article
){

    return String(

        article.id ||

        article.guid ||

        article.url ||

        article.link ||

        (
            String(
                article.title ||
                ""
            )
            +
            "|"
            +
            String(
                article.publishedAt ||
                article.published ||
                article.date ||
                ""
            )
        )

    );

}


/* =========================================================
   READ
========================================================= */

function isRead(
    article
){

    return readIds.includes(
        getId(article)
    );

}


function setRead(
    article,
    value
){

    const id =
        getId(article);


    const index =
        readIds.indexOf(id);


    if(
        value &&
        index === -1
    ){

        readIds.push(id);

    }


    if(
        !value &&
        index !== -1
    ){

        readIds.splice(
            index,
            1
        );

    }


    saveStorage(
        READ_KEY,
        readIds
    );

}


/* =========================================================
   FAVORITE
========================================================= */

function isFavorite(
    article
){

    return favoriteIds.includes(
        getId(article)
    );

}


function toggleFavorite(
    article
){

    const id =
        getId(article);


    const index =
        favoriteIds.indexOf(id);


    if(
        index === -1
    ){

        favoriteIds.push(id);

    }

    else{

        favoriteIds.splice(
            index,
            1
        );

    }


    saveStorage(
        FAVORITE_KEY,
        favoriteIds
    );


    render();

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   SOURCE
========================================================= */

function getSource(
    article
){

    return String(

        article.source ||

        article.publisher ||

        article.site ||

        article.sourceName ||

        article.outlet ||

        "その他"

    ).trim();

}


/* =========================================================
   TYPE
========================================================= */

function getType(
    article
){

    const raw =
        String(

            article.type ||

            article.category ||

            article.articleType ||

            article.kind ||

            ""

        )
        .trim()
        .toUpperCase();


    if(
        raw.includes("GAME") ||
        raw.includes("RECAP") ||
        raw.includes("PREVIEW")
    ){

        return "GAME";

    }


    if(
        raw.includes("ANALYSIS") ||
        raw.includes("ANALYTICS")
    ){

        return "ANALYSIS";

    }


    if(
        raw.includes("TRANSACTION") ||
        raw.includes("ROSTER") ||
        raw.includes("SIGN") ||
        raw.includes("TRADE")
    ){

        return "TRANSACTION";

    }


    if(
        raw.includes("INJURY") ||
        raw.includes("INJURED")
    ){

        return "INJURY";

    }


    if(
        raw.includes("NEWS")
    ){

        return "NEWS";

    }


    /*
     * typeが存在しない旧データについては
     * タイトルから最低限判定
     */

    const title =
        String(
            article.title || ""
        ).toUpperCase();


    if(
        /INJURY|INJURED|IL\b|INJURED LIST/.test(title)
    ){

        return "INJURY";

    }


    if(
        /TRADE|SIGNED|SIGNING|ACQUIRED|DESIGNATED|ROSTER/.test(title)
    ){

        return "TRANSACTION";

    }


    if(
        /ANALYSIS|WHY |BREAKDOWN|OUTLOOK/.test(title)
    ){

        return "ANALYSIS";

    }


    return "NEWS";

}


/* =========================================================
   DATE
========================================================= */

function getDate(
    article
){

    return new Date(

        article.publishedAt ||

        article.published ||

        article.date ||

        article.datetime ||

        article.createdAt ||

        0

    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    article
){

    const date =
        getDate(article);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleString(
        "ja-JP",
        {
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   LOAD SOURCE OPTIONS
========================================================= */

function buildSourceOptions(){

    const sources =
        [...new Set(

            articles.map(
                article =>
                    getSource(
                        article
                    )
            )

        )]
        .filter(Boolean)
        .sort();


    sourceSelect.innerHTML = `

        <option value="all">
            すべて
        </option>

    `;


    sources.forEach(
        source => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                source;


            option.textContent =
                source;


            sourceSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   PERIOD
========================================================= */

function withinPeriod(
    article
){

    if(
        periodFilter === "all"
    ){

        return true;

    }


    const date =
        getDate(
            article
        );


    const time =
        date.getTime();


    if(
        Number.isNaN(time)
    ){

        return false;

    }


    const now =
        Date.now();


    const days =
        Number(
            periodFilter
        );


    const limit =
        days *
        24 *
        60 *
        60 *
        1000;


    return (
        now -
        time
        <=
        limit
    );

}


/* =========================================================
   FILTER ARTICLES
========================================================= */

function getFilteredArticles(){

    return articles.filter(
        article => {

            const read =
                isRead(
                    article
                );


            const favorite =
                isFavorite(
                    article
                );


            const type =
                getType(
                    article
                );


            const source =
                getSource(
                    article
                );


            if(
                statusFilter ===
                "unread" &&
                read
            ){

                return false;

            }


            if(
                statusFilter ===
                "read" &&
                !read
            ){

                return false;

            }


            if(
                statusFilter ===
                "favorite" &&
                !favorite
            ){

                return false;

            }


            if(
                typeFilter !==
                "all" &&
                type !==
                typeFilter
            ){

                return false;

            }


            if(
                sourceFilter !==
                "all" &&
                source !==
                sourceFilter
            ){

                return false;

            }


            if(
                !withinPeriod(
                    article
                )
            ){

                return false;

            }


            return true;

        }
    );

}


/* =========================================================
   SORT
========================================================= */

function sortArticles(
    list
){

    return [...list].sort(
        (
            a,
            b
        ) => {

            return (
                getDate(b).getTime()
                -
                getDate(a).getTime()
            );

        }
    );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    article
){

    const card =
        document.createElement(
            "article"
        );


    const read =
        isRead(
            article
        );


    const favorite =
        isFavorite(
            article
        );


    card.className =
        "news-card" +
        (
            read
            ? " read"
            : ""
        );


    const url =
        article.url ||
        article.link ||
        "#";


    const title =
        article.title ||
        "タイトルなし";


    const description =
        article.description ||
        article.summary ||
        article.excerpt ||
        "";


    card.innerHTML = `

        <button
            type="button"
            class="read-button ${
                read
                ? "read"
                : ""
            }"
        >
            ${
                read
                ? "既読"
                : "未読"
            }
        </button>


        <button
            type="button"
            class="favorite-button ${
                favorite
                ? "active"
                : ""
            }"
        >
            ${
                favorite
                ? "★"
                : "☆"
            }
        </button>


        <a
            class="news-link"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="card-top">

                <div class="meta">

                    <span class="source">

                        ${escapeHTML(
                            getSource(
                                article
                            )
                        )}

                    </span>


                    <span class="type">

                        ${escapeHTML(
                            getType(
                                article
                            )
                        )}

                    </span>


                    <span class="date">

                        ${escapeHTML(
                            formatDate(
                                article
                            )
                        )}

                    </span>

                </div>

            </div>


            <div class="news-title">

                ${escapeHTML(
                    title
                )}

            </div>


            ${
                description
                ?
                `
                <div class="description">

                    ${escapeHTML(
                        description
                    )}

                </div>
                `
                :
                ""
            }


            <div class="card-footer">

                <span class="status">

                    ${
                        read
                        ? "READ"
                        : "UNREAD"
                    }

                </span>


                <span class="arrow">
                    ›
                </span>

            </div>

        </a>

    `;


    /* -----------------------------------------------------
       FAVORITE
    ----------------------------------------------------- */

    card
    .querySelector(
        ".favorite-button"
    )
    .addEventListener(
        "click",
        event => {

            event.preventDefault();

            event.stopPropagation();

            toggleFavorite(
                article
            );

        }
    );


    /* -----------------------------------------------------
       READ BUTTON
    ----------------------------------------------------- */

    card
    .querySelector(
        ".read-button"
    )
    .addEventListener(
        "click",
        event => {

            event.preventDefault();

            event.stopPropagation();

            setRead(
                article,
                !isRead(
                    article
                )
            );

            render();

        }
    );


    /* -----------------------------------------------------
       OPEN ARTICLE = READ
    ----------------------------------------------------- */

    card
    .querySelector(
        ".news-link"
    )
    .addEventListener(
        "click",
        () => {

            setRead(
                article,
                true
            );

        }
    );


    return card;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const filtered =
        sortArticles(
            getFilteredArticles()
        );


    newsList.innerHTML =
        "";


    newsCount.textContent =
        filtered.length +
        " ARTICLES";


    if(
        filtered.length ===
        0
    ){

        let message =
            "該当するニュースがありません。";


        if(
            statusFilter ===
            "favorite"
        ){

            message =
                "お気に入りの記事がありません。";

        }


        if(
            statusFilter ===
            "unread"
        ){

            message =
                "未読の記事がありません。";

        }


        if(
            statusFilter ===
            "read"
        ){

            message =
                "既読の記事がありません。";

        }


        newsList.innerHTML = `

            <div class="empty">

                ${message}

            </div>

        `;


        return;

    }


    filtered.forEach(
        article => {

            newsList.appendChild(
                createCard(
                    article
                )
            );

        }
    );

}


/* =========================================================
   LOAD NEWS JSON
========================================================= */

async function loadNews(){

    try{

        const response =
            await fetch(
                NEWS_URL,
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "news.json could not be loaded"
            );

        }


        const data =
            await response.json();


        /*
         * 対応形式
         *
         * [
         *   {...}
         * ]
         *
         * {
         *   articles:[...]
         * }
         *
         * {
         *   news:[...]
         * }
         */

        if(
            Array.isArray(
                data
            )
        ){

            articles =
                data;

        }

        else if(
            Array.isArray(
                data.articles
            )
        ){

            articles =
                data.articles;

        }

        else if(
            Array.isArray(
                data.news
            )
        ){

            articles =
                data.news;

        }

        else{

            articles =
                [];

        }


        buildSourceOptions();

        render();

    }

    catch(error){

        console.error(
            error
        );


        newsList.innerHTML = `

            <div class="empty">

                ニュースデータを
                読み込めませんでした。

                <br><br>

                data/news.json
                を確認してください。

            </div>

        `;

        newsCount.textContent =
            "0 ARTICLES";

    }

}
