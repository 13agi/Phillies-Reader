<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PHILLIES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --navy: #07152b;
    --navy-light: #0c1d38;
    --navy-card: #102542;
    --red: #e31937;
    --red-dark: #c9122e;
    --white: #ffffff;
    --muted: #8fa0b7;
    --line: rgba(255,255,255,0.08);
    --bottom-height: 76px;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}
html {
    background: var(--navy);
}
body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(227,25,55,0.13),
            transparent 35%
        ),
        var(--navy);
    color: var(--white);
    font-family: "Inter", sans-serif;
    padding-bottom: calc(
        var(--bottom-height) +
        env(safe-area-inset-bottom)
    );
}
/* =========================
   HEADER
========================= */
.header {
    position: relative;
    height: 104px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(
            180deg,
            #e31937 0%,
            #d51633 100%
        );
    overflow: hidden;
    box-shadow:
        0 8px 25px rgba(0,0,0,0.28);
}
/* subtle baseball-style stripes */
.header::before {
    content: "";
    position: absolute;
    width: 180%;
    height: 160px;
    left: -40%;
    top: -80px;
    transform: rotate(-8deg);
    border-top: 2px solid rgba(255,255,255,0.12);
    border-bottom: 2px solid rgba(255,255,255,0.08);
    opacity: 0.5;
}
/* =========================
   PHILLIES TITLE
========================= */
.logo {
    position: relative;
    z-index: 2;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 1px;
    font-style: italic;
    color: white;
    text-transform: uppercase;
    text-shadow:
        2px 2px 0 rgba(0,0,0,0.12),
        0 4px 12px rgba(0,0,0,0.16);
    transform: skewX(-5deg);
}
.logo::after {
    content: "";
    display: block;
    height: 3px;
    width: 68%;
    margin: 3px auto 0;
    background: rgba(255,255,255,0.9);
    border-radius: 99px;
}
/* =========================
   MAIN
========================= */
main {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 26px 18px 30px;
}
/* =========================
   HERO
========================= */
.hero {
    position: relative;
    padding: 24px 22px;
    border-radius: 20px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.015)
        );
    border: 1px solid var(--line);
    overflow: hidden;
    margin-bottom: 20px;
}
.hero::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -80px;
    bottom: -100px;
    background: var(--red);
    opacity: 0.12;
    border-radius: 50%;
}
.eyebrow {
    position: relative;
    z-index: 2;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #f05a70;
    margin-bottom: 8px;
}
.hero-title {
    position: relative;
    z-index: 2;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 35px;
    line-height: 0.95;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.hero-text {
    position: relative;
    z-index: 2;
    color: var(--muted);
    font-size: 13px;
    margin-top: 12px;
    line-height: 1.6;
}
/* =========================
   SECTION
========================= */
.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 28px 2px 12px;
}
.section-title h2 {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
}
.section-title span {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
}
/* =========================
   CARDS
========================= */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}
.card {
    position: relative;
    min-height: 128px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-radius: 17px;
    background: var(--navy-card);
    border: 1px solid var(--line);
    overflow: hidden;
    transition:
        transform 0.15s ease,
        border-color 0.15s ease;
}
.card:active {
    transform: scale(0.97);
    border-color: rgba(227,25,55,0.5);
}
.card-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(227,25,55,0.12);
    color: #f02a47;
    font-size: 18px;
    font-weight: 800;
}
.card-title {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.4px;
}
.card-description {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}
/* =========================
   FEATURE CARD
========================= */
.feature {
    min-height: 150px;
    background:
        linear-gradient(
            135deg,
            #102542,
            #0b1b34
        );
}
.feature .card-icon {
    background: var(--red);
    color: white;
}
.feature::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    right: -55px;
    top: -45px;
    border: 2px solid rgba(227,25,55,0.18);
    border-radius: 50%;
}
/* =========================
   BOTTOM NAV
========================= */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    height: calc(
        var(--bottom-height) +
        env(safe-area-inset-bottom)
    );
    padding:
        7px 8px
        env(safe-area-inset-bottom);
    background:
        rgba(5,16,34,0.96);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
}
.nav-item {
    flex: 1;
    max-width: 100px;
    height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    color: #64748b;
    border-radius: 13px;
    transition:
        color 0.15s ease,
        background 0.15s ease;
}
.nav-icon {
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
}
.nav-label {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
}
.nav-item.active {
    color: white;
    background:
        rgba(227,25,55,0.13);
}
.nav-item.active .nav-icon {
    color: var(--red);
}
/* =========================
   SMALL DEVICES
========================= */
@media (max-width: 360px) {
    .header {
        height: 92px;
    }
    .logo {
        font-size: 42px;
    }
    main {
        padding-left: 14px;
        padding-right: 14px;
    }
    .grid {
        gap: 9px;
    }
    .card {
        padding: 15px;
    }
}
/* =========================
   LARGE SCREEN
========================= */
@media (min-width: 700px) {
    body {
        padding-bottom: 0;
    }
    .bottom-nav {
        position: static;
        max-width: 700px;
        margin: 0 auto;
        border: 0;
        background: transparent;
        padding-bottom: 20px;
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="logo">Phillies</div>
</header>
<main>
    <section class="hero">
        <div class="eyebrow">PHILADELPHIA BASEBALL</div>
        <h1 class="hero-title">
            THIS IS<br>
            PHILLIES BASEBALL.
        </h1>
        <p class="hero-text">
            Philliesをもっと深く楽しむための
            パーソナルベースボールサイト。
        </p>
    </section>
    <div class="section-title">
        <h2>EXPLORE</h2>
        <span>PHILLIES</span>
    </div>
    <div class="grid">
        <a href="#" class="card feature">
            <div class="card-icon">P</div>
            <div>
                <div class="card-title">
                    PLAYERS
                </div>
                <div class="card-description">
                    選手情報
                </div>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-icon">S</div>
            <div>
                <div class="card-title">
                    STATS
                </div>
                <div class="card-description">
                    成績・データ
                </div>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-icon">F</div>
            <div>
                <div class="card-title">
                    FACT
                </div>
                <div class="card-description">
                    Philliesの情報
                </div>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-icon">N</div>
            <div>
                <div class="card-title">
                    NOTES
                </div>
                <div class="card-description">
                    自分用メモ
                </div>
            </div>
        </a>
    </div>
</main>
<nav class="bottom-nav">
    <a href="#" class="nav-item active">
        <div class="nav-icon">⌂</div>
        <div class="nav-label">HOME</div>
    </a>
    <a href="#" class="nav-item">
        <div class="nav-icon">♟</div>
        <div class="nav-label">PLAYERS</div>
    </a>
    <a href="#" class="nav-item">
        <div class="nav-icon">▥</div>
        <div class="nav-label">STATS</div>
    </a>
    <a href="#" class="nav-item">
        <div class="nav-icon">◆</div>
        <div class="nav-label">FACT</div>
    </a>
</nav>
<script>
const navItems = document.querySelectorAll(".nav-item");
navItems.forEach(item => {
    item.addEventListener("click", () => {
        navItems.forEach(nav => {
            nav.classList.remove("active");
        });
        item.classList.add("active");
    });
});
</script>
</body>
</html>
