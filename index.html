<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Philadelphia Phillies</title>

<style>

:root {
    --navy: #07152b;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
}


/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}


body {
    color: var(--white);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    height: 72px;

    overflow: hidden;

    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );

    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.30);
}


/* =====================================================
   HEADER DIAGONAL
===================================================== */

.header::before {

    content: "";

    position: absolute;

    top: -120px;
    right: -55px;

    width: 300px;
    height: 300px;

    transform:
        rotate(27deg);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.015)
        );

    border-left:
        1px solid
        rgba(255,255,255,0.16);

    box-shadow:
        -15px 0 40px
        rgba(0,0,0,0.08);

    pointer-events: none;
}


/* =====================================================
   NAVY DIAGONAL
===================================================== */

.header-navy-shape {

    position: absolute;

    top: -20px;
    left: 43%;

    width: 130px;
    height: 130px;

    transform:
        rotate(25deg);

    background:
        rgba(7,21,43,0.16);

    pointer-events: none;
}


/* =====================================================
   HEADER LINES
===================================================== */

.header-line-one {

    position: absolute;

    left: -20px;
    bottom: 14px;

    width: 55%;

    height: 2px;

    transform:
        skewX(-35deg);

    background:
        rgba(255,255,255,0.34);

    pointer-events: none;
}


.header-line-two {

    position: absolute;

    left: 4%;
    bottom: 8px;

    width: 35%;

    height: 1px;

    transform:
        skewX(-35deg);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


/* =====================================================
   HEADER LIGHT
===================================================== */

.header-light {

    position: absolute;

    top: -85px;
    right: 20px;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.18) 0%,
            rgba(255,255,255,0.06) 35%,
            transparent 72%
        );

    pointer-events: none;
}


/* =====================================================
   HEADER BOTTOM EDGE
===================================================== */

.header::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,0.35) 45%,
            rgba(255,255,255,0.28) 72%,
            transparent 100%
        );

    pointer-events: none;
}


/* =====================================================
   MAIN
===================================================== */

main {

    min-height: 100vh;

    padding-top: 72px;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 200;

    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    padding:
        7px 5px
        env(safe-area-inset-bottom);

    display: flex;

    align-items: flex-start;

    justify-content:
        space-between;

    background:
        rgba(5,16,34,0.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}


/* =====================================================
   NAV ITEM
===================================================== */

.nav-item {

    flex: 1;

    min-width: 0;

    height: 60px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    text-decoration: none;

    color: var(--muted);

    border-radius: 13px;

    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}


.nav-item:active {

    transform:
        scale(.94);
}


/* =====================================================
   ICON
===================================================== */

.nav-icon {

    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    font-weight: 700;
}


/* =====================================================
   LABEL
===================================================== */

.nav-label {

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .45px;

    white-space: nowrap;
}


/* =====================================================
   ACTIVE
===================================================== */

.nav-item.active {

    color: var(--white);

    background:
        rgba(227,25,55,0.13);
}


.nav-item.active .nav-icon {

    color: var(--red);
}


/* =====================================================
   SMALL IPHONE
===================================================== */

@media (max-width: 360px) {

    .header {
        height: 68px;
    }

    main {
        padding-top: 68px;
    }

    .nav-label {
        font-size: 9px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-navy-shape"></div>

    <div class="header-line-one"></div>

    <div class="header-line-two"></div>

    <div class="header-light"></div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>
</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">


    <!-- SCHEDULE -->

    <a href="schedule.html"
       class="nav-item">

        <div class="nav-icon">
            ▣
        </div>

        <div class="nav-label">
            SCHEDULE
        </div>

    </a>


    <!-- SCORE -->

    <a href="score.html"
       class="nav-item">

        <div class="nav-icon">
            ●
        </div>

        <div class="nav-label">
            SCORE
        </div>

    </a>


    <!-- HOME -->

    <a href="index.html"
       class="nav-item active">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            HOME
        </div>

    </a>


    <!-- PLAYER -->

    <a href="player.html"
       class="nav-item">

        <div class="nav-icon">
            ♟
        </div>

        <div class="nav-label">
            PLAYER
        </div>

    </a>


    <!-- STATS -->

    <a href="stats.html"
       class="nav-item">

        <div class="nav-icon">
            ▥
        </div>

        <div class="nav-label">
            STATS
        </div>

    </a>


</nav>

</body>
</html>
