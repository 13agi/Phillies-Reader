<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PHILLIES</title>


<style>

/* =========================================================
   COLORS
========================================================= */

:root {

    --phillies-red: #E31837;

    --phillies-red-dark: #C8102E;

    --phillies-navy: #002D72;

    --phillies-navy-dark: #001F4F;

    --phillies-navy-deep: #00132F;

    --white: #FFFFFF;

    --white-soft: rgba(255,255,255,0.72);

}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    background: var(--phillies-navy-deep);
}


body {

    min-height: 100vh;

    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(0,74,160,0.55),
            transparent 45%
        ),

        linear-gradient(
            180deg,
            var(--phillies-navy) 0%,
            var(--phillies-navy-dark) 42%,
            var(--phillies-navy-deep) 100%
        );

    color: var(--white);

}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 76px;

    background:

        linear-gradient(
            180deg,
            #E91A39 0%,
            #E31837 55%,
            #CF102E 100%
        );

    box-shadow:

        0 8px 25px
        rgba(0,0,0,0.28);

}


/* subtle shine */

.header::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    height: 1px;

    background:
        rgba(255,255,255,0.45);

}


/* navy bottom line */

.header::after {

    content: "";

    position: absolute;

    bottom: 0;

    left: 0;

    right: 0;

    height: 3px;

    background:
        var(--phillies-navy);

}


/* =========================================================
   HEADER INNER
========================================================= */

.header-inner {

    max-width: 1280px;

    height: 100%;

    margin: 0 auto;

    padding:
        0 28px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


/* =========================================================
   LOGO
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 14px;

    text-decoration: none;

    color: #FFFFFF;

}


/* P */

.brand-mark {

    width: 44px;

    height: 44px;

    border-radius: 50%;

    background:
        #FFFFFF;

    color:
        var(--phillies-red);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 22px;

    font-weight: 900;

    letter-spacing: -1px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.18);

}


/* =========================================================
   BRAND TEXT
========================================================= */

.brand-text {

    display: flex;

    flex-direction: column;

}


.brand-main {

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 20px;

    font-weight: 900;

    letter-spacing: 1.8px;

    line-height: 1;

}


.brand-sub {

    margin-top: 5px;

    font-size: 7px;

    font-weight: 700;

    letter-spacing: 2.5px;

    opacity: 0.72;

}


/* =========================================================
   NAV
========================================================= */

.nav {

    display: flex;

    align-items: center;

    gap: 4px;

}


.nav-item {

    position: relative;

    padding:
        10px 14px;

    color:
        rgba(255,255,255,0.82);

    text-decoration: none;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1.2px;

    transition:
        0.2s ease;

}


.nav-item:hover {

    color:
        #FFFFFF;

    background:
        rgba(0,0,0,0.10);

}


.nav-item::after {

    content: "";

    position: absolute;

    left: 14px;

    right: 14px;

    bottom: 4px;

    height: 2px;

    background:
        #FFFFFF;

    transform:
        scaleX(0);

    transition:
        0.2s ease;

}


.nav-item:hover::after {

    transform:
        scaleX(1);

}


/* =========================================================
   MAIN
========================================================= */

main {

    width: 100%;

    max-width: 1280px;

    margin: 0 auto;

    padding:
        50px 28px 120px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    position: relative;

    min-height: 410px;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            #003982 0%,
            #002D72 45%,
            #001F4F 100%
        );

    border:
        1px solid
        rgba(255,255,255,0.10);

    box-shadow:

        0 20px 55px
        rgba(0,0,0,0.28);

}


/* red diagonal */

.hero::before {

    content: "";

    position: absolute;

    right: -150px;

    top: -160px;

    width: 560px;

    height: 620px;

    background:

        linear-gradient(
            135deg,
            transparent 48%,
            rgba(227,24,55,0.95) 49%,
            rgba(227,24,55,0.95) 56%,
            transparent 57%
        );

}


/* subtle pattern */

.hero::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        repeating-linear-gradient(
            135deg,
            transparent 0px,
            transparent 35px,
            rgba(255,255,255,0.025) 36px,
            rgba(255,255,255,0.025) 37px
        );

}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-content {

    position: relative;

    z-index: 5;

    padding:
        65px 60px;

}


.hero-label {

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.62);

}


.hero-title {

    margin-top: 18px;

    font-family:
        "Arial Black",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:
        clamp(54px, 9vw, 100px);

    font-weight: 900;

    line-height: 0.9;

    letter-spacing:
        -4px;

    color:
        #FFFFFF;

}


.hero-accent {

    width: 70px;

    height: 4px;

    margin-top: 25px;

    background:
        var(--phillies-red);

}


.hero-text {

    margin-top: 20px;

    max-width: 480px;

    color:
        rgba(255,255,255,0.65);

    font-size: 13px;

    line-height: 1.9;

}


/* =========================================================
   EMPTY AREA
========================================================= */

.content-area {

    position: relative;

    margin-top: 28px;

    min-height: 500px;

    border:

        1px solid
        rgba(255,255,255,0.08);

    background:

        rgba(0,31,79,0.55);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.04),

        0 15px 45px
        rgba(0,0,0,0.18);

}


/* =========================================================
   PLACEHOLDER
========================================================= */

.placeholder {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    text-align: center;

    color:
        rgba(255,255,255,0.25);

}


.placeholder-title {

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 3px;

}


.placeholder-line {

    width: 30px;

    height: 2px;

    margin:
        12px auto;

    background:
        var(--phillies-red);

}


.placeholder-sub {

    font-size: 8px;

    letter-spacing: 2px;

    opacity: 0.7;

}


/* =========================================================
   MOBILE NAV
========================================================= */

.mobile-nav {

    display: none;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {


    .header {

        height: 67px;

    }


    .header-inner {

        padding:
            0 16px;

    }


    .brand-mark {

        width: 38px;

        height: 38px;

        font-size: 19px;

    }


    .brand-main {

        font-size: 17px;

    }


    .brand-sub {

        font-size: 6px;

        letter-spacing: 2px;

    }


    .nav {

        display: none;

    }


    main {

        padding:
            18px 12px 95px;

    }


    .hero {

        min-height: 340px;

    }


    .hero-content {

        padding:
            40px 25px;

    }


    .hero-title {

        font-size: 55px;

        letter-spacing:
            -2px;

    }


    .hero-text {

        font-size: 11px;

    }


    .content-area {

        min-height: 500px;

        margin-top: 18px;

    }


    /* bottom navigation */

    .mobile-nav {

        position: fixed;

        display: flex;

        align-items: center;

        justify-content: space-around;

        left: 10px;

        right: 10px;

        bottom: 10px;

        height: 61px;

        z-index: 999;

        background:

            rgba(0,19,47,0.94);

        backdrop-filter:
            blur(18px);

        -webkit-backdrop-filter:
            blur(18px);

        border:

            1px solid
            rgba(255,255,255,0.10);

        box-shadow:

            0 12px 35px
            rgba(0,0,0,0.35);

    }


    .mobile-nav-item {

        text-decoration: none;

        color:
            rgba(255,255,255,0.45);

        font-size: 8px;

        font-weight: 800;

        letter-spacing: 1px;

        text-align: center;

    }


    .mobile-nav-icon {

        display: block;

        margin-bottom: 4px;

        font-size: 15px;

    }


    .mobile-nav-item:first-child {

        color:
            #FFFFFF;

    }


    .mobile-nav-item:first-child
    .mobile-nav-icon {

        color:
            var(--phillies-red);

    }

}

</style>

</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="header-inner">


        <a href="#" class="brand">

            <div class="brand-mark">
                P
            </div>

            <div class="brand-text">

                <div class="brand-main">
                    PHILLIES
                </div>

                <div class="brand-sub">
                    PHILADELPHIA BASEBALL
                </div>

            </div>

        </a>


        <nav class="nav">

            <a href="#" class="nav-item">
                HOME
            </a>

            <a href="#" class="nav-item">
                NEWS
            </a>

            <a href="#" class="nav-item">
                PLAYERS
            </a>

            <a href="#" class="nav-item">
                STATS
            </a>

        </nav>

    </div>

</header>



<!-- ======================================================
     MAIN
====================================================== -->

<main>


    <section class="hero">

        <div class="hero-content">

            <div class="hero-label">
                PHILADELPHIA PHILLIES
            </div>

            <div class="hero-title">
                PHILLIES
            </div>

            <div class="hero-accent"></div>

            <div class="hero-text">
                Philadelphia Philliesをもっと深く。
                <br>
                あなたのためのPhillies専用サイト。
            </div>

        </div>

    </section>



    <section class="content-area">

        <div class="placeholder">

            <div class="placeholder-title">
                PHILLIES
            </div>

            <div class="placeholder-line"></div>

            <div class="placeholder-sub">
                UI DESIGN
            </div>

        </div>

    </section>


</main>



<!-- ======================================================
     MOBILE NAV
====================================================== -->

<nav class="mobile-nav">

    <a href="#" class="mobile-nav-item">

        <span class="mobile-nav-icon">
            ◆
        </span>

        HOME

    </a>


    <a href="#" class="mobile-nav-item">

        <span class="mobile-nav-icon">
            ◇
        </span>

        NEWS

    </a>


    <a href="#" class="mobile-nav-item">

        <span class="mobile-nav-icon">
            ○
        </span>

        PLAYERS

    </a>


    <a href="#" class="mobile-nav-item">

        <span class="mobile-nav-icon">
            ≡
        </span>

        STATS

    </a>

</nav>


</body>
</html>
