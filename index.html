<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHILLIES</title>
<style>
/* =====================================================
   PHILLIES COLORS
===================================================== */
:root {
    --red: #E31837;
    --red-dark: #C8102E;
    --navy: #002D72;
    --navy-light: #073B82;
    --navy-dark: #001F4F;
    --navy-deep: #00152F;
    --white: #FFFFFF;
    --white-muted: rgba(255,255,255,0.68);
    --line: rgba(255,255,255,0.10);
}
/* =====================================================
   RESET
===================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    background: var(--navy-deep);
}
body {
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    background:
        var(--navy-deep);
    color: var(--white);
}
/* =====================================================
   HEADER
===================================================== */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 72px;
    background:
        var(--red);
    border-bottom:
        1px solid
        rgba(255,255,255,0.16);
}
/* thin navy line */
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -3px;
    height: 3px;
    background:
        var(--navy);
}
/* =====================================================
   HEADER INNER
===================================================== */
.header-inner {
    width: 100%;
    max-width: 1240px;
    height: 100%;
    margin: 0 auto;
    padding:
        0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
/* =====================================================
   BRAND
===================================================== */
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: white;
}
/* circular mark */
.brand-mark {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background:
        white;
    color:
        var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 900;
}
/* inner ring */
.brand-mark::after {
    content: "";
    position: absolute;
    inset: 4px;
    border:
        1px solid
        rgba(227,24,55,0.30);
    border-radius: 50%;
}
/* brand text */
.brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1;
}
.brand-main {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1.8px;
}
.brand-sub {
    margin-top: 5px;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 2.2px;
    opacity: 0.72;
}
/* =====================================================
   DESKTOP NAV
===================================================== */
.nav {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 2px;
}
.nav-item {
    position: relative;
    height: 100%;
    padding:
        0 17px;
    display: flex;
    align-items: center;
    color:
        rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.3px;
    transition:
        color 0.2s ease;
}
.nav-item:hover {
    color: white;
}
/* active indicator */
.nav-item:first-child {
    color: white;
}
.nav-item:first-child::after {
    content: "";
    position: absolute;
    left: 17px;
    right: 17px;
    bottom: -1px;
    height: 3px;
    background:
        white;
}
/* =====================================================
   MENU BUTTON
===================================================== */
.menu {
    display: none;
    width: 40px;
    height: 40px;
    border:
        1px solid
        rgba(255,255,255,0.25);
    background:
        rgba(0,0,0,0.08);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
}
.menu span {
    width: 18px;
    height: 2px;
    background:
        white;
}
/* =====================================================
   MAIN
===================================================== */
.main {
    min-height:
        calc(100vh - 72px);
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(20,85,165,0.55),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            var(--navy) 0%,
            var(--navy-dark) 48%,
            var(--navy-deep) 100%
        );
}
/* =====================================================
   CONTENT FRAME
===================================================== */
.content {
    width: 100%;
    max-width: 1240px;
    min-height:
        calc(100vh - 72px);
    margin: 0 auto;
    padding:
        36px 24px;
}
/* =====================================================
   TOP DESIGN STRIP
===================================================== */
.design-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 24px;
    margin-bottom: 18px;
}
.design-strip-red {
    width: 36px;
    height: 2px;
    background:
        var(--red);
}
.design-strip-blue {
    flex: 1;
    height: 1px;
    background:
        var(--line);
}
.design-strip-label {
    color:
        rgba(255,255,255,0.42);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 2px;
}
/* =====================================================
   EMPTY CANVAS
===================================================== */
.canvas {
    min-height: 560px;
    position: relative;
    border:
        1px solid
        var(--line);
    background:
        rgba(0,31,79,0.38);
}
/* subtle inner border */
.canvas::before {
    content: "";
    position: absolute;
    inset: 10px;
    border:
        1px solid
        rgba(255,255,255,0.035);
    pointer-events: none;
}
/* =====================================================
   CENTER MARK
===================================================== */
.canvas-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform:
        translate(-50%, -50%);
    text-align: center;
    opacity: 0.42;
}
.canvas-mark-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
}
.canvas-mark-line {
    width: 28px;
    height: 2px;
    margin:
        12px auto;
    background:
        var(--red);
}
.canvas-mark-sub {
    font-size: 7px;
    letter-spacing: 2px;
    color:
        var(--white-muted);
}
/* =====================================================
   MOBILE
===================================================== */
@media (max-width: 700px) {
    .header {
        height: 64px;
    }
    .header-inner {
        padding:
            0 16px;
    }
    .brand-mark {
        width: 36px;
        height: 36px;
        font-size: 17px;
    }
    .brand-main {
        font-size: 17px;
        letter-spacing: 1.5px;
    }
    .brand-sub {
        font-size: 6px;
        letter-spacing: 1.8px;
    }
    .nav {
        display: none;
    }
    .menu {
        display: flex;
    }
    .main {
        min-height:
            calc(100vh - 64px);
    }
    .content {
        min-height:
            calc(100vh - 64px);
        padding:
            22px 14px;
    }
    .design-strip {
        margin-bottom: 14px;
    }
    .design-strip-label {
        font-size: 7px;
    }
    .canvas {
        min-height:
            calc(100vh - 150px);
    }
    .canvas::before {
        inset: 7px;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     HEADER
===================================================== -->
<header class="header">
    <div class="header-inner">
        <a href="#" class="brand">
            <div class="brand-mark">
                P
            </div>
            <div class="brand-name">
                <div class="brand-main">
                    PHILLIES
                </div>
                <div class="brand-sub">
                    PHILADELPHIA BASEBALL
                </div>
            </div>
        </a>
        <nav class="nav">
            <a href="#" class="nav-item">
                HOME
            </a>
            <a href="#" class="nav-item">
                NEWS
            </a>
            <a href="#" class="nav-item">
                PLAYERS
            </a>
            <a href="#" class="nav-item">
                STATS
            </a>
        </nav>
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>
<!-- =====================================================
     MAIN
===================================================== -->
<main class="main">
    <div class="content">
        <div class="design-strip">
            <div class="design-strip-red"></div>
            <div class="design-strip-blue"></div>
            <div class="design-strip-label">
                PHILADELPHIA PHILLIES
            </div>
        </div>
        <section class="canvas">
            <div class="canvas-mark">
                <div class="canvas-mark-title">
                    PHILLIES
                </div>
                <div class="canvas-mark-line"></div>
                <div class="canvas-mark-sub">
                    UI DESIGN
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
