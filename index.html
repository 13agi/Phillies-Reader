<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phillies</title>

<style>

:root {
    --navy: #06172d;
    --navy-light: #0a203b;

    --red: #e31837;
    --red-dark: #b80f2c;
    --red-deep: #8f0921;

    --white: #ffffff;
}


/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;

    background: var(--navy);
}

body {
    min-height: 100vh;

    padding-bottom: 76px;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* ==================================================
   HEADER
================================================== */

.header {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 82px;

    overflow: hidden;

    background:
        linear-gradient(
            160deg,
            var(--red-deep) 0%,
            var(--red-dark) 28%,
            var(--red) 58%,
            var(--red-dark) 100%
        );

    box-shadow:
        0 8px 28px rgba(0, 0, 0, .38);
}


/*
    大きな赤い面
    ヘッダー全体に奥行きを作る
*/

.header-shape-one {

    position: absolute;

    width: 75%;
    height: 180%;

    left: -20%;
    top: -40%;

    transform:
        skewX(-22deg);

    background:
        rgba(255,255,255,.055);
}


/*
    深い赤の面
*/

.header-shape-two {

    position: absolute;

    width: 42%;
    height: 180%;

    right: -8%;
    top: -35%;

    transform:
        skewX(-22deg);

    background:
        rgba(95, 0, 20, .18);
}


/*
    上部の微細な光
*/

.header-light {

    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 1px;

    background:
        rgba(255,255,255,.3);
}


/*
    下部の境界
*/

.header-edge {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.35),
            rgba(255,255,255,.22),
            rgba(0,0,0,.35)
        );
}


/*
    ヘッダー中央の抽象形状

    文字・ロゴではなく、
    「形」だけで存在感を出す
*/

.header-emblem {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 74px;
    height: 74px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.025);

    box-shadow:
        inset 0 0 0 8px rgba(255,255,255,.018);
}


/*
    中央形状の内側
*/

.header-emblem::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 42px;
    height: 42px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.18);
}


/*
    中央の細いライン
*/

.header-emblem::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 64px;
    height: 1px;

    transform:
        translate(-50%, -50%);

    background:
        rgba(255,255,255,.2);
}


/* ==================================================
   MAIN
   今は空
================================================== */

main {
    min-height:
        calc(100vh - 158px);
}


/* ==================================================
   BOTTOM NAV
   ここは指定どおり維持
================================================== */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    height: 76px;

    background:
        rgba(7, 26, 51, .98);

    border-top:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 -8px 25px rgba(0,0,0,.28);
}


.bottom-inner {

    width: 100%;

    max-width: 760px;

    height: 100%;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);
}


.nav-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    color: #718298;

    text-decoration: none;

    font-size: 8px;

    font-weight: 900;

    letter-spacing: .5px;
}


.nav-icon {

    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    font-size: 16px;
}


/* HOMEだけ180度 */

.nav-item.home .nav-icon {

    transform:
        rotate(180deg);
}


.nav-item.active {

    color:
        var(--red);
}


.nav-item.active .nav-icon {

    background:
        rgba(227,24,55,.14);
}


</style>
</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

    <div class="header-shape-one"></div>

    <div class="header-shape-two"></div>

    <div class="header-light"></div>

    <div class="header-emblem"></div>

    <div class="header-edge"></div>

</header>



<!-- ==================================================
     EMPTY HOME
================================================== -->

<main></main>



<!-- ==================================================
     BOTTOM NAV
================================================== -->

<nav class="bottom-nav">

    <div class="bottom-inner">


        <a
            href="schedule.html"
            class="nav-item"
        >

            <div class="nav-icon">
                ▤
            </div>

            SCHEDULE

        </a>



        <a
            href="score.html"
            class="nav-item"
        >

            <div class="nav-icon">
                ◎
            </div>

            SCORE

        </a>



        <a
            href="index.html"
            class="nav-item active home"
        >

            <div class="nav-icon">
                ⌂
            </div>

            HOME

        </a>



        <a
            href="player.html"
            class="nav-item"
        >

            <div class="nav-icon">
                ◉
            </div>

            PLAYER

        </a>



        <a
            href="stats.html"
            class="nav-item"
        >

            <div class="nav-icon">
                ▥
            </div>

            STATS

        </a>


    </div>

</nav>


</body>
</html>
