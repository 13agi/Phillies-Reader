<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<title>PHILLIES</title>
<style>
/* ========================================
   PHILLIES COLORS
======================================== */
:root {
    --phillies-red: #E31837;
    --phillies-navy: #002D72;
    --white: #FFFFFF;
}
/* ========================================
   RESET
======================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html,
body {
    width: 100%;
    min-height: 100%;
}
body {
    background:
        var(--phillies-navy);
    color:
        var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:
        antialiased;
}
/* ========================================
   APP
======================================== */
.app {
    width: 100%;
    min-height:
        100vh;
    min-height:
        100dvh;
    background:
        var(--phillies-navy);
}
/* ========================================
   HEADER
======================================== */
.header {
    width: 100%;
    height: 68px;
    background:
        var(--phillies-red);
    display: flex;
    align-items: center;
    padding-top:
        env(safe-area-inset-top);
}
/* ========================================
   HEADER INNER
======================================== */
.header-inner {
    width: 100%;
    height: 68px;
    padding:
        0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
/* ========================================
   PHILLIES
======================================== */
.logo {
    color:
        var(--white);
    text-decoration: none;
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    font-size:
        31px;
    font-weight:
        900;
    font-style:
        italic;
    letter-spacing:
        -1.2px;
    line-height:
        1;
    user-select:
        none;
}
/* ========================================
   HEADER RIGHT
======================================== */
.header-action {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background:
        rgba(0, 0, 0, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
}
/* ========================================
   SIMPLE MENU ICON
======================================== */
.menu-icon {
    width: 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.menu-icon span {
    width: 100%;
    height: 2px;
    background:
        var(--white);
    border-radius: 2px;
}
/* ========================================
   MAIN
======================================== */
main {
    width: 100%;
    min-height:
        calc(100dvh - 68px);
    background:
        var(--phillies-navy);
}
/* ========================================
   MOBILE CONTENT WIDTH
======================================== */
.main-inner {
    width: 100%;
    max-width: 600px;
    margin:
        0 auto;
}
/* ========================================
   SAFE AREA
======================================== */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
    body {
        padding-bottom:
            env(safe-area-inset-bottom);
    }
}
/* ========================================
   SMALL PHONES
======================================== */
@media (max-width: 375px) {
    .header {
        height: 64px;
    }
    .header-inner {
        height: 64px;
        padding:
            0 16px;
    }
    .logo {
        font-size:
            28px;
    }
    main {
        min-height:
            calc(100dvh - 64px);
    }
}
/* ========================================
   LARGER PHONES
======================================== */
@media (min-width: 430px) {
    .header-inner {
        padding:
            0 22px;
    }
}
</style>
</head>
<body>
<div class="app">
    <!-- ================================
         HEADER
    ================================= -->
    <header class="header">
        <div class="header-inner">
            <a
                href="#"
                class="logo"
            >
                PHILLIES
            </a>
            <button
                class="header-action"
                aria-label="メニュー"
            >
                <span class="menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
        </div>
    </header>
    <!-- ================================
         MAIN
    ================================= -->
    <main>
        <div class="main-inner">
        </div>
    </main>
</div>
</body>
</html>
