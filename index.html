<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHILLIES</title>
<style>
/* =========================
   PHILLIES COLORS
========================= */
:root {
    --red: #E31837;
    --navy: #002D72;
    --navy-dark: #001F4F;
    --white: #FFFFFF;
}
/* =========================
   BASE
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: var(--navy);
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================
   HEADER
========================= */
.header {
    width: 100%;
    height: 72px;
    background: var(--red);
}
/* =========================
   HEADER INNER
========================= */
.header-inner {
    width: 100%;
    max-width: 1200px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
/* =========================
   LOGO
========================= */
.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    text-decoration: none;
}
.logo-text {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
}
/* =========================
   NAV
========================= */
.nav {
    display: flex;
    align-items: center;
    gap: 4px;
}
.nav a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 14px;
    border-radius: 6px;
}
.nav a:hover {
    background:
        rgba(0,0,0,0.12);
}
/* =========================
   MOBILE MENU
========================= */
.menu {
    display: none;
    width: 42px;
    height: 42px;
    border: 0;
    background:
        rgba(0,0,0,0.12);
    border-radius: 7px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
}
.menu span {
    width: 20px;
    height: 2px;
    background: white;
}
/* =========================
   EMPTY NAVY AREA
========================= */
main {
    min-height:
        calc(100vh - 72px);
    background:
        var(--navy);
}
/* =========================
   MOBILE
========================= */
@media (max-width: 700px) {
    .header {
        height: 64px;
    }
    .header-inner {
        padding: 0 18px;
    }
    .logo-text {
        font-size: 21px;
    }
    .nav {
        display: none;
    }
    .menu {
        display: flex;
    }
    main {
        min-height:
            calc(100vh - 64px);
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a href="#" class="logo">
            <span class="logo-text">
                PHILLIES
            </span>
        </a>
        <nav class="nav">
            <a href="#">
                HOME
            </a>
            <a href="#">
                NEWS
            </a>
            <a href="#">
                PLAYERS
            </a>
            <a href="#">
                STATS
            </a>
        </nav>
        <button class="menu" aria-label="menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
<main></main>
</body>
</html>
