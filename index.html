<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>PHILLIES</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>

:root {
    --navy: #07152b;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
}

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;

    background: var(--navy);
}

body {
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

    padding-bottom:
        calc(76px + env(safe-area-inset-bottom));
}


/* =========================
   TOP HEADER
========================= */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    height: 96px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--red);

    box-shadow:
        0 5px 20px rgba(0,0,0,0.25);

    overflow: hidden;
}


/* subtle diagonal detail */

.header::before {

    content: "";

    position: absolute;

    width: 160%;
    height: 140px;

    top: -75px;
    left: -30%;

    transform: rotate(-7deg);

    border-top:
        2px solid rgba(255,255,255,0.12);

    border-bottom:
        2px solid rgba(255,255,255,0.08);

    opacity: .6;
}


/* =========================
   PHILLIES TITLE
========================= */

.logo {

    position: relative;

    z-index: 2;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 48px;

    font-weight: 900;

    font-style: italic;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: white;

    transform: skewX(-5deg);

    text-shadow:
        2px 2px 0 rgba(0,0,0,0.12),
        0 4px 10px rgba(0,0,0,0.12);
}


/* underline */

.logo::after {

    content: "";

    display: block;

    width: 65%;

    height: 3px;

    margin:
        3px auto 0;

    border-radius: 99px;

    background:
        rgba(255,255,255,0.9);
}


/* =========================
   MAIN
========================= */

main {

    min-height: 100vh;

    padding-top: 96px;
}


/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 200;

    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    padding:
        7px 8px
        env(safe-area-inset-bottom);

    display: flex;

    align-items: flex-start;

    justify-content:
        space-around;

    background:
        rgba(5,16,34,0.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}


/* =========================
   NAV ITEM
========================= */

.nav-item {

    flex: 1;

    max-width: 100px;

    height: 60px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    text-decoration: none;

    color: var(--muted);

    border-radius: 13px;

    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}


.nav-item:active {

    transform:
        scale(.94);
}


/* =========================
   NAV ICON
========================= */

.nav-icon {

    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    font-weight: 700;
}


/* =========================
   NAV LABEL
========================= */

.nav-label {

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: .8px;
}


/* =========================
   ACTIVE
========================= */

.nav-item.active {

    color: white;

    background:
        rgba(227,25,55,0.13);
}


.nav-item.active
.nav-icon {

    color: var(--red);
}


/* =========================
   SMALL IPHONE
========================= */

@media (max-width: 360px) {

    .header {

        height: 90px;
    }

    main {

        padding-top: 90px;
    }

    .logo {

        font-size: 43px;
    }

}

</style>
</head>


<body>


<!-- =====================
     HEADER
===================== -->

<header class="header">

    <div class="logo">
        Phillies
    </div>

</header>


<!-- =====================
     EMPTY MAIN
===================== -->

<main>
</main>


<!-- =====================
     BOTTOM NAV
===================== -->

<nav class="bottom-nav">

    <a href="#"
       class="nav-item active">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            HOME
        </div>

    </a>


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ♟
        </div>

        <div class="nav-label">
            PLAYERS
        </div>

    </a>


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ▥
        </div>

        <div class="nav-label">
            STATS
        </div>

    </a>


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ◆
        </div>

        <div class="nav-label">
            FACT
        </div>

    </a>

</nav>


<script>

const navItems =
    document.querySelectorAll(".nav-item");


navItems.forEach(item => {

    item.addEventListener(
        "click",
        () => {

            navItems.forEach(nav => {

                nav.classList.remove(
                    "active"
                );

            });

            item.classList.add(
                "active"
            );

        }
    );

});

</script>


</body>
</html>
