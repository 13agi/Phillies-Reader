<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phillies</title>
<style>
/* ==================================================
   COLOR
================================================== */
:root {
    --navy: #06172d;
    --navy-2: #081d36;
    --red: #e31837;
    --red-dark: #b90f2d;
    --red-deep: #920b24;
    --white: #ffffff;
    --muted: #718298;
}
/* ==================================================
   RESET
================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    min-height: 100vh;
    padding-bottom: 76px;
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* ==================================================
   HEADER
================================================== */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 82px;
    overflow: hidden;
    background:
        linear-gradient(
            115deg,
            var(--red-deep) 0%,
            var(--red-dark) 22%,
            var(--red) 50%,
            #d41432 72%,
            #a80d28 100%
        );
    box-shadow:
        0 8px 28px rgba(0,0,0,.38);
}
/* --------------------------------------------------
   大きな斜めの光
-------------------------------------------------- */
.header::before {
    content: "";
    position: absolute;
    left: -25%;
    top: -100%;
    width: 95%;
    height: 250%;
    transform:
        rotate(17deg);
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,.025) 30%,
            rgba(255,255,255,.11) 50%,
            rgba(255,255,255,.025) 70%,
            transparent 100%
        );
    pointer-events: none;
}
/* --------------------------------------------------
   右側の深い赤
-------------------------------------------------- */
.header .red-depth {
    position: absolute;
    right: -12%;
    top: -60%;
    width: 48%;
    height: 220%;
    transform:
        skewX(-19deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,20,.02),
            rgba(70,0,18,.18)
        );
}
/* --------------------------------------------------
   上部エッジ
-------------------------------------------------- */
.header .top-edge {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background:
        rgba(255,255,255,.3);
}
/* --------------------------------------------------
   下部エッジ
-------------------------------------------------- */
.header .bottom-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background:
        linear-gradient(
            90deg,
            var(--navy),
            rgba(255,255,255,.35) 50%,
            var(--navy)
        );
    opacity: .8;
}
/* --------------------------------------------------
   文字なしの抽象アクセント
-------------------------------------------------- */
.header .accent {
    position: absolute;
    left: 22px;
    bottom: 16px;
    width: 52px;
    height: 5px;
    transform:
        skewX(-25deg);
    background:
        rgba(255,255,255,.82);
    border-radius:
        999px;
    box-shadow:
        0 0 12px rgba(255,255,255,.15);
}
.header .accent::after {
    content: "";
    position: absolute;
    left: 18px;
    top: 9px;
    width: 30px;
    height: 2px;
    background:
        rgba(255,255,255,.35);
    border-radius:
        999px;
}
/* ==================================================
   EMPTY MAIN
================================================== */
main {
    min-height:
        calc(100vh - 158px);
}
/* ==================================================
   BOTTOM NAV
================================================== */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2000;
    height: 76px;
    background:
        rgba(6,23,45,.98);
    border-top:
        1px solid rgba(255,255,255,.08);
    box-shadow:
        0 -8px 25px rgba(0,0,0,.3);
    backdrop-filter:
        blur(14px);
}
.bottom-inner {
    width: 100%;
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns:
        repeat(5, 1fr);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color:
        var(--muted);
    text-decoration: none;
    font-size: 8px;
    font-weight: 900;
    letter-spacing:
        .55px;
}
/* ==================================================
   SVG ICON
================================================== */
.nav-icon {
    width: 29px;
    height: 29px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius:
        9px;
}
.nav-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* ==================================================
   ACTIVE
================================================== */
.nav-item.active {
    color:
        var(--red);
}
.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.13);
}
/* ==================================================
   HOME ICON 180°
================================================== */
.nav-item.home .nav-icon {
    transform:
        rotate(180deg);
}
/* ==================================================
   MOBILE
================================================== */
@media (max-width: 380px) {
    .header {
        height: 76px;
    }
    .nav-item {
        font-size: 7px;
    }
    .nav-icon {
        width: 28px;
        height: 28px;
    }
}
</style>
</head>
<body>
<!-- ==================================================
     HEADER
================================================== -->
<header class="header">
    <div class="red-depth"></div>
    <div class="top-edge"></div>
    <div class="accent"></div>
    <div class="bottom-edge"></div>
</header>
<!-- ==================================================

================================================== -->
<main></main>
<!-- ==================================================

================================================== -->

        <a

        <!-- HOME -->
        <a

        >
            <div class="nav-icon">

        <!-- STATS -->
        <a

            STATS
        </a>
    </div>
</nav>
</body>
</html>
