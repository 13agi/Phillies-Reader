<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phillies</title>

<style>

/* =========================================================
   BASE
========================================================= */

:root {
    --navy: #06172d;
    --navy-deep: #041020;

    --red: #e31837;
    --red-dark: #c20f2f;
    --red-deep: #970a24;

    --white: #ffffff;
    --gray: #708197;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}

body {
    width: 100%;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(227,24,55,.045),
            transparent 34%
        ),
        var(--navy);

    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom: 78px;
}


/* =========================================================
   HEADER
   文字・ロゴなし
========================================================= */

.header {

    position: sticky;
    top: 0;

    z-index: 1000;

    width: 100%;
    height: 82px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #8f0923 0%,
            #c10f30 24%,
            #e31837 50%,
            #d31534 74%,
            #a30b27 100%
        );

    box-shadow:
        0 9px 30px rgba(0,0,0,.42);
}


/* ---------------------------------------------------------
   巨大な斜め面
--------------------------------------------------------- */

.header-panel {

    position: absolute;

    width: 72%;
    height: 190%;

    left: -19%;
    top: -43%;

    transform:
        skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.015),
            rgba(255,255,255,.105),
            rgba(255,255,255,.025)
        );
}


/* ---------------------------------------------------------
   深い赤の右面
--------------------------------------------------------- */

.header-depth {

    position: absolute;

    width: 45%;
    height: 180%;

    right: -12%;
    top: -37%;

    transform:
        skewX(-24deg);

    background:
        linear-gradient(
            90deg,
            rgba(91,0,20,.02),
            rgba(73,0,17,.22)
        );
}


/* ---------------------------------------------------------
   中央を横切る細い光
--------------------------------------------------------- */

.header-glow {

    position: absolute;

    left: 15%;
    right: 15%;

    top: 50%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    opacity: .7;
}


/* ---------------------------------------------------------
   左側の抽象ライン
--------------------------------------------------------- */

.header-line-left {

    position: absolute;

    left: 18px;
    bottom: 20px;

    width: 58px;
    height: 4px;

    transform:
        skewX(-28deg);

    border-radius: 99px;

    background:
        rgba(255,255,255,.88);
}


.header-line-left::after {

    content: "";

    position: absolute;

    left: 12px;
    top: 8px;

    width: 34px;
    height: 2px;

    border-radius: 99px;

    background:
        rgba(255,255,255,.35);
}


/* ---------------------------------------------------------
   右側の抽象ライン
--------------------------------------------------------- */

.header-line-right {

    position: absolute;

    right: 20px;
    top: 20px;

    width: 42px;
    height: 3px;

    transform:
        skewX(-28deg);

    border-radius: 99px;

    background:
        rgba(255,255,255,.42);
}


.header-line-right::after {

    content: "";

    position: absolute;

    right: 9px;
    top: 7px;

    width: 24px;
    height: 2px;

    border-radius: 99px;

    background:
        rgba(255,255,255,.2);
}


/* ---------------------------------------------------------
   上端
--------------------------------------------------------- */

.header-top-edge {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 1px;

    background:
        rgba(255,255,255,.35);
}


/* ---------------------------------------------------------
   下端
--------------------------------------------------------- */

.header-bottom-edge {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 3px;

    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.45) 50%,
            var(--navy-deep)
        );

    opacity: .85;
}


/* ---------------------------------------------------------
   ヘッダー中央の小さなアクセント
   ロゴではなく抽象的な形
--------------------------------------------------------- */

.header-center {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 30px;
    height: 30px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.24);

    background:
        rgba(255,255,255,.018);
}


.header-center::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 12px;
    height: 12px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.34);
}


/* =========================================================
   HOME
   現在は空
========================================================= */

main {

    width: 100%;
    min-height:
        calc(100vh - 160px);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    height: 78px;

    background:
        rgba(5,20,39,.98);

    border-top:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);

    backdrop-filter:
        blur(16px);
}


.bottom-inner {

    width: 100%;
    max-width: 760px;

    height: 100%;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);
}


/* =========================================================
   NAV ITEM
========================================================= */

.nav-item {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    color:
        var(--gray);

    text-decoration: none;

    font-size: 8px;

    font-weight: 800;

    letter-spacing:
        .65px;

    -webkit-tap-highlight-color:
        transparent;
}


/* =========================================================
   ICON
========================================================= */

.nav-icon {

    width: 31px;
    height: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    transition:
        background .15s ease,
        color .15s ease;
}


.nav-icon svg {

    width: 19px;
    height: 19px;

    fill: none;

    stroke:
        currentColor;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


/* =========================================================
   ACTIVE
========================================================= */

.nav-item.active {

    color:
        var(--red);
}


.nav-item.active .nav-icon {

    background:
        rgba(227,24,55,.14);
}


/* =========================================================
   HOME
   五角形 + 180度回転
========================================================= */

.nav-item.home .nav-icon {

    transform:
        rotate(180deg);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 380px) {

    .header {
        height: 76px;
    }

    .nav-item {
        font-size: 7px;
    }

    .nav-icon {
        width: 29px;
        height: 29px;
    }

    .nav-icon svg {
        width: 18px;
        height: 18px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-panel"></div>

    <div class="header-depth"></div>

    <div class="header-glow"></div>

    <div class="header-line-left"></div>

    <div class="header-line-right"></div>

    <div class="header-center"></div>

    <div class="header-top-edge"></div>

    <div class="header-bottom-edge"></div>

</header>


<!-- =========================================================
     EMPTY HOME
========================================================= -->

<main></main>


<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav class="bottom-nav">

    <div class="bottom-inner">


        <!-- SCHEDULE -->

        <a
            href="schedule.html"

        >

            <div class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3.5"
                        y="5"
                        width="17"
                        height="16"
                        rx="2"
                    />

                    <line
                        x1="7.5"
                        y1="3"
                        x2="7.5"
                        y2="7"
                    />

                    <line
                        x1="16.5"
                        y1="3"
                        x2="16.5"
                        y2="7"
                    />

                    <line
                        x1="3.5"
                        y1="10"
                        x2="20.5"
                        y2="10"
                    />

                    <line
                        x1="8"
                        y1="14"
                        x2="10"
                        y2="14"
                    />

                    <line
                        x1="13"
                        y1="14"
                        x2="15"
                        y2="14"
                    />

                </svg>

            </div>

            SCHEDULE

        </a>



        <!-- SCORE -->

        <a
            href="score.html"
            class="nav-item"
        >

            <div class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3.5"
                        y="4"
                        width="17"
                        height="16"
                        rx="2"
                    />

                    <line
                        x1="8"
                        y1="4"
                        x2="8"
                        y2="20"
                    />

                    <line
                        x1="16"
                        y1="4"
                        x2="16"
                        y2="20"
                    />

                    <line
                        x1="3.5"
                        y1="12"
                        x2="20.5"
                        y2="12"
                    />

                </svg>

            </div>

            SCORE

        </a>



        <!-- HOME -->

        <a
            href="index.html"
            class="nav-item active home"
        >

            <div class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <!-- 五角形 -->

                    <path
                        d="
                            M12 3
                            L20.5 9.2
                            L17.25 19.2
                            H6.75
                            L3.5 9.2
                            Z
                        "
                    />

                </svg>

            </div>

            HOME

        </a>



        <!-- PLAYER -->

        <a
            href="player.html"
            class="nav-item"
        >

            <div class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"

                    />

                    <path

                            M5 20

                    />

                </svg>

            </div>

        </a>



        <!-- STATS -->

        <a

            <div class="nav-icon">

                <svg

                    aria-hidden="true"
                >

                    <line

                    <line

                    <line

                    />

                </svg>

            </div>

            STATS

        </a>


    </div>

</nav>


</body>
</html>
