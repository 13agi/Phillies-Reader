<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,

             viewport-fit=cover"
>

<title>Phillies News</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --navy:
        #07152b;

    --navy-2:
        #0b1c38;

    --red:
        #e31937;

    --white:
        #ffffff;

    --muted:
        #64748b;

    --line:
        rgba(255,255,255,.075);

    --gold:
        #ffd447;
}


/* =========================================================
   RESET
========================================================= */

* {

    margin:0;
    padding:0;

    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body {

    width:100%;
    min-height:100%;

    background:
        var(--navy);
}


body {

    color:
        var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}


/* =========================================================
   HEADER
   schedule.html と完全統一
========================================================= */

.header {

    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:100;

    height:72px;

    overflow:hidden;

    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );

    box-shadow:
        0 7px 22px
        rgba(0,0,0,.30);
}


.header::before {

    content:"";

    position:absolute;

    top:-120px;
    right:-55px;

    width:300px;
    height:300px;

    transform:
        rotate(27deg);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.015)
        );

    border-left:
        1px solid
        rgba(255,255,255,.16);

    pointer-events:
        none;
}


.header::after {

    content:"";

    position:absolute;

    left:0;
    right:0;

    bottom:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,.35) 45%,
            rgba(255,255,255,.28) 72%,
            transparent 100%
        );

    pointer-events:
        none;
}


.header-navy-shape {

    position:absolute;

    top:-20px;
    left:43%;

    width:130px;
    height:130px;

    transform:
        rotate(25deg);

    background:
        rgba(7,21,43,.16);

    pointer-events:
        none;
}


.header-line-one {

    position:absolute;

    left:-20px;
    bottom:14px;

    width:55%;
    height:2px;

    transform:
        skewX(-35deg);

    background:
        rgba(255,255,255,.34);

    pointer-events:
        none;
}


.header-line-two {

    position:absolute;

    left:4%;
    bottom:8px;

    width:35%;
    height:1px;

    transform:
        skewX(-35deg);

    background:
        rgba(255,255,255,.18);

    pointer-events:
        none;
}


.header-light {

    position:absolute;

    top:-85px;
    right:20px;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,.06) 35%,

    pointer-events:

}


/* =========================================================
   MAIN
========================================================= */

main {

    min-height:
        100vh;

    padding-top:
        72px;
}


.page {

    width:100%;

}


/* =========================================================
   PAGE HEADING
   schedule.html と統一
========================================================= */

.page-heading {

}


.page-heading h1 {

        "Barlow Condensed",

.page-heading p {

    font-size:

    font-weight:

/* =========================================================
   FILTERS
========================================================= */

.filters-wrap {

    overflow-y:

}


.filters-wrap::-webkit-scrollbar {

.filters {

.filter-box {

    position:
        relative;

    width:

    flex-shrink:

}


.filter-box select {

    width:
        100%;

    height:
        43px;

    border-radius:

    font-size:

}


.filter-box select option {

    color:

}


.filter-box::after {

/* =========================================================

========================================================= */

.news-label {

.news-count {

}


/* =========================================================

========================================================= */

.news-list {

/* =========================================================
   NEWS CARD

========================================================= */

.news-card {

.news-card:active {

.news-card::before {

.type {

.news-title {

<body>


<!-- =====================================================

<script>

/* =========================================================
   CONFIG
========================================================= */

const NEWS_URL =
    "data/news.json";


/* =========================================================
   STORAGE
========================================================= */

const READ_KEY =
    "phillies_reader_read";


const FAVORITE_KEY =
    "phillies_reader_favorite";


/* =========================================================
   STATE
========================================================= */

let articles = [];

let statusFilter =
    "all";

let typeFilter =
    "all";

let sourceFilter =
    "all";

let periodFilter =
    "all";


/* =========================================================
   ELEMENTS
========================================================= */

const newsList =
    document.getElementById(
        "newsList"
    );


const newsCount =
    document.getElementById(
        "newsCount"
    );


const statusSelect =
    document.getElementById(
        "statusFilter"
    );


const typeSelect =
    document.getElementById(
        "typeFilter"
    );


const sourceSelect =
    document.getElementById(
        "sourceFilter"
    );


const periodSelect =
    document.getElementById(
        "periodFilter"
    );


/* =========================================================
   STORAGE
========================================================= */

function loadStorage(key) {

    try {

        const value =
            JSON.parse(
                localStorage.getItem(
                    key
                ) || "[]"
            );

        return Array.isArray(value)
            ? value
            : [];

    }

    catch {

        return [];

    }

}


let readIds =
    loadStorage(
        READ_KEY
    );


let favoriteIds =
    loadStorage(
        FAVORITE_KEY
    );


/* =========================================================
   SAVE STORAGE
========================================================= */

function saveStorage(
    key,
    value
) {

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* =========================================================
   ARTICLE ID
========================================================= */

function getId(article) {

    return String(

        article.id ||

        article.guid ||

        article.url ||

        article.link ||

        (
            String(
                article.title || ""
            )
            +
            "|"
            +
            String(
                article.publishedAt ||
                article.published ||
                article.date ||
                ""
            )
        )

    );

}


/* =========================================================
   READ
========================================================= */

function isRead(article) {

    return readIds.includes(
        getId(article)
    );

}


function setRead(
    article,
    value
) {

    const id =
        getId(article);

    const index =
        readIds.indexOf(id);


    if (
        value &&
        index === -1
    ) {

        readIds.push(id);

    }


    if (
        !value &&
        index !== -1
    ) {

        readIds.splice(
            index,
            1
        );

    }


    saveStorage(
        READ_KEY,
        readIds
    );

}


/* =========================================================
   FAVORITE
========================================================= */

function isFavorite(article) {

    return favoriteIds.includes(
        getId(article)
    );

}


function toggleFavorite(article) {

    const id =
        getId(article);

    const index =
        favoriteIds.indexOf(id);


    if (index === -1) {

        favoriteIds.push(id);

    }

    else {

        favoriteIds.splice(
            index,
            1
        );

    }


    saveStorage(
        FAVORITE_KEY,
        favoriteIds
    );


    render();

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   SOURCE
========================================================= */

function getSource(article) {

    return String(

        article.source ||

        article.publisher ||

        article.site ||

        article.sourceName ||

        article.outlet ||

        "その他"

    ).trim();

}


/* =========================================================
   TYPE
========================================================= */

function getType(article) {

    const raw =
        String(

            article.type ||

            article.category ||

            article.articleType ||

            article.kind ||

            ""

        )
        .trim()
        .toUpperCase();


    if (
        raw.includes("GAME") ||
        raw.includes("RECAP") ||
        raw.includes("PREVIEW")
    ) {

        return "GAME";

    }


    if (
        raw.includes("ANALYSIS") ||
        raw.includes("ANALYTICS")
    ) {

        return "ANALYSIS";

    }


    if (
        raw.includes("TRANSACTION") ||
        raw.includes("ROSTER") ||
        raw.includes("SIGN") ||
        raw.includes("TRADE")
    ) {

        return "TRANSACTION";

    }


    if (
        raw.includes("INJURY") ||
        raw.includes("INJURED")
    ) {

        return "INJURY";

    }


    if (
        raw.includes("NEWS")
    ) {

        return "NEWS";

    }


    const title =
        String(
            article.title || ""
        ).toUpperCase();


    if (
        /INJURY|INJURED|INJURED LIST|\bIL\b/.test(
            title
        )
    ) {

        return "INJURY";

    }


    if (
        /TRADE|SIGNED|SIGNING|ACQUIRED|DESIGNATED|ROSTER/.test(
            title
        )
    ) {

        return "TRANSACTION";

    }


    if (
        /ANALYSIS|BREAKDOWN|OUTLOOK/.test(
            title
        )
    ) {

        return "ANALYSIS";

    }


    return "NEWS";

}


/* =========================================================
   DATE
========================================================= */

function getDate(article) {

    return new Date(

        article.publishedAt ||

        article.published ||

        article.date ||

        article.datetime ||

        article.createdAt ||

        0

    );

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(article) {

    const date =
        getDate(article);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "ja-JP",
        {
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   SOURCE OPTIONS
========================================================= */

function buildSourceOptions() {

    const sources =
        [
            ...new Set(
                articles.map(
                    article =>
                        getSource(
                            article
                        )
                )
            )
        ]
        .filter(Boolean)
        .sort();


    sourceSelect.innerHTML = `

        <option value="all">
            すべて
        </option>

    `;


    sources.forEach(
        source => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                source;

            option.textContent =
                source;


            sourceSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   PERIOD
========================================================= */

function withinPeriod(article) {

    if (
        periodFilter ===
        "all"
    ) {

        return true;

    }


    const date =
        getDate(article);


    const time =
        date.getTime();


    if (
        Number.isNaN(time)
    ) {

        return false;

    }


    const days =
        Number(
            periodFilter
        );


    return (
        Date.now() -
        time
        <=
        days *
        24 *
        60 *
        60 *
        1000
    );

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredArticles() {

    return articles.filter(
        article => {

            const read =
                isRead(article);


            const favorite =
                isFavorite(article);


            const type =
                getType(article);


            const source =
                getSource(article);


            if (
                statusFilter ===
                "unread" &&
                read
            ) {

                return false;

            }


            if (
                statusFilter ===
                "read" &&
                !read
            ) {

                return false;

            }


            if (
                statusFilter ===
                "favorite" &&
                !favorite
            ) {

                return false;

            }


            if (
                typeFilter !==
                "all" &&
                type !==
                typeFilter
            ) {

                return false;

            }


            if (
                sourceFilter !==
                "all" &&
                source !==
                sourceFilter
            ) {

                return false;

            }


            if (
                !withinPeriod(
                    article
                )
            ) {

                return false;

            }


            return true;

        }
    );

}


/* =========================================================
   SORT
========================================================= */

function sortArticles(list) {

    return [...list].sort(
        (
            a,
            b
        ) => {

            return (
                getDate(b).getTime()
                -
                getDate(a).getTime()
            );

        }
    );

}


/* =========================================================
   CARD
========================================================= */

function createCard(article) {

    const card =
        document.createElement(
            "article"
        );


    const read =
        isRead(article);


    const favorite =
        isFavorite(article);


    card.className =
        "news-card" +
        (
            read
            ? " read"
            : ""
        );


    const url =
        article.url ||
        article.link ||
        "#";


    const title =
        article.title ||
        "タイトルなし";


    const description =
        article.description ||
        article.summary ||
        article.excerpt ||
        "";


    card.innerHTML = `

        <button
            type="button"
            class="read-button ${
                read
                ? "read"
                : ""
            }"
        >
            ${
                read
                ? "既読"
                : "未読"
            }
        </button>


        <button
            type="button"
            class="favorite-button ${
                favorite
                ? "active"
                : ""
            }"
        >
            ${
                favorite
                ? "★"
                : "☆"
            }
        </button>


        <a
            class="news-link"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="card-top">

                <div class="meta">

                    <span class="source">

                        ${escapeHTML(
                            getSource(
                                article
                            )
                        )}

                    </span>


                    <span class="type">

                        ${escapeHTML(
                            getType(
                                article
                            )
                        )}

                    </span>


                    <span class="date">

                        ${escapeHTML(
                            formatDate(
                                article
                            )
                        )}

                    </span>

                </div>

            </div>


            <div class="news-title">

                ${escapeHTML(
                    title
                )}

            </div>


            ${
                description
                ?
                `
                <div class="description">

                    ${escapeHTML(
                        description
                    )}

                </div>
                `
                :
                ""
            }


            <div class="card-footer">

                <span class="status">

                    ${
                        read
                        ? "READ"
                        : "UNREAD"
                    }

                </span>


                <span class="arrow">
                    ›
                </span>

            </div>

        </a>

    `;


    /* FAVORITE */

    card
    .querySelector(
        ".favorite-button"
    )
    .addEventListener(
        "click",
        event => {

            event.preventDefault();

            event.stopPropagation();

            toggleFavorite(
                article
            );

        }
    );


    /* READ */

    card
    .querySelector(
        ".read-button"
    )
    .addEventListener(
        "click",
        event => {

            event.preventDefault();

            event.stopPropagation();

            setRead(
                article,
                !isRead(article)
            );

            render();

        }
    );


    /* OPEN = READ */

    card
    .querySelector(
        ".news-link"
    )
    .addEventListener(
        "click",
        () => {

            setRead(
                article,
                true
            );

        }
    );


    return card;

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const filtered =
        sortArticles(
            getFilteredArticles()
        );


    newsList.innerHTML =
        "";


    newsCount.textContent =
        filtered.length +
        " ARTICLES";


    if (
        filtered.length ===
        0
    ) {

        let message =
            "該当するニュースがありません。";


        if (
            statusFilter ===
            "favorite"
        ) {

            message =
                "お気に入りの記事がありません。";

        }


        if (
            statusFilter ===
            "unread"
        ) {

            message =
                "未読の記事がありません。";

        }


        if (
            statusFilter ===
            "read"
        ) {

            message =
                "既読の記事がありません。";

        }


        newsList.innerHTML = `

            <div class="empty">

                ${message}

            </div>

        `;


        return;

    }


    filtered.forEach(
        article => {

            newsList.appendChild(
                createCard(
                    article
                )
            );

        }
    );

}


/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews() {

    try {

        const response =
            await fetch(
                NEWS_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "news.json could not be loaded"
            );

        }


        const data =
            await response.json();


        if (
            Array.isArray(data)
        ) {

            articles =
                data;

        }

        else if (
            Array.isArray(
                data.articles
            )
        ) {

            articles =
                data.articles;

        }

        else if (
            Array.isArray(
                data.news
            )
        ) {

            articles =
                data.news;

        }

        else {

            articles =
                [];

        }


        buildSourceOptions();

        render();

    }

    catch(error) {

        console.error(
            error
        );


        newsList.innerHTML = `

            <div class="empty">

                ニュースデータを
                読み込めませんでした。

                <br><br>

                data/news.json
                を確認してください。

            </div>

        `;


        newsCount.textContent =
            "0 ARTICLES";

    }

}


/* =========================================================
   FILTER EVENTS
========================================================= */

statusSelect.addEventListener(
    "change",
    function() {

        statusFilter =
            this.value;

        render();

    }
);


typeSelect.addEventListener(
    "change",
    function() {

        typeFilter =
            this.value;

        render();

    }
);


sourceSelect.addEventListener(
    "change",
    function() {

        sourceFilter =
            this.value;

        render();

    }
);


periodSelect.addEventListener(
    "change",
    function() {

        periodFilter =
            this.value;

        render();

    }
);


/* =========================================================
   START
========================================================= */

loadNews();

</script>
