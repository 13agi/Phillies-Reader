<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHILLIES</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(232, 24, 40, 0.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(0, 45, 114, 0.10),
            transparent 35%
        ),
        #f3f4f6;

    color: #172033;

    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background:
        linear-gradient(
            135deg,
            #ed1b2f 0%,
            #d81428 55%,
            #c40f22 100%
        );

    color: white;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.16);

    overflow: hidden;
}


/* 光沢 */

.header::before {
    content: "";

    position: absolute;

    top: -80px;
    left: -20%;

    width: 70%;
    height: 180px;

    background: rgba(255,255,255,0.13);

    transform: rotate(-12deg);

    pointer-events: none;
}


/* 青い下ライン */

.header::after {
    content: "";

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            #002d72 0%,
            #164f99 50%,
            #002d72 100%
        );
}


/* =========================================================
   HEADER INNER
========================================================= */

.header-inner {
    position: relative;
    z-index: 2;

    max-width: 1280px;

    margin: 0 auto;

    min-height: 74px;

    padding:
        12px 22px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
    display: flex;

    align-items: center;

    gap: 13px;

    text-decoration: none;

    color: white;
}


/* Pマーク */

.brand-mark {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #edf0f5
        );

    color: #e31837;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family: Georgia, serif;

    font-size: 25px;

    font-weight: 900;

    border:
        3px solid
        rgba(255,255,255,0.85);

    box-shadow:
        0 5px 14px rgba(0,0,0,0.22);
}


/* PHILLIES */

.brand-name {
    display: flex;
    flex-direction: column;
}

.brand-name-main {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 23px;

    font-weight: 900;

    letter-spacing: 1.2px;

    line-height: 1;
}

.brand-name-sub {
    margin-top: 4px;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 2.5px;

    opacity: 0.78;
}


/* =========================================================
   DESKTOP NAV
========================================================= */

.top-nav {
    display: flex;

    align-items: center;

    gap: 4px;
}

.top-nav-item {
    color: rgba(255,255,255,0.88);

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 0.3px;

    padding:
        10px 13px;

    border-radius: 9px;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
}

.top-nav-item:hover {
    background:
        rgba(255,255,255,0.14);

    color: #ffffff;

    transform:
        translateY(-1px);
}


/* =========================================================
   MAIN
========================================================= */

main {
    width: 100%;

    max-width: 1280px;

    margin: 0 auto;

    padding:
        28px 22px 110px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    min-height: 245px;

    border-radius: 22px;

    overflow: hidden;

    background:
        linear-gradient(
            120deg,
            #071d42 0%,
            #002d72 55%,
            #073d88 100%
        );

    box-shadow:
        0 14px 35px
        rgba(0, 30, 75, 0.22);

    color: white;

    padding:
        38px 36px;

    display: flex;

    align-items: flex-end;
}


/* 赤い装飾 */

.hero::before {
    content: "";

    position: absolute;

    width: 330px;
    height: 330px;

    right: -90px;
    top: -120px;

    border-radius: 50%;

    border:
        45px solid
        rgba(232,24,40,0.18);
}


/* 斜めライン */

.hero::after {
    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 65%;

    height: 100%;

    background:
        repeating-linear-gradient(
            120deg,
            transparent 0px,
            transparent 18px,
            rgba(255,255,255,0.035) 19px,
            rgba(255,255,255,0.035) 20px
        );

    pointer-events: none;
}


/* Hero content */

.hero-content {
    position: relative;

    z-index: 2;

    max-width: 650px;
}

.hero-kicker {
    font-size: 11px;

    font-weight: 800;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.68);

    margin-bottom: 10px;
}

.hero-title {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(38px, 7vw, 68px);

    line-height: 0.95;

    font-weight: 900;

    letter-spacing: -1px;
}

.hero-description {
    margin-top: 15px;

    font-size: 13px;

    line-height: 1.7;

    color:
        rgba(255,255,255,0.72);
}


/* =========================================================
   EMPTY DESIGN AREA
========================================================= */

.design-area {
    margin-top: 22px;

    min-height: 500px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.92);

    border:
        1px solid
        rgba(15,30,55,0.08);

    box-shadow:
        0 8px 28px
        rgba(20,30,50,0.07);

    position: relative;

    overflow: hidden;
}


/* 上部ライン */

.design-area::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            #e31837,
            #e31837 48%,
            #002d72 52%,
            #002d72
        );
}


/* =========================================================
   FUTURE SECTION GUIDE
========================================================= */

.future-label {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    color: #b1b5bc;
}

.future-label-main {
    font-size: 12px;

    font-weight: 700;

    letter-spacing: 2px;
}

.future-label-sub {
    margin-top: 7px;

    font-size: 10px;

    color: #c5c8cd;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
    display: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .header-inner {
        min-height: 66px;

        padding:
            10px 16px;
    }


    .brand-mark {
        width: 39px;
        height: 39px;

        font-size: 21px;
    }


    .brand-name-main {
        font-size: 19px;
    }


    .brand-name-sub {
        font-size: 7px;

        letter-spacing: 2px;
    }


    .top-nav {
        display: none;
    }


    main {
        padding:
            16px 12px 90px;
    }


    .hero {
        min-height: 245px;

        padding:
            30px 24px;

        border-radius: 19px;
    }


    .hero-title {
        font-size: 45px;
    }


    .hero-description {
        font-size: 12px;
    }


    .design-area {
        min-height: 520px;

        border-radius: 17px;
    }


    /* 将来のスマホ用ナビ */

    .bottom-nav {
        position: fixed;

        display: flex;

        left: 10px;
        right: 10px;
        bottom: 10px;

        height: 62px;

        z-index: 900;

        background:
            rgba(255,255,255,0.94);

        backdrop-filter:
            blur(18px);

        -webkit-backdrop-filter:
            blur(18px);

        border:
            1px solid
            rgba(0,0,0,0.08);

        border-radius: 18px;

        box-shadow:
            0 10px 30px
            rgba(0,0,0,0.16);

        align-items: center;

        justify-content: space-around;
    }


    .bottom-nav-item {
        text-decoration: none;

        color: #8b9099;

        font-size: 9px;

        font-weight: 700;

        letter-spacing: 0.3px;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 4px;
    }


    .bottom-nav-icon {
        font-size: 17px;

        line-height: 1;
    }


    .bottom-nav-item:first-child {
        color: #e31837;
    }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-width: 380px) {

    .hero {
        min-height: 225px;

        padding:
            26px 20px;
    }


    .hero-title {
        font-size: 39px;
    }

}

</style>
</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="header-inner">

        <a href="#" class="brand">

            <div class="brand-mark">
                P
            </div>

            <div class="brand-name">

                <div class="brand-name-main">
                    PHILLIES
                </div>

                <div class="brand-name-sub">
                    PHILADELPHIA BASEBALL
                </div>

            </div>

        </a>


        <nav class="top-nav">

            <a href="#" class="top-nav-item">
                HOME
            </a>

            <a href="#" class="top-nav-item">
                NEWS
            </a>

            <a href="#" class="top-nav-item">
                PLAYERS
            </a>

            <a href="#" class="top-nav-item">
                STATS
            </a>

        </nav>

    </div>

</header>



<!-- ======================================================
     MAIN
====================================================== -->

<main>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <div class="hero-kicker">
                PHILADELPHIA PHILLIES
            </div>

            <h1 class="hero-title">
                PHILLIES
            </h1>

            <p class="hero-description">
                Philadelphia Philliesをもっと深く、もっと身近に。
            </p>

        </div>

    </section>



    <!-- EMPTY DESIGN AREA -->

    <section class="design-area">

        <div class="future-label">

            <div class="future-label-main">
                YOUR PHILLIES
            </div>

            <div class="future-label-sub">
                UI DESIGN AREA
            </div>

        </div>

    </section>


</main>



<!-- ======================================================
     MOBILE BOTTOM NAV
     ※現在は見た目だけ
====================================================== -->

<nav class="bottom-nav">

    <a href="#" class="bottom-nav-item">

        <span class="bottom-nav-icon">
            ⌂
        </span>

        HOME

    </a>


    <a href="#" class="bottom-nav-item">

        <span class="bottom-nav-icon">
            ◉
        </span>

        NEWS

    </a>


    <a href="#" class="bottom-nav-item">

        <span class="bottom-nav-icon">
            ♟
        </span>

        PLAYERS

    </a>


    <a href="#" class="bottom-nav-item">

        <span class="bottom-nav-icon">
            ◇
        </span>

        STATS

    </a>

</nav>


</body>
</html>
