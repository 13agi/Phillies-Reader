<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phillies</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(232,24,40,0.08), transparent 40%),
        radial-gradient(circle at 80% 0%, rgba(0,45,114,0.08), transparent 40%),
        linear-gradient(180deg, #f7f7f7, #ececec);
    color: #1d1d1f;
}
/* HEADER */
.header {
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(90deg, #e81828, #c41222);
    border-bottom: 3px solid #002d72;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}
.header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
    pointer-events: none;
}
.header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.site-title {
    display: flex;
    align-items: center;
    gap: 14px;
}
.site-title-mark {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #002d72;
    border: 2px solid rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}
.site-title-text {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
}
.nav {
    display: flex;
    gap: 18px;
}
.nav a {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    transition: 0.2s;
}
.nav a:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
}
/* MAIN */
main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px;
}
/* CONTENT */
.content-area {
    min-height: 600px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        0 2px 8px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
}
.content-area::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #e81828, #002d72);
}
.placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 14px;
}
/* MOBILE */
@media (max-width: 600px) {
    .header-inner {
        padding: 14px 16px;
    }
    .site-title-text {
        font-size: 18px;
    }
    .nav {
        display: none;
    }
    main {
        padding: 20px 12px;
    }
    .content-area {
        border-radius: 14px;
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <div class="site-title">
            <div class="site-title-mark">P</div>
            <div class="site-title-text">PHILLIES</div>
        </div>
        <nav class="nav">
            <a href="#">News</a>
            <a href="#">Players</a>
            <a href="#">Stats</a>
            <a href="#">Schedule</a>
        </nav>
    </div>
</header>
<main>
    <div class="content-area">
        <div class="placeholder">
            CONTENT AREA (UI DESIGN ONLY)
        </div>
    </div>
</main>
</body>
</html>
