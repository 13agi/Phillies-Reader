<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>PHILLIES</title>

<!-- ロゴ用：流線型の筆記体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
      rel="stylesheet">

<style>

:root {
    --navy: #07152b;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
}


/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;

    background: var(--navy);
}

body {
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

    padding-bottom:
        calc(76px + env(safe-area-inset-bottom));
}


/* =========================
   HEADER
========================= */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    height: 96px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--red);

    box-shadow:
        0 5px 20px rgba(0,0,0,0.25);

    overflow: hidden;
}


/* =========================
   HEADER DECORATION
========================= */

.header::before {

    content: "";

    position: absolute;

    width: 160%;
    height: 150px;

    top: -80px;
    left: -30%;

    transform: rotate(-7deg);

    border-top:
        2px solid rgba(255,255,255,0.13);

    border-bottom:
        2px solid rgba(255,255,255,0.08);

    opacity: .55;
}


/* =========================
   PHILLIES WORDMARK
========================= */

.logo {

    position: relative;

    z-index: 2;

    font-family:
        "Lobster",
        cursive;

    font-size: 54px;

    font-weight: 400;

    letter-spacing: -1.8px;

    line-height: 1;

    color: #ffffff;

    transform:
        rotate(-4deg)
        skewX(-7deg)
        scaleX(1.12);

    /* 深い赤の立体影 */
    text-shadow:

        1px 1px 0 #b70e2b,
        2px 2px 0 #b70e2b,
        3px 3px 0 #b70e2b,

        4px 4px 0 rgba(0,0,0,0.14),

        0 6px 12px rgba(0,0,0,0.12);

}


/* =========================
   WORDMARK UNDERLINE
========================= */

.logo::after {

    content: "";

    position: absolute;

    left: 5%;
    right: 2%;

    bottom: -7px;

    height: 4px;

    background: white;

    border-radius: 50%;

    transform:
        rotate(-2deg)
        skewX(-15deg);

    box-shadow:
        1px 2px 0 #b70e2b;

}


/* =========================
   MAIN
========================= */

main {

    min-height: 100vh;

    padding-top: 96px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 200;

    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    padding:
        7px 5px
        env(safe-area-inset-bottom);

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    background:
        rgba(5,16,34,0.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}


/* =========================
   NAV ITEM
========================= */

.nav-item {

    flex: 1;

    min-width: 0;

    height: 60px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    text-decoration: none;

    color: var(--muted);

    border-radius: 13px;

    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}


.nav-item:active {

    transform: scale(.94);
}


/* =========================
   ICON
========================= */

.nav-icon {

    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    font-weight: 700;
}


/* =========================
   LABEL
========================= */

.nav-label {

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .45px;

    white-space: nowrap;
}


/* =========================
   ACTIVE
========================= */

.nav-item.active {

    color: white;

    background:
        rgba(227,25,55,0.13);
}


.nav-item.active .nav-icon {

    color: var(--red);
}


/* =========================
   SMALL IPHONE
========================= */

@media (max-width: 360px) {

    .header {
        height: 90px;
    }

    main {
        padding-top: 90px;
    }

    .logo {
        font-size: 47px;
    }

    .nav-label {
        font-size: 9px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        Phillies
    </div>

</header>


<!-- =========================
     EMPTY MAIN
========================= -->

<main>
</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ▣
        </div>

        <div class="nav-label">
            SCHEDULE
        </div>

    </a>


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ●
        </div>

        <div class="nav-label">
            SCORE
        </div>

    </a>


    <a href="#"
       class="nav-item active">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            HOME
        </div>

    </a>


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ♟
        </div>

        <div class="nav-label">
            PLAYER
        </div>

    </a>


    <a href="#"
       class="nav-item">

        <div class="nav-icon">
            ▥
        </div>

        <div class="nav-label">
            STATS
        </div>

    </a>

</nav>


<script>

const navItems =
    document.querySelectorAll(".nav-item");


navItems.forEach(item => {

    item.addEventListener(
        "click",
        () => {

            navItems.forEach(nav => {
                nav.classList.remove("active");
            });

            item.classList.add("active");

        }
    );

});

</script>


</body>
</html>
