<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PHILLIES</title>


<style>

/* =========================
   PHILLIES COLORS
========================= */

:root {

    --red: #E31837;

    --navy: #002D72;

    --navy-dark: #001F4F;

    --white: #FFFFFF;

}


/* =========================
   BASE
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    min-height: 100vh;

    background:
        var(--navy);

    color:
        var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom: 76px;

}


/* =========================
   HEADER
========================= */

.header {

    width: 100%;

    height: 72px;

    background:
        var(--red);

}


.header-inner {

    width: 100%;

    max-width: 1200px;

    height: 100%;

    margin: 0 auto;

    padding:
        0 24px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


/* =========================
   LOGO
========================= */

.logo {

    display: flex;

    align-items: center;

    gap: 12px;

    color:
        white;

    text-decoration: none;

}


.logo-text {

    font-size: 24px;

    font-weight: 900;

    letter-spacing: 1px;

}


/* =========================
   DESKTOP NAV
========================= */

.nav {

    display: flex;

    align-items: center;

    gap: 4px;

}


.nav a {

    color:
        white;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    padding:
        10px 14px;

    border-radius:
        6px;

}


.nav a:hover {

    background:
        rgba(0,0,0,0.12);

}


/* =========================
   MOBILE MENU
========================= */

.menu {

    display: none;

    width: 42px;

    height: 42px;

    border: 0;

    background:
        rgba(0,0,0,0.12);

    border-radius:
        7px;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 5px;

}


.menu span {

    width: 20px;

    height: 2px;

    background:
        white;

}


/* =========================
   MAIN
========================= */

main {

    min-height:
        calc(100vh - 72px);

    background:
        var(--navy);

}


/* =========================
   BOTTOM TAB BAR
========================= */

.bottom-tabs {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 76px;

    background:
        var(--navy-dark);

    border-top:
        1px solid
        rgba(255,255,255,0.14);

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    z-index: 1000;

}


/* =========================
   TAB
========================= */

.tab {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    text-decoration: none;

    color:
        rgba(255,255,255,0.58);

}


.tab-icon {

    width: 22px;

    height: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 19px;

}


/* =========================
   HOME TAB
========================= */

.home-tab {

    color:
        var(--white);

}


/* =========================
   HOME BASE
========================= */

.home-base {

    position: absolute;

    top: -25px;

    left: 50%;

    width: 52px;

    height: 52px;

    transform:
        translateX(-50%);

    background:
        var(--red);

    /*
       ホームベースの五角形
    */

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 58%,
            50% 100%,
            0 58%
        );

}


/* =========================
   HOME CONTENT
========================= */

.home-content {

    position: relative;

    z-index: 2;

    margin-top: 18px;

    color:
        var(--white);

    font-size: 9px;

    font-weight: 900;

    letter-spacing:
        0.8px;

}


/* =========================
   HOME BASE LINE
========================= */

.home-tab::before {

    content: "";

    position: absolute;

    top: 0;

    left: 50%;

    width: 52px;

    height: 1px;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,0.25);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {


    .header {

        height: 64px;

    }


    .header-inner {

        padding:
            0 18px;

    }


    .logo-text {

        font-size: 21px;

    }


    .nav {

        display: none;

    }


    .menu {

        display: flex;

    }


    main {

        min-height:
            calc(100vh - 64px);

    }


    .bottom-tabs {

        height: 72px;

    }


    .home-base {

        width: 50px;

        height: 50px;

        top: -24px;

    }


    .home-content {

        margin-top: 17px;

        font-size: 8px;

    }

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 701px) {

    .bottom-tabs {

        max-width: 520px;

        left: 50%;

        right: auto;

        transform:
            translateX(-50%);

        bottom: 18px;

        border:
            1px solid
            rgba(255,255,255,0.14);

        border-radius:
            12px;

        overflow:
            visible;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">


        <a href="#" class="logo">

            <span class="logo-text">
                PHILLIES
            </span>

        </a>


        <nav class="nav">

            <a href="#">
                HOME
            </a>

            <a href="#">
                NEWS
            </a>

            <a href="#">
                PLAYERS
            </a>

            <a href="#">
                STATS
            </a>

        </nav>


        <button
            class="menu"
            aria-label="menu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>


    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>
</main>


<!-- =========================
     BOTTOM TABS
========================= -->

<nav class="bottom-tabs">


    <!-- 左① -->

    <a
        href="#"
        class="tab"
    >

        <span class="tab-icon">
            ○
        </span>

    </a>


    <!-- 左② -->

    <a
        href="#"
        class="tab"
    >

        <span class="tab-icon">
            ○
        </span>

    </a>


    <!-- HOME -->

    <a
        href="#"
        class="tab home-tab"
    >

        <span class="home-base"></span>

        <span class="home-content">
            HOME
        </span>

    </a>


    <!-- 右① -->

    <a
        href="#"
        class="tab"
    >

        <span class="tab-icon">
            ○
        </span>

    </a>


    <!-- 右② -->

    <a
        href="#"
        class="tab"
    >

        <span class="tab-icon">
            ○
        </span>

    </a>


</nav>


</body>
</html>
