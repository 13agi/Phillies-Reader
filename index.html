<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHILLIES</title>
<style>
/* =========================================================
   BASE
========================================================= */
:root {
    --phillies-red: #E31837;
    --phillies-red-dark: #9E1026;
    --phillies-red-deep: #650B1B;
    --phillies-navy: #002D72;
    --navy-dark: #00152F;
    --navy-deep: #000C1E;
    --white: #FFFFFF;
    --silver: #C9CED6;
    --text: #172033;
    --muted: #737B89;
    --surface: #F5F6F8;
    --line: rgba(0, 45, 114, 0.12);
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    background: var(--navy-deep);
}
body {
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    color: var(--text);
    background:
        radial-gradient(
            ellipse at 15% 0%,
            rgba(227, 24, 55, 0.08),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 90% 10%,
            rgba(0, 45, 114, 0.10),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #F7F8FA 0%,
            #EFF1F5 100%
        );
}
/* =========================================================
   TOP HEADER
========================================================= */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background:
        linear-gradient(
            180deg,
            #071C3A 0%,
            #001B3F 55%,
            #00152F 100%
        );
    border-bottom:
        1px solid
        rgba(255,255,255,0.09);
    box-shadow:
        0 14px 35px
        rgba(0, 12, 30, 0.35);
}
/* very subtle red light */
.header::before {
    content: "";
    position: absolute;
    left: -10%;
    top: -150px;
    width: 55%;
    height: 230px;
    background:
        radial-gradient(
            ellipse,
            rgba(227,24,55,0.22),
            transparent 70%
        );
    pointer-events: none;
}
/* red accent line */
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            var(--phillies-red) 15%,
            #FF3652 50%,
            var(--phillies-red) 85%,
            transparent 100%
        );
}
/* =========================================================
   HEADER INNER
========================================================= */
.header-inner {
    position: relative;
    z-index: 2;
    max-width: 1320px;
    min-height: 78px;
    margin: 0 auto;
    padding:
        0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
/* =========================================================
   BRAND
========================================================= */
.brand {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
    color: white;
}
/* emblem */
.brand-emblem {
    position: relative;
    width: 47px;
    height: 47px;
    border-radius: 50%;
    background:
        linear-gradient(
            145deg,
            #FFFFFF 0%,
            #F1F2F4 55%,
            #D5D9DF 100%
        );
    border:
        1px solid
        rgba(255,255,255,0.8);
    box-shadow:
        0 5px 15px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
}
.brand-emblem::before {
    content: "";
    position: absolute;
    inset: 4px;
    border:
        1px solid
        rgba(0,45,114,0.25);
    border-radius: 50%;
}
.brand-emblem span {
    position: relative;
    color:
        var(--phillies-red);
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    font-size: 25px;
    font-weight: 900;
}
/* brand text */
.brand-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.brand-main {
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    font-size: 22px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 1.5px;
}
.brand-sub {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    color:
        rgba(255,255,255,0.50);
}
/* =========================================================
   NAVIGATION
========================================================= */
.nav {
    display: flex;
    align-items: center;
    gap: 5px;
}
.nav-item {
    position: relative;
    padding:
        11px 15px;
    color:
        rgba(255,255,255,0.62);
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    transition:
        color 0.25s ease;
}
.nav-item::after {
    content: "";
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 3px;
    height: 1px;
    background:
        var(--phillies-red);
    transform:
        scaleX(0);
    transition:
        transform 0.25s ease;
}
.nav-item:hover {
    color: white;
}
.nav-item:hover::after {
    transform:
        scaleX(1);
}
/* =========================================================
   MAIN
========================================================= */
main {
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding:
        42px 32px 120px;
}
/* =========================================================
   PREMIUM HERO
========================================================= */
.hero {
    position: relative;
    min-height: 390px;
    overflow: hidden;
    border-radius: 2px;
    background:
        linear-gradient(
            125deg,
            #000C1E 0%,
            #001A3D 45%,
            #002D72 100%
        );
    box-shadow:
        0 24px 55px
        rgba(0, 17, 45, 0.28);
    border:
        1px solid
        rgba(255,255,255,0.08);
    display: flex;
    align-items: flex-end;
    padding:
        55px;
}
/* red diagonal */
.hero::before {
    content: "";
    position: absolute;
    right: -130px;
    top: -180px;
    width: 520px;
    height: 650px;
    background:
        linear-gradient(
            145deg,
            transparent 42%,
            rgba(227,24,55,0.75) 43%,
            rgba(227,24,55,0.28) 62%,
            transparent 63%
        );
    transform:
        rotate(7deg);
}
/* navy pattern */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.20;
    background:
        repeating-linear-gradient(
            120deg,
            transparent 0px,
            transparent 24px,
            rgba(255,255,255,0.035) 25px,
            rgba(255,255,255,0.035) 26px
        );
    pointer-events: none;
}
/* =========================================================
   HERO CONTENT
========================================================= */
.hero-content {
    position: relative;
    z-index: 5;
}
.hero-kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    color:
        rgba(255,255,255,0.55);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3.5px;
}
.hero-kicker::before {
    content: "";
    width: 28px;
    height: 1px;
    background:
        var(--phillies-red);
}
.hero-title {
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    font-size:
        clamp(56px, 9vw, 104px);
    line-height: 0.84;
    font-weight: 900;
    letter-spacing: -3px;
    color: #FFFFFF;
    text-shadow:
        0 8px 25px
        rgba(0,0,0,0.28);
}
.hero-line {
    width: 62px;
    height: 3px;
    margin-top: 25px;
    background:
        var(--phillies-red);
}
.hero-description {
    max-width: 440px;
    margin-top: 18px;
    color:
        rgba(255,255,255,0.55);
    font-size: 12px;
    line-height: 1.9;
    letter-spacing: 0.3px;
}
/* =========================================================
   EMPTY CONTENT
========================================================= */
.content-area {
    position: relative;
    margin-top: 28px;
    min-height: 520px;
    background:
        rgba(255,255,255,0.96);
    border:
        1px solid
        rgba(0,45,114,0.09);
    box-shadow:
        0 12px 35px
        rgba(0,25,60,0.07);
    overflow: hidden;
}
/* top detail */
.content-area::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 3px;
    background:
        linear-gradient(
            90deg,
            var(--phillies-red),
            var(--phillies-red) 40%,
            var(--phillies-navy) 60%,
            var(--phillies-navy)
        );
}
/* =========================================================
   DESIGN PLACEHOLDER
========================================================= */
.design-placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform:
        translate(-50%, -50%);
    text-align: center;
    color:
        rgba(0,45,114,0.25);
}
.design-placeholder-title {
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    font-size: 18px;
    letter-spacing: 3px;
    font-weight: 700;
}
.design-placeholder-line {
    width: 32px;
    height: 1px;
    margin:
        13px auto;
    background:
        var(--phillies-red);
}
.design-placeholder-sub {
    font-size: 9px;
    letter-spacing: 2px;
    color:
        rgba(23,32,51,0.28);
}
/* =========================================================
   MOBILE
========================================================= */
.mobile-nav {
    display: none;
}
@media (max-width: 700px) {
    .header-inner {
        min-height: 68px;
        padding:
            0 17px;
    }
    .brand-emblem {
        width: 40px;
        height: 40px;
    }
    .brand-emblem span {
        font-size: 22px;
    }
    .brand-main {
        font-size: 18px;
    }
    .brand-sub {
        font-size: 6px;
        letter-spacing: 2px;
    }
    .nav {
        display: none;
    }
    main {
        padding:
            18px 12px 95px;
    }
    .hero {
        min-height: 330px;
        padding:
            32px 25px;
        border-radius: 2px;
    }
    .hero-title {
        font-size: 55px;
        letter-spacing: -2px;
    }
    .hero-description {
        font-size: 11px;
    }
    .content-area {
        min-height: 520px;
        margin-top: 18px;
    }
    /* mobile bottom bar */
    .mobile-nav {
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 999;
        left: 10px;
        right: 10px;
        bottom: 10px;
        height: 62px;
        background:
            rgba(0,21,47,0.94);
        backdrop-filter:
            blur(20px);
        -webkit-backdrop-filter:
            blur(20px);
        border:
            1px solid
            rgba(255,255,255,0.10);
        box-shadow:
            0 15px 40px
            rgba(0,0,0,0.30);
    }
    .mobile-nav-item {
        text-decoration: none;
        color:
            rgba(255,255,255,0.48);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1px;
        text-align: center;
    }
    .mobile-nav-icon {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
    }
    .mobile-nav-item:first-child {
        color:
            #FFFFFF;
    }
    .mobile-nav-item:first-child
    .mobile-nav-icon {
        color:
            var(--phillies-red);
    }
}
/* =========================================================
   SMALL MOBILE
========================================================= */
@media (max-width: 380px) {
    .hero {
        min-height: 300px;
        padding:
            28px 21px;
    }
    .hero-title {
        font-size: 47px;
    }
}
</style>
</head>
<body>
<!-- ======================================================
     HEADER
====================================================== -->
<header class="header">
    <div class="header-inner">
        <a href="#" class="brand">
            <div class="brand-emblem">
                <span>P</span>
            </div>
            <div class="brand-text">
                <div class="brand-main">
                    PHILLIES
                </div>
                <div class="brand-sub">
                    PHILADELPHIA BASEBALL
                </div>
            </div>
        </a>
        <nav class="nav">
            <a href="#" class="nav-item">
                HOME
            </a>
            <a href="#" class="nav-item">
                NEWS
            </a>
            <a href="#" class="nav-item">
                PLAYERS
            </a>
            <a href="#" class="nav-item">
                STATS
            </a>
        </nav>
    </div>
</header>
<!-- ======================================================
     MAIN
====================================================== -->
<main>
    <section class="hero">
        <div class="hero-content">
            <div class="hero-kicker">
                PHILADELPHIA PHILLIES
            </div>
            <h1 class="hero-title">
                PHILLIES
            </h1>
            <div class="hero-line"></div>
            <p class="hero-description">
                Philadelphia Philliesを、より深く。
                <br>
                あなたのためのPhillies専用サイト。
            </p>
        </div>
    </section>
    <!-- 空のデザイン領域 -->
    <section class="content-area">
        <div class="design-placeholder">
            <div class="design-placeholder-title">
                PHILLIES
            </div>
            <div class="design-placeholder-line"></div>
            <div class="design-placeholder-sub">
                MORE TO COME
            </div>
        </div>
    </section>
</main>
<!-- ======================================================
     MOBILE NAV
====================================================== -->
<nav class="mobile-nav">
    <a href="#" class="mobile-nav-item">
        <span class="mobile-nav-icon">
            ◆
        </span>
        HOME
    </a>
    <a href="#" class="mobile-nav-item">
        <span class="mobile-nav-icon">
            ◇
        </span>
        NEWS
    </a>
    <a href="#" class="mobile-nav-item">
        <span class="mobile-nav-icon">
            ○
        </span>
        PLAYERS
    </a>
    <a href="#" class="mobile-nav-item">
        <span class="mobile-nav-icon">
            ≡
        </span>
        STATS
    </a>
</nav>
</body>
</html>
