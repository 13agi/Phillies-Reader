<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #06172d;
}

body {
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom: 78px;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   EXISTING HEADER
   ※既存UI領域
========================================================= */

.header {
    position: sticky;
    top: 0;

    z-index: 1000;

    height: 84px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );

    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}

.header-field {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 250px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.10);
}

.header-field::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 175px;
    height: 175px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.09);
}

.header-left {
    position: absolute;

    left: -14%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        rgba(70,0,20,.08);
}

.header-right {
    position: absolute;

    right: -13%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        rgba(80,0,20,.14);
}

.header-highlight {
    position: absolute;

    left: -10%;
    top: 0;

    width: 120%;
    height: 1px;

    background:
        rgba(255,255,255,.30);
}

.header-edge {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background:
        rgba(0,0,0,.30);
}

.header-base {
    position: absolute;

    left: 50%;
    bottom: 9px;

    width: 24px;
    height: 20px;

    transform:
        translateX(-50%);

    border:
        1px solid rgba(255,255,255,.22);
}


/* =========================================================
   PLAYER PAGE
========================================================= */

.player-main {
    width: 100%;

    min-height:
        calc(100vh - 162px);

    padding:
        20px 0 30px;
}

.player-shell {
    width: 100%;

    max-width: 820px;

    margin: 0 auto;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.player-heading {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    padding:
        0 16px 18px;

    border-bottom:
        1px solid rgba(255,255,255,.10);
}

.player-heading-main {
    display: flex;

    flex-direction: column;

    gap: 5px;
}

.player-heading-eyebrow {
    color:
        rgba(255,255,255,.30);

    font-size: 7px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        2px;
}

.player-heading-title {
    margin: 0;

    color: #fff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 32px;

    line-height: .9;

    font-weight: 400;

    letter-spacing:
        -.8px;
}

.player-heading-season {
    color:
        rgba(255,255,255,.35);

    font-size: 8px;

    font-weight: 800;

    letter-spacing:
        1.2px;
}


/* =========================================================
   ROSTER GROUP
========================================================= */

.roster-group {
    margin-top: 14px;
}

.roster-group-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 16px 9px;
}

.roster-group-title {
    display: flex;

    align-items: center;

    gap: 8px;
}

.roster-group-line {
    width: 14px;
    height: 2px;

    background: #e31837;
}

.roster-group-name {
    color:
        rgba(255,255,255,.54);

    font-size: 7px;

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        1.5px;
}

.roster-group-count {
    color:
        rgba(255,255,255,.20);

    font-size: 6px;

    font-weight: 800;

    letter-spacing:
        1px;
}


/* =========================================================
   PLAYER ITEM
========================================================= */

.player-item {
    --accent: #e31837;

    position: relative;

    display: grid;

    grid-template-columns:
        76px
        1fr
        42px;

    min-height: 108px;

    width: 100%;

    border-top:
        1px solid rgba(255,255,255,.065);

    background:
        rgba(255,255,255,.008);

    overflow: hidden;

    transition:
        background .18s ease;
}

.player-item.il {
    --accent: #f4c542;
}

.player-item.forty {
    --accent: #75869b;
}


/* =========================================================
   ACTIVE ACCENT
========================================================= */

.player-item::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 3px;

    background:
        var(--accent);
}


/* =========================================================
   NUMBER
========================================================= */

.player-item-number {
    display: flex;

    align-items: center;

    justify-content: center;

    padding-left: 4px;

    border-right:
        1px solid rgba(255,255,255,.065);
}

.player-item-number span {
    color:
        rgba(255,255,255,.95);

    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        sans-serif;

    font-size: 42px;

    line-height: .8;

    font-weight: 800;

    letter-spacing:
        -3px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   PLAYER CONTENT
========================================================= */

.player-item-content {
    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding:
        15px 12px 14px 17px;
}


/* =========================================================
   POS + B/T
========================================================= */

.player-item-meta {
    display: flex;

    align-items: center;

    min-width: 0;

    gap: 8px;
}

.player-position {
    color:
        rgba(255,255,255,.82);

    font-size: 9px;

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        .9px;
}

.player-bt {
    position: relative;

    padding-left: 9px;

    color:
        rgba(255,255,255,.37);

    font-size: 8px;

    line-height: 1;

    font-weight: 700;

    letter-spacing:
        .7px;
}

.player-bt::before {
    content: "";

    position: absolute;

    left: 0;
    top: 50%;

    width: 1px;
    height: 10px;

    transform:
        translateY(-50%);

    background:
        rgba(255,255,255,.16);
}


/* =========================================================
   NAME
========================================================= */

.player-item-name {
    width: 100%;

    min-width: 0;

    margin-top: 6px;

    color: #fff;

    font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 24px;

    line-height: 1;

    font-weight: 650;

    letter-spacing:
        -1px;

    white-space: nowrap;

    overflow: hidden;

    transform-origin:
        left center;
}


/* =========================================================
   ROSTER STATUS
========================================================= */

.player-item-status {
    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 9px;

    min-width: 0;
}

.player-status-marker {
    width: 5px;
    height: 5px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        var(--accent);
}

.player-status-name {
    color:
        var(--accent);

    font-size: 6px;

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        1.1px;
}

.player-status-detail {
    color:
        rgba(255,255,255,.20);

    font-size: 6px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        .8px;

    white-space: nowrap;
}


/* =========================================================
   RIGHT POSITION MARK
========================================================= */

.player-item-side {
    display: flex;

    align-items: center;

    justify-content: center;

    padding-right: 8px;
}

.player-item-side span {
    color:
        rgba(255,255,255,.10);

    font-size: 8px;

    font-weight: 900;

    letter-spacing:
        1px;

    writing-mode:
        vertical-rl;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover:hover) {

    .player-item:hover {
        background:
            rgba(255,255,255,.025);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 390px) {

    .player-main {
        padding-top: 17px;
    }

    .player-heading {
        padding:
            0 13px 16px;
    }

    .player-heading-title {
        font-size: 29px;
    }

    .roster-group-header {
        padding:
            0 13px 8px;
    }

    .player-item {
        grid-template-columns:
            66px
            minmax(0,1fr)
            35px;

        min-height: 103px;
    }

    .player-item-content {
        padding:
            14px 8px 13px 15px;
    }

    .player-item-number span {
        font-size: 38px;
    }

    .player-item-name {
        font-size: 21px;
        letter-spacing:
            -.8px;
    }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media (max-width: 340px) {

    .player-item {
        grid-template-columns:
            58px
            minmax(0,1fr);
    }

    .player-item-side {
        display: none;
    }

    .player-item-name {
        font-size: 19px;
    }

    .player-item-number span {
        font-size: 34px;
    }

}


/* =========================================================
   EXISTING BOTTOM NAV
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    height: 78px;

    background:
        rgba(5,20,39,.98);

        1px solid rgba(255,255,255,.08);

    backdrop-filter:

.bottom-inner {

.nav-item {

    font-size: 8px;

    font-weight: 800;

    letter-spacing:
        .65px;

.nav-icon {
    width: 31px;
    height: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;
}

.nav-icon svg {
    width: 20px;
    height: 20px;

    fill: none;

    stroke:
        currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.nav-item.active {
    color:
        #e31837;
}

.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}

</style>

   PLAYER DATA NORMALIZATION
========================================================= */

const VALID_POSITIONS = new Set([
    "P",
    "C",
    "1B",
    "2B",
    "3B",
    "SS",
    "LF",
    "CF",
    "RF",
    "DH"
]);


/* ---------------------------------------------------------
   Number
   07 -> 7
   null -> —
--------------------------------------------------------- */

function normalizeNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    const number =
        Number.parseInt(
            String(value),
            10
        );

    return Number.isNaN(number)
        ? "—"
        : String(number);
}


/* ---------------------------------------------------------
   Position
--------------------------------------------------------- */

function normalizePosition(value) {

    if (!value) {
        return "—";
    }

    const position =
        String(value)
            .trim()
            .toUpperCase();

    return VALID_POSITIONS.has(position)
        ? position
        : "—";
}


/* ---------------------------------------------------------
   B/T
--------------------------------------------------------- */

function normalizeBT(
    bats,
    throws
) {

    if (
        !bats ||
        !throws
    ) {
        return "—";
    }

    const b =
        String(bats)
            .trim()
            .toUpperCase();

    const t =
        String(throws)
            .trim()
            .toUpperCase();

    const validBats =
        ["R", "L", "S"];

    const validThrows =
        ["R", "L"];

    if (
        !validBats.includes(b) ||
        !validThrows.includes(t)
    ) {
        return "—";
    }

    return `${b}/${t}`;
}


/* ---------------------------------------------------------
   Player normalization
--------------------------------------------------------- */

function normalizePlayer(player) {

    return {

        id:
            player?.id ??
            null,

        number:
            normalizeNumber(
                player?.number
            ),

        position:
            normalizePosition(
                player?.position
            ),

        bats:
            player?.bats ??
            null,

        throws:
            player?.throws ??
            null,

        bt:
            normalizeBT(
                player?.bats,
                player?.throws
            ),

        name:
            player?.fullName ??
            null,

        status:
            player?.status ??
            null,

        roster:
            player?.roster ??
            null

    };

}


/* =========================================================
   NAME FIT
   ---------------------------------------------------------
   長い選手名でも絶対に2行にしない
========================================================= */

function fitPlayerNames() {

    document
        .querySelectorAll(
            ".player-item-name"
        )
        .forEach(name => {

            const container =
                name.parentElement;

            if (!container) {
                return;
            }

            const availableWidth =
                container.clientWidth;

            let fontSize =
                window.innerWidth <= 390
                    ? 21
                    : 24;

            name.style.fontSize =
                `${fontSize}px`;

            while (
                name.scrollWidth >
                    availableWidth &&
                fontSize > 13
            ) {

                fontSize -= .25;

                name.style.fontSize =
                    `${fontSize}px`;
            }

        });

}


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        fitPlayerNames();

    }
);


window.addEventListener(
    "resize",
    fitPlayerNames
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            fitPlayerNames,
            100
        );

    }
);

</script>
