<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player | Phillies</title>
<style>
:root{
    --navy:#06172d;
    --navy-deep:#031020;
    --red:#e31837;
    --yellow:#f4c542;
    --white:#f7f9fc;
    --muted:#708198;
    --soft:rgba(255,255,255,.42);
    --faint:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.075);
}
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
html,
body{
    width:100%;
    min-height:100%;
    background:var(--navy);
}
body{
    min-height:100vh;
    padding-bottom:78px;
    color:var(--white);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   EXISTING HEADER
========================================================= */
.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:84px;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
.header-field{
    position:absolute;
    left:50%;
    top:50%;
    width:250px;
    height:250px;
    transform:
        translate(-50%,-50%)
        rotate(45deg);
    border:
        1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
    opacity:.8;
}
.header-field::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:175px;
    height:175px;
    transform:
        translate(-50%,-50%);
    border:
        1px solid rgba(255,255,255,.09);
}
.header-field::after{
    content:"";
    position:absolute;
    left:50%;
    top:-30px;
    width:1px;
    height:310px;
    transform:
        translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
.header-left{
    position:absolute;
    left:-14%;
    top:-60%;
    width:47%;
    height:220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right{
    position:absolute;
    right:-13%;
    top:-60%;
    width:47%;
    height:220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
.header-highlight{
    position:absolute;
    left:-10%;
    top:0;
    width:120%;
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
.header-edge{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:4px;
    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
    opacity:.85;
}
.header-base{
    position:absolute;
    left:50%;
    bottom:9px;
    width:24px;
    height:20px;
    transform:
        translateX(-50%);
    border:
        1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
    opacity:.75;
}
/* =========================================================
   ROSTER
========================================================= */
main{
    width:100%;
    min-height:calc(100vh - 162px);
    padding:
        22px 14px 30px;
}
.roster{
    width:100%;
    max-width:760px;
    margin:0 auto;
}
/* =========================================================
   TITLE
========================================================= */
.roster-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:
        0 3px 14px;
    border-bottom:
        1px solid var(--line);
    margin-bottom:0;
}
.roster-title{
    display:flex;
    align-items:baseline;
    gap:9px;
}
.roster-title strong{
    font-size:13px;
    font-weight:950;
    letter-spacing:2.2px;
}
.roster-title span{
    color:
        rgba(255,255,255,.28);
    font-size:7px;
    font-weight:850;
    letter-spacing:1.1px;
}
.roster-count{
    color:
        rgba(255,255,255,.28);
    font-size:7px;
    font-weight:850;
    letter-spacing:1px;
}
/* =========================================================
   PLAYER ROW
========================================================= */
.player{
    --accent:var(--red);
    position:relative;
    display:grid;
    grid-template-columns:
        58px
        54px
        minmax(0,1fr)
        70px;
    align-items:center;
    width:100%;
    height:104px;
    border-bottom:
        1px solid var(--line);
    overflow:hidden;
    cursor:pointer;
    transition:
        background .18s ease,
        padding-left .18s ease;
}
.player.il{
    --accent:var(--yellow);
}
/* status line */
.player::before{
    content:"";
    position:absolute;
    left:0;
    top:18px;
    bottom:18px;
    width:3px;
    background:
        var(--accent);
    opacity:.95;
}
/* subtle number background */
.player::after{
    content:attr(data-number);
    position:absolute;
    right:62px;
    top:50%;
    transform:
        translateY(-50%);
    color:
        rgba(255,255,255,.018);
    font-family:
        "Arial Narrow",
        Impact,
        sans-serif;
    font-size:100px;
    font-weight:900;
    line-height:.8;
    letter-spacing:-7px;
    pointer-events:none;
}
/* =========================================================
   NUMBER
========================================================= */
.number{
    position:relative;
    z-index:2;
    padding-left:16px;
    color:
        rgba(255,255,255,.94);
    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        Impact,
        sans-serif;
    font-size:31px;
    font-weight:900;
    line-height:1;
    letter-spacing:-1.8px;
    font-variant-numeric:
        tabular-nums;
}
/* =========================================================
   POS
========================================================= */
.position{
    position:relative;
    z-index:2;
    color:
        rgba(255,255,255,.55);
    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.3px;
}
/* =========================================================
   NAME
========================================================= */
.player-center{
    position:relative;
    z-index:2;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-right:8px;
}
.name{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    color:
        var(--white);
    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "Helvetica Neue",
        Arial,
        sans-serif;
    font-size:
        clamp(19px,5.8vw,27px);
    line-height:.95;
    font-weight:900;
    letter-spacing:
        -.8px;
    text-overflow:ellipsis;
}
.bt{
    margin-top:7px;
    color:
        rgba(255,255,255,.29);
    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;
    font-size:7px;
    font-weight:850;
    letter-spacing:1px;
}
/* =========================================================
   ROSTER STATUS
========================================================= */
.status{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
    padding-right:5px;
    text-align:right;
}
.status-main{
    display:flex;
    align-items:center;
    gap:6px;
    color:
        var(--accent);
    font-size:7px;
    font-weight:950;
    letter-spacing:1px;
}
.status-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:
        var(--accent);
    box-shadow:
        0 0 8px
        color-mix(
            in srgb,
            var(--accent) 65%,
            transparent
        );
}
.status-sub{
    margin-top:5px;
    color:
        rgba(255,255,255,.20);
    font-size:5.5px;
    font-weight:800;
    letter-spacing:.7px;
    white-space:nowrap;
}
/* =========================================================
   INTERACTION
========================================================= */
@media(hover:hover){
    .player:hover{
        background:
            linear-gradient(
                90deg,
                rgba(255,255,255,.025),
                rgba(255,255,255,.01)
            );
        padding-left:4px;
    }
    .player:hover::before{
        box-shadow:
            0 0 16px
            color-mix(
                in srgb,
                var(--accent) 45%,
                transparent
            );
    }
}
.player:active{
    background:
        rgba(255,255,255,.035);
}
/* =========================================================
   MOBILE
========================================================= */
@media(max-width:390px){
    main{
        padding:
            18px 9px 28px;
    }
    .player{
        grid-template-columns:
            50px
            43px
            minmax(0,1fr)
            63px;
        height:96px;
    }
    .number{
        padding-left:13px;
        font-size:28px;
    }
    .position{
        font-size:9px;
    }
    .name{
        font-size:
            clamp(
                17px,
                5.8vw,
                23px
            );
    }
    .bt{
        font-size:6px;
        margin-top:6px;
    }
    .status-main{
        font-size:6.5px;
    }
    .status-sub{
        font-size:5px;
    }
    .player::after{
        right:52px;
        font-size:82px;
    }
}
/* =========================================================
   BOTTOM NAV
========================================================= */
.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:2000;
    height:78px;

.bottom-inner{

.nav-item{

    font-weight:800;

        transparent;
}
.nav-icon{
    width:31px;
    height:31px;

.nav-icon svg{

.nav-item.active{

        var(--red);
}
.nav-item.active .nav-icon{
    background:
        rgba(227,24,55,.14);
}
</style>

<script>
/*
 * 背番号
 *
 * "07" → "7"
 * null → "—"
 */
function normalizeNumber(value){
    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "—";
    }
    const parsed =
        Number.parseInt(
            String(value),
            10
        );
    return Number.isNaN(parsed)
        ? "—"
        : String(parsed);
}
/*
 * B/T
 *
 * bats / throws のどちらかが
 * 不明なら勝手に推測しない。
 */
function formatBT(bats, throws){
    if(
        !bats ||
        !throws
    ){
        return "—";
    }
    return `${bats}/${throws}`;
}
/*
 * 将来のMLB APIデータ用
 */
function playerViewModel(player){
    return {
        number:
            normalizeNumber(
                player?.number
            ),
        position:
            player?.position ?? "—",
        bt:
            formatBT(
                player?.bats,
                player?.throws
            ),
        name:
            player?.fullName ?? "—",
        status:
            player?.status ?? "—",
        roster:
            player?.roster ?? "—"
    };
}
/*
 * 長い選手名をカード幅に合わせる。
 * カード自体の高さ・幅は変更しない。
 */
function fitPlayerNames(){
    document
        .querySelectorAll(".name")
        .forEach(name => {
            name.style.fontSize = "";
            const maxWidth =
                name.parentElement
                    .clientWidth;
            let size =
                parseFloat(
                    getComputedStyle(name)
                        .fontSize
                );
            while(
                name.scrollWidth >
                maxWidth &&
                size > 14
            ){
                size -= .5;
                name.style.fontSize =
                    `${size}px`;
            }
        });
}
window.addEventListener(
    "DOMContentLoaded",
    fitPlayerNames
);
window.addEventListener(
    "resize",
    fitPlayerNames
);
window.addEventListener(
    "orientationchange",
    () => {
        setTimeout(
            fitPlayerNames,
            100
        );
    }
);
</script>
