<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">
<title>PLAYER | PHILLIES</title>
<style>
:root {
    --navy: #07152b;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
    --yellow: #f4c430;
    --gray: #64748b;
}
/* =====================================================
   RESET
===================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background:
        var(--navy);
}
body {
    color:
        var(--white);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =====================================================
   HEADER
===================================================== */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    overflow: hidden;
    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );
    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.30);
}
.header::before {
    content: "";
    position: absolute;
    top: -120px;
    right: -55px;
    width: 300px;
    height: 300px;
    transform:
        rotate(27deg);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.015)
        );
    border-left:
        1px solid
        rgba(255,255,255,0.16);
}
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,0.35) 45%,
            rgba(255,255,255,0.28) 72%,
            transparent 100%
        );
}
/* =====================================================
   MAIN
===================================================== */
main {
    min-height: 100vh;
    padding-top:
        72px;
    padding-bottom:
        20px;
}
.player-page {
    width: 100%;
    padding:
        22px 16px 30px;
}
/* =====================================================
   TITLE
===================================================== */
.player-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: .5px;
    margin-bottom: 4px;
}
.player-subtitle {
    color:
        var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 20px;
}
/* =====================================================
   FILTER AREA
===================================================== */
.filter-area {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 25px;
}
/* =====================================================
   SELECT
===================================================== */
.filter-select {
    width: 100%;
    height: 46px;
    padding:
        0 42px 0 15px;
    border: 1px solid
        rgba(255,255,255,0.10);
    border-radius: 12px;
    background:
        rgba(255,255,255,0.055);
    color:
        var(--white);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .5px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image:
        linear-gradient(
            45deg,
            transparent 50%,
            rgba(255,255,255,.65) 50%
        ),
        linear-gradient(
            135deg,
            rgba(255,255,255,.65) 50%,
            transparent 50%
        );
    background-position:
        calc(100% - 19px) 19px,
        calc(100% - 13px) 19px;
    background-size:
        6px 6px,
        6px 6px;
    background-repeat:
        no-repeat;
}
.filter-select:focus {
    border-color:
        rgba(227,25,55,.65);
}
.filter-select option {
    background:
        #07152b;
    color:
        white;
}
/* =====================================================
   POSITION GROUP
===================================================== */
.position-group {
    margin-bottom:
        25px;
}
.position-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom:
        9px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color:
        rgba(255,255,255,0.70);
}
.position-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background:
        rgba(255,255,255,0.08);
}
/* =====================================================
   PLAYER LIST
===================================================== */
.player-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
/* =====================================================
   PLAYER CARD
===================================================== */
.player-card {
    position: relative;
    width: 100%;
    min-height: 84px;
    display: flex;
    align-items: center;
    padding:
        11px 13px 11px 18px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.022)
        );
    border:
        1px solid
        rgba(255,255,255,0.075);
    border-radius:
        14px;
    overflow:
        hidden;
}
/* =====================================================
   STATUS LINE
===================================================== */
.player-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 4px;
}
/* ACTIVE */
.player-card.active::after {
    background:
        var(--red);
}
/* IL */
.player-card.il::after {
    background:
        var(--yellow);
}
/* 40-MAN */
.player-card.outside::after {
    background:
        var(--gray);
}
/* =====================================================
   NUMBER
===================================================== */
.player-number {
    width: 56px;
    flex-shrink: 0;
    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;
    font-size: 31px;
    line-height: 1;
    letter-spacing:
        -1.5px;
    color:
        rgba(255,255,255,0.30);
    transform:
        scaleX(.88);
    transform-origin:
        left center;
}
.player-number::before {
    content:
        "#";
    display: inline-block;
    margin-right:
        1px;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size:
        9px;
    font-weight:
        800;
    color:
        rgba(227,25,55,.75);
    vertical-align:
        top;
}
/* =====================================================
   B/T
===================================================== */
.player-bt {
    width:
        55px;
    flex-shrink:
        0;
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        .3px;
    color:
        rgba(255,255,255,.58);
}
/* =====================================================
   POSITION
===================================================== */
.player-pos {
    width:
        40px;
    flex-shrink:
        0;
    font-size:
        10px;
    font-weight:
        800;
    color:
        var(--red);
}
/* =====================================================
   PLAYER INFO
===================================================== */
.player-info {
    flex: 1;
    min-width: 0;
    display:
        flex;
    flex-direction:
        column;
    justify-content:
        center;
    gap:
        4px;
}
/* =====================================================
   FULL PLAYER NAME
===================================================== */
.player-name {
    width:
        100%;
    font-size:
        15px;
    font-weight:
        800;
    letter-spacing:
        .05px;
    color:
        var(--white);
    /*
       名前は省略しない
    */
    white-space:
        normal;
    overflow:
        visible;
    text-overflow:
        clip;
    line-height:
        1.2;
}
/* =====================================================
   STATUS LABEL
===================================================== */
.player-status {
    width:
        fit-content;
    font-size:
        8px;
    font-weight:
        900;
    letter-spacing:
        .7px;
    line-height:
        1;
}
.player-card.active
.player-status {
    color:
        var(--red);
}
.player-card.il
.player-status {
    color:
        var(--yellow);
}
.player-card.outside
.player-status {
    color:
        #94a3b8;
}
/* =====================================================
   MESSAGE
===================================================== */
.message {
    padding:
        35px 20px;
    text-align:
        center;
    color:
        var(--muted);
    font-size:
        13px;
    line-height:
        1.7;
}
/* =====================================================
   BOTTOM NAV
===================================================== */
.bottom-nav {
    position:
        fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index:
        200;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 5px
        env(safe-area-inset-bottom);
    display:
        flex;
    align-items:
        flex-start;
    justify-content:
        space-between;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
.nav-item {
    flex:
        1;
    min-width:
        0;
    height:
        60px;
    display:
        flex;
    flex-direction:
        column;
    align-items:
        center;
    justify-content:
        center;
    gap:
        5px;
    text-decoration:
        none;
    color:
        var(--muted);
    border-radius:
        13px;
}
.nav-icon {
    width:
        25px;
    height:
        25px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        18px;
    font-weight:
        700;
}
.nav-label {
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        .45px;
    white-space:
        nowrap;
}
.nav-item.active {
    color:
        var(--white);
    background:
        rgba(227,25,55,.13);
}
.nav-item.active
.nav-icon {
    color:
        var(--red);
}
/* =====================================================
   SMALL IPHONE
===================================================== */
@media (max-width: 360px) {
    .player-page {
        padding-left:
            13px;
        padding-right:
            13px;
    }
    .player-number {
        width:
            48px;
        font-size:
            28px;
    }
    .player-bt {
        width:
            43px;
    }
    .player-pos {
        width:
            34px;
    }
    .player-name {
        font-size:
            14px;
    }
}
</style>
</head>
<body>
<header class="header"></header>
<main>
<section class="player-page">
    <h1 class="player-title">
        Players
    </h1>
    <p class="player-subtitle">
        PHILADELPHIA PHILLIES
    </p>
    <!-- =============================================
         FILTER
    ============================================== -->
    <div class="filter-area">
        <select
            id="roster-filter"
            class="filter-select">
            <option value="ALL">
                ACTIVE + 40-MAN + IL
            </option>
            <option value="26MAN">
                ACTIVE
            </option>
            <option value="IL">
                IL
            </option>
            <option value="40MAN">
                40-MAN
            </option>
        </select>
        <select
            id="position-filter"
            class="filter-select">
            <option value="ALL">
                ALL POSITIONS
            </option>
            <option value="P">
                PITCHERS
            </option>
            <option value="C">
                CATCHERS
            </option>
            <option value="IF">
                INFIELDERS
            </option>
            <option value="OF">
                OUTFIELDERS
            </option>
            <option value="DH">
                DESIGNATED HITTERS
            </option>
        </select>
    </div>
    <div id="player-container">
        <div class="message">
            Loading players...
        </div>
    </div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
===================================================== -->
<nav class="bottom-nav">
    <a
        href="schedule.html"
        class="nav-item">
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
    <a
        href="score.html"
        class="nav-item">
        <div class="nav-icon">
            ●
        </div>
        <div class="nav-label">
            SCORE
        </div>
    </a>
    <a
        href="index.html"
        class="nav-item">
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <a
        href="player.html"
        class="nav-item active">
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <a
        href="stats.html"
        class="nav-item">
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
</nav>
<script>
/* =====================================================
   GLOBAL DATA
===================================================== */
let allPlayers = [];
/* =====================================================
   POSITION GROUP
===================================================== */
function getPositionGroup(player) {
    const position =
        String(
            player.position || ""
        ).toUpperCase();
    const name =
        String(
            player.positionName || ""
        ).toLowerCase();
    /* 投手 */
    if (
        position === "P" ||
        position === "SP" ||
        position === "RP" ||
        position === "RHP" ||
        position === "LHP" ||
        name.includes("pitcher")
    ) {
        return "P";
    }
    /* 捕手 */
    if (
        position === "C" ||
        name.includes("catcher")
    ) {
        return "C";
    }
    /* 内野手 */
    if (
        [
            "1B",
            "2B",
            "3B",
            "SS"
        ].includes(position) ||
        name.includes("infielder") ||
        name.includes("first baseman") ||
        name.includes("second baseman") ||
        name.includes("third baseman") ||
        name.includes("shortstop")
    ) {
        return "IF";
    }
    /* 外野手 */
    if (
        [
            "LF",
            "CF",
            "RF",
            "OF"
        ].includes(position) ||
        name.includes("outfielder")
    ) {
        return "OF";
    }
    /* DH */
    if (
        position === "DH" ||
        name.includes(
            "designated"
        )
    ) {
        return "DH";
    }
    return "OTHER";
}
/* =====================================================
   POSITION ORDER
===================================================== */
function positionOrder(player) {
    const group =
        getPositionGroup(
            player
        );
    const order = {
        P: 1,
        C: 2,
        IF: 3,
        OF: 4,
        DH: 5,
        OTHER: 6
    };
    return (
        order[group] || 99
    );
}
/* =====================================================
   NUMBER
===================================================== */
function getNumber(player) {
    const number =
        parseInt(
            player.number,
            10
        );
    if (
        Number.isNaN(number)
    ) {
        return 999;
    }
    return number;
}
/* =====================================================
   CREATE CARD
===================================================== */
function createCard(player) {
    const status =
        String(
            player.rosterStatus ||
            "40MAN"
        ).toUpperCase();
    let className =
        "outside";
    let statusText =
        "40-MAN";
    if (
        status === "26MAN"
    ) {
        className =
            "active";
        statusText =
            "ACTIVE";
    }
    else if (
        status === "IL"
    ) {
        className =
            "il";
        statusText =
            "IL";
    }
    const card =
        document.createElement(
            "div"
        );
    card.className =
        "player-card " +
        className;
    /* NUMBER */
    const number =
        document.createElement(
            "div"
        );
    number.className =
        "player-number";
    number.textContent =
        player.number || "--";
    /* B/T */
    const bt =
        document.createElement(
            "div"
        );
    bt.className =
        "player-bt";
    bt.textContent =
        player.bt || "--";
    /* POSITION */
    const position =
        document.createElement(
            "div"
        );
    position.className =
        "player-pos";
    position.textContent =
        player.position || "--";
    /* INFO */
    const info =
        document.createElement(
            "div"
        );
    info.className =
        "player-info";
    /* NAME */
    const name =
        document.createElement(
            "div"
        );
    name.className =
        "player-name";
    name.textContent =
        player.name ||
        "Unknown";
    /* STATUS */
    const statusElement =
        document.createElement(
            "div"
        );
    statusElement.className =
        "player-status";
    statusElement.textContent =
        statusText;
    info.appendChild(
        name
    );
    info.appendChild(
        statusElement
    );
    card.appendChild(
        number
    );
    card.appendChild(
        bt
    );
    card.appendChild(
        position
    );
    card.appendChild(
        info
    );
    return card;
}
/* =====================================================
   RENDER
===================================================== */
function renderPlayers() {
    const container =
        document.getElementById(
            "player-container"
        );
    const rosterFilter =
        document.getElementById(
            "roster-filter"
        ).value;
    const positionFilter =
        document.getElementById(
            "position-filter"
        ).value;
    /* ---------------------------------------------
       FILTER
    --------------------------------------------- */
    let players =
        allPlayers.filter(
            player => {
                const status =
                    String(
                        player.rosterStatus ||
                        "40MAN"
                    ).toUpperCase();
                const position =
                    getPositionGroup(
                        player
                    );
                /* roster */
                if (
                    rosterFilter !== "ALL" &&
                    status !== rosterFilter
                ) {
                    return false;
                }
                /* position */
                if (
                    positionFilter !== "ALL" &&
                    position !== positionFilter
                ) {
                    return false;
                }
                return true;
            }
        );
    /* ---------------------------------------------
       SORT
    --------------------------------------------- */
    players.sort(
        (a, b) => {
            const positionDifference =
                positionOrder(a) -
                positionOrder(b);
            if (
                positionDifference !== 0
            ) {
                return positionDifference;
            }
            return (
                getNumber(a) -
                getNumber(b)
            );
        }
    );
    /* ---------------------------------------------
       EMPTY
    --------------------------------------------- */
    if (
        players.length === 0
    ) {
        container.innerHTML =
            `
            <div class="message">
                No players found.
            </div>
            `;
        return;
    }
    container.innerHTML =
        "";
    /* ---------------------------------------------
       GROUPS
    --------------------------------------------- */
    const groups = {
        P: {
            title:
                "PITCHERS",
            players: []
        },
        C: {
            title:
                "CATCHERS",
            players: []
        },
        IF: {
            title:
                "INFIELDERS",
            players: []
        },
        OF: {
            title:
                "OUTFIELDERS",
            players: []
        },
        DH: {
            title:
                "DESIGNATED HITTERS",
            players: []
        },
        OTHER: {
            title:
                "OTHER",
            players: []
        }
    };
    players.forEach(
        player => {
            const group =
                getPositionGroup(
                    player
                );
            if (
                groups[group]
            ) {
                groups[group]
                    .players
                    .push(player);
            }
        }
    );
    /* ---------------------------------------------
       DISPLAY ORDER
    --------------------------------------------- */
    const order = [
        "P",
        "C",
        "IF",
        "OF",
        "DH",
        "OTHER"
    ];
    order.forEach(
        key => {
            const group =
                groups[key];
            if (
                group.players.length === 0
            ) {
                return;
            }
            const section =
                document.createElement(
                    "section"
                );
            section.className =
                "position-group";
            const title =
                document.createElement(
                    "div"
                );
            title.className =
                "position-title";
            title.textContent =
                group.title;
            const list =
                document.createElement(
                    "div"
                );
            list.className =
                "player-list";
            group.players.forEach(
                player => {
                    list.appendChild(
                        createCard(
                            player
                        )
                    );
                }
            );
            section.appendChild(
                title
            );
            section.appendChild(
                list
            );
            container.appendChild(
                section
            );
        }
    );
}
/* =====================================================
   LOAD
===================================================== */
async function loadRoster() {
    const container =
        document.getElementById(
            "player-container"
        );
    try {
        const response =
            await fetch(
                "data/roster.json?ts=" +
                Date.now()
            );
        if (
            !response.ok
        ) {
            throw new Error(
                "Could not load roster.json"
            );
        }
        const data =
            await response.json();
        allPlayers =
            Array.isArray(
                data.players
            )
                ? data.players
                : [];
        renderPlayers();
    }
    catch (
        error
    ) {
        console.error(
            error
        );
        container.innerHTML =
            `
            <div class="message">
                Player data could not be loaded.
            </div>
            `;
    }
}
/* =====================================================
   FILTER EVENTS
===================================================== */
document
    .getElementById(
        "roster-filter"
    )
    .addEventListener(
        "change",
        renderPlayers
    );
document
    .getElementById(
        "position-filter"
    )
    .addEventListener(
        "change",
        renderPlayers
    );
/* =====================================================
   START
===================================================== */
loadRoster();
</script>
</body>
</html>
