<!-- player.html
     サンプル版
     既存のHEADER / BOTTOM NAVは固定。
     PLAYER CARD UIのみ新規デザイン。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player | Phillies</title>
<style>
:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --red: #e31837;
    --red-dark: #c20f30;
    --white: #ffffff;
    --gray: #718298;
    --gray-light: #aab6c5;
    --yellow: #f5c542;
    --yellow-dark: #dca900;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   HEADER
   既存UI固定
========================================================= */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 84px;
    overflow: hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
.header-field {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 250px;
    height: 250px;
    transform:
        translate(-50%, -50%)
        rotate(45deg);
    border:
        1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
}
.header-field::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 175px;
    height: 175px;
    transform:
        translate(-50%, -50%);
    border:
        1px solid rgba(255,255,255,.09);
}
.header-field::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -30px;
    width: 1px;
    height: 310px;
    transform:
        translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
.header-left {
    position: absolute;
    left: -14%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right {
    position: absolute;
    right: -13%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
.header-highlight {
    position: absolute;
    left: -10%;
    top: 0;
    width: 120%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
.header-base {
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 24px;
    height: 20px;
    transform:
        translateX(-50%);
    border:
        1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
}
.header-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
}
/* =========================================================
   PLAYER AREA
========================================================= */
main {
    width: 100%;
    min-height:
        calc(100vh - 162px);
    padding:
        18px 13px 30px;
}
.player-list {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
}
/* =========================================================
   PLAYER CARD
========================================================= */
.player-card {
    position: relative;
    display: grid;
    grid-template-columns:
        68px minmax(0, 1fr) auto;
    min-height: 104px;
    margin-bottom: 11px;
    overflow: hidden;
    background:
        linear-gradient(
            145deg,
            rgba(18,39,67,.98),
            rgba(6,23,45,.98)
        );
    border:
        1px solid rgba(255,255,255,.075);
    border-radius: 17px;
    box-shadow:
        0 10px 28px rgba(0,0,0,.26);
    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    -webkit-tap-highlight-color:
        transparent;
}
.player-card:active {
    transform:
        scale(.985);
}
/* =========================================================
   CARD ACCENT
========================================================= */
.player-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background:
        var(--red);
}
.player-card.il::before {
    background:
        var(--yellow);
}
.player-card.minors::before {
    background:
        #66778c;
}
.player-card.unknown::before {
    background:
        #45566b;
}
/* subtle diagonal field */
.player-card::after {
    content: "";
    position: absolute;
    right: -55px;
    top: -75px;
    width: 190px;
    height: 190px;
    border:
        1px solid rgba(255,255,255,.035);
    transform:
        rotate(45deg);
    pointer-events: none;
}
/* =========================================================
   NUMBER
========================================================= */
.player-number-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
}
.player-number-area::after {
    content: "";
    position: absolute;
    right: 0;
    top: 18px;
    bottom: 18px;
    width: 1px;
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );
}
.player-number {
    position: relative;
    z-index: 2;
    color:
        rgba(255,255,255,.94);
    font-size: 31px;
    line-height: 1;
    font-weight: 950;
    letter-spacing:
        -1.8px;
}
/* =========================================================
   MAIN INFORMATION
========================================================= */
.player-main {
    position: relative;
    z-index: 2;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding:
        15px 13px;
}
.player-label {
    margin-bottom: 5px;
    color:
        rgba(255,255,255,.38);
    font-size: 7px;
    font-weight: 900;
    letter-spacing:
        1.5px;
}
.player-name {
    overflow: hidden;
    color:
        var(--white);
    font-size: 18px;
    line-height: 1.12;
    font-weight: 900;
    letter-spacing:
        -.3px;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.player-meta {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 10px;
}
.player-position {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 31px;
    height: 21px;
    padding:
        0 7px;
    border-radius: 6px;
    color:
        rgba(255,255,255,.92);
    background:
        rgba(255,255,255,.07);
    border:
        1px solid rgba(255,255,255,.08);
    font-size: 9px;
    font-weight: 950;
    letter-spacing:
        .4px;
}
.player-bt {
    color:
        var(--gray-light);
    font-size: 9px;
    font-weight: 850;
    letter-spacing:
        .7px;
}
.player-divider {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background:
        rgba(255,255,255,.25);
}
/* =========================================================
   STATUS AREA
========================================================= */
.player-status {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 86px;
    padding:
        0 10px;
}
.status-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}
.status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background:
        var(--red);
    box-shadow:
        0 0 10px
        rgba(227,24,55,.65);
}
.player-card.il .status-dot {
    background:
        var(--yellow);
    box-shadow:
        0 0 10px
        rgba(245,197,66,.55);
}
.player-card.minors .status-dot {
    background:
        #718298;
    box-shadow:
        none;
}
.status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 67px;
    height: 23px;
    padding:
        0 8px;
    border-radius: 7px;
    font-size: 7px;
    font-weight: 950;
    letter-spacing:
        .8px;
    white-space: nowrap;
}
.status-active {
    color:
        #ff6b82;
    background:
        rgba(227,24,55,.10);
    border:
        1px solid rgba(227,24,55,.27);
}
.status-il {
    color:
        var(--yellow);
    background:
        rgba(245,197,66,.09);
    border:
        1px solid rgba(245,197,66,.28);
}
.status-minors {
    color:
        #9cabbc;
    background:
        rgba(113,130,152,.09);
    border:
        1px solid rgba(113,130,152,.22);
}
/* =========================================================
   UNKNOWN
========================================================= */
.player-card.unknown {
    opacity: .72;
}
.player-card.unknown .status-badge {
    color:
        #8493a4;
    border-color:
        rgba(132,147,164,.20);
    background:
        rgba(132,147,164,.06);
}
/* =========================================================
   SECTION LABEL
========================================================= */
.player-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin:
        4px 3px 13px;
}
.player-section-title span:first-child {
    color:
        rgba(255,255,255,.72);
    font-size: 9px;
    font-weight: 950;
    letter-spacing:
        1.5px;
}
.player-section-title span:last-child {
    color:
        rgba(255,255,255,.27);
    font-size: 8px;
    font-weight: 800;
    letter-spacing:
        .7px;
}
/* =========================================================
   BOTTOM NAV
   既存UI固定
========================================================= */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2000;
    height: 78px;
    background:
        rgba(5,20,39,.98);
    border-top:
        1px solid rgba(255,255,255,.08);
    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);
    backdrop-filter:
        blur(16px);
}
.bottom-inner {
    width: 100%;
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns:
        repeat(5, 1fr);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color:
        var(--gray);
    text-decoration: none;
    font-size: 8px;
    font-weight: 800;
    letter-spacing:
        .65px;
    -webkit-tap-highlight-color:
        transparent;
}
.nav-icon {
    width: 31px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
}
.nav-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke:
        currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.nav-item.active {
    color:
        var(--red);
}
.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}
/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 380px) {
    .header {
        height: 78px;
    }
    main {
        padding:
            15px 9px 25px;
    }
    .player-card {
        grid-template-columns:
            57px minmax(0, 1fr) auto;
        min-height: 98px;
        border-radius: 15px;
    }
    .player-number {
        font-size: 27px;
    }
    .player-main {
        padding:
            14px 10px;
    }
    .player-name {
        font-size: 16px;
    }
    .player-status {
        min-width: 74px;
        padding:
            0 6px;
    }
    .status-badge {
        min-width: 61px;
        font-size: 6.5px;
    }
    .nav-item {
        font-size: 7px;
    }
    .nav-icon {
        width: 29px;
        height: 29px;
    }
    .nav-icon svg {
        width: 19px;
        height: 19px;
    }
}
</style>
</head>
<body>
