<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player | Phillies</title>

<style>
:root{
    --navy:#06172d;
    --navy-deep:#031020;
    --red:#e31837;
    --white:#fff;
    --gray:#718298;
    --line:rgba(255,255,255,.075);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:var(--navy);
}

body{
    min-height:100vh;
    padding-bottom:78px;
    color:var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
}


/* =========================================================
   HEADER
   ※既存UI
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:84px;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );

    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}

.header-field{
    position:absolute;
    left:50%;
    top:50%;
    width:250px;
    height:250px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    border:1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
}

.header-field::before{
    content:"";

    position:absolute;
    left:50%;
    top:50%;

    width:175px;
    height:175px;

    transform:translate(-50%,-50%);

    border:1px solid rgba(255,255,255,.09);
}

.header-field::after{
    content:"";

    position:absolute;
    left:50%;
    top:-30px;

    width:1px;
    height:310px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}

.header-left{
    position:absolute;
    left:-14%;
    top:-60%;

    width:47%;
    height:220%;

    transform:skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}

.header-right{
    position:absolute;
    right:-13%;
    top:-60%;

    width:47%;
    height:220%;

    transform:skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}

.header-highlight{
    position:absolute;
    left:-10%;
    top:0;

    width:120%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}

.header-edge{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
}

.header-base{
    position:absolute;
    left:50%;
    bottom:9px;

    width:24px;
    height:20px;

    transform:translateX(-50%);

    border:1px solid rgba(255,255,255,.22);

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
}


/* =========================================================
   PLAYER AREA
========================================================= */

.player-page{
    width:100%;
    max-width:760px;

    margin:0 auto;

    padding:
        10px
        13px
        34px;
}


/* =========================================================
   ROSTER
========================================================= */

.roster{
    width:100%;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card{

    --accent:rgba(255,255,255,.18);

    position:relative;

    display:grid;

    grid-template-columns:
        72px
        minmax(0,1fr)
        auto;

    width:100%;

    min-height:88px;

    border-bottom:
        1px solid var(--line);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.018),
            rgba(255,255,255,.006) 65%,
            transparent
        );

    overflow:hidden;

    transition:
        background .18s ease;
}


/*
    極細のアクセントライン
*/

.player-card::before{

    content:"";

    position:absolute;

    left:0;
    top:17px;
    bottom:17px;

    width:2px;

    background:var(--accent);

}


/* =========================================================
   ACTIVE
========================================================= */

.player-card--active{
    --accent:var(--red);
}


/* =========================================================
   IL
========================================================= */

.player-card--il{
    --accent:#d5ad48;
}


/* =========================================================
   NUMBER
========================================================= */

.player-number{

    display:flex;

    align-items:center;
    justify-content:flex-start;

    padding-left:13px;

    position:relative;

}


/*
    背番号は凝縮されたディスプレイ数字。
    名前とは意図的に違う字体。
*/

.player-number span{

    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "DIN Condensed",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:36px;

    line-height:.82;

    font-weight:800;

    letter-spacing:-2.6px;

    font-variant-numeric:
        tabular-nums;

    color:
        rgba(255,255,255,.90);

}


/* =========================================================
   IDENTITY
========================================================= */

.player-identity{

    min-width:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:
        0
        12px
        0
        4px;

}


/* =========================================================
   NAME
========================================================= */

.player-name{

    display:block;

    min-width:0;

    width:100%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:18px;

    line-height:21px;

    font-weight:600;

    letter-spacing:-.45px;

    color:
        rgba(255,255,255,.95);

}


/* =========================================================
   META
========================================================= */

.player-meta{

    display:flex;

    align-items:center;

    gap:11px;

    margin-top:8px;

    height:10px;

}


.player-meta span{

    font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:7px;

    line-height:1;

    font-weight:700;

    letter-spacing:.8px;

    color:
        rgba(255,255,255,.31);

}


/*
    POSをほんの少し強く
*/

.player-meta .position{

    color:
        rgba(255,255,255,.52);

}


/*
    区切り線
*/

.player-meta span + span{

    position:relative;

}

.player-meta span + span::before{

    content:"";

    position:absolute;

    left:-6px;
    top:50%;

    width:1px;
    height:6px;

    transform:translateY(-50%);

    background:
        rgba(255,255,255,.14);

}


/* =========================================================
   STATUS
========================================================= */

.player-status{

    display:flex;

    align-items:center;

    justify-content:flex-end;

    padding-right:11px;

    min-width:55px;

}


/*
    ACTIVE / IL は短い状態表示だけ。
    正式名称は表示しない。
*/

.player-status span{

    display:flex;

    align-items:center;

    font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:6px;

    line-height:1;

    font-weight:800;

    letter-spacing:.75px;

    color:
        var(--accent);

}


/* ACTIVE indicator */

.player-card--active
.player-status span::before{

    content:"";

    width:4px;
    height:4px;

    margin-right:5px;

    border-radius:50%;

    background:
        var(--accent);

}


/* IL */

.player-card--il
.player-status span{

    color:#d5ad48;

}


/* =========================================================
   SUBTLE HOVER / TAP
========================================================= */

.player-card:active{

    background:
        rgba(255,255,255,.035);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:390px){

    .player-page{

        padding-left:9px;
        padding-right:9px;

    }

    .player-card{

        grid-template-columns:
            62px
            minmax(0,1fr)
            auto;

        min-height:84px;

    }

    .player-number{

        padding-left:11px;

    }

    .player-number span{

        font-size:33px;

        letter-spacing:-2.3px;

    }

    .player-name{

        font-size:16px;

        letter-spacing:-.35px;

    }

    .player-status{

        min-width:49px;

        padding-right:7px;

    }

}


@media(max-width:340px){

    .player-card{

        grid-template-columns:
            55px
            minmax(0,1fr)
            auto;

    }

    .player-number span{

        font-size:30px;

    }

    .player-name{

        font-size:15px;

    }

}


/* =========================================================
   BOTTOM NAV
   ※既存UI
========================================================= */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    height:78px;

    background:
        rgba(5,20,39,.98);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 -10px 28px
        rgba(0,0,0,.32);

    backdrop-filter:
        blur(16px);
}

.bottom-inner{

    width:100%;

    max-width:760px;

    height:100%;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:var(--gray);

    text-decoration:none;

    font-size:8px;

    font-weight:800;

    letter-spacing:.65px;

}

.nav-icon{

    width:31px;
    height:31px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

}

.nav-icon svg{

    width:20px;
    height:20px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;

}

.nav-item.active{

    color:var(--red);

}

.nav-item.active .nav-icon{

    background:
        rgba(227,24,55,.14);

}

</style>
