<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Players | Phillies</title>
<!-- =====================================================
     HEAD / GLOBAL
     既存部分はそのまま使用
===================================================== -->
<style>
/* =====================================================
   PLAYER ONLY
===================================================== */
.player-page {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 15px 12px 34px;
}
/* -----------------------------------------------------
   ページ見出し
----------------------------------------------------- */
.player-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 3px 14px;
    border-bottom: 1px solid
        rgba(255,255,255,.075);
}
.player-heading-left {
    display: flex;
    align-items: center;
    gap: 9px;
}
.player-heading-mark {
    width: 3px;
    height: 22px;
    background: #e31837;
    border-radius: 2px;
}
.player-heading-title {
    color: rgba(255,255,255,.94);
    font-size: 21px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.65px;
}
.player-heading-season {
    color: rgba(255,255,255,.19);
    font-size: 7px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .6px;
}
/* -----------------------------------------------------
   サマリー
----------------------------------------------------- */
.player-summary {
    display: grid;
    grid-template-columns:
        1fr 1fr 1fr;
    margin-top: 13px;
    border-bottom: 1px solid
        rgba(255,255,255,.055);
}
.player-summary-cell {
    min-width: 0;
    padding: 9px 11px 11px;
}
.player-summary-cell + .player-summary-cell {
    border-left: 1px solid
        rgba(255,255,255,.05);
}
.player-summary-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(255,255,255,.20);
    font-size: 6px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .6px;
}
.player-summary-number {
    display: block;
    color: rgba(255,255,255,.86);
    font-size: 18px;
    line-height: 1;
    font-weight: 650;
    font-variant-numeric:
        tabular-nums;
}
.player-summary-cell.active
.player-summary-number {
    color: #e31837;
}
.player-summary-cell.injured
.player-summary-number {
    color: #f0c84b;
}
/* -----------------------------------------------------
   列ヘッダー
----------------------------------------------------- */
.player-columns {
    display: grid;
    grid-template-columns:
        54px
        42px
        45px
        minmax(0,1fr);
    align-items: center;
    height: 27px;
    margin-top: 10px;
    border-bottom: 1px solid
        rgba(255,255,255,.045);
}
.player-columns span {
    color: rgba(255,255,255,.17);
    font-size: 6px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .55px;
    text-align: center;
}
.player-columns .player-columns-name {
    text-align: left;
    padding-left: 5px;
}
/* -----------------------------------------------------
   グループ
----------------------------------------------------- */
.player-group {
    margin-top: 17px;
}
.player-group:first-of-type {
    margin-top: 8px;
}
.player-group-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 20px;
    padding: 0 3px;
    margin-bottom: 5px;
}
.player-group-label {
    display: flex;
    align-items: center;
    gap: 7px;
    color: rgba(255,255,255,.37);
    font-size: 7px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .65px;
}
.player-group-label::before {
    content: "";
    width: 8px;
    height: 2px;
    border-radius: 2px;
    background: #e31837;
}
.player-group.il
.player-group-label::before {
    background: #f0c84b;
}
.player-group-total {
    color: rgba(255,255,255,.15);
    font-size: 7px;
    line-height: 1;
    font-weight: 700;
    font-variant-numeric:
        tabular-nums;
}
/* -----------------------------------------------------
   選手行
----------------------------------------------------- */
.player-row {
    --accent: #e31837;
    position: relative;
    display: grid;
    grid-template-columns:
        54px
        42px
        45px
        minmax(0,1fr);
    width: 100%;
    height: 78px;
    border-bottom: 1px solid
        rgba(255,255,255,.055);
    background:
        rgba(255,255,255,.006);
}
.player-row.il {
    --accent: #f0c84b;
}
/* -----------------------------------------------------
   状態ライン
----------------------------------------------------- */
.player-row::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
}
/* -----------------------------------------------------
   背番号
----------------------------------------------------- */
.player-number {
    display: flex;
    align-items: center;
    justify-content: center;
}
.player-number span {
    color: rgba(255,255,255,.89);
    font-size: 28px;
    line-height: .9;
    font-weight: 650;
    letter-spacing: -1.6px;
    font-variant-numeric:
        tabular-nums;
}
/* -----------------------------------------------------
   POS
----------------------------------------------------- */
.player-pos {
    display: flex;
    align-items: center;
    justify-content: center;
}
.player-pos span {
    color: rgba(255,255,255,.48);
    font-size: 8px;
    line-height: 1;
    font-weight: 800;
}
/* -----------------------------------------------------
   B/T
----------------------------------------------------- */
.player-bt {
    display: flex;
    align-items: center;
    justify-content: center;
}
.player-bt span {
    color: rgba(255,255,255,.29);
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
}
/* -----------------------------------------------------
   選手情報
----------------------------------------------------- */
.player-detail {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding:
        0 11px
        0 4px;
}
/* -----------------------------------------------------
   選手名
   ★ 必ず1行
----------------------------------------------------- */
.player-name {
    display: block;
    width: 100%;
    min-width: 0;
    overflow: hidden;
    color: rgba(255,255,255,.95);
    font-size: 17px;
    line-height: 20px;
    font-weight: 600;
    letter-spacing: -.38px;
    white-space: nowrap;
    text-overflow: ellipsis;
}
/* -----------------------------------------------------
   ロスター情報
----------------------------------------------------- */
.player-roster {
    display: flex;
    align-items: center;
    min-width: 0;
    height: 10px;
    margin-top: 5px;
}
.player-roster-state {
    flex: 0 0 auto;
    color: var(--accent);
    font-size: 6px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .45px;
}
.player-roster-separator {
    flex: 0 0 auto;
    width: 1px;
    height: 6px;
    margin:
        0 6px;
    background:
        rgba(255,255,255,.12);
}
.player-roster-info {
    min-width: 0;
    overflow: hidden;
    color:
        rgba(255,255,255,.20);
    font-size: 6px;
    line-height: 1;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
}
/* -----------------------------------------------------
   モバイル
----------------------------------------------------- */
@media (max-width: 390px) {
    .player-page {
        padding-left: 9px;
        padding-right: 9px;
    }
    .player-columns,
    .player-row {
        grid-template-columns:
            51px
            38px
            41px
            minmax(0,1fr);
    }
    .player-number span {
        font-size: 25px;
    }
    .player-name {
        font-size: 16px;
    }
}
@media (max-width: 340px) {
    .player-columns,
    .player-row {
        grid-template-columns:
            46px
            34px
            38px
            minmax(0,1fr);
    }
    .player-name {
        font-size: 15px;
    }
}
</style>
