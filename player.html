<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #06172d;
}

body {

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom: 78px;
}


/* =========================================================
   EXISTING HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;

    z-index: 1000;

    height: 84px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );

    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}

.header-field {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 250px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.10);
}

.header-field::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 175px;
    height: 175px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.09);
}

.header-left {
    position: absolute;

    left: -14%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        rgba(70,0,20,.08);
}

.header-right {
    position: absolute;

    right: -13%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        rgba(80,0,20,.14);
}

.header-highlight {
    position: absolute;

    left: -10%;
    top: 0;

    width: 120%;
    height: 1px;

    background:
        rgba(255,255,255,.30);
}

.header-edge {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background:
        rgba(0,0,0,.30);
}

.header-base {
    position: absolute;

    left: 50%;
    bottom: 9px;

    width: 24px;
    height: 20px;

    transform:
        translateX(-50%);

    border:
        1px solid rgba(255,255,255,.22);
}


/* =========================================================
   PLAYER AREA
========================================================= */

.player-main {

    width: 100%;

    padding:
        18px 0 30px;
}

.player-container {

    width: 100%;

    max-width: 760px;

    margin:
        0 auto;
}


/* =========================================================
   PLAYER PAGE TITLE
========================================================= */

.player-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 14px 15px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.player-header-title {

    margin: 0;

    color: #ffffff;

    font-size: 24px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        -.7px;
}

.player-header-count {

    color:
        rgba(255,255,255,.28);

    font-size: 7px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        1px;
}


/* =========================================================
   SECTION
========================================================= */

.player-section {

    margin-top: 16px;
}

.player-section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 14px 8px;
}

.player-section-title {

    display: flex;

    align-items: center;

    gap: 7px;

    color:
        rgba(255,255,255,.48);

    font-size: 7px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        1px;
}

.player-section-title::before {

    content: "";

    width: 13px;
    height: 2px;

    background:
        #e31837;
}

.player-section.il
.player-section-title::before {

    background:
        #f4c542;
}

.player-section-count {

    color:
        rgba(255,255,255,.20);

    font-size: 6px;

    font-weight: 800;

    letter-spacing:
        .8px;
}


/* =========================================================
   PLAYER LIST
========================================================= */

.player-list {

    width: 100%;
}


/* =========================================================
   PLAYER ROW
   基本構成
   背番号 / POS / B/T / 選手名
========================================================= */

.player-row {

    --status-color: #e31837;

    position: relative;

    display: grid;

    grid-template-columns:
        58px
        42px
        48px
        minmax(0, 1fr);

    width: 100%;

    min-height: 92px;

    padding:
        14px 14px 12px 0;

    border-top:
        1px solid rgba(255,255,255,.065);

    background:
        transparent;

    transition:
        background .15s ease;
}

.player-row.il {

    --status-color: #f4c542;
}

.player-row.forty {

    --status-color: #75869b;
}


/* =========================================================
   STATUS LINE
========================================================= */

.player-row::before {

    content: "";

    position: absolute;

    left: 0;
    top: 13px;
    bottom: 13px;

    width: 3px;

    background:
        var(--status-color);
}


/* =========================================================
   NUMBER
========================================================= */

.player-number {

    display: flex;

    align-items: flex-start;

    justify-content: center;

    padding-top: 2px;

    color:
        #ffffff;

    font-size: 29px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        -1.5px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   POSITION
========================================================= */

.player-position {

    display: flex;

    align-items: flex-start;

    justify-content: center;

    padding-top: 5px;

    color:
        rgba(255,255,255,.75);

    font-size: 9px;

    line-height: 1;

    font-weight: 850;

    letter-spacing:
        .4px;
}


/* =========================================================
   B/T
========================================================= */

.player-bt {

    display: flex;

    align-items: flex-start;

    justify-content: center;

    padding-top: 5px;

    color:
        rgba(255,255,255,.36);

    font-size: 8px;

    line-height: 1;

    font-weight: 700;

    letter-spacing:
        .4px;
}


/* =========================================================
   NAME AREA
========================================================= */

.player-name-area {

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: flex-start;
}


/* =========================================================
   NAME
========================================================= */

.player-name {

    width: 100%;

    min-width: 0;

    color:
        #ffffff;

    font-size: 20px;

    line-height: 1.15;

    font-weight: 650;

    letter-spacing:
        -.45px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: clip;
}


/* =========================================================
   ROSTER
========================================================= */

.player-roster {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 8px;

    min-width: 0;
}

.player-roster-dot {

    width: 5px;
    height: 5px;

    flex:
        0 0 auto;

    border-radius: 50%;

    background:
        var(--status-color);
}

.player-roster-status {

    color:
        var(--status-color);

    font-size: 6px;

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        .8px;
}

.player-roster-detail {

    color:
        rgba(255,255,255,.20);

    font-size: 6px;

    line-height: 1;

    font-weight: 700;

    letter-spacing:
        .5px;

    white-space: nowrap;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover:hover) {

    .player-row:hover {

        background:
            rgba(255,255,255,.025);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 390px) {

    .player-row {

        grid-template-columns:
            53px
            39px
            43px
            minmax(0,1fr);

        min-height: 88px;

        padding-right: 10px;
    }

<script>

/* =========================================================
   NORMALIZATION
========================================================= */

const VALID_POSITIONS = [
    "P",
    "C",
    "1B",
    "2B",
    "3B",
    "SS",
    "LF",
    "CF",
    "RF",
    "DH"
];


/* =========================================================
   NUMBER
========================================================= */

function normalizeNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    const number =
        Number.parseInt(
            String(value),
            10
        );

    if (
        Number.isNaN(number)
    ) {
        return "—";
    }

    return String(number);
}


/* =========================================================
   POSITION
========================================================= */

function normalizePosition(value) {

    if (!value) {
        return "—";
    }

    const position =
        String(value)
            .trim()
            .toUpperCase();

    if (
        !VALID_POSITIONS.includes(
            position
        )
    ) {
        return "—";
    }

    return position;
}


/* =========================================================
   B/T
========================================================= */

function normalizeBT(
    bats,
    throws
) {

    if (
        !bats ||
        !throws
    ) {
        return "—";
    }

    const b =
        String(bats)
            .trim()
            .toUpperCase();

    const t =
        String(throws)
            .trim()
            .toUpperCase();

    if (
        !["R", "L", "S"].includes(b) ||
        !["R", "L"].includes(t)
    ) {
        return "—";
    }

    return `${b}/${t}`;
}


/* =========================================================
   PLAYER OBJECT
========================================================= */

function normalizePlayer(player) {

    return {

        id:
            player?.id ??
            null,

        number:
            normalizeNumber(
                player?.number
            ),

        position:
            normalizePosition(
                player?.position
            ),

        bt:
            normalizeBT(
                player?.bats,
                player?.throws
            ),

        name:
            player?.fullName ??
            null,

        status:
            player?.status ??
            null,

        roster:
            player?.roster ??
            null

    };

}


/* =========================================================
   FORCE NUMBER NORMALIZATION
========================================================= */

document
    .querySelectorAll(
        ".player-number"
    )
    .forEach(element => {

        element.textContent =
            normalizeNumber(
                element.dataset.number
            );

    });


/* =========================================================
   NAME FIT
========================================================= */

function fitNames() {

    document
        .querySelectorAll(
            ".player-name"
        )
        .forEach(name => {

            const parent =
                name.parentElement;

            if (!parent) {
                return;
            }

            let size =
                window.innerWidth <= 390
                    ? 18
                    : 20;

            name.style.fontSize =
                `${size}px`;

            while (
                name.scrollWidth >
                    parent.clientWidth &&
                size > 12
            ) {

                size -= .25;

                name.style.fontSize =
                    `${size}px`;
            }

        });

}
