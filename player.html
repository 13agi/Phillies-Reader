<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">
<title>PLAYER | PHILLIES</title>
<style>
:root {
    --navy: #07152b;
    --navy-light: #0b1c38;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
    --yellow: #f4c430;
    --gray: #64748b;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    color: var(--white);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =====================================================
   HEADER
===================================================== */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    overflow: hidden;
    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );
    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.30);
}
.header::before {
    content: "";
    position: absolute;
    top: -150px;
    right: -65px;
    width: 330px;
    height: 330px;
    transform:
        rotate(27deg);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.015)
        );
    border-left:
        1px solid
        rgba(255,255,255,0.14);
}
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,0.35) 45%,
            rgba(255,255,255,0.28) 72%,
            transparent 100%
        );
}
/* =====================================================
   MAIN
===================================================== */
main {
    min-height: 100vh;
    padding-top: 72px;
    padding-bottom: 20px;
}
.player-page {
    width: 100%;
    padding:
        22px 16px 30px;
}
.player-title {
    font-size: 27px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 5px;
}
.player-subtitle {
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.3px;
    margin-bottom: 20px;
}
/* =====================================================
   FILTER
===================================================== */
.filter-area {
    width: 100%;
    margin-bottom: 27px;
    padding: 13px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.025)
        );
    border:
        1px solid
        rgba(255,255,255,0.075);
    border-radius: 16px;
    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);
}
.filter-area::before {
    content: "FILTER";
    display: block;
    margin:
        0 2px 11px;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color:
        rgba(255,255,255,0.38);
}
.filter-block {
    width: 100%;
}
.filter-block:first-child {
    margin-bottom: 9px;
}
.roster-filter-block {
    padding-top: 9px;
    border-top:
        1px solid
        rgba(255,255,255,0.06);
}
.filter-caption {
    margin:
        0 0 5px 2px;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1px;
    color:
        rgba(255,255,255,0.42);
}
.filter-select {
    width: 100%;
    height: 45px;
    padding:
        0 40px 0 14px;
    border:
        1px solid
        rgba(255,255,255,0.085);
    border-radius: 11px;
    background:
        rgba(7,21,43,0.82);
    color: var(--white);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .45px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image:
        linear-gradient(
            45deg,
            transparent 50%,
            rgba(255,255,255,.65) 50%
        ),
        linear-gradient(
            135deg,
            rgba(255,255,255,.65) 50%,
            transparent 50%
        );
    background-position:
        calc(100% - 18px) 18px,
        calc(100% - 12px) 18px;
    background-size:
        6px 6px,
        6px 6px;
    background-repeat:
        no-repeat;
}
.filter-select option {
    background: #07152b;
    color: white;
}
/* =====================================================
   POSITION GROUP
===================================================== */
.position-group {
    margin-bottom: 25px;
}
.position-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    color:
        rgba(255,255,255,0.66);
}
.position-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background:
        rgba(255,255,255,0.08);
}
/* =====================================================
   PLAYER LIST
===================================================== */
.player-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.player-wrapper {
    width: 100%;
}
/* =====================================================
   PLAYER CARD
===================================================== */
.player-card {
    position: relative;
    width: 100%;
    min-height: 84px;
    display: flex;
    align-items: center;
    padding:
        11px 13px 11px 18px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.022)
        );
    border:
        1px solid
        rgba(255,255,255,0.075);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition:
        transform .15s ease,
        background .15s ease;
}
.player-card:active {
    transform:
        scale(.985);
}
.player-card.open {
    border-bottom-left-radius: 5px;
    border-bottom-right-radius: 5px;
}
/* =====================================================
   STATUS LINE
===================================================== */
.player-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 4px;
}
.player-card.active::after {
    background: var(--red);
}
.player-card.il::after {
    background: var(--yellow);
}
.player-card.outside::after {
    background: var(--gray);
}
/* =====================================================
   NUMBER
===================================================== */
.player-number {
    width: 55px;
    flex-shrink: 0;
    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;
    font-size: 31px;
    line-height: 1;
    letter-spacing: -1.5px;
    color:
        rgba(255,255,255,0.30);
    transform:
        scaleX(.88);
    transform-origin:
        left center;
}
.player-number::before {
    content: "#";
    display: inline-block;
    margin-right: 1px;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 9px;
    font-weight: 800;
    color:
        rgba(227,25,55,.75);
    vertical-align: top;
}
/* =====================================================
   B/T
===================================================== */
.player-bt {
    width: 54px;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .3px;
    color:
        rgba(255,255,255,.55);
}
/* =====================================================
   POSITION
===================================================== */
.player-pos {
    width: 39px;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 900;
    color:
        var(--red);
}
/* =====================================================
   PLAYER INFO
===================================================== */
.player-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
}
.player-name {
    width: 100%;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.25;
    color: var(--white);
    white-space: normal;
    overflow-wrap: anywhere;
}
.player-status {
    width: fit-content;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .8px;
    line-height: 1;
}
.player-card.active
.player-status {
    color: var(--red);
}
.player-card.il
.player-status {
    color: var(--yellow);
}
.player-card.outside
.player-status {
    color: #94a3b8;
}
/* =====================================================
   EXPAND
===================================================== */
.expand-mark {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    margin-left: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color:
        rgba(255,255,255,.35);
    font-size: 15px;
    transition:
        transform .2s ease,
        color .2s ease;
}
.player-card.open
.expand-mark {
    color: var(--red);
    transform:
        rotate(180deg);
}
/* =====================================================
   STATS CARD
===================================================== */
.stats-card {
    display: none;
    position: relative;
    margin-top: -1px;
    padding:
        15px 12px 16px;
    background:
        linear-gradient(
            145deg,
            #0b1c38,
            #08172e
        );
    border:
        1px solid
        rgba(255,255,255,0.07);
    border-top:
        1px solid
        rgba(227,25,55,.20);
    border-radius:
        0 0 14px 14px;
    animation:
        statsOpen .18s ease-out;
}
.stats-card.show {
    display: block;
}
@keyframes statsOpen {
    from {
        opacity: 0;
        transform:
            translateY(-5px);
    }
    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}
/* =====================================================
   STATS HEADER
===================================================== */
.stats-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 13px;
}
.stats-title {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1.2px;
    color:
        rgba(255,255,255,.42);
}
.stats-period {
    font-size: 9px;
    font-weight: 800;
    color:
        rgba(255,255,255,.35);
}
/* =====================================================
   STATS GRID
===================================================== */
.stat-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 6px;
}
.stat-grid.second-row {
    margin-top: 6px;
}
.stat-box {
    min-width: 0;
    padding:
        10px 3px;
    text-align: center;
    background:
        rgba(255,255,255,.035);
    border:
        1px solid
        rgba(255,255,255,.055);
    border-radius: 9px;
}
.stat-value {
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
    font-weight: 900;
    line-height: 1;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.stat-label {
    display: block;
    font-size: 7px;
    font-weight: 800;
    letter-spacing: .55px;
    color:
        rgba(255,255,255,.38);
}
/* =====================================================
   MESSAGE
===================================================== */
.message {
    padding:
        35px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
}
/* =====================================================
   BOTTOM NAV
===================================================== */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 200;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 5px
        env(safe-area-inset-bottom);
    display: flex;
    align-items: flex-start;
    justify-content:
        space-between;
    background:
        rgba(5,16,34,0.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,0.08);
}
.nav-item {
    flex: 1;
    min-width: 0;
    height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    color: var(--muted);
    border-radius: 13px;
}
.nav-item:active {
    transform:
        scale(.94);
}
.nav-icon {
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
}
.nav-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .45px;
    white-space:
        nowrap;
}
.nav-item.active {
    color: var(--white);
    background:
        rgba(227,25,55,0.13);
}
.nav-item.active
.nav-icon {
    color: var(--red);
}
/* =====================================================
   SMALL IPHONE
===================================================== */
@media (max-width: 360px) {
    .player-page {
        padding-left: 13px;
        padding-right: 13px;
    }
    .player-number {
        width: 48px;
        font-size: 28px;
    }
    .player-bt {
        width: 43px;
    }
    .player-pos {
        width: 34px;
    }
    .player-name {
        font-size: 14px;
    }
    .stat-value {
        font-size: 12px;
    }
    .stat-label {
        font-size: 6px;
    }
 /* SCHEDULE UI FIX */

</style>
</head>
<body>
<header class="header"></header>
<main>
<section class="player-page">
<h1 class="player-title">
    Players
</h1>
<p class="player-subtitle">
    PHILADELPHIA PHILLIES
</p>
<!-- =================================================
     FILTER
================================================== -->
<div class="filter-area">
    <div class="filter-block">
        <div class="filter-caption">
            POSITION
        </div>
        <select
            id="position-filter"
            class="filter-select">
            <option value="ALL">
                ALL POSITIONS
            </option>
            <option value="P">
                PITCHERS
            </option>
            <option value="C">
                CATCHERS
            </option>
            <option value="IF">
                INFIELDERS
            </option>
            <option value="OF">
                OUTFIELDERS
            </option>
            <option value="DH">
                DESIGNATED HITTERS
            </option>
        </select>
    </div>
    <div class="filter-block roster-filter-block">
        <div class="filter-caption">
            ROSTER
        </div>
        <select
            id="roster-filter"
            class="filter-select">
            <option value="ALL">
                ACTIVE + 40-MAN + IL
            </option>
            <option value="26MAN">
                ACTIVE
            </option>
            <option value="IL">
                IL
            </option>
            <option value="40MAN">
                40-MAN
            </option>
        </select>
    </div>
</div>
<div id="player-container">
    <div class="message">
        Loading players...
    </div>
</div>
</section>
</main>
<!-- =================================================
     BOTTOM NAV
================================================== -->

<script>
/* =====================================================
   DATA
===================================================== */
let allPlayers = [];
let playerStats = {};
let openedPlayerId = null;
/* =====================================================
   POSITION GROUP
===================================================== */
function getPositionGroup(player) {
    const position =
        String(
            player.position || ""
        ).toUpperCase();
    const positionName =
        String(
            player.positionName || ""
        ).toLowerCase();
    if (
        position === "P" ||
        position === "SP" ||
        position === "RP" ||
        position === "RHP" ||
        position === "LHP" ||
        positionName.includes(
            "pitcher"
        )
    ) {
        return "P";
    }
    if (
        position === "C" ||
        positionName.includes(
            "catcher"
        )
    ) {
        return "C";
    }
    if (
        [
            "1B",
            "2B",
            "3B",
            "SS"
        ].includes(position) ||
        positionName.includes(
            "infielder"
        ) ||
        positionName.includes(
            "first baseman"
        ) ||
        positionName.includes(
            "second baseman"
        ) ||
        positionName.includes(
            "third baseman"
        ) ||
        positionName.includes(
            "shortstop"
        )
    ) {
        return "IF";
    }
    if (
        [
            "LF",
            "CF",
            "RF",
            "OF"
        ].includes(position) ||
        positionName.includes(
            "outfielder"
        )
    ) {
        return "OF";
    }
    if (
        position === "DH" ||
        positionName.includes(
            "designated"
        )
    ) {
        return "DH";
    }
    return "OTHER";
}
/* =====================================================
   POSITION ORDER
===================================================== */
function positionOrder(player) {
    const group =
        getPositionGroup(
            player
        );
    const order = {
        P: 1,
        C: 2,
        IF: 3,
        OF: 4,
        DH: 5,
        OTHER: 6
    };
    return order[group] || 99;
}
/* =====================================================
   NUMBER
===================================================== */
function getNumber(player) {
    const number =
        parseInt(
            player.number,
            10
        );
    return Number.isNaN(number)
        ? 999
        : number;
}
/* =====================================================
   STATUS
===================================================== */
function getStatusClass(player) {
    const status =
        String(
            player.rosterStatus || ""
        ).toUpperCase();
    if (
        status === "26MAN"
    ) {
        return "active";
    }
    if (
        status === "IL"
    ) {
        return "il";
    }
    return "outside";
}
function getStatusText(player) {
    const status =
        String(
            player.rosterStatus || ""
        ).toUpperCase();
    if (
        status === "26MAN"
    ) {
        return "ACTIVE";
    }
    if (
        status === "IL"
    ) {
        return "IL";
    }
    return "40-MAN";
}
/* =====================================================
   FORMAT
===================================================== */
function formatStat(
    value,
    decimals = 0
) {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }
    if (
        typeof value === "number"
    ) {
        return value.toFixed(
            decimals
        );
    }
    return String(value);
}
/* =====================================================
   FIND STATS
===================================================== */
function findPlayerStats(player) {
    const id =
        String(
            player.id ||
            player.playerId ||
            ""
        );
    if (!id) {
        return null;
    }
    return (
        playerStats[id] ||
        null
    );
}
/* =====================================================
   BATTING STATS
   1段目
   G / H / HR / RBI
   2段目
   PA / AVG / OPS / BABIP
===================================================== */
function createBattingStats(
    card,
    stats
) {
    const batting =
        stats.batting || {};
    const games =
        batting.games ??
        batting.G ??
        batting.gamesPlayed;
    const hits =
        batting.hits ??
        batting.H;
    const homeRuns =
        batting.homeRuns ??
        batting.HR ??
        batting.home_runs;
    const rbi =
        batting.rbi ??
        batting.RBI;
    const plateAppearances =
        batting.plateAppearances ??
        batting.PA ??
        batting.plate_appearances;
    const avg =
        batting.avg ??
        batting.AVG ??
        batting.battingAverage;
    const ops =
        batting.ops ??
        batting.OPS;
    const babip =
        batting.babip ??
        batting.BABIP;
    card.innerHTML = `
        <div class="stats-header">
            <div class="stats-title">
                BATTING
            </div>
            <div class="stats-period">
                2026 SEASON
            </div>
        </div>
        <!-- ROW 1 -->
        <div class="stat-grid">
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(games)}
                </span>
                <span class="stat-label">
                    G
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(hits)}
                </span>
                <span class="stat-label">
                    H
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(homeRuns)}
                </span>
                <span class="stat-label">
                    HR
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(rbi)}
                </span>
                <span class="stat-label">
                    RBI
                </span>
            </div>
        </div>
        <!-- ROW 2 -->
        <div class="stat-grid second-row">
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        plateAppearances
                    )}
                </span>
                <span class="stat-label">
                    PA
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        avg,
                        3
                    )}
                </span>
                <span class="stat-label">
                    AVG
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        ops,
                        3
                    )}
                </span>
                <span class="stat-label">
                    OPS
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        babip,
                        3
                    )}
                </span>
                <span class="stat-label">
                    BABIP
                </span>
            </div>
        </div>
    `;
}
/* =====================================================
   PITCHING STATS
   1段目
   G / W-L / IP / K
   2段目
   ERA / WHIP / K% / BB%
   K%  = K / BF × 100
   BB% = BB / BF × 100
   ★ JSONに保存されたK%/BB%を
     表示値として直接使用しない
   ★ 必ずK・BB・BFから再計算
===================================================== */
function createPitchingStats(
    card,
    stats
) {
    const pitching =
        stats.pitching || {};
    /* =========================
       BASIC
    ========================== */
    const games =
        pitching.games ??
        pitching.G ??
        pitching.gamesPlayed;
    const wins =
        pitching.wins ??
        pitching.W;
    const losses =
        pitching.losses ??
        pitching.L;
    const inningsPitched =
        pitching.inningsPitched ??
        pitching.IP ??
        pitching.innings;
    const strikeouts =
        pitching.strikeouts ??
        pitching.SO ??
        pitching.K ??
        pitching.strikeOuts;
    const era =
        pitching.era ??
        pitching.ERA;
    const whip =
        pitching.whip ??
        pitching.WHIP;
    const walks =
        pitching.walks ??
        pitching.BB ??
        pitching.baseOnBalls;
    /* =========================
       BATTERS FACED
       BFのみを使用
       PAなどへの代替はしない
    ========================== */
    const battersFaced =
        pitching.battersFaced ??
        pitching.BF;
    /* =========================
       K%
       K / BF × 100
    ========================== */
    let kPercent = null;
    const so =
        parseFloat(
            strikeouts
        );
    const bf =
        parseFloat(
            battersFaced
        );
    if (
        Number.isFinite(so) &&
        Number.isFinite(bf) &&
        bf > 0
    ) {
        kPercent =
            (
                so / bf
            ) * 100;
    }
    /* =========================
       BB%
       BB / BF × 100
    ========================== */
    let bbPercent = null;
    const bb =
        parseFloat(
            walks
        );
    if (
        Number.isFinite(bb) &&
        Number.isFinite(bf) &&
        bf > 0
    ) {
        bbPercent =
            (
                bb / bf
            ) * 100;
    }
    /* =========================
       DISPLAY
    ========================== */
    const kDisplay =
        kPercent !== null
            ? kPercent.toFixed(1) + "%"
            : "—";
    const bbDisplay =
        bbPercent !== null
            ? bbPercent.toFixed(1) + "%"
            : "—";
    /* =========================
       W-L
    ========================== */
    let record = "—";
    if (
        wins !== null &&
        wins !== undefined &&
        losses !== null &&
        losses !== undefined
    ) {
        record =
            String(wins) +
            "-" +
            String(losses);
    }
    /* =========================
       CARD
    ========================== */
    card.innerHTML = `
        <div class="stats-header">
            <div class="stats-title">
                PITCHING
            </div>
            <div class="stats-period">
                2026 SEASON
            </div>
        </div>
        <!-- ROW 1 -->
        <div class="stat-grid">
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(games)}
                </span>
                <span class="stat-label">
                    G
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${record}
                </span>
                <span class="stat-label">
                    W-L
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        inningsPitched
                    )}
                </span>
                <span class="stat-label">
                    IP
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        strikeouts
                    )}
                </span>
                <span class="stat-label">
                    K
                </span>
            </div>
        </div>
        <!-- ROW 2 -->
        <div class="stat-grid second-row">
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        era,
                        2
                    )}
                </span>
                <span class="stat-label">
                    ERA
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${formatStat(
                        whip,
                        2
                    )}
                </span>
                <span class="stat-label">
                    WHIP
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${kDisplay}
                </span>
                <span class="stat-label">
                    K%
                </span>
            </div>
            <div class="stat-box">
                <span class="stat-value">
                    ${bbDisplay}
                </span>
                <span class="stat-label">
                    BB%
                </span>
            </div>
        </div>
    `;
}
/* =====================================================
   CREATE STATS CARD
===================================================== */
function createStatsCard(
    player
) {
    const card =
        document.createElement(
            "div"
        );
    card.className =
        "stats-card";
    const stats =
        findPlayerStats(
            player
        );
    if (!stats) {
        card.innerHTML = `
            <div class="stats-header">
                <div class="stats-title">
                    PLAYER STATS
                </div>
                <div class="stats-period">
                    2026 SEASON
                </div>
            </div>
            <div class="message">
                No statistics available yet.
            </div>
        `;
        return card;
    }
    const group =
        getPositionGroup(
            player
        );
    if (
        group === "P"
    ) {
        createPitchingStats(
            card,
            stats
        );
    } else {
        createBattingStats(
            card,
            stats
        );
    }
    return card;
}
/* =====================================================
   TOGGLE
===================================================== */
function toggleStats(
    wrapper,
    player
) {
    const card =
        wrapper.querySelector(
            ".player-card"
        );
    const statsCard =
        wrapper.querySelector(
            ".stats-card"
        );
    const playerId =
        String(
            player.id ||
            player.playerId ||
            ""
        );
    if (
        openedPlayerId === playerId
    ) {
        card.classList.remove(
            "open"
        );
        statsCard.classList.remove(
            "show"
        );
        openedPlayerId =
            null;
        return;
    }
    document
        .querySelectorAll(
            ".player-card.open"
        )
        .forEach(
            item => {
                item.classList.remove(
                    "open"
                );
            }
        );
    document
        .querySelectorAll(
            ".stats-card.show"
        )
        .forEach(
            item => {
                item.classList.remove(
                    "show"
                );
            }
        );
    card.classList.add(
        "open"
    );
    statsCard.classList.add(
        "show"
    );
    openedPlayerId =
        playerId;
}
/* =====================================================
   CREATE PLAYER
===================================================== */
function createPlayerWrapper(
    player
) {
    const wrapper =
        document.createElement(
            "div"
        );
    wrapper.className =
        "player-wrapper";
    const card =
        document.createElement(
            "div"
        );
    card.className =
        "player-card " +
        getStatusClass(
            player
        );
    const number =
        document.createElement(
            "div"
        );
    number.className =
        "player-number";
    number.textContent =
        player.number || "--";
    const bt =
        document.createElement(
            "div"
        );
    bt.className =
        "player-bt";
    bt.textContent =
        player.bt || "--";
    const position =
        document.createElement(
            "div"
        );
    position.className =
        "player-pos";
    position.textContent =
        player.position || "--";
    const info =
        document.createElement(
            "div"
        );
    info.className =
        "player-info";
    const name =
        document.createElement(
            "div"
        );
    name.className =
        "player-name";
    name.textContent =
        player.name ||
        "Unknown";
    const status =
        document.createElement(
            "div"
        );
    status.className =
        "player-status";
    status.textContent =
        getStatusText(
            player
        );
    info.appendChild(
        name
    );
    info.appendChild(
        status
    );
    const arrow =
        document.createElement(
            "div"
        );
    arrow.className =
        "expand-mark";
    arrow.textContent =
        "⌄";
    card.appendChild(
        number
    );
    card.appendChild(
        bt
    );
    card.appendChild(
        position
    );
    card.appendChild(
        info
    );
    card.appendChild(
        arrow
    );
    const statsCard =
        createStatsCard(
            player
        );
    wrapper.appendChild(
        card
    );
    wrapper.appendChild(
        statsCard
    );
    card.addEventListener(
        "click",
        () => {
            toggleStats(
                wrapper,
                player
            );
        }
    );
    return wrapper;
}
/* =====================================================
   RENDER
===================================================== */
function renderPlayers() {
    const container =
        document.getElementById(
            "player-container"
        );
    const rosterFilter =
        document.getElementById(
            "roster-filter"
        ).value;
    const positionFilter =
        document.getElementById(
            "position-filter"
        ).value;
    let players =
        allPlayers.filter(
            player => {
                const status =
                    String(
                        player.rosterStatus ||
                        "40MAN"
                    ).toUpperCase();
                const position =
                    getPositionGroup(
                        player
                    );
                if (
                    rosterFilter !== "ALL" &&
                    status !== rosterFilter
                ) {
                    return false;
                }
                if (
                    positionFilter !== "ALL" &&
                    position !== positionFilter
                ) {
                    return false;
                }
                return true;
            }
        );
    players.sort(
        (a, b) => {
            const groupDifference =
                positionOrder(a) -
                positionOrder(b);
            if (
                groupDifference !== 0
            ) {
                return groupDifference;
            }
            return (
                getNumber(a) -
                getNumber(b)
            );
        }
    );
    openedPlayerId =
        null;
    container.innerHTML =
        "";
    if (
        players.length === 0
    ) {
        container.innerHTML = `
            <div class="message">
                No players found.
            </div>
        `;
        return;
    }
    const groups = {
        P: {
            title:
                "PITCHERS",
            players: []
        },
        C: {
            title:
                "CATCHERS",
            players: []
        },
        IF: {
            title:
                "INFIELDERS",
            players: []
        },
        OF: {
            title:
                "OUTFIELDERS",
            players: []
        },
        DH: {
            title:
                "DESIGNATED HITTERS",
            players: []
        },
        OTHER: {
            title:
                "OTHER",
            players: []
        }
    };
    players.forEach(
        player => {
            const group =
                getPositionGroup(
                    player
                );
            if (
                groups[group]
            ) {
                groups[group]
                    .players
                    .push(
                        player
                    );
            }
        }
    );
    [
        "P",
        "C",
        "IF",
        "OF",
        "DH",
        "OTHER"
    ].forEach(
        key => {
            const group =
                groups[key];
            if (
                group.players.length === 0
            ) {
                return;
            }
            const section =
                document.createElement(
                    "section"
                );
            section.className =
                "position-group";
            const title =
                document.createElement(
                    "div"
                );
            title.className =
                "position-title";
            title.textContent =
                group.title;
            const list =
                document.createElement(
                    "div"
                );
            list.className =
                "player-list";
            group.players.forEach(
                player => {
                    list.appendChild(
                        createPlayerWrapper(
                            player
                        )
                    );
                }
            );
            section.appendChild(
                title
            );
            section.appendChild(
                list
            );
            container.appendChild(
                section
            );
        }
    );
}
/* =====================================================
   LOAD ROSTER
===================================================== */
async function loadRoster() {
    const response =
        await fetch(
            "data/roster.json?ts=" +
            Date.now()
        );
    if (
        !response.ok
    ) {
        throw new Error(
            "roster.json could not be loaded."
        );
    }
    const data =
        await response.json();
    allPlayers =
        Array.isArray(
            data.players
        )
            ? data.players
            : [];
}
/* =====================================================
   LOAD PLAYER STATS
===================================================== */
async function loadPlayerStats() {
    const response =
        await fetch(
            "data/player_stats.json?ts=" +
            Date.now()
        );
    if (
        !response.ok
    ) {
        throw new Error(
            "player_stats.json could not be loaded."
        );
    }
    const data =
        await response.json();
    playerStats =
        data.players &&
        typeof data.players === "object"
            ? data.players
            : {};
}
/* =====================================================
   INITIALIZE
===================================================== */
async function initialize() {
    const container =
        document.getElementById(
            "player-container"
        );
    try {
        await Promise.all([
            loadRoster(),
            loadPlayerStats()
        ]);
        renderPlayers();
    }
    catch(error) {
        console.error(
            error
        );
        container.innerHTML = `
            <div class="message">
                Player data could not be loaded.
                <br><br>
                Please check
                roster.json and
                player_stats.json.
            </div>
        `;
    }
}
/* =====================================================
   FILTER EVENTS
===================================================== */
document
    .getElementById(
        "position-filter"
    )
    .addEventListener(
        "change",
        renderPlayers
    );
document
    .getElementById(
        "roster-filter"
    )
    .addEventListener(
        "change",
        renderPlayers
    );
/* =====================================================
   START
===================================================== */
initialize();
</script>
