<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player | Phillies</title>
<style>
:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --red: #e31837;
    --red-dark: #c20f30;
    --red-deep: #970a24;
    --white: #ffffff;
    --gray: #718298;
    --gray-light: #aab6c5;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   HEADER
========================================================= */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 84px;
    overflow: hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
.header-field {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 250px;
    height: 250px;
    transform:
        translate(-50%, -50%)
        rotate(45deg);
    border:
        1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
    opacity: .8;
}
.header-field::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 175px;
    height: 175px;
    transform:
        translate(-50%, -50%);
    border:
        1px solid rgba(255,255,255,.09);
}
.header-field::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -30px;
    width: 1px;
    height: 310px;
    transform:
        translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
.header-left {
    position: absolute;
    left: -14%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right {
    position: absolute;
    right: -13%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
.header-highlight {
    position: absolute;
    left: -10%;
    top: 0;
    width: 120%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
.header-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
    opacity: .85;
}
.header-base {
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 24px;
    height: 20px;
    transform:
        translateX(-50%);
    border:
        1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
    opacity: .75;
}
/* =========================================================
   PLAYER AREA
========================================================= */
main {
    width: 100%;
    min-height:
        calc(100vh - 162px);
    padding:
        20px 14px 28px;
}
.player-list {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}
/* =========================================================
   PLAYER CARD
========================================================= */
.player-card {
    position: relative;
    width: 100%;
    min-height: 92px;
    margin-bottom: 10px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 62px 1fr auto;
    align-items: center;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );
    border:
        1px solid rgba(255,255,255,.07);
    border-radius: 14px;
    box-shadow:
        0 7px 20px rgba(0,0,0,.18);
}
.player-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--red);
}
.player-card.il::before {
    background: #718298;
}
.player-card.minors::before {
    background: #aab6c5;
}
/* =========================================================
   NUMBER
========================================================= */
.player-number {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: rgba(255,255,255,.92);
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}
/* =========================================================
   PLAYER INFORMATION
========================================================= */
.player-main {
    min-width: 0;
    padding: 15px 8px;
}
.player-name {
    overflow: hidden;
    color: var(--white);
    font-size: 17px;
    font-weight: 850;
    line-height: 1.15;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.player-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    color: var(--gray-light);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
}
.player-position {
    min-width: 30px;
    color: var(--white);
    font-size: 11px;
    font-weight: 900;
}
.player-bt {
    color: var(--gray-light);
}
.player-divider {
    width: 1px;
    height: 11px;
    background:
        rgba(255,255,255,.16);
}
/* =========================================================
   STATUS
========================================================= */
.player-status {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 78px;
    padding: 0 10px;
}
.status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 67px;
    height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .55px;
    white-space: nowrap;
}
.status-active {
    color: #ffffff;
    background:
        rgba(227,24,55,.20);
    border:
        1px solid rgba(227,24,55,.45);
}
.status-il {
    color: #d8e0ea;
    background:
        rgba(113,130,152,.18);
    border:
        1px solid rgba(113,130,152,.35);
}
.status-minors {
    color: #bfc9d5;
    background:
        rgba(170,182,197,.10);
    border:
        1px solid rgba(170,182,197,.20);
}
/* =========================================================
   UNKNOWN
========================================================= */
.player-card.unknown {
    opacity: .78;
}
/* =========================================================
   BOTTOM NAV
========================================================= */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2000;
    height: 78px;
    background:
        rgba(5,20,39,.98);
    border-top:
        1px solid rgba(255,255,255,.08);
    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);
    backdrop-filter:
        blur(16px);
}
.bottom-inner {
    width: 100%;
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns:
        repeat(5, 1fr);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color:
        var(--gray);
    text-decoration: none;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .65px;
    -webkit-tap-highlight-color:
        transparent;
}
.nav-icon {
    width: 31px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
}
.nav-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke:
        currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* =========================================================
   ACTIVE = PLAYER
========================================================= */
.nav-item.active {
    color:
        var(--red);
}
.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}
/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 380px) {
    .header {
        height: 78px;
    }
    main {
        padding:
            16px 10px 24px;
    }
    .player-card {
        min-height: 86px;
        grid-template-columns:
            53px 1fr auto;
    }
    .player-number {
        font-size: 24px;
    }
    .player-name {
        font-size: 15px;
    }
    .player-meta {
        font-size: 9px;
    }
    .player-status {
        min-width: 70px;
        padding: 0 6px;
    }
    .status-badge {
        min-width: 61px;
        font-size: 7px;
    }
    .nav-item {
        font-size: 7px;
    }
    .nav-icon {
        width: 29px;
        height: 29px;
    }
    .nav-icon svg {
        width: 19px;
        height: 19px;
    }
}
</style>
</head>
