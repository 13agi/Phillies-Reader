<!DOCTYPE html>
<html lang="ja">
<head>

<title>Player | Phillies</title>

<style>
:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --card: #0a1f37;
    --card-light: #102946;

    --red: #e31837;
    --yellow: #f5c542;
    --gray: #718298;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}

body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

/* =========================================================
   HEADER
   既存UIそのまま
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 84px;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );

    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}

.header-field {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 250px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );

    opacity: .8;
}

.header-field::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 175px;
    height: 175px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.09);
}

.header-field::after {
    content: "";

    position: absolute;

    left: 50%;
    top: -30px;

    width: 1px;
    height: 310px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}

.header-left {
    position: absolute;

    left: -14%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}

.header-right {
    position: absolute;

    right: -13%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}

.header-highlight {
    position: absolute;

    left: -10%;
    top: 0;

    width: 120%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}

.header-edge {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );

    opacity: .85;
}

.header-base {
    position: absolute;

    left: 50%;
    bottom: 9px;

    width: 24px;
    height: 20px;

    transform:
        translateX(-50%);

    border:
        1px solid rgba(255,255,255,.22);

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );

    opacity: .75;
}


/* =========================================================
   PLAYER AREA
========================================================= */

main {
    width: 100%;
    min-height:
        calc(100vh - 162px);

    padding:
        17px 12px 30px;
}

.player-container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* =========================================================
   SECTION HEADER
========================================================= */

.player-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin:
        0 3px 13px;
}

.player-section-title {
    color:
        rgba(255,255,255,.86);

    font-size: 10px;
    font-weight: 900;

    letter-spacing:
        1.6px;
}

.player-section-count {
    color:
        rgba(255,255,255,.25);

    font-size: 7px;
    font-weight: 800;

    letter-spacing:
        1px;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card {
    --status-color: var(--red);

    position: relative;

    width: 100%;
    height: 104px;

    margin-bottom: 10px;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            var(--card-light) 0%,
            var(--card) 58%,
            #071a30 100%
        );

    box-shadow:
        0 9px 25px rgba(0,0,0,.24);
}


/* ロスター状態と完全に同じ色 */

.player-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 4px;

    background:
        var(--status-color);

    z-index: 5;
}


/* 背景の微細な斜線 */

.player-card::after {
    content: "";

    position: absolute;

    right: -80px;
    top: -110px;

    width: 230px;
    height: 230px;

    transform:
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.028);

    pointer-events: none;
}


/* =========================================================
   STATUS VARIANTS
========================================================= */

.player-card.il {
    --status-color: var(--yellow);
}

.player-card.forty-man {
    --status-color: #8291a3;
}

.player-card.unknown {
    --status-color: #596b80;
}


/* =========================================================
   MAIN INFORMATION ROW
   背番号 / POS / 投打 / 選手
========================================================= */

.player-main-row {
    position: relative;
    z-index: 2;

    display: grid;

    grid-template-columns:
        58px
        45px
        56px
        minmax(0, 1fr);

    align-items: center;

    height: 61px;

    padding:
        0 16px 0 17px;

    border-bottom:
        1px solid rgba(255,255,255,.055);
}


/* =========================================================
   FIELD
========================================================= */

.player-field {
    min-width: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;

    height: 100%;
}


/* ラベル */

.player-label {
    margin-bottom: 5px;

    color:
        rgba(255,255,255,.25);

    font-size: 6px;
    line-height: 1;

    font-weight: 900;

    letter-spacing:
        .8px;

    text-transform: uppercase;
}


/* 値 */

.player-value {
    color:
        rgba(255,255,255,.94);

    font-size: 13px;
    line-height: 1;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   NUMBER
========================================================= */

.player-number-field {
    padding-left: 1px;
}

.player-number {
    color:
        var(--white);

    font-size: 21px;
    line-height: 1;

    font-weight: 950;

    letter-spacing:
        -.8px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   POSITION
========================================================= */

.player-position {
    color:
        rgba(255,255,255,.90);

    font-size: 15px;
    font-weight: 950;

    letter-spacing:
        -.1px;
}


/* =========================================================
   B/T
========================================================= */

.player-bt {
    color:
        rgba(255,255,255,.82);

    font-size: 12px;
    font-weight: 850;

    letter-spacing:
        .3px;
}


/* =========================================================
   NAME
========================================================= */

.player-name-field {
    min-width: 0;

    overflow: hidden;

    padding-left: 7px;
}

.player-name {
    display: block;

    width: max-content;
    max-width: none;

    color:
        #ffffff;

    font-size: 16px;
    line-height: 1;

    font-weight: 900;

    letter-spacing:
        -.3px;

    white-space: nowrap;

    transform-origin:
        left center;
}


/* =========================================================
   ROSTER ROW
========================================================= */

.player-roster-row {
    position: relative;
    z-index: 2;

    display: flex;

    align-items: center;

    height: 42px;

    padding:
        0 16px 0 17px;
}


/* ロスター情報 */

.player-roster {
    display: flex;

    align-items: center;

    min-width: 0;

    color:
        var(--status-color);

    font-size: 8px;
    line-height: 1;

    font-weight: 950;

    letter-spacing:
        .85px;

    text-transform: uppercase;
}


/* 状態ドット */

.player-roster-dot {
    flex:
        0 0 auto;

    width: 5px;
    height: 5px;

    margin-right: 7px;

    border-radius: 50%;

    background:
        var(--status-color);

    box-shadow:
        0 0 9px
        color-mix(
            in srgb,
            var(--status-color) 60%,
            transparent
        );
}


/* ロスター補足 */

.player-roster-detail {
    margin-left: 9px;

    color:
        rgba(255,255,255,.25);

    font-size: 6px;

    font-weight: 800;

    letter-spacing:
        .5px;
}


/* =========================================================
   NULL / UNKNOWN
========================================================= */

.player-card.unknown .player-roster {
    color:
        var(--status-color);
}

.player-card.unknown .player-roster-detail {
    color:
        rgba(255,255,255,.18);
}


/* =========================================================
   BOTTOM NAV
   既存UIそのまま
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    height: 78px;

    background:
        rgba(5,20,39,.98);

.nav-item {

.nav-icon {

    height: 31px;

    align-items: center;
    justify-content: center;

    border-radius: 10px;
}

.nav-icon svg {

    height: 20px;

.nav-item.active {

    }

    .nav-icon {
        width: 29px;
        height: 29px;
    }

    .nav-icon svg {
        width: 19px;
        height: 19px;
    }
}

<script>
/*
 * =========================================================
 * PLAYER NAME FITTER
 *
 * カードサイズを変更せず、
 * 長い選手名だけをカード内の利用可能幅に合わせる。
 *
 * 名前が短い選手は通常サイズ。
 * 長い選手は横方向だけ縮小して必ず収める。
 * =========================================================
 */

function fitPlayerNames() {

    const fields =
        document.querySelectorAll(".player-name-field");

    fields.forEach(field => {

        const name =
            field.querySelector(".player-name");

        if (!name) {
            return;
        }

        name.style.transform =
            "scaleX(1)";

        const availableWidth =
            field.clientWidth -
            parseFloat(
                getComputedStyle(field).paddingLeft
            ) -
            2;

        const actualWidth =
            name.scrollWidth;

        if (
            actualWidth > availableWidth &&
            availableWidth > 0
        ) {

            const scale =
                availableWidth / actualWidth;

            name.style.transform =
                "scaleX(" +
                Math.max(scale, 0.62) +
                ")";

        }

    });

}


/*
 * 初期表示
 */

window.addEventListener(
    "DOMContentLoaded",
    fitPlayerNames
);


/*
 * 画面サイズ変更
 */

window.addEventListener(
    "resize",
    fitPlayerNames
);


/*
 * iPhoneの回転・表示状態変更対策
 */

window.addEventListener(
    "orientationchange",
    () => {
        setTimeout(
            fitPlayerNames,
            100
        );
    }
);

</script>

</body>
</html>
