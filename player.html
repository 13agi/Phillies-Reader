<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player | Phillies</title>
<style>
:root{
    --navy:#06172d;
    --navy2:#091d35;
    --red:#e31837;
    --yellow:#f3c548;
    --white:#f7f9fc;
    --muted:#718198;
    --dim:#394b62;
    --line:rgba(255,255,255,.075);
}
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
html,body{
    min-height:100%;
    background:var(--navy);
}
body{
    color:var(--white);
    padding-bottom:78px;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   EXISTING HEADER
========================================================= */
.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:84px;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
.header-field{
    position:absolute;
    left:50%;
    top:50%;
    width:250px;
    height:250px;
    transform:
        translate(-50%,-50%)
        rotate(45deg);
    border:1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
}
.header-field::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:175px;
    height:175px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,255,255,.09);
}
.header-field::after{
    content:"";
    position:absolute;
    left:50%;
    top:-30px;
    width:1px;
    height:310px;
    transform:translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
.header-left{
    position:absolute;
    left:-14%;
    top:-60%;
    width:47%;
    height:220%;
    transform:skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right{
    position:absolute;
    right:-13%;
    top:-60%;
    width:47%;
    height:220%;
    transform:skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
.header-highlight{
    position:absolute;
    left:-10%;
    top:0;
    width:120%;
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
.header-edge{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:4px;
    background:
        linear-gradient(
            90deg,
            var(--navy),
            rgba(255,255,255,.28) 50%,
            var(--navy)
        );
}
.header-base{
    position:absolute;
    left:50%;
    bottom:9px;
    width:24px;
    height:20px;
    transform:translateX(-50%);
    border:1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
}
/* =========================================================
   PLAYER AREA
========================================================= */
main{
    width:100%;
    min-height:calc(100vh - 162px);
    padding:20px 12px 30px;
}
.roster{
    width:100%;
    max-width:720px;
    margin:auto;
}
/* =========================================================
   PAGE TITLE
========================================================= */
.page-title{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin:
        0 4px 18px;
}
.page-title-main{
    display:flex;
    align-items:baseline;
    gap:8px;
}
.page-title h1{
    font-size:13px;
    line-height:1;
    font-weight:900;
    letter-spacing:2px;
}
.page-title span{
    color:rgba(255,255,255,.28);
    font-size:7px;
    font-weight:800;
    letter-spacing:1.2px;
}
/* =========================================================
   PLAYER CARD
========================================================= */
.player{
    --accent:var(--red);
    position:relative;
    display:grid;
    grid-template-columns:76px minmax(0,1fr);
    width:100%;
    min-height:126px;
    margin-bottom:12px;
    overflow:hidden;
    border:
        1px solid rgba(255,255,255,.075);
    border-radius:16px;
    background:
        linear-gradient(
            115deg,
            #0b213b 0%,
            #091c34 55%,
            #07172b 100%
        );
    box-shadow:
        0 12px 30px rgba(0,0,0,.28);
    transition:
        transform .18s ease,
        border-color .18s ease;
}
.player.il{
    --accent:var(--yellow);
}
.player:active{
    transform:scale(.985);
}
/* =========================================================
   LEFT NUMBER PANEL
========================================================= */
.player-number{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    border-right:
        1px solid rgba(255,255,255,.065);
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.008)
        );
}
.player-number::before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    bottom:14px;
    width:3px;
    background:var(--accent);
}
.player-number::after{
    content:"";
    position:absolute;
    width:48px;
    height:48px;
    border:
        1px solid rgba(255,255,255,.035);
    border-radius:50%;
}
.number{
    position:relative;
    z-index:2;
    color:#fff;
    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        Impact,
        sans-serif;
    font-size:39px;
    line-height:1;
    font-weight:900;
    letter-spacing:-2px;
    font-variant-numeric:
        tabular-nums;
}
/* =========================================================
   MAIN PLAYER INFORMATION
========================================================= */
.player-main{
    min-width:0;
    display:flex;
    flex-direction:column;
    padding:
        15px 17px 13px 16px;
}
/* TOP LINE */
.player-top{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:18px;
}
.position{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:28px;
    height:19px;
    padding:0 7px;
    border:
        1px solid rgba(255,255,255,.12);
    border-radius:5px;
    background:
        rgba(255,255,255,.055);
    color:
        rgba(255,255,255,.92);
    font-size:8px;
    font-weight:900;
    letter-spacing:.7px;
}
.batthrow{
    color:
        rgba(255,255,255,.46);
    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
}
.meta-divider{
    width:1px;
    height:11px;
    background:
        rgba(255,255,255,.12);
}
/* =========================================================
   NAME
========================================================= */
.name-wrap{
    min-width:0;
    display:flex;
    align-items:flex-end;
    flex:1;
    padding-top:7px;
}
.name{
    min-width:0;
    max-width:100%;
    color:#fff;
    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "Helvetica Neue",
        Arial,
        sans-serif;
    font-size:clamp(20px,6vw,28px);
    line-height:.92;
    font-weight:900;
    letter-spacing:-.8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/* =========================================================
   BOTTOM STATUS
========================================================= */
.status-area{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding-top:10px;
    border-top:
        1px solid rgba(255,255,255,.065);
}
.status{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--accent);
    font-size:7px;
    line-height:1;
    font-weight:950;
    letter-spacing:1.1px;
}
.status-dot{
    width:5px;
    height:5px;
    flex:0 0 auto;
    border-radius:50%;
    background:var(--accent);
    box-shadow:
        0 0 9px
        var(--accent);
}
.roster-info{
    color:
        rgba(255,255,255,.27);
    font-size:6.5px;
    font-weight:850;
    letter-spacing:.8px;
    white-space:nowrap;
}
/* =========================================================
   SMALL SECONDARY ACCENT
========================================================= */
.player-main::after{
    content:"";
    position:absolute;
    right:16px;
    top:14px;
    width:18px;
    height:1px;
    background:
        var(--accent);
    opacity:.65;
}
/* =========================================================
   BOTTOM NAV
========================================================= */
.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:2000;
    height:78px;
    background:
        rgba(5,20,39,.98);
    border-top:
        1px solid rgba(255,255,255,.08);
    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);
    backdrop-filter:
        blur(16px);
}
.bottom-inner{
    width:100%;
    max-width:760px;
    height:100%;
    margin:auto;
    display:grid;
    grid-template-columns:
        repeat(5,1fr);
}
.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:
        rgba(255,255,255,.38);
    text-decoration:none;
    font-size:8px;
    font-weight:800;
    letter-spacing:.65px;
    -webkit-tap-highlight-color:
        transparent;
}
.nav-icon{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
}
.nav-icon svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.nav-item.active{
    color:var(--red);
}
.nav-item.active .nav-icon{
    background:
        rgba(227,24,55,.14);
}
/* =========================================================
   MOBILE
========================================================= */
@media(max-width:380px){
    main{
        padding:
            16px 9px 26px;
    }
    .player{
        grid-template-columns:68px minmax(0,1fr);
        min-height:119px;
        border-radius:15px;
    }
    .player-main{
        padding:
            14px 13px 12px 14px;
    }
    .number{
        font-size:35px;
    }
    .name{
        font-size:
            clamp(
                18px,
                6vw,
                24px
            );
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="header-field"></div>

    <div class="header-right"></div>
    <div class="header-highlight"></div>
    <div class="header-base"></div>
    <div class="header-edge"></div>
</header>
<main>
<section class="roster">

    <article

            <div class="name-wrap">

            </div>

</section>
</main>
<nav class="bottom-nav">
    <div class="bottom-inner">
        <a href="schedule.html" class="nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3.5" y="5" width="17" height="16" rx="2"/>
                    <line x1="7.5" y1="3" x2="7.5" y2="7"/>

<script>
/*
 * 表示用背番号の正規化
 * "07" → "7"
 * null → "—"
 */
function normalizeNumber(value){
    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "—";
    }
    const number =
        Number.parseInt(
            String(value),
            10
        );
    return Number.isNaN(number)
        ? "—"
        : String(number);
}
/*
 * 将来のMLB API接続用
 *
 * player.number
 * player.position
 * player.bats
 * player.throws
 * player.fullName
 * player.status
 * player.roster
 */
function createPlayerCard(player){
    const article =
        document.createElement("article");
    article.className =
        "player";
    if(player.status === "IL"){
        article.classList.add("il");
    }
    const number =
        normalizeNumber(
            player.number
        );
    const position =
        player.position ?? "—";
    const bats =
        player.bats ?? null;
    const throws =
        player.throws ?? null;
    const bt =
        bats && throws
            ? `${bats}/${throws}`
            : "—";
    const name =
        player.fullName ?? "—";
    const status =
        player.status ?? "—";
    const roster =
        player.roster ?? "—";
    article.innerHTML = `
        <div class="player-number">
            <span class="number">
                ${number}
            </span>
        </div>
        <div class="player-main">
            <div class="player-top">
                <span class="position">
                    ${position}
                </span>
                <span class="meta-divider"></span>
                <span class="batthrow">
                    ${bt}
                </span>
            </div>
            <div class="name-wrap">
                <span class="name">
                    ${String(name).toUpperCase()}
                </span>
            </div>
            <div class="status-area">
                <span class="status">
                    <span class="status-dot"></span>
                    ${status}
                </span>
                <span class="roster-info">
                    ${roster}
                </span>
            </div>
        </div>
    `;
    return article;
}
</script>
