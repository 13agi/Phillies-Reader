<style>
:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --panel: #0a1d34;
    --panel-2: #0d2540;
    --red: #e31837;
    --yellow: #f4c542;
    --white: #ffffff;
    --muted: #718298;
    --line: rgba(255,255,255,.075);
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   HEADER
   EXISTING UI — DO NOT CHANGE
========================================================= */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 84px;
    overflow: hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
.header-field {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 250px;
    height: 250px;
    transform:
        translate(-50%, -50%)
        rotate(45deg);
    border:
        1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
    opacity: .8;
}
.header-field::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 175px;
    height: 175px;
    transform:
        translate(-50%, -50%);
    border:
        1px solid rgba(255,255,255,.09);
}
.header-field::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -30px;
    width: 1px;
    height: 310px;
    transform:
        translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
.header-left {
    position: absolute;
    left: -14%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right {
    position: absolute;
    right: -13%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
.header-highlight {
    position: absolute;
    left: -10%;
    top: 0;
    width: 120%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
.header-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
    opacity: .85;
}
.header-base {
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 24px;
    height: 20px;
    transform:
        translateX(-50%);
    border:
        1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
    opacity: .75;
}
/* =========================================================
   PLAYER PAGE
========================================================= */
main {
    width: 100%;
    min-height:
        calc(100vh - 162px);
    padding:
        18px 12px 28px;
}
.roster-board {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}
/* =========================================================
   TITLE
========================================================= */
.roster-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin:
        0 4px 15px;
}
.roster-heading-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
}
.roster-heading-title {
    font-size: 11px;
    font-weight: 950;
    letter-spacing: 1.7px;
}
.roster-heading-season {
    color:
        rgba(255,255,255,.28);
    font-size: 7px;
    font-weight: 900;
    letter-spacing: 1px;
}
.roster-heading-count {
    color:
        rgba(255,255,255,.25);
    font-size: 7px;
    font-weight: 900;
    letter-spacing: .8px;
}
/* =========================================================
   PLAYER CARD
========================================================= */
.player-card {
    --status: var(--red);
    position: relative;
    width: 100%;
    height: 116px;
    margin-bottom: 11px;
    overflow: hidden;
    border:
        1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    background:
        linear-gradient(
            135deg,
            var(--panel-2) 0%,
            var(--panel) 54%,
            #07192e 100%
        );
    box-shadow:
        0 12px 30px rgba(0,0,0,.25);
    cursor: pointer;
    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}
/* 状態ライン */
.player-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background:
        var(--status);
    z-index: 5;
}
/* 大きな背番号の背景 */
.player-card::after {
    content: attr(data-number);
    position: absolute;
    right: -4px;
    top: -25px;
    color:
        rgba(255,255,255,.025);
    font-size: 138px;
    line-height: 1;
    font-weight: 950;
    letter-spacing: -9px;
    pointer-events: none;
    user-select: none;
}
/* タップ */
.player-card:active {
    transform:
        scale(.985);
}
@media (hover: hover) {
    .player-card:hover {
        transform:
            translateY(-2px);
        border-color:
            rgba(255,255,255,.14);
        box-shadow:
            0 16px 36px rgba(0,0,0,.32);
    }
}
/* =========================================================
   STATUS
========================================================= */
.player-card.il {
    --status: var(--yellow);
}
.player-card.forty-man {
    --status: #8291a3;
}
.player-card.unknown {
    --status: #65778d;
}
/* =========================================================
   CARD CONTENT
========================================================= */
.player-card-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding:
        14px 17px 13px 20px;
}
/* =========================================================
   TOP META
========================================================= */
.player-meta {
    display: grid;
    grid-template-columns:
        58px
        48px
        55px
        minmax(0, 1fr);
    align-items: center;
    height: 30px;
    color:
        rgba(255,255,255,.35);
}
.meta-item {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.meta-label {
    color:
        rgba(255,255,255,.25);
    font-size: 5.5px;
    line-height: 1;
    font-weight: 950;
    letter-spacing: .8px;
}
.meta-value {
    color:
        rgba(255,255,255,.92);
    font-size: 12px;
    line-height: 1;
    font-weight: 950;
}
.number-value {
    font-size: 17px;
    letter-spacing:
        -.7px;
    font-variant-numeric:
        tabular-nums;
}
.position-value {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    min-width: 25px;
    height: 18px;
    padding:
        0 6px;
    border:
        1px solid rgba(255,255,255,.10);
    border-radius: 5px;
    background:
        rgba(255,255,255,.055);
    font-size: 9px;
}
.bt-value {
    font-size: 10px;
    letter-spacing:
        .4px;
}
/* =========================================================
   PLAYER NAME
========================================================= */
.player-name-area {
    display: flex;
    align-items: center;
    min-width: 0;
    flex: 1;
    margin-top: 5px;
}
.player-name {
    display: block;
    min-width: 0;
    width: 100%;
    color:
        #ffffff;
    font-size: 20px;
    line-height: 1;
    font-weight: 950;
    letter-spacing:
        -.65px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    transform-origin:
        left center;
}
/* =========================================================
   DIVIDER
========================================================= */
.player-divider {
    width: 100%;
    height: 1px;
    margin-top: 9px;
    background:
        linear-gradient(
            90deg,
            var(--status),
            rgba(255,255,255,.08) 36%,
            transparent 100%
        );
    opacity: .75;
}
/* =========================================================
   ROSTER STATUS
========================================================= */
.player-roster-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 21px;
    margin-top: 5px;
}
.roster-status {
    display: flex;
    align-items: center;
    min-width: 0;
    color:
        var(--status);
    font-size: 8px;
    line-height: 1;
    font-weight: 950;
    letter-spacing:
        .8px;
}
.roster-dot {
    width: 5px;
    height: 5px;
    margin-right: 7px;
    flex: 0 0 auto;
    border-radius: 50%;
    background:
        var(--status);
    box-shadow:
        0 0 10px
        color-mix(
            in srgb,
            var(--status) 55%,
            transparent
        );
}
.roster-detail {
    color:
        rgba(255,255,255,.22);
    font-size: 6px;
    font-weight: 850;
    letter-spacing:
        .55px;
    white-space: nowrap;
}
/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 380px) {
    .header {
        height: 78px;
    }
    main {
        padding:
            14px 9px 25px;
    }

        height: 113px;
        border-radius: 16px;
    }
    .player-card-inner {
        padding:
            13px 13px 12px 17px;
    }
    .player-meta {

            42px

            minmax(0, 1fr);
    }
    .player-name {
        font-size: 18px;
    }
    .roster-detail {
        font-size: 5.5px;
    }
}
/* =========================================================

========================================================= */

.nav-item {

.nav-icon {

.nav-icon svg {

}
.nav-item.active {
    color:
        var(--red);
}
.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}
</style>

<script>
/*
=========================================================
PLAYER NAME FIT
=========================================================
カードサイズは変更せず、名前だけを利用可能幅へ
自動的に収める。
=========================================================
*/
function fitPlayerNames() {
    document
        .querySelectorAll(".player-card")
        .forEach(card => {
            const area =
                card.querySelector(
                    ".player-name-area"
                );
            const name =
                card.querySelector(
                    ".player-name"
                );
            if (!area || !name) {
                return;
            }
            name.style.fontSize = "20px";
            const available =
                area.clientWidth;
            let size = 20;
            while (
                name.scrollWidth > available &&
                size > 13
            ) {
                size -= .5;
                name.style.fontSize =
                    size + "px";
            }
        });
}
/*
=========================================================
CARD TAP
=========================================================
将来的に player detail へ接続できるよう、
カード自体をクリック可能な構造にしておく。
=========================================================
*/
document
    .querySelectorAll(".player-card")
    .forEach(card => {
        card.addEventListener(
            "click",
            () => {
                /*
                 * 今はサンプル段階なので遷移なし。
                 *
                 * MLB API接続後、
                 * playerIdを使って
                 * player-detail.html?id=...
                 * へ接続可能。
                 */
            }
        );
    });
window.addEventListener(
    "DOMContentLoaded",
    fitPlayerNames
);
window.addEventListener(
    "resize",
    fitPlayerNames
);
window.addEventListener(
    "orientationchange",
    () => {
        setTimeout(
            fitPlayerNames,
            120
        );
    }
);
</script>
</body>
