<html lang="ja">

<head>

<title>Player | Phillies</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --panel: #0a1d34;
    --panel-2: #0d2540;

    --red: #e31837;
    --yellow: #f4c542;

    --white: #ffffff;
    --muted: #718298;

    --line: rgba(255,255,255,.075);
}


/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}

body {
    min-height: 100vh;
    padding-bottom: 78px;

    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* =========================================================
   HEADER
   EXISTING UI — DO NOT CHANGE
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 84px;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );

    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}

.header-field {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 250px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );

    opacity: .8;
}

.header-field::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 175px;
    height: 175px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.09);
}

.header-field::after {
    content: "";

    position: absolute;

    left: 50%;
    top: -30px;

    width: 1px;
    height: 310px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}

.header-left {
    position: absolute;

    left: -14%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}

.header-right {
    position: absolute;

    right: -13%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform:
        skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}

.header-highlight {
    position: absolute;

    left: -10%;
    top: 0;

    width: 120%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}

.header-edge {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );

    opacity: .85;
}

.header-base {
    position: absolute;

    left: 50%;
    bottom: 9px;

    width: 24px;
    height: 20px;

    transform:
        translateX(-50%);

    border:
        1px solid rgba(255,255,255,.22);

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );

    opacity: .75;
}


/* =========================================================
   PLAYER PAGE
   NEW DESIGN
========================================================= */

main {
    width: 100%;

    min-height:
        calc(100vh - 162px);

    padding:
        22px 12px 32px;
}

.player-page {
    width: 100%;
    max-width: 760px;

    margin: 0 auto;
}


/* =========================================================
   PAGE INTRO
========================================================= */

.player-page-head {
    display: flex;

    align-items: flex-end;
    justify-content: space-between;

    padding:
        0 5px 17px;

    border-bottom:
        1px solid rgba(255,255,255,.10);
}

.player-page-title {
    display: flex;

    flex-direction: column;

    gap: 5px;
}

.player-page-title small {
    color:
        rgba(255,255,255,.30);

    font-size: 7px;
    line-height: 1;

    font-weight: 800;

    letter-spacing:
        2px;
}

.player-page-title h1 {
    color:
        #ffffff;

    font-size: 29px;
    line-height: .95;

    font-weight: 650;

    letter-spacing:
        -1.3px;
}

.player-page-meta {
    display: flex;

    flex-direction: column;

    align-items: flex-end;

    gap: 4px;
}

.player-page-meta strong {
    color:
        rgba(255,255,255,.88);

    font-size: 15px;
    line-height: 1;

    font-weight: 700;
}

.player-page-meta span {
    color:
        rgba(255,255,255,.24);

    font-size: 6px;
    line-height: 1;

    font-weight: 800;

    letter-spacing:
        1.2px;
}


/* =========================================================
   FILTER BAR
========================================================= */

.player-filter {
    display: flex;

    align-items: center;
    justify-content: space-between;

    height: 44px;

    border-bottom:
        1px solid rgba(255,255,255,.065);
}

.player-filter-left {
    display: flex;

    align-items: center;

    gap: 15px;
}

.player-filter-item {
    position: relative;

    color:
        rgba(255,255,255,.30);

    font-size: 7px;

    font-weight: 850;

    letter-spacing:
        .9px;
}

.player-filter-item.active {
    color:
        rgba(255,255,255,.85);
}

.player-filter-item.active::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: -15px;

    height: 2px;

    background:
        var(--red);
}

.player-filter-count {
    color:
        rgba(255,255,255,.22);

    font-size: 6px;

    font-weight: 800;

    letter-spacing:
        .7px;
}


/* =========================================================
   PLAYER LIST
========================================================= */

.player-list {
    width: 100%;
}


/* =========================================================
   PLAYER ROW
========================================================= */

.player-entry {
    --player-status: var(--red);

    position: relative;

    display: grid;

    grid-template-columns:
        78px
        minmax(0, 1fr);

    width: 100%;

    min-height: 128px;

    border-bottom:
        1px solid rgba(255,255,255,.075);

    overflow: hidden;

    cursor: pointer;

    transition:
        background .18s ease;
}

.player-entry.il {
    --player-status: var(--yellow);
}

.player-entry.forty {
    --player-status: #728196;
}


/* =========================================================
   LEFT NUMBER AREA
========================================================= */

.player-number-area {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;
}

.player-number-area::after {
    content: "";

    position: absolute;

    right: 0;
    top: 20px;
    bottom: 20px;

    width: 1px;

    background:
        rgba(255,255,255,.085);
}

.player-number {
    color:
        rgba(255,255,255,.92);

    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        Impact,
        sans-serif;

    font-size: 48px;

    line-height: .8;

    font-weight: 800;

    letter-spacing:
        -3.5px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   NUMBER STATUS MARKER
========================================================= */

.player-number-area::before {
    content: "";

    position: absolute;

    left: 0;
    top: 25px;
    bottom: 25px;

    width: 2px;

    background:
        var(--player-status);
}


/* =========================================================
   MAIN INFORMATION
========================================================= */

.player-content {
    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding:
        17px 7px 16px 19px;
}


/* =========================================================
   POSITION + B/T
========================================================= */

.player-specs {
    display: flex;

    align-items: center;

    gap: 9px;

    min-height: 14px;
}

.player-position {
    color:
        rgba(255,255,255,.82);

    font-size: 10px;

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        1px;
}

.player-bt {
    display: flex;

    align-items: center;

    gap: 7px;

    color:
        rgba(255,255,255,.38);

    font-size: 9px;

    line-height: 1;

    font-weight: 700;

    letter-spacing:
        .4px;
}

.player-bt::before {
    content: "";

    width: 1px;
    height: 11px;

    background:
        rgba(255,255,255,.15);
}


/* =========================================================
   NAME
========================================================= */

.player-name-wrap {
    min-width: 0;

    width: 100%;

    margin-top: 7px;
}

.player-name {
    display: block;

    width: 100%;
    min-width: 0;

    color:
        #ffffff;

    font-size: 25px;

    line-height: 1;

    font-weight: 650;

    letter-spacing:
        -.85px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: clip;

    transform-origin:
        left center;
}


/* =========================================================
   ROSTER INFORMATION
========================================================= */

.player-roster {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 10px;

    min-width: 0;
}

.player-roster-status {
    display: flex;

    align-items: center;

    gap: 6px;

    color:
        var(--player-status);

    font-size: 7px;

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        .9px;
}

.player-roster-dot {
    width: 5px;
    height: 5px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        var(--player-status);
}

.player-roster-detail {
    padding-left: 8px;

    border-left:
        1px solid rgba(255,255,255,.11);

    color:
        rgba(255,255,255,.22);

    font-size: 6px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        .6px;

    white-space: nowrap;
}


/* =========================================================
   RIGHT EDGE DETAIL
========================================================= */

.player-entry .edge-number {
    position: absolute;

    right: 10px;
    bottom: 7px;

    color:
        rgba(255,255,255,.07);

    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;

    font-size: 7px;

    font-weight: 900;

    letter-spacing:
        1px;
}


/* =========================================================
   HOVER / TAP
========================================================= */

@media (hover: hover) {

    .player-entry:hover {
        background:
            rgba(255,255,255,.022);
    }

    .player-entry:hover
    .player-number {
        color:
            #ffffff;
    }
}

.player-entry:active {
    background:
        rgba(255,255,255,.04);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 380px) {

    main {
        padding:
            17px 9px 28px;
    }

    .player-page-head {
        padding-bottom: 15px;
    }

    .player-page-title h1 {
        font-size: 27px;
    }

    .player-entry {
        grid-template-columns:
            68px
            minmax(0, 1fr);

        min-height: 116px;
    }

    .player-number {
        font-size: 42px;
    }

    .player-content {
        padding:
            15px 5px 14px 16px;
    }

    .player-name {
        font-size: 22px;
    }

    .player-specs {
        gap: 8px;
    }
}


/* =========================================================
   VERY SMALL DEVICES
========================================================= */

@media (max-width: 340px) {

    .player-entry {
        grid-template-columns:
            61px
            minmax(0, 1fr);
    }

    .player-number {
        font-size: 38px;
    }

    .player-content {
        padding-left: 14px;
    }

    .player-name {
        font-size: 20px;
    }

    .player-roster-detail {
        display: none;
    }
}


/* =========================================================
   BOTTOM NAV
   EXISTING UI — DO NOT CHANGE
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    height: 78px;

    background:
        rgba(5,20,39,.98);

    border-top:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);

    backdrop-filter:
        blur(16px);
}

.bottom-inner {
    width: 100%;
    max-width: 760px;

    height: 100%;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);
}

.nav-item {
    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    color:
        var(--gray);

    text-decoration: none;

    font-size: 8px;

    font-weight: 800;

    letter-spacing:
        .65px;

    -webkit-tap-highlight-color:
        transparent;
}

.nav-icon {
    width: 31px;
    height: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;
}

.nav-icon svg {
    width: 20px;
    height: 20px;

    fill: none;

    stroke:
        currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.nav-item.active {
    color:
        var(--red);
}

.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}

</style>

<script>

/* =========================================================
   PLAYER NAME FIT
   --------------------------------
   ・常に1行
   ・長い名前だけ縮小
   ・名前そのものは大文字化しない
========================================================= */

function fitPlayerNames() {

    const names =
        document.querySelectorAll(
            ".player-name"
        );

    names.forEach(name => {

        const parent =
            name.closest(
                ".player-name-wrap"
            );

        if (!parent) {
            return;
        }

        const width =
            parent.clientWidth;

        let size =
            window.innerWidth <= 380
                ? 22
                : 25;

        name.style.fontSize =
            `${size}px`;

        while (
            name.scrollWidth > width &&
            size > 13
        ) {

            size -= 0.25;

            name.style.fontSize =
                `${size}px`;
        }

    });

}


/* =========================================================
   NUMBER NORMALIZATION
   --------------------------------
   07 → 7
   0007 → 7
   null → —
========================================================= */

function normalizeNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    const number =
        Number.parseInt(
            String(value),
            10
        );

    if (
        Number.isNaN(number)
    ) {
        return "—";
    }

    return String(number);
}


/* =========================================================
   POSITION NORMALIZATION
========================================================= */

const VALID_POSITIONS = new Set([
    "P",
    "C",
    "1B",
    "2B",
    "3B",
    "SS",
    "LF",
    "CF",
    "RF",
    "DH"
]);

function normalizePosition(value) {

    if (!value) {
        return "—";
    }

    const position =
        String(value)
            .trim()
            .toUpperCase();

    return VALID_POSITIONS.has(position)
        ? position
        : "—";
}


/* =========================================================
   B/T
   --------------------------------
   必ず R/R のような一体表記。
   不明なら推測せず —。
========================================================= */

function normalizeBT(
    bats,
    throws
) {

    if (
        !bats ||
        !throws
    ) {
        return "—";
    }

    const b =
        String(bats)
            .trim()
            .toUpperCase();

    const t =
        String(throws)
            .trim()
            .toUpperCase();

    if (
        !["R","L","S"].includes(b) ||
        !["R","L"].includes(t)
    ) {
        return "—";
    }

    return `${b}/${t}`;
}


/* =========================================================
   ROSTER STATUS
========================================================= */

function normalizeRosterStatus(
    status
) {

    if (!status) {
        return "—";
    }

    const value =
        String(status)
            .trim()
            .toUpperCase();

    if (
        value === "ACTIVE"
    ) {
        return "ACTIVE";
    }

    if (
        value === "IL" ||
        value === "INJURED LIST"
    ) {
        return "IL";
    }

    if (
        value === "40-MAN" ||
        value === "40 MAN"
    ) {
        return "40-MAN";
    }

    return "—";
}


/* =========================================================
   PLAYER MODEL
   --------------------------------
   MLB APIから来る値をUI用に統一。
========================================================= */

function normalizePlayer(
    player
) {

    return {

        id:
            player?.id ??
            null,

        number:
            normalizeNumber(
                player?.number
            ),

        position:
            normalizePosition(
                player?.position
            ),

        bats:
            player?.bats ??
            null,

        throws:
            player?.throws ??
            null,

        bt:
            normalizeBT(
                player?.bats,
                player?.throws
            ),

        name:
            player?.fullName ??
            null,

        status:
            normalizeRosterStatus(
                player?.status
            ),

        roster:
            player?.roster ??
            null

    };

}


/* =========================================================
   PLAYER COUNT
========================================================= */

function updatePlayerCount() {

    const count =
        document.querySelectorAll(
            ".player-entry"
        ).length;

    const element =
        document.getElementById(
            "playerCount"
        );

    if (!element) {
        return;
    }

    element.textContent =
        `${count} PLAYERS`;
}


/* =========================================================
   INITIALIZE
========================================================= */

function initializePlayerPage() {

    fitPlayerNames();

    updatePlayerCount();

}


/* =========================================================
   EVENTS
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    initializePlayerPage
);

window.addEventListener(
    "resize",
    fitPlayerNames
);

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            fitPlayerNames,
            120
        );

    }
);

</script>
