<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>PLAYER | PHILLIES</title>


<style>

:root {

    --navy: #07152b;

    --red: #e31937;

    --white: #ffffff;

    --muted: #64748b;

    --yellow: #f4c430;

    --gray: #64748b;
}


/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}


html,
body {

    width: 100%;

    min-height: 100%;

    background:
        var(--navy);
}


body {

    color:
        var(--white);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    height: 72px;

    overflow: hidden;

    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );

    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.30);
}


.header::before {

    content: "";

    position: absolute;

    top: -120px;
    right: -55px;

    width: 300px;
    height: 300px;

    transform:
        rotate(27deg);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.015)
        );

    border-left:
        1px solid
        rgba(255,255,255,0.16);

    pointer-events: none;
}


.header-navy-shape {

    position: absolute;

    top: -20px;
    left: 43%;

    width: 130px;
    height: 130px;

    transform:
        rotate(25deg);

    background:
        rgba(7,21,43,0.16);

    pointer-events: none;
}


.header-line-one {

    position: absolute;

    left: -20px;
    bottom: 14px;

    width: 55%;

    height: 2px;

    transform:
        skewX(-35deg);

    background:
        rgba(255,255,255,0.34);

    pointer-events: none;
}


.header-line-two {

    position: absolute;

    left: 4%;
    bottom: 8px;

    width: 35%;

    height: 1px;

    transform:
        skewX(-35deg);

    background:
        rgba(255,255,255,0.18);

    pointer-events: none;
}


.header-light {

    position: absolute;

    top: -85px;
    right: 20px;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.18) 0%,
            rgba(255,255,255,0.06) 35%,
            transparent 72%
        );

    pointer-events: none;
}


.header::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,0.35) 45%,
            rgba(255,255,255,0.28) 72%,
            transparent 100%
        );

    pointer-events: none;
}


/* =====================================================
   MAIN
===================================================== */

main {

    min-height: 100vh;

    padding-top: 72px;

    padding-bottom: 20px;
}


.player-page {

    width: 100%;

    padding:
        24px 18px 30px;
}


/* =====================================================
   TITLE
===================================================== */

.player-title {

    font-size: 26px;

    font-weight: 800;

    letter-spacing: .5px;

    margin-bottom: 5px;
}


.player-subtitle {

    color:
        var(--muted);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .7px;

    margin-bottom: 25px;
}


/* =====================================================
   POSITION GROUP
===================================================== */

.position-group {

    margin-bottom: 25px;
}


.position-title {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 9px;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,0.70);
}


.position-title::after {

    content: "";

    flex: 1;

    height: 1px;

    background:
        rgba(255,255,255,0.08);
}


/* =====================================================
   PLAYER LIST
===================================================== */

.player-list {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


/* =====================================================
   PLAYER CARD
===================================================== */

.player-card {

    position: relative;

    width: 100%;

    min-height: 76px;

    display: flex;

    align-items: center;

    padding:
        11px 15px 11px 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.022)
        );

    border:
        1px solid
        rgba(255,255,255,0.075);

    border-radius: 14px;

    overflow: hidden;

    transition:
        transform .15s ease,
        background .15s ease;
}


.player-card:active {

    transform:
        scale(.98);

    background:
        rgba(227,25,55,0.10);
}


/* =====================================================
   STATUS LINE
===================================================== */

.player-card::after {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    bottom: 0;

    width: 4px;

    background:
        var(--red);

    opacity: .95;
}


/* ACTIVE */

.player-card.active::after {

    background:
        var(--red);
}


/* IL */

.player-card.il::after {

    background:
        var(--yellow);
}


/* 26-MAN OUT */

.player-card.outside::after {

    background:
        var(--gray);
}


/* =====================================================
   NUMBER
===================================================== */

.player-number {

    position: relative;

    width: 58px;

    flex-shrink: 0;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

    font-size: 31px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: -1.5px;

    color:
        rgba(255,255,255,0.30);

    text-align: left;

    transform:
        scaleX(.88);

    transform-origin:
        left center;
}


.player-number::before {

    content: "#";

    position: absolute;

    left: -2px;

    top: -8px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 9px;

    font-weight: 800;

    color:
        rgba(227,25,55,0.75);
}


/* =====================================================
   B/T
===================================================== */

.player-bt {

    width: 55px;

    flex-shrink: 0;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .4px;

    color:
        rgba(255,255,255,0.62);
}


/* =====================================================
   POSITION
===================================================== */

.player-pos {

    width: 43px;

    flex-shrink: 0;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: .4px;

    color:
        var(--red);
}


/* =====================================================
   PLAYER NAME
===================================================== */

.player-name {

    flex: 1;

    min-width: 0;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: .15px;

    color:
        var(--white);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   STATUS LABEL
===================================================== */

.player-status {

    margin-left: 8px;

    flex-shrink: 0;

    font-size: 8px;

    font-weight: 800;

    letter-spacing: .5px;

    padding:
        4px 6px;

    border-radius: 5px;

    background:
        rgba(255,255,255,0.06);

    color:
        rgba(255,255,255,0.55);
}


.player-card.active .player-status {

    color:
        var(--red);
}


.player-card.il .player-status {

    color:
        var(--yellow);
}


.player-card.outside .player-status {

    color:
        #94a3b8;
}


/* =====================================================
   EMPTY / ERROR
===================================================== */

.message {

    padding:
        35px 20px;

    text-align: center;

    color:
        var(--muted);

    font-size: 13px;

    line-height: 1.7;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 200;

    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    padding:
        7px 5px
        env(safe-area-inset-bottom);

    display: flex;

    align-items: flex-start;

    justify-content:
        space-between;

    background:
        rgba(5,16,34,0.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}


/* =====================================================
   NAV ITEM
===================================================== */

.nav-item {

    flex: 1;

    min-width: 0;

    height: 60px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    text-decoration: none;

    color:
        var(--muted);

    border-radius: 13px;

    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}


.nav-item:active {

    transform:
        scale(.94);
}


.nav-icon {

    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    font-weight: 700;
}


.nav-label {

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .45px;

    white-space: nowrap;
}


.nav-item.active {

    color:
        var(--white);

    background:
        rgba(227,25,55,0.13);
}


.nav-item.active .nav-icon {

    color:
        var(--red);
}


/* =====================================================
   SMALL IPHONE
===================================================== */

@media (max-width: 360px) {

    .header {
        height: 68px;
    }

    main {
        padding-top: 68px;
    }

    .player-page {
        padding-left: 15px;
        padding-right: 15px;
    }

    .player-number {
        width: 50px;
        font-size: 28px;
    }

    .player-bt {
        width: 45px;
    }

    .player-pos {
        width: 36px;
    }

    .player-name {
        font-size: 14px;
    }

    .player-status {
        display: none;
    }

    .nav-label {
        font-size: 9px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-navy-shape"></div>

    <div class="header-line-one"></div>

    <div class="header-line-two"></div>

    <div class="header-light"></div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

<section class="player-page">

    <h1 class="player-title">
        Players
    </h1>

    <p class="player-subtitle">
        PHILADELPHIA PHILLIES
    </p>

    <div id="player-container">

        <div class="message">
            Loading players...
        </div>

    </div>

</section>

</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">


    <a href="schedule.html"
       class="nav-item">

        <div class="nav-icon">
            ▣
        </div>

        <div class="nav-label">
            SCHEDULE
        </div>

    </a>


    <a href="score.html"
       class="nav-item">

        <div class="nav-icon">
            ●
        </div>

        <div class="nav-label">
            SCORE
        </div>

    </a>


    <a href="index.html"
       class="nav-item">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            HOME
        </div>

    </a>


    <a href="player.html"
       class="nav-item active">

        <div class="nav-icon">
            ♟
        </div>

        <div class="nav-label">
            PLAYER
        </div>

    </a>


    <a href="stats.html"
       class="nav-item">

        <div class="nav-icon">
            ▥
        </div>

        <div class="nav-label">
            STATS
        </div>

    </a>

</nav>


<script>

/* =====================================================
   PLAYER DATA
===================================================== */

const container =
    document.getElementById(
        "player-container"
    );


/* =====================================================
   POSITION GROUP
===================================================== */

function getPositionGroup(player) {

    const position =
        (player.position || "")
        .toUpperCase();

    const positionName =
        (player.positionName || "")
        .toLowerCase();


    /*
       投手
    */

    if (
        position === "P" ||
        position === "SP" ||
        position === "RP" ||
        position === "RHP" ||
        position === "LHP" ||
        positionName.includes("pitcher")
    ) {

        return {
            key: "pitcher",
            label: "PITCHERS",
            order: 1
        };

    }


    /*
       捕手
    */

    if (
        position === "C" ||
        positionName.includes("catcher")
    ) {

        return {
            key: "catcher",
            label: "CATCHERS",
            order: 2
        };

    }


    /*
       内野手
    */

    if (
        [
            "1B",
            "2B",
            "3B",
            "SS"
        ].includes(position) ||

        positionName.includes("first baseman") ||
        positionName.includes("second baseman") ||
        positionName.includes("third baseman") ||
        positionName.includes("shortstop") ||
        positionName.includes("infielder")
    ) {

        return {
            key: "infielder",
            label: "INFIELDERS",
            order: 3
        };

    }


    /*
       外野手
    */

    if (
        [
            "LF",
            "CF",
            "RF",
            "OF"
        ].includes(position) ||

        positionName.includes("outfielder")
    ) {

        return {
            key: "outfielder",
            label: "OUTFIELDERS",
            order: 4
        };

    }


    /*
       指名打者
    */

    if (
        position === "DH" ||
        positionName.includes("designated")
    ) {

        return {
            key: "dh",
            label: "DESIGNATED HITTERS",
            order: 5
        };

    }


    /*
       判定できない場合
    */

    return {
        key: "other",
        label: "OTHER",
        order: 6
    };

}


/* =====================================================
   JERSEY NUMBER SORT
===================================================== */

function jerseyNumber(player) {

    const number =
        parseInt(
            player.number,
            10
        );

    if (
        Number.isNaN(number)
    ) {

        return 999;

    }

    return number;

}


/* =====================================================
   CREATE PLAYER CARD
===================================================== */

function createPlayerCard(player) {

    const group =
        getPositionGroup(player);


    const card =
        document.createElement("div");


    card.className =
        "player-card";


    /*
       STATUS
    */

    let statusClass =
        "outside";

    let statusLabel =
        "40-MAN";


    if (
        player.status === "IL" ||
        player.il === true
    ) {

        statusClass =
            "il";

        statusLabel =
            "IL";

    }

    else if (
        player.activeRoster === true ||
        player.twentySixMan === true ||
        player.status === "ACTIVE"
    ) {

        statusClass =
            "active";

        statusLabel =
            "ACTIVE";

    }


    card.classList.add(
        statusClass
    );


    /*
       NUMBER
    */

    const number =
        document.createElement(
            "div"
        );

    number.className =
        "player-number";

    number.textContent =
        player.number || "--";


    /*
       B/T
    */

    const bt =
        document.createElement(
            "div"
        );

    bt.className =
        "player-bt";

    bt.textContent =
        player.bt || "--";


    /*
       POSITION
    */

    const position =
        document.createElement(
            "div"
        );

    position.className =
        "player-pos";

    position.textContent =
        player.position || "--";


    /*
       NAME
    */

    const name =
        document.createElement(
            "div"
        );

    name.className =
        "player-name";

    name.textContent =
        player.name || "Unknown";


    /*
       STATUS
    */

    const status =
        document.createElement(
            "div"
        );

    status.className =
        "player-status";

    status.textContent =
        statusLabel;


    card.appendChild(
        number
    );

    card.appendChild(
        bt
    );

    card.appendChild(
        position
    );

    card.appendChild(
        name
    );

    card.appendChild(
        status
    );


    return {
        card,
        group
    };

}


/* =====================================================
   LOAD ROSTER
===================================================== */

async function loadRoster() {

    try {

        const response =
            await fetch(
                "data/roster.json?ts=" +
                Date.now()
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Roster data could not be loaded."
            );

        }


        const data =
            await response.json();


        const players =
            Array.isArray(
                data.players
            )
                ? data.players
                : [];


        if (
            players.length === 0
        ) {

            container.innerHTML =
                `
                <div class="message">
                    No player data found.
                </div>
                `;

            return;

        }


        /*
           グループ化
        */

        const groups =
            {};


        players.forEach(
            player => {

                const group =
                    getPositionGroup(
                        player
                    );


                if (
                    !groups[group.key]
                ) {

                    groups[group.key] = {

                        key:
                            group.key,

                        label:
                            group.label,

                        order:
                            group.order,

                        players:
                            []

                    };

                }


                groups[group.key]
                    .players
                    .push(player);

            }
        );


        /*
           グループ順
        */

        const sortedGroups =
            Object.values(
                groups
            ).sort(
                (a, b) =>
                    a.order - b.order
            );


        container.innerHTML =
            "";


        /*
           各ポジション
        */

        sortedGroups.forEach(
            group => {


                /*
                   背番号順
                */

                group.players.sort(
                    (a, b) => {

                        const numberA =
                            jerseyNumber(a);

                        const numberB =
                            jerseyNumber(b);


                        if (
                            numberA !== numberB
                        ) {

                            return (
                                numberA -
                                numberB
                            );

                        }


                        return (
                            (a.name || "")
                            .localeCompare(
                                b.name || ""
                            )
                        );

                    }
                );


                /*
                   GROUP
                */

                const groupElement =
                    document.createElement(
                        "section"
                    );


                groupElement.className =
                    "position-group";


                /*
                   TITLE
                */

                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "position-title";


                title.textContent =
                    group.label;


                groupElement.appendChild(
                    title
                );


                /*
                   LIST
                */

                const list =
                    document.createElement(
                        "div"
                    );


                list.className =
                    "player-list";


                group.players.forEach(
                    player => {

                        const result =
                            createPlayerCard(
                                player
                            );


                        list.appendChild(
                            result.card
                        );

                    }
                );


                groupElement.appendChild(
                    list
                );


                container.appendChild(
                    groupElement
                );

            }
        );


    }

    catch (error) {

        console.error(
            error
        );


        container.innerHTML =
            `
            <div class="message">
                Player data could not be loaded.<br>
                Please try again later.
            </div>
            `;

    }

}


/* =====================================================
   START
===================================================== */

loadRoster();

</script>


</body>

</html>
