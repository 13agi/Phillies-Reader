<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player | Phillies</title>
<style>
:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --red: #e31837;
    --red-dark: #c20f30;
    --red-deep: #970a24;
    --white: #ffffff;
    --gray: #718298;
    --gray-light: #aab6c5;
    --yellow: #f5c542;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   HEADER
   既存UIをそのまま維持
========================================================= */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 84px;
    overflow: hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
.header-field {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 250px;
    height: 250px;
    transform:
        translate(-50%, -50%)
        rotate(45deg);
    border:
        1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
    opacity: .8;
}
.header-field::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 175px;
    height: 175px;
    transform:
        translate(-50%, -50%);
    border:
        1px solid rgba(255,255,255,.09);
}
.header-field::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -30px;
    width: 1px;
    height: 310px;
    transform:
        translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
.header-left {
    position: absolute;
    left: -14%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right {
    position: absolute;
    right: -13%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
.header-highlight {
    position: absolute;
    left: -10%;
    top: 0;
    width: 120%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
.header-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
    opacity: .85;
}
.header-base {
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 24px;
    height: 20px;
    transform:
        translateX(-50%);
    border:
        1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
    opacity: .75;
}
/* =========================================================
   PLAYER
========================================================= */
main {
    width: 100%;
    min-height:
        calc(100vh - 162px);
    padding:
        18px 13px 30px;
}
.player-list {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}
/* =========================================================
   TITLE
========================================================= */
.player-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin:
        2px 3px 14px;
}
.player-heading-main {
    color: rgba(255,255,255,.94);
    font-size: 11px;
    font-weight: 950;
    letter-spacing: 1.6px;
}
.player-heading-sub {
    color: rgba(255,255,255,.30);
    font-size: 7px;
    font-weight: 850;
    letter-spacing: 1px;
}
/* =========================================================
   PLAYER CARD
========================================================= */
.player-card {
    position: relative;
    display: grid;
    grid-template-columns:
        84px minmax(0,1fr) 82px;
    min-height: 104px;
    margin-bottom: 10px;
    overflow: hidden;
    background:
        linear-gradient(
            135deg,
            rgba(18,40,68,.98),
            rgba(7,24,46,.98)
        );
    border:
        1px solid rgba(255,255,255,.075);
    border-radius: 17px;
    box-shadow:
        0 9px 25px rgba(0,0,0,.25);
    transition:
        transform .15s ease,
        border-color .15s ease;
}
.player-card:active {
    transform:
        scale(.985);
}
/* 左端のステータスライン */
.player-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background:
        var(--red);
    z-index: 5;
}
.player-card.il::before {
    background:
        var(--yellow);
}
.player-card.minors::before {
    background:
        #66778c;
}
/* 背景に薄く背番号 */
.player-card::after {
    content: attr(data-number);
    position: absolute;
    right: 70px;
    bottom: -30px;
    color:
        rgba(255,255,255,.018);
    font-size: 145px;
    line-height: 1;
    font-weight: 950;
    letter-spacing:
        -10px;
    pointer-events: none;
    z-index: 0;
}
/* =========================================================
   NUMBER
========================================================= */
.player-number {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    color:
        rgba(255,255,255,.96);
    font-size: 42px;
    line-height: 1;
    font-weight: 950;
    letter-spacing:
        -3px;
    font-variant-numeric:
        tabular-nums;
}
.player-number::before {
    content: "#";
    margin-right: 2px;
    color:
        rgba(255,255,255,.32);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0;
    align-self: flex-start;
    margin-top: 30px;
}
/* =========================================================
   MAIN INFO
========================================================= */
.player-info {
    position: relative;
    z-index: 3;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding:
        14px 8px;
}
.player-label {
    margin-bottom: 5px;
    color:
        rgba(255,255,255,.30);
    font-size: 6px;
    font-weight: 900;
    letter-spacing:
        1.5px;
}
.player-name {
    overflow: hidden;
    color:
        var(--white);
    font-size: 18px;
    line-height: 1.15;
    font-weight: 900;
    letter-spacing:
        -.25px;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.player-meta {
    display: flex;
    align-items: center;
    margin-top: 10px;
    min-width: 0;
    color:
        var(--gray-light);
    font-size: 9px;
    font-weight: 800;
    letter-spacing:
        .55px;
}
.player-position {
    color:
        rgba(255,255,255,.88);
    font-size: 10px;
    font-weight: 950;
}
.meta-dot {
    width: 3px;
    height: 3px;
    margin:
        0 8px;
    border-radius: 50%;
    background:
        rgba(255,255,255,.30);
}
.player-bt {
    color:
        var(--gray-light);
    font-size: 9px;
    font-weight: 850;
    letter-spacing:
        .5px;
}
/* =========================================================
   STATUS
========================================================= */
.player-status {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
        0 8px;
}
.status-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}
.status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background:
        var(--red);
    box-shadow:
        0 0 9px
        rgba(227,24,55,.65);
}
.player-card.il .status-dot {
    background:
        var(--yellow);
    box-shadow:
        0 0 9px
        rgba(245,197,66,.55);
}
.player-card.minors .status-dot {
    background:
        #718298;
    box-shadow:
        none;
}
.status {
    min-width: 65px;
    height: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
        0 7px;
    border-radius: 7px;
    font-size: 6.5px;
    font-weight: 950;
    letter-spacing:
        .75px;
    white-space: nowrap;
}
.status-active {
    color:
        #ff6680;
    background:
        rgba(227,24,55,.10);
    border:
        1px solid rgba(227,24,55,.28);
}
.status-il {
    color:
        var(--yellow);
    background:
        rgba(245,197,66,.09);
    border:
        1px solid rgba(245,197,66,.30);
}
.status-40 {
    color:
        #9aa9ba;
    background:
        rgba(113,130,152,.09);
    border:
        1px solid rgba(113,130,152,.22);
}
/* =========================================================
   BOTTOM NAV
   既存UIをそのまま維持
========================================================= */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2000;
    height: 78px;
    background:
        rgba(5,20,39,.98);
    border-top:
        1px solid rgba(255,255,255,.08);
    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);
    backdrop-filter:
        blur(16px);
}
.bottom-inner {
    width: 100%;
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns:
        repeat(5, 1fr);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color:
        var(--gray);
    text-decoration: none;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .65px;
    -webkit-tap-highlight-color:
        transparent;
}
.nav-icon {
    width: 31px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
}
.nav-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke:
        currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.nav-item.active {
    color:
        var(--red);
}
.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}
/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 380px) {
    .header {
        height: 78px;
    }
    main {
        padding:
            15px 9px 25px;
    }
    .player-card {
        grid-template-columns:
            70px minmax(0,1fr) 73px;
        min-height: 96px;
        border-radius: 15px;
    }
    .player-number {
        font-size: 36px;
    }
    .player-number::before {
        font-size: 10px;
        margin-top: 27px;
    }
    .player-info {
        padding:
            13px 5px;
    }
    .player-name {
        font-size: 15px;
    }
    .player-meta {
        margin-top: 8px;
    }
    .player-status {
        padding:
            0 5px;
    }
    .status {
        min-width: 59px;
        height: 22px;
        font-size: 6px;
    }
    .nav-item {
        font-size: 7px;
    }
    .nav-icon {
        width: 29px;
        height: 29px;
    }
    .nav-icon svg {
        width: 19px;
        height: 19px;
    }
}
</style>
</head>
