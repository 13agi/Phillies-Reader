<!DOCTYPE html>

<head>

<title>Player | Phillies</title>

<style>

/* =========================================================
   GLOBAL
   ※既存UI
========================================================= */

:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --red: #e31837;
    --white: #ffffff;
    --gray: #718298;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}

body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
}


/* =========================================================
   HEADER
   ※既存UIそのまま
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 84px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );

    box-shadow:
        0 9px 32px
        rgba(0,0,0,.42);
}

.header-field {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 250px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
}

.header-field::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 175px;
    height: 175px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(255,255,255,.09);
}

.header-field::after {
    content: "";

    position: absolute;

    left: 50%;
    top: -30px;

    width: 1px;
    height: 310px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}

.header-left {
    position: absolute;

    left: -14%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform: skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}

.header-right {
    position: absolute;

    right: -13%;
    top: -60%;

    width: 47%;
    height: 220%;

    transform: skewX(-22deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}

.header-highlight {
    position: absolute;

    left: -10%;
    top: 0;

    width: 120%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}

.header-edge {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
}

.header-base {
    position: absolute;

    left: 50%;
    bottom: 9px;

    width: 24px;
    height: 20px;

    transform:
        translateX(-50%);

    border:
        1px solid
        rgba(255,255,255,.22);

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
}


/* =========================================================
   PLAYER
   ※ここから今回全面変更
========================================================= */

.player-page {

    width: 100%;

    max-width: 760px;

    margin: 0 auto;

    padding:
        8px
        12px
        34px;

}


/* =========================================================
   ROSTER
========================================================= */

.roster {

    width: 100%;

}


/* =========================================================
   PLAYER CARD
   角丸カードではなくロスター・プレート
========================================================= */

.player-card {

    --player-accent:
        rgba(255,255,255,.20);

    position: relative;

    display: grid;

    grid-template-columns:
        67px
        44px
        47px
        minmax(0,1fr);

    width: 100%;

    min-height: 82px;

    border-bottom:
        1px solid
        rgba(255,255,255,.065);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.018),
            transparent 72%
        );

    transition:
        background .18s ease;

}


/*
   左側の細いアクセント。
   ACTIVEを大きく表示するためではなく、
   選手カードの起点として使用。
*/

.player-card::before {

    content: "";

    position: absolute;

    left: 0;

    top: 14px;

    bottom: 14px;

    width: 2px;

    background:
        var(--player-accent);

}


/* =========================================================
   ACTIVE
========================================================= */

.player-card--active {

    --player-accent:
        var(--red);

}


/* =========================================================
   IL
========================================================= */

.player-card--il {

    --player-accent:
        #f0c84b;

}


/* =========================================================
   NUMBER
   背番号専用の凝縮系タイポグラフィ
========================================================= */

.player-number {

    display: flex;

    align-items: center;

    justify-content: center;

    padding-left: 3px;

}


.player-number span {

    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 32px;

    line-height: .86;

    font-weight: 800;

    letter-spacing:
        -2.1px;

    font-variant-numeric:
        tabular-nums;

    color:
        rgba(255,255,255,.92);

}


/* =========================================================
   POSITION
========================================================= */

.player-position {

    display: flex;

    align-items: center;

    justify-content: center;

}


.player-position span {

    font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 9px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        .15px;

    color:
        rgba(255,255,255,.48);

}


/* =========================================================
   B/T
========================================================= */

.player-bt {

    display: flex;

    align-items: center;

    justify-content: center;

}


.player-bt span {

    font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 8px;

    line-height: 1;

    font-weight: 700;

    letter-spacing:
        .2px;

    color:
        rgba(255,255,255,.27);

}


/* =========================================================
   PLAYER IDENTITY
========================================================= */

.player-identity {

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding:
        0
        9px
        0
        7px;

}


/* =========================================================
   NAME
   背番号とは別の字体・ウェイト
========================================================= */

.player-name {

    display: block;

    width: 100%;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 17px;

    line-height: 20px;

    font-weight: 650;

    letter-spacing:
        -.42px;

    color:
        rgba(255,255,255,.95);

}


/* =========================================================
   STATUS
   正式名称は一切表示しない
========================================================= */

.player-status {

    display: flex;

    align-items: center;

    min-height: 8px;

    margin-top: 6px;

}


.player-status span {

    font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 6px;

    line-height: 1;

    font-weight: 800;

    letter-spacing:
        .65px;

    color:
        var(--player-accent);

}


/* ACTIVEだけ小さなインジケーター */

.player-card--active
.player-status span::before {

    content: "";

    display: inline-block;

    width: 4px;

    height: 4px;

    margin-right: 5px;

    vertical-align: 1px;

    border-radius: 50%;

    background:
        var(--player-accent);

}


/* ILはドットなし */

.player-card--il
.player-status span {

    color:
        #f0c84b;

}


/* =========================================================
   BOTTOM NAV
   ※既存UIそのまま
========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    height: 78px;

    background:
        rgba(5,20,39,.98);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 -10px 28px
        rgba(0,0,0,.32);

    backdrop-filter:
        blur(16px);
}

.bottom-inner {

    width: 100%;

    max-width: 760px;

    height: 100%;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);
}

.nav-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    color:
        var(--gray);

    text-decoration: none;

    font-size: 8px;

    font-weight: 800;

    letter-spacing:
        .65px;
}

.nav-icon {

    width: 31px;

    height: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;
}

.nav-icon svg {

    width: 20px;

    height: 20px;

    fill: none;

    stroke:
        currentColor;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}

.nav-item.active {

    color:
        var(--red);
}

.nav-item.active .nav-icon {

    background:
        rgba(227,24,55,.14);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 390px) {

    .player-page {

        padding-left: 9px;

        padding-right: 9px;

    }


    .player-card {

        grid-template-columns:
            58px
            39px
            40px
            minmax(0,1fr);

        min-height:
            78px;

    }


    .player-number span {

        font-size:
            29px;

        letter-spacing:
            -1.9px;

    }


    .player-name {

        font-size:
            16px;

        letter-spacing:
            -.35px;

    }

}


@media (max-width: 340px) {

    .player-card {

        grid-template-columns:
            51px
            35px
            38px
            minmax(0,1fr);

    }


    .player-number span {

        font-size:
            27px;

    }


    .player-name {

        font-size:
            15px;

    }

}
