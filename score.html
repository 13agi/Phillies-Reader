<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">
<title>SCORE | PHILLIES</title>
<style>
:root {
    --navy: #07152b;
    --navy-light: #0b1c38;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
    --gray: #94a3b8;
    --green: #38b27d;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =====================================================
   HEADER
===================================================== */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    overflow: hidden;
    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );
    box-shadow:
        0 7px 22px
        rgba(0,0,0,0.30);
}
.header::before {
    content: "";
    position: absolute;
    top: -150px;
    right: -65px;
    width: 330px;
    height: 330px;
    transform:
        rotate(27deg);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.015)
        );
    border-left:
        1px solid
        rgba(255,255,255,0.14);
}
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,0.35) 45%,
            rgba(255,255,255,0.28) 72%,
            transparent 100%
        );
}
/* =====================================================
   MAIN
===================================================== */
main {
    min-height: 100vh;
    padding-top: 72px;
    padding-bottom: 20px;
}
.score-page {
    width: 100%;
    padding:
        22px 16px 30px;
}
/* =====================================================
   TITLE
===================================================== */
.page-title {
    font-size: 31px;
    font-weight: 800;
    line-height: .95;
    letter-spacing: -.5px;
    color: var(--white);
    margin-bottom: 6px;
}
.page-subtitle {
    color:
        rgba(255,255,255,.38);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.4px;
    margin-bottom: 22px;
}
/* =====================================================
   DATE SELECTOR
===================================================== */
.date-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
}
.date-arrow {
    width: 38px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border:
        1px solid
        rgba(255,255,255,.07);
    border-radius: 11px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.55);
    font-size: 18px;
}
.date-current {
    flex: 1;
    height: 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border:
        1px solid
        rgba(255,255,255,.075);
    border-radius: 11px;
    background:
        rgba(255,255,255,.045);
}
.date-day {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .5px;
}
.date-label {
    margin-top: 2px;
    font-size: 7px;
    font-weight: 800;
    letter-spacing: 1px;
    color:
        rgba(255,255,255,.35);
}
/* =====================================================
   SCORE CARD
===================================================== */
.score-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
/* =====================================================
   GAME CARD
===================================================== */
.game-card {
    position: relative;
    width: 100%;
    overflow: hidden;
    border:
        1px solid
        rgba(255,255,255,.075);
    border-radius: 16px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.022)
        );
    box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);
}
/* =====================================================
   GAME STATUS
===================================================== */
.game-status {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding:
        0 13px;
    border-bottom:
        1px solid
        rgba(255,255,255,.055);
}
.game-status-left {
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1px;
    color:
        rgba(255,255,255,.42);
}
.status-live {
    color: var(--red);
}
.status-final {
    color: var(--gray);
}
/* =====================================================
   TEAMS
===================================================== */
.teams {
    padding:
        17px 15px 15px;
}
.team-row {
    min-height: 47px;
    display: flex;
    align-items: center;
}
.team-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
}
.team-code {
    width: 42px;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 900;
    color:
        rgba(255,255,255,.38);
    text-align: right;
}
.team-score {
    width: 45px;
    flex-shrink: 0;
    font-size: 25px;
    font-weight: 900;
    line-height: 1;
    text-align: right;
}
.team-row.phillies
.team-name {
    color: var(--white);
}
.team-row.phillies
.team-score {
    color: var(--red);
}
/* =====================================================
   DIVIDER
===================================================== */
.team-divider {
    height: 1px;
    margin:
        0 0;
    background:
        rgba(255,255,255,.055);
}
/* =====================================================
   GAME INFO
===================================================== */
.game-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding:
        11px 15px;
    border-top:
        1px solid
        rgba(255,255,255,.055);
    background:
        rgba(0,0,0,.08);
}
.game-info-item {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .5px;
    color:
        rgba(255,255,255,.38);
}
.game-info-value {
    color:
        rgba(255,255,255,.72);
}
/* =====================================================
   EMPTY / LOADING
===================================================== */
.empty-state {
    padding:
        50px 20px;
    text-align: center;
    color:
        rgba(255,255,255,.32);
    font-size: 12px;
    line-height: 1.7;
}
/* =====================================================
   BOTTOM NAV
===================================================== */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 200;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 5px
        env(safe-area-inset-bottom);
    display: flex;
    align-items: flex-start;
    justify-content:
        space-between;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
.nav-item {
    flex: 1;
    min-width: 0;
    max-width: 100px;
    height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    color: var(--muted);
    border-radius: 13px;
}
.nav-item:active {
    transform:
        scale(.94);
}
.nav-icon {
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
}
.nav-label {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: .45px;
    white-space: nowrap;
}
.nav-item.active {
    color: var(--white);
    background:
        rgba(227,25,55,.13);
}
.nav-item.active
.nav-icon {
    color: var(--red);
}
/* =====================================================
   SMALL IPHONE
===================================================== */
@media (max-width: 360px) {
    .score-page {
        padding-left: 13px;
        padding-right: 13px;
    }
    .page-title {
        font-size: 29px;
    }
    .team-name {
        font-size: 14px;
    }
    .team-score {
        font-size: 23px;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     HEADER
===================================================== -->
<header class="header"></header>
<!-- =====================================================
     MAIN
===================================================== -->
<main>
<section class="score-page">
    <h1 class="page-title">
        Score
    </h1>
    <p class="page-subtitle">
        PHILADELPHIA PHILLIES
    </p>
    <!-- =================================================
         DATE SELECTOR
    ================================================== -->
    <div class="date-selector">
        <div class="date-arrow">
            ‹
        </div>
        <div class="date-current">
            <div class="date-day">
                TODAY
            </div>
            <div class="date-label">

    <!-- =================================================

    ================================================== -->
    <div class="score-list">

        <article class="game-card">

            </div>
            <div class="teams">

                    </div>

                </div>
                <div class="team-divider"></div>
                <div class="team-row">
                    <div class="team-name">
                        Opponent
                    </div>
                    <div class="team-code">
                        OPP
                    </div>
                    <div class="team-score">
                        3
                    </div>
                </div>
            </div>
            <div class="game-info">
                <div class="game-info-item">
                    WIN
                </div>
                <div class="game-info-item">
                    <span class="game-info-value">
                        2:05 PM
                    </span>
                </div>
                <div class="game-info-item">
                    <span class="game-info-value">
                        PHI
                    </span>
                </div>
            </div>
        </article>
        <!-- GAME 2 -->
        <article class="game-card">
            <div class="game-status">
                <div class="game-status-left status-live">
                    LIVE · 6TH
                </div>
                <div class="game-status-left">
                    GAME 2
                </div>
            </div>
            <div class="teams">
                <div class="team-row phillies">
                    <div class="team-name">
                        Philadelphia Phillies
                    </div>
                    <div class="team-code">
                        PHI
                    </div>
                    <div class="team-score">
                        2
                    </div>
                </div>
                <div class="team-divider"></div>
                <div class="team-row">
                    <div class="team-name">
                        Opponent
                    </div>
                    <div class="team-code">
                        OPP
                    </div>
                    <div class="team-score">
                        2
                    </div>
                </div>
            </div>
            <div class="game-info">
                <div class="game-info-item">
                    LIVE
                </div>
                <div class="game-info-item">
                    <span class="game-info-value">
                        6TH INNING
                    </span>
                </div>
                <div class="game-info-item">
                    <span class="game-info-value">
                        PHI
                    </span>
                </div>
            </div>
        </article>
        <!-- EMPTY EXAMPLE -->
        <div class="empty-state">
            Score data will appear here.
        </div>
    </div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
===================================================== -->
<nav class="bottom-nav">
    <a
        href="schedule.html"
        class="nav-item">
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
    <a
        href="score.html"
        class="nav-item active">
        <div class="nav-icon">
            ●
        </div>
        <div class="nav-label">
            SCORE
        </div>
    </a>
    <a
        href="index.html"
        class="nav-item">
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <a
        href="player.html"
        class="nav-item">
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <a
        href="stats.html"
        class="nav-item">
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
</nav>
</body>
</html>
