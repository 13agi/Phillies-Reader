<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Score | Phillies Reader</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --navy: #07152b;
    --navy-2: #0b1d38;
    --navy-3: #102542;

    --red: #e31937;
    --red-dark: #b90f2e;

    --white: #ffffff;
    --text: rgba(255,255,255,.82);
    --muted: #718096;

    --line: rgba(255,255,255,.075);
    --line-strong: rgba(255,255,255,.12);
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;

    background: var(--navy);
}

body {
    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    padding-bottom:
        calc(82px + env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    height: 72px;

    overflow: hidden;

    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );

    box-shadow:
        0 7px 22px rgba(0,0,0,.30);
}

.header::before {
    content: "";

    position: absolute;

    top: -120px;
    right: -55px;

    width: 300px;
    height: 300px;

    transform: rotate(27deg);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.015)
        );

    border-left:
        1px solid rgba(255,255,255,.16);
}

.header::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,.35) 45%,
            rgba(255,255,255,.28) 72%,
            transparent 100%
        );
}

.header-shape {
    position: absolute;

    top: -20px;
    left: 43%;

    width: 130px;
    height: 130px;

    transform: rotate(25deg);

    background:
        rgba(7,21,43,.16);
}

.header-line {
    position: absolute;

    left: -20px;
    bottom: 14px;

    width: 55%;
    height: 2px;

    transform: skewX(-35deg);

    background:
        rgba(255,255,255,.34);
}


/* =========================================================
   MAIN
========================================================= */

main {
    min-height: 100vh;

    padding-top: 72px;
}

.page {
    width: 100%;

    padding:
        21px 14px 35px;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.page-heading {
    margin-bottom: 17px;
}

.page-heading h1 {
    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 31px;
    font-weight: 900;

    line-height: .95;

    letter-spacing: -.4px;
}

.page-heading p {
    margin-top: 6px;

    color: var(--muted);

    font-size: 9px;
    font-weight: 800;

    letter-spacing: 1.5px;
}


/* =========================================================
   DATE SELECTOR
========================================================= */

.date-selector {
    width: 100%;
    height: 59px;

    display: flex;
    align-items: center;

    padding: 0 7px;

    margin-bottom: 18px;

    border:
        1px solid var(--line);

    border-radius: 15px;

    background:
        rgba(255,255,255,.035);
}

.date-button {
    width: 43px;
    height: 43px;

    flex-shrink: 0;

    border: 0;
    border-radius: 11px;

    background:
        rgba(255,255,255,.035);

    color:
        rgba(255,255,255,.72);

    font-size: 26px;

    line-height: 1;
}

.date-center {
    flex: 1;

    text-align: center;
}

.date-main {
    display: block;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 20px;
    font-weight: 800;

    letter-spacing: .7px;
}

.date-sub {
    display: block;

    margin-top: 2px;

    color: var(--muted);

    font-size: 8px;
    font-weight: 800;

    letter-spacing: 1.3px;
}


/* =========================================================
   GAME CARD
========================================================= */

.game-card {
    position: relative;

    width: 100%;

    overflow: hidden;

    margin-bottom: 20px;

    border:
        1px solid var(--line);

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 9px 26px rgba(0,0,0,.15);
}

.game-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 4px;

    background:
        var(--red);
}


/* =========================================================
   GAME STATUS
========================================================= */

.game-top {
    display: flex;

    justify-content: flex-end;
    align-items: center;

    min-height: 36px;

    padding:
        9px 14px 2px 16px;
}

.game-status {
    padding:
        4px 8px;

    border-radius: 6px;

    background:
        rgba(227,25,55,.10);

    color:
        var(--red);

    font-size: 7px;
    font-weight: 900;

    letter-spacing: .8px;
}


/* =========================================================
   MATCHUP
========================================================= */

.matchup {
    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: center;

    gap: 10px;

    padding:
        7px 16px 15px;
}

.team {
    min-width: 0;
}

.team.away {
    text-align: left;
}

.team.home {
    text-align: right;
}

.team-code {
    display: block;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 28px;
    font-weight: 900;

    line-height: .95;
}

.team-name {
    display: block;

    margin-top: 4px;

    color: var(--muted);

    font-size: 8px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   SCORE
========================================================= */

.score {
    min-width: 70px;

    text-align: center;
}

.score-numbers {
    display: flex;

    justify-content: center;
    align-items: center;
}

.score-main {
    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 30px;
    font-weight: 900;

    line-height: 1;
}

.score-divider {
    margin:
        0 4px;

    color:
        rgba(255,255,255,.22);

    font-size: 13px;
}

.result {
    display: block;

    margin-top: 5px;

    color: var(--red);

    font-size: 8px;
    font-weight: 900;

    letter-spacing: 1px;
}


/* =========================================================
   VENUE
========================================================= */

.venue {
    display: flex;

    align-items: center;

    gap: 9px;

    padding:
        10px 16px 13px;

    border-top:
        1px solid rgba(255,255,255,.045);
}

.venue-icon {
    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 7px;

    background:
        rgba(255,255,255,.04);

    color:
        var(--red);

    font-size: 10px;
}

.venue-name {
    display: block;

    font-size: 10px;
    font-weight: 800;
}

.venue-location {
    display: block;

    margin-top: 2px;

    color: var(--muted);

    font-size: 8px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.score-section {
    margin-top: 22px;
}

.section-title {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 9px;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 13px;
    font-weight: 900;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,.72);
}

.section-title::after {
    content: "";

    flex: 1;

    height: 1px;

    background:
        rgba(255,255,255,.08);
}


/* =========================================================
   DETAIL CARD
========================================================= */

.detail-card {
    width: 100%;

    overflow: hidden;

    border:
        1px solid var(--line);

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );
}


/* =========================================================
   INNING SCORE
========================================================= */

.table-scroll {
    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}

.inning-table {
    width: 100%;

    min-width: 350px;

    border-collapse: collapse;
}

.inning-table th,
.inning-table td {
    height: 34px;

    padding:
        0 5px;

    text-align: center;

    white-space: nowrap;

    font-size: 8px;
    font-weight: 700;
}

.inning-table th {
    color:
        rgba(255,255,255,.30);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 8px;
    font-weight: 800;
}

.inning-table td {
    border-top:
        1px solid rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.70);
}

.inning-table .team-cell {
    padding-left: 14px;

    text-align: left;

    color: var(--white);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 11px;
    font-weight: 900;
}

.inning-table .total {
    color:
        var(--white);

    font-weight: 900;
}


/* =========================================================
   CURRENT AT-BAT
========================================================= */

.at-bat-card {
    padding:
        15px;
}

.at-bat-header {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;

    margin-bottom: 15px;
}

.at-bat-label {
    color: var(--red);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 9px;
    font-weight: 900;

    letter-spacing: 1.2px;
}

.at-bat-inning {
    color:
        rgba(255,255,255,.42);

    font-size: 8px;
    font-weight: 800;

    letter-spacing: .5px;
}

.at-bat-main {
    display: grid;

    grid-template-columns:
        1fr auto;

    align-items: center;

    gap: 15px;
}

.batter-order {
    color:
        var(--muted);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .7px;
}

.batter-name {
    margin-top: 2px;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 26px;
    font-weight: 900;

    line-height: 1;
}

.batter-vs {
    margin-top: 5px;

    color:
        var(--muted);

    font-size: 8px;
    font-weight: 700;
}

.count-box {
    display: flex;

    gap: 8px;
}

.count-item {
    text-align: center;
}

.count-number {
    display: block;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 23px;
    font-weight: 900;

    line-height: 1;
}

.count-label {
    display: block;

    margin-top: 3px;

    color:
        var(--muted);

    font-size: 7px;
    font-weight: 800;

    letter-spacing: .5px;
}

.pitch-sequence {
    display: flex;

    gap: 7px;

    margin-top: 16px;

    padding-top: 13px;

    border-top:
        1px solid rgba(255,255,255,.06);
}

.pitch {
    width: 31px;
    height: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.68);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 9px;
    font-weight: 800;
}

.pitch.result {
    width: auto;

    padding:
        0 10px;

    background:
        rgba(227,25,55,.12);

    color:
        var(--red);

    letter-spacing: .6px;
}


/* =========================================================
   BATTING / PITCHING TABLE
========================================================= */

.stats-table {
    width: 100%;

    min-width: 420px;

    border-collapse: collapse;
}

.stats-table th,
.stats-table td {
    height: 39px;

    padding:
        0 7px;

    text-align: center;

    white-space: nowrap;

    font-size: 9px;
    font-weight: 700;
}

.stats-table th {
    height: 31px;

    background:
        rgba(255,255,255,.025);

    color:
        rgba(255,255,255,.30);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 8px;
    font-weight: 900;

    letter-spacing: .5px;
}

.stats-table td {
    border-top:
        1px solid rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.72);
}

.stats-table td:first-child {
    padding-left: 14px;

    text-align: left;

    color:
        var(--white);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 11px;
    font-weight: 800;
}

.stats-table td.order {
    width: 28px;

    padding-left: 10px;

    color:
        var(--muted);

    font-size: 9px;
}

.stats-table tr.featured td:first-child {
    color:
        var(--red);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 999;

    height:
        calc(76px + env(safe-area-inset-bottom));

    display: flex;

    align-items: flex-start;

    padding:
        7px 5px env(safe-area-inset-bottom);

    background:
        rgba(5,16,34,.97);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid rgba(255,255,255,.08);
}

.nav-item {
    flex: 1;

    min-width: 0;

    height: 60px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    border-radius: 13px;

    text-decoration: none;

    color:
        #64748b;
}

.nav-item.active {
    color:
        #ffffff;

    background:
        rgba(227,25,55,.13);
}

.nav-icon {
    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 17px;
}

.nav-item.active .nav-icon {
    color:
        var(--red);
}

.nav-label {
    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .45px;
}


/* =========================================================
   SMALL SCREEN
========================================================= */

@media (max-width: 360px) {

    .header {
        height: 68px;
    }

    main {
        padding-top: 68px;
    }

    .page {
        padding-left: 11px;
        padding-right: 11px;
    }

    .team-code {
        font-size: 25px;
    }

    .score-main {
        font-size: 27px;
    }

    .batter-name {
        font-size: 24px;
    }

    .nav-label {
        font-size: 9px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-shape"></div>

    <div class="header-line"></div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

<section class="page">


    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="page-heading">

        <h1>
            Score
        </h1>

        <p>
            2026 REGULAR SEASON
        </p>

    </div>


    <!-- =================================================
         DATE
    ================================================== -->

    <div class="date-selector">

        <button
            type="button"
            class="date-button"
        >
            ‹
        </button>


        <div class="date-center">

            <span class="date-main">
                AUGUST 11, 2026
            </span>

            <span class="date-sub">
                GAME SCORE
            </span>

        </div>


        <button
            type="button"
            class="date-button"
        >
            ›
        </button>

    </div>


    <!-- =================================================
         GAME
    ================================================== -->

    <section class="game-card">


        <div class="game-top">

            <div class="game-status">
                FINAL
            </div>

        </div>


        <div class="matchup">


            <div class="team away">
