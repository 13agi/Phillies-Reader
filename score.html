<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score | Phillies</title>
<style>
:root {
    --navy: #06172d;
    --navy-deep: #031020;
    --red: #e31837;
    --red-dark: #c20f30;
    --red-deep: #970a24;
    --white: #ffffff;
    --gray: #718298;
}
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    min-height: 100vh;
    padding-bottom: 78px;
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =========================================================
   HEADER
   ※ 固定UI
========================================================= */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 84px;
    overflow: hidden;
    background:
        linear-gradient(
            135deg,
            #8d0822 0%,
            #b90d2c 25%,
            #e31837 52%,
            #d41434 73%,
            #a50b27 100%
        );
    box-shadow:
        0 9px 32px rgba(0,0,0,.42);
}
/* 野球場のダイヤモンド */
.header-field {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 250px;
    height: 250px;
    transform:
        translate(-50%, -50%)
        rotate(45deg);
    border:
        1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
    opacity: .8;
}
.header-field::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 175px;
    height: 175px;
    transform:
        translate(-50%, -50%);
    border:
        1px solid rgba(255,255,255,.09);
}
.header-field::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -30px;
    width: 1px;
    height: 310px;
    transform:
        translateX(-50%);
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}
/* 左右の赤い面 */
.header-left {
    position: absolute;
    left: -14%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(80,0,18,.12),
            rgba(80,0,18,.025)
        );
}
.header-right {
    position: absolute;
    right: -13%;
    top: -60%;
    width: 47%;
    height: 220%;
    transform:
        skewX(-22deg);
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(90,0,20,.20)
        );
}
/* 上部の光 */
.header-highlight {
    position: absolute;
    left: -10%;
    top: 0;
    width: 120%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.34),
            transparent
        );
}
/* 下部エッジ */
.header-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            var(--navy-deep),
            rgba(255,255,255,.28) 50%,
            var(--navy-deep)
        );
    opacity: .85;
}
/* ホームベースの抽象アクセント */
.header-base {
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 24px;
    height: 20px;
    transform:
        translateX(-50%);
    border:
        1px solid rgba(255,255,255,.22);
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 62%,
            50% 100%,
            0 62%
        );
    opacity: .75;
}
/* =========================================================
   SCORE CONTENT
   現在は空
========================================================= */
main {
    width: 100%;
    min-height:
        calc(100vh - 162px);
}
/* =========================================================
   BOTTOM NAV
   ※ 固定UI
========================================================= */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2000;
    height: 78px;
    background:
        rgba(5,20,39,.98);
    border-top:
        1px solid rgba(255,255,255,.08);
    box-shadow:
        0 -10px 28px rgba(0,0,0,.32);
    backdrop-filter:
        blur(16px);
}
.bottom-inner {
    width: 100%;
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns:
        repeat(5, 1fr);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color:
        var(--gray);
    text-decoration: none;
    font-size: 8px;
    font-weight: 800;
    letter-spacing:
        .65px;
    -webkit-tap-highlight-color:
        transparent;
}
/* =========================================================
   ICON
========================================================= */
.nav-icon {
    width: 31px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
}
.nav-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke:
        currentColor;
    stroke-width:
        1.8;
    stroke-linecap:
        round;
    stroke-linejoin:
        round;
}
/* =========================================================
   ACTIVE
   SCOREだけ赤
========================================================= */
.nav-item.active {
    color:
        var(--red);
}
.nav-item.active .nav-icon {
    background:
        rgba(227,24,55,.14);
}
/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 380px) {
    .header {
        height: 78px;
    }
    .nav-item {
        font-size: 7px;
    }
    .nav-icon {
        width: 29px;
        height: 29px;
    }
    .nav-icon svg {
        width: 19px;
        height: 19px;
    }
}
</style>
</head>
<body>
<!-- =========================================================
     HEADER
========================================================= -->
<header class="header">
    <div class="header-field"></div>
    <div class="header-left"></div>
    <div class="header-right"></div>
    <div class="header-highlight"></div>
    <div class="header-base"></div>
    <div class="header-edge"></div>
</header>
<!-- =========================================================
     SCORE
     今は空
========================================================= -->
<main></main>
<!-- =========================================================
     BOTTOM NAV
========================================================= -->
<nav class="bottom-nav">
    <div class="bottom-inner">
        <!-- SCHEDULE -->
        <a
            href="schedule.html"

        >

                    <line
                        x1="16.5"
                        y1="3"
                        x2="16.5"
                        y2="7"
                    />
                    <line
                        x1="3.5"
                        y1="10"
                        x2="20.5"
                        y2="10"
                    />
                    <line
                        x1="8"
                        y1="14"
                        x2="10"
                        y2="14"
                    />
                    <line
                        x1="13"
                        y1="14"
                        x2="15"
                        y2="14"
                    />
                </svg>
            </div>
            SCHEDULE
        </a>
        <!-- SCORE : ACTIVE -->
        <a
            href="score.html"
            class="nav-item active"
        >
            <div class="nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <rect
                        x="3.5"
                        y="4"
                        width="17"
                        height="16"
                        rx="2"
                    />
                    <line
                        x1="8"
                        y1="4"
                        x2="8"
                        y2="20"
                    />
                    <line
                        x1="16"
                        y1="4"
                        x2="16"
                        y2="20"
                    />
                    <line
                        x1="3.5"
                        y1="12"
                        x2="20.5"
                        y2="12"
                    />
                </svg>
            </div>
            SCORE
        </a>
        <!-- HOME -->
        <a
            href="index.html"
            class="nav-item"
        >
            <div class="nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <!-- 野球のホームベース -->
                    <path
                        d="
                            M4 4
                            H20
                            V13
                            L12 21
                            L4 13
                            Z
                        "
                    />
                </svg>
            </div>
            HOME
        </a>
        <!-- PLAYER -->
        <a
            href="player.html"
            class="nav-item"
        >
            <div class="nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="12"
                        cy="8"
                        r="3.4"
                    />
                    <path
                        d="
                            M5 20
                            C5.7 16
                            8.1 14
                            12 14
                            C15.9 14
                            18.3 16
                            19 20
                        "
                    />
                </svg>
            </div>
            PLAYER
        </a>
        <!-- STATS -->
        <a
            href="stats.html"
            class="nav-item"
        >
            <div class="nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <line
                        x1="4"

                        x2="4"
                        y2="14"
                    />
                    <line
                        x1="10"

                    />
                    <line

                    />
                </svg>
            </div>
            STATS
        </a>
    </div>
</nav>
</body>
</html>
