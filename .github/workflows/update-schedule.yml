name: Update Phillies Schedule
on:
  # =======================================================
  # 3時間ごとに実行
  # =======================================================
  schedule:
    - cron: "0 */3 * * *"
  # =======================================================
  # Actions画面から手動実行
  # =======================================================
  workflow_dispatch:
jobs:
  update-schedule:
    runs-on:
      ubuntu-latest
    permissions:
      contents:
        write
    steps:
      # ===================================================
      # GitHub repository
      # ===================================================
      - name:
          Checkout repository
        uses:
          actions/checkout@v4
      # ===================================================
      # Python
      # ===================================================
      - name:
          Setup Python
        uses:
          actions/setup-python@v5
        with:
          python-version:
            "3.x"
      # ===================================================
      # requests
      # ===================================================
      - name:
          Install dependencies
        run: |
          python -m pip install \
            --upgrade pip
          pip install requests
      # ===================================================
      # MLB API
      # ===================================================
      - name:
          Update Phillies schedule
        run: |
          python scripts/update_schedule.py
      # ===================================================
      # GitHub
      # ===================================================
      - name:
          Save schedule data
        run: |
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/update-schedule.json
          if git diff --cached --quiet; then
            echo \
              "No changes detected."
          else
            git commit \
              -m "Update Phillies schedule"
            git push
          fi
