name: Update Phillies Roster
on:
  # 3時間ごと
  schedule:
    - cron: "15 */3 * * *"
  # 手動実行も可能
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Fetch Phillies roster
        run: |
          python scripts/fetch_roster.py
      - name: Check changes
        id: changes
        run: |
          if git diff --quiet -- data/players.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit roster update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add data/players.json
          git commit \
            -m "Update Phillies roster"
          git push
      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No roster changes."
