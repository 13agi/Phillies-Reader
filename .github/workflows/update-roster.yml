name: Update Phillies Roster

on:
  # 6時間ごとに自動実行
  schedule:
    - cron: "15 */6 * * *"

  # GitHub上から手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-roster:

    runs-on: ubuntu-latest

    steps:

      # GitHubリポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Pythonを準備
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requestsをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 選手情報を取得
      - name: Fetch Phillies roster
        run: |
          python scripts/fetch_roster.py

      # 変更があった場合だけ保存
      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/players.json

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "Update Phillies roster"

            git push

          fi
