name: Update Phillies Roster

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-phillies-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Update Phillies roster
        run: |
          python scripts/update_phillies_roster.py

      - name: Validate JSON
        run: |
          python -m json.tool data/phillies-roster.json > /dev/null

      - name: Commit updated roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/phillies-roster.json

          if git diff --cached --quiet; then
            echo "No roster changes."
          else
            git commit -m "Update Phillies roster"
            git push
          fi
