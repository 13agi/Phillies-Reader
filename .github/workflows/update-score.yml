name: Update Phillies Score
on:
  schedule:
    # 5分ごと
    - cron: "*/5 * * * *"
  # GitHub Actions画面から手動実行可能
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # =====================================================
      # PYTHON
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # =====================================================
      # DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      # =====================================================
      # UPDATE SCORE
      # =====================================================
      - name: Update score data
        run: |
          python scripts/update_score.py
      # =====================================================
      # CHECK RESULT
      # =====================================================
      - name: Show generated score.json
        run: |
          echo "===== data/score.json ====="
          cat data/score.json
      # =====================================================
      # COMMIT
      # =====================================================
      - name: Commit score data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/score.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Phillies score data"
            git push
          fi
