<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">
<title>Schedule</title>
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --navy:
        #07152b;
    --navy-2:
        #0b1c38;
    --red:
        #e31937;
    --white:
        #ffffff;
    --muted:
        #718096;
    --line:
        rgba(255,255,255,.075);
}
/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color:
        transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background:
        var(--navy);
}
body {
    color:
        var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =========================================================
   HEADER
   HOME / PLAYER と統一
========================================================= */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 76px;
    background:
        var(--red);
}
/* =========================================================
   MAIN
========================================================= */
main {
    min-height:
        100vh;
    padding-top:
        76px;
}
.page {
    width: 100%;
    padding:
        21px 14px 35px;
}
/* =========================================================
   PAGE HEADING
========================================================= */
.page-heading {
    margin-bottom:
        17px;
}
.page-heading h1 {
    font-size:
        31px;
    font-weight:
        800;
    line-height:
        .95;
    letter-spacing:
        -.5px;
}
.page-heading p {
    margin-top:
        6px;
    color:
        var(--muted);
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        1.4px;
}
/* =========================================================
   MONTH SELECTOR
========================================================= */
.month-selector {
    width: 100%;
    height: 59px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    padding:
        0 7px;
    margin-bottom:
        19px;
    border:
        1px solid
        var(--line);
    border-radius:
        15px;
    background:
        rgba(255,255,255,.035);
}
.month-button {
    width: 43px;
    height: 43px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border:
        0;
    border-radius:
        11px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.70);
    font-size:
        25px;
    cursor:
        pointer;
}
.month-button:active {
    transform:
        scale(.92);
}
.month-center {
    flex:
        1;
    text-align:
        center;
}
.month {
    display:
        block;
    font-size:
        20px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.month-sub {
    display:
        block;
    margin-top:
        2px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        700;
    letter-spacing:
        1.2px;
}
/* =========================================================
   SCHEDULE LIST
========================================================= */
.schedule-list {
    display:
        flex;
    flex-direction:
        column;
    gap:
        11px;
}
/* =========================================================
   GAME CARD
========================================================= */
.game-card {
    position:
        relative;
    overflow:
        hidden;
    width:
        100%;
    border:
        1px solid
        var(--line);
    border-radius:
        16px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );
    box-shadow:
        0 8px 24px
        rgba(0,0,0,.12);
    cursor:
        pointer;
    transition:
        transform .15s ease,
        border-color .15s ease;
}
.game-card:active {
    transform:
        scale(.985);
}
.game-card.expanded {
    border-color:
        rgba(227,25,55,.35);
}
.game-card::before {
    content: "";
    position:
        absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background:
        rgba(255,255,255,.10);
}
.game-card.win::before {
    background:
        var(--red);
}
.game-card.loss::before {
    background:
        #64748b;
}
/* =========================================================
   GAME TOP
========================================================= */
.game-top {
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    padding:
        13px 14px 7px 16px;
}
.game-date {
    display:
        flex;
    align-items:
        baseline;
    gap:
        7px;
}
.game-day {
    font-size:
        25px;
    font-weight:
        800;
    line-height:
        1;
}
.game-weekday {
    color:
        var(--muted);
    font-size:
        9px;
    font-weight:
        700;
    letter-spacing:
        .7px;
}
.game-status {
    padding:
        4px 8px;
    border-radius:
        6px;
    background:
        rgba(255,255,255,.05);
    color:
        rgba(255,255,255,.50);
    font-size:
        7px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.game-card.win
.game-status {
    color:
        var(--red);
    background:
        rgba(227,25,55,.10);
}
.game-card.loss
.game-status {
    color:
        #94a3b8;
}
/* =========================================================
   MATCHUP
========================================================= */
.matchup {
    display:
        grid;
    grid-template-columns:
        1fr auto 1fr;
    align-items:
        center;
    gap:
        10px;
    padding:
        7px 16px 13px;
}
.team {
    min-width:
        0;
}
.team.away {
    text-align:
        left;
}
.team.home {
    text-align:
        right;
}
.team-code {
    display:
        block;
    font-size:
        27px;
    font-weight:
        900;
    line-height:
        .95;
}
.team-name {
    display:
        block;
    margin-top:
        4px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        700;
    white-space:
        nowrap;
    overflow:
        hidden;
    text-overflow:
        ellipsis;
}
/* =========================================================
   SCORE
========================================================= */
.score {
    min-width:
        61px;
    text-align:
        center;
}
.score-main {
    font-size:
        28px;
    font-weight:
        900;
    letter-spacing:
        1px;
}
.score-divider {
    color:
        rgba(255,255,255,.18);
    font-size:
        12px;
    margin:
        0 2px;
}
.result {
    display:
        inline-block;
    margin-top:
        4px;
    font-size:
        8px;
    font-weight:
        900;
    letter-spacing:
        1px;
}
.result.win {
    color:
        var(--red);
}
.result.loss {
    color:
        #94a3b8;
}
/* =========================================================
   FUTURE GAME
========================================================= */
.future-time {
    text-align:
        center;
}
.future-time strong {
    display:
        block;
    font-size:
        23px;
    font-weight:
        900;
}
.future-time span {
    display:
        block;
    margin-top:
        3px;
    color:
        var(--muted);
    font-size:
        7px;
    font-weight:
        700;
    letter-spacing:
        .8px;
}
/* =========================================================
   VENUE
========================================================= */
.venue {
    display:
        flex;
    align-items:
        center;
    gap:
        8px;
    padding:
        10px 16px 13px;
    border-top:
        1px solid
        rgba(255,255,255,.045);
}
.venue-icon {
    width:
        25px;
    height:
        25px;
    flex-shrink:
        0;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border-radius:
        7px;
    background:
        rgba(255,255,255,.04);
    color:
        var(--red);
    font-size:
        11px;
}
.venue-info {
    min-width:
        0;
}
.venue-name {
    display:
        block;
    font-size:
        10px;
    font-weight:
        800;
    white-space:
        nowrap;
    overflow:
        hidden;
    text-overflow:
        ellipsis;
}
.venue-location {
    display:
        block;
    margin-top:
        2px;
    color:
        var(--muted);
    font-size:
        8px;
}
/* =========================================================
   HOME / AWAY
========================================================= */
.game-label {
    position:
        absolute;
    top: 0;
    right: 0;
    padding:
        4px 8px;
    border-radius:
        0 0 0 8px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.30);
    font-size:
        6px;
    font-weight:
        800;
    letter-spacing:
        1px;
}
/* =========================================================
   DETAIL
   タップ時に展開
========================================================= */
.game-detail {
    display:
        none;
    border-top:
        1px solid
        rgba(255,255,255,.07);
    background:
        rgba(0,0,0,.10);
}
.game-card.expanded
.game-detail {
    display:
        block;
}
/* =========================================================
   DETAIL SECTION
========================================================= */
.detail-section {
    padding:
        13px 15px;
}
.detail-title {
    margin-bottom:
        9px;
    color:
        rgba(255,255,255,.45);
    font-size:
        8px;
    font-weight:
        800;
    letter-spacing:
        1.2px;
}
/* =========================================================
   INNING SCORE
========================================================= */
.inning-table {
    width:
        100%;
    overflow-x:
        auto;
}
.inning-row {
    display:
        grid;
    grid-template-columns:
        40px repeat(
            var(--innings),
            minmax(24px, 1fr)
        ) 34px;
    min-width:
        max-content;
    align-items:
        center;
}
.inning-row + .inning-row {
    margin-top:
        5px;
}
.inning-cell {
    text-align:
        center;
    color:
        rgba(255,255,255,.65);
    font-size:
        8px;
    font-weight:
        700;
}
.inning-row.header
.inning-cell {
    color:
        rgba(255,255,255,.30);
    font-size:
        7px;
}
.inning-row.total
.inning-cell {
    color:
        var(--white);
    font-size:
        9px;
    font-weight:
        900;
}
/* =========================================================
   PITCHERS
========================================================= */
.pitcher-list {
    display:
        flex;
    flex-wrap:
        wrap;
    gap:
        6px;
}
.pitcher {
    padding:
        7px 9px;
    border:
        1px solid
        rgba(255,255,255,.06);
    border-radius:
        8px;
    background:
        rgba(255,255,255,.035);
    font-size:
        9px;
    font-weight:
        700;
}
.no-data {
    color:
        rgba(255,255,255,.30);
    font-size:
        9px;
}
/* =========================================================
   BOTTOM NAV
   順番固定
========================================================= */
.bottom-nav {
    position:
        fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index:
        999;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 8px
        env(safe-area-inset-bottom);
    display:
        flex;
    align-items:
        flex-start;
    justify-content:
        space-around;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
/* =========================================================
   NAV ITEM
========================================================= */
.nav-item {
    flex:
        1;
    max-width:
        100px;
    height:
        60px;
    display:
        flex;
    flex-direction:
        column;
    align-items:
        center;
    justify-content:
        center;
    gap:
        5px;
    text-decoration:
        none;
    color:
        #64748b;
    border-radius:
        13px;
    cursor:
        pointer;
}
.nav-item:active {
    transform:
        scale(.94);
}
.nav-item.active {
    color:
        var(--white);
    background:
        rgba(227,25,55,.13);
}
.nav-icon {
    width:
        25px;
    height:
        25px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        18px;
    font-weight:
        700;
}
.nav-item.active
.nav-icon {
    color:
        var(--red);
}
.nav-label {
    font-size:
        11px;
    font-weight:
        700;
    letter-spacing:
        .7px;
}
/* =========================================================
   EMPTY
========================================================= */
.empty {
    padding:
        50px 20px;
    text-align:
        center;
    color:
        var(--muted);
    font-size:
        11px;
}
/* =========================================================
   SMALL IPHONE
========================================================= */
@media (
    max-width: 360px
) {
    .header {
        height:
            76px;
    }
    main {
        padding-top:
            76px;
    }
    .page {
        padding-left:
            11px;
        padding-right:
            11px;
    }
    .team-code {
        font-size:
            25px;
    }
    .score-main {
        font-size:
            26px;
    }
    .game-day {
        font-size:
            23px;
    }
}
/* =========================================================
   SAFE AREA
========================================================= */
@supports (
    padding:
    env(safe-area-inset-bottom)
) {
    .bottom-nav {
        padding-bottom:
            env(safe-area-inset-bottom);
    }
}
</style>
</head>
<body>
<!-- =====================================================
     HEADER
===================================================== -->
<header class="header"></header>
<!-- =====================================================
     MAIN
===================================================== -->
<main>
<section class="page">
    <div class="page-heading">
        <h1>
            Schedule
        </h1>
        <p>
            2026 REGULAR SEASON
        </p>
    </div>
    <!-- =================================================
         MONTH
    ================================================== -->
    <div class="month-selector">
        <button
            type="button"
            class="month-button"
            id="prev-month">
            ‹
        </button>
        <div class="month-center">
            <span
                class="month"
                id="month-name">
                AUGUST 2026
            </span>
            <span class="month-sub">
                REGULAR SEASON
            </span>
        </div>
        <button
            type="button"
            class="month-button"
            id="next-month">
            ›
        </button>
    </div>
    <!-- =================================================
         GAME LIST
    ================================================== -->
    <div
        class="schedule-list"
        id="schedule-list">
    </div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
     順番を変更しない
===================================================== -->
<nav class="bottom-nav">
    <a
        href="schedule.html"
        class="nav-item active">
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
    <a
        href="score.html"
        class="nav-item">
        <div class="nav-icon">
            ●
        </div>
        <div class="nav-label">
            SCORE
        </div>
    </a>
    <a
        href="index.html"
        class="nav-item">
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <a
        href="player.html"
        class="nav-item">
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <a
        href="stats.html"
        class="nav-item">
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
</nav>
<script>
/* =========================================================
   CONFIG
========================================================= */
const DATA_URL =
    "data/update-schedule.json";
/* =========================================================
   ELEMENTS
========================================================= */
const scheduleList =
    document.getElementById(
        "schedule-list"
    );
const monthName =
    document.getElementById(
        "month-name"
    );
const previousButton =
    document.getElementById(
        "prev-month"
    );
const nextButton =
    document.getElementById(
        "next-month"
    );
/* =========================================================
   STATE
========================================================= */
let scheduleData = [];
let currentMonth =
    new Date().getMonth();
let currentYear =
    2026;
/* =========================================================
   MONTH NAMES
========================================================= */
const monthNames = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
];
/* =========================================================
   WEEKDAYS
========================================================= */
const weekdays = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
];
/* =========================================================
   LOAD JSON
========================================================= */
async function loadSchedule() {
    try {
        const response =
            await fetch(
                DATA_URL,
                {
                    cache:
                        "no-store"
                }
            );
        if (
            !response.ok
        ) {
            throw new Error(
                "Schedule JSON could not be loaded."
            );
        }
        const data =
            await response.json();
        scheduleData =
            Array.isArray(
                data.games
            )
                ? data.games
                : [];
        renderSchedule();
    } catch (error) {
        console.error(
            error
        );
        scheduleList.innerHTML = `
            <div class="empty">
                Schedule data
                could not be loaded.
            </div>
        `;
    }
}
/* =========================================================
   MONTH DISPLAY
========================================================= */
function updateMonthTitle() {
    monthName.textContent =
        `${monthNames[currentMonth]} ${currentYear}`;
}
/* =========================================================
   GET GAMES FOR MONTH
========================================================= */
function getGamesForMonth() {
    return scheduleData.filter(
        game => {
            if (
                !game.date
            ) {
                return false;
            }
            const date =
                new Date(
                    `${game.date}T12:00:00`
                );
            return (
                date.getFullYear()
                ===
                currentYear
                &&
                date.getMonth()
                ===
                currentMonth
            );
        }
    );
}
/* =========================================================
   FORMAT TIME
========================================================= */
function formatGameTime(
    gameDate
) {
    if (
        !gameDate
    ) {
        return "";
    }
    const date =
        new Date(
            gameDate
        );
    return date.toLocaleTimeString(
        "en-US",
        {
            hour:
                "numeric",
            minute:
                "2-digit",
            hour12:
                true,
            timeZone:
                "America/New_York"
        }
    );
}
/* =========================================================
   FORMAT VENUE LOCATION
========================================================= */
function formatVenueLocation(
    venue
) {
    if (
        !venue
    ) {
        return "";
    }
    const parts = [];
    if (
        venue.city
    ) {
        parts.push(
            venue.city
        );
    }
    if (
        venue.stateAbbrev
    ) {
        parts.push(
            venue.stateAbbrev
        );
    } else if (
        venue.state
    ) {
        parts.push(
            venue.state
        );
    }
    return parts.join(
        ", "
    );
}
/* =========================================================
   ESCAPE HTML
========================================================= */
function escapeHTML(
    value
) {
    if (
        value === null
        ||
        value === undefined
    ) {
        return "";
    }
    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
/* =========================================================
   INNING DETAIL
========================================================= */
function renderInningScores(
    game
) {
    const innings =
        Array.isArray(
            game.inningScores
        )
            ? game.inningScores
            : [];
    if (
        innings.length === 0
    ) {
        return `
            <div class="detail-section">
                <div class="detail-title">
                    INNING SCORE
                </div>
                <div class="no-data">
                    No inning data available.
                </div>
            </div>
        `;
    }
    const count =
        innings.length;
    let header = `
        <div
            class="inning-row header"
            style="--innings:${count}"
        >
            <div class="inning-cell"></div>
    `;
    innings.forEach(
        inning => {
            header += `
                <div class="inning-cell">
                    ${escapeHTML(
                        inning.inning
                    )}
                </div>
            `;
        }
    );
    header += `
            <div class="inning-cell">
                R
            </div>
        </div>
    `;
    let awayRow = `
        <div
            class="inning-row"
            style="--innings:${count}"
        >
            <div class="inning-cell">
                ${escapeHTML(
                    game.opponent
                    ?.abbreviation
                    || "OPP"
                )}
            </div>
    `;
    let homeRow = `
        <div
            class="inning-row"
            style="--innings:${count}"
        >
            <div class="inning-cell">
                PHI
            </div>
    `;
    innings.forEach(
        inning => {
            awayRow += `
                <div class="inning-cell">
                    ${escapeHTML(
                        inning.away ?? 0
                    )}
                </div>
            `;
            homeRow += `
                <div class="inning-cell">
                    ${escapeHTML(
                        inning.home ?? 0
                    )}
                </div>
            `;
        }
    );
    const isHome =
        game.location ===
        "HOME";
    const philliesRuns =
        isHome
            ? innings.reduce(
                (
                    total,
                    inning
                ) =>
                    total +
                    Number(
                        inning.home
                        || 0
                    ),
                0
            )
            : innings.reduce(
                (
                    total,
                    inning
                ) =>
                    total +
                    Number(
                        inning.away
                        || 0
                    ),
                0
            );
    const opponentRuns =
        isHome
            ? innings.reduce(
                (
                    total,
                    inning
                ) =>
                    total +
                    Number(
                        inning.away
                        || 0
                    ),
                0
            )
            : innings.reduce(
                (
                    total,
                    inning
                ) =>
                    total +
                    Number(
                        inning.home
                        || 0
                    ),
                0
            );
    awayRow += `
            <div class="inning-cell">
                ${opponentRuns}
            </div>
        </div>
    `;
    homeRow += `
            <div class="inning-cell">
                ${philliesRuns}
            </div>
        </div>
    `;
    return `
        <div class="detail-section">
            <div class="detail-title">
                INNING SCORE
            </div>
            <div class="inning-table">
                ${header}
                ${isHome
                    ? homeRow
                    : awayRow
                }
                ${isHome
                    ? awayRow
                    : homeRow
                }
            </div>
        </div>
    `;
}
/* =========================================================
   PITCHERS
========================================================= */
function renderPitchers(
    game
) {
    const pitchers =
        Array.isArray(
            game.philliesPitchers
        )
            ? game.philliesPitchers
            : [];
    let content = "";
    if (
        pitchers.length === 0
    ) {
        content = `
            <div class="no-data">
                No pitching data available.
            </div>
        `;
    } else {
        content =
            pitchers.map(
                pitcher => `
                    <div class="pitcher">
                        ${escapeHTML(
                            pitcher.name
                        )}
                    </div>
                `
            ).join("");
    }
    return `
        <div class="detail-section">
            <div class="detail-title">
                PHILLIES PITCHING
            </div>
            <div class="pitcher-list">
                ${content}
            </div>
        </div>
    `;
}
/* =========================================================
   DETAIL
========================================================= */
function renderDetail(
    game
) {
    return `
        <div class="game-detail">
            ${renderInningScores(
                game
            )}
            ${renderPitchers(
                game
            )}
        </div>
    `;
}
/* =========================================================
   GAME CARD
========================================================= */
function renderGame(
    game
) {
    const date =
        new Date(
            `${game.date}T12:00:00`
        );
    const day =
        date.getDate();
    const weekday =
        weekdays[
            date.getDay()
        ];
    const result =
        game.result;
    const cardClass =
        result === "W"
            ? "win"
            : result === "L"
                ? "loss"
                : "";
    const status =
        game.status ===
        "Final"
            ? "FINAL"
            : game.status ===
              "Live"
                ? "LIVE"
                : "UPCOMING";
    const isFinal =
        game.status ===
        "Final";
    let center;
    if (
        isFinal
        ||
        game.status ===
        "Live"
    ) {
        center = `
            <div class="score">
                <span
                    class="score-main"
                >
                    ${escapeHTML(
                        game.phillies?.score
                        ?? "-"
                    )}
                    <span
                        class="score-divider"
                    >
                        —
                    </span>
                    ${escapeHTML(
                        game.opponent?.score
                        ?? "-"
                    )}
                </span>
                ${
                    result
                    ? `
                        <span
                            class="result ${
                                result === "W"
                                    ? "win"
                                    : "loss"
                            }"
                        >
                            ${
                                result === "W"
                                    ? "WIN"
                                    : result === "L"
                                        ? "LOSS"
                                        : "TIE"
                            }
                        </span>
                    `
                    : ""
                }
            </div>
        `;
    } else {
        center = `
            <div class="future-time">
                <strong>
                    ${escapeHTML(
                        formatGameTime(
                            game.gameDate
                        )
                        || "--:--"
                    )}
                </strong>
                <span>
                    FIRST PITCH
                </span>
            </div>
        `;
    }
    const locationLabel =
        game.location ===
        "HOME"
            ? "HOME"
            : "AWAY";
    const venueLocation =
        formatVenueLocation(
            game.venue
        );
    const card =
        document.createElement(
            "article"
        );
    card.className =
        `game-card ${cardClass}`;
    card.innerHTML = `
        <div class="game-label">
            ${locationLabel}
        </div>
        <div class="game-top">
            <div class="game-date">
                <span class="game-day">
                    ${day}
                </span>
                <span class="game-weekday">
                    ${weekday}
                </span>
            </div>
            <div class="game-status">
                ${status}
            </div>
        </div>
        <div class="matchup">
            <div
                class="team ${
                    game.location === "AWAY"
                        ? "away"
                        : "away"
                }"
            >
                <span class="team-code">
                    ${
                        game.location ===
                        "AWAY"
                            ? "PHI"
                            : escapeHTML(
                                game.opponent
                                ?.abbreviation
                                || ""
                            )
                    }
                </span>
                <span class="team-name">
                    ${
                        game.location ===
                        "AWAY"
                            ? "PHILADELPHIA"
                            : escapeHTML(
                                game.opponent
                                ?.name
                                || ""
                            )
                    }
                </span>
            </div>
            ${center}
            <div
                class="team home"
            >
                <span class="team-code">
                    ${
                        game.location ===
                        "HOME"
                            ? "PHI"
                            : escapeHTML(
                                game.opponent
                                ?.abbreviation
                                || ""
                            )
                    }
                </span>
                <span class="team-name">
                    ${
                        game.location ===
                        "HOME"
                            ? "PHILADELPHIA"
                            : escapeHTML(
                                game.opponent
                                ?.name
                                || ""
                            )
                    }
                </span>
            </div>
        </div>
        <div class="venue">
            <div class="venue-icon">
                ◆
            </div>
            <div class="venue-info">
                <span class="venue-name">
                    ${
                        escapeHTML(
                            game.venue
                            ?.name
                            || "Venue"
                        )
                    }
                </span>
                <span class="venue-location">
                    ${
                        escapeHTML(
                            venueLocation
                        )
                    }
                </span>
            </div>
        </div>
        ${renderDetail(
            game
        )}
    `;
    card.addEventListener(
        "click",
        function () {
            card.classList.toggle(
                "expanded"
            );
        }
    );
    return card;
}
/* =========================================================
   RENDER
========================================================= */
function renderSchedule() {
    updateMonthTitle();
    scheduleList.innerHTML =
        "";
    const games =
        getGamesForMonth();
    if (
        games.length === 0
    ) {
        scheduleList.innerHTML = `
            <div class="empty">
                No games scheduled
                for this month.
            </div>
        `;
        return;
    }
    games.forEach(
        game => {
            scheduleList.appendChild(
                renderGame(
                    game
                )
            );
        }
    );
}
/* =========================================================
   MONTH NAVIGATION
========================================================= */
previousButton.addEventListener(
    "click",
    function () {
        if (
            currentMonth === 0
        ) {
            currentMonth = 11;
            currentYear--;
        } else {
            currentMonth--;
        }
        renderSchedule();
    }
);
nextButton.addEventListener(
    "click",
    function () {
        if (
            currentMonth === 11
        ) {
            currentMonth = 0;
            currentYear++;
        } else {
            currentMonth++;
        }
        renderSchedule();
    }
);
/* =========================================================
   INITIAL
========================================================= */
loadSchedule();
</script>
</body>
</html>
