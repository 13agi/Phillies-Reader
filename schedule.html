<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">
<title>Schedule</title>
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --navy: #07152b;
    --navy-light: #0d1e38;
    --red: #e31937;
    --white: #ffffff;
    --muted: #71809a;
    --line: rgba(255,255,255,.07);
}
/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}
body {
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =========================================================
   HEADER
   Home / Player と統一
   ========================================================= */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 40%,
            #ef233c 65%,
            #c8102e 100%
        );
    box-shadow:
        0 7px 22px
        rgba(0,0,0,.30);
    overflow: hidden;
}
/* 装飾 */
.header::before {
    content: "";
    position: absolute;
    width: 180%;
    height: 120px;
    top: -65px;
    left: -40%;
    transform:
        rotate(-7deg);
    border-top:
        1px solid
        rgba(255,255,255,.12);
    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}
/* =========================================================
   MAIN
========================================================= */
main {
    min-height: 100vh;
    padding-top: 72px;
}
.page {
    padding:
        23px 14px
        30px;
}
/* =========================================================
   PAGE TITLE
========================================================= */
.page-heading {
    margin-bottom: 18px;
}
.page-heading h1 {
    font-size: 28px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: -.5px;
}
.page-heading p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .8px;
}
/* =========================================================
   MONTH SELECTOR
========================================================= */
.month-selector {
    display: grid;
    grid-template-columns:
        42px 1fr 42px;
    align-items: center;
    height: 52px;
    margin-bottom: 15px;
    border:
        1px solid var(--line);
    border-radius: 14px;
    background:
        rgba(255,255,255,.035);
}
.month-button {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,.72);
    font-size: 27px;
    line-height: 1;
}
.month-button:active {
    transform: scale(.88);
}
.month-current {
    text-align: center;
}
.month-name {
    display: block;
    font-size: 15px;
    font-weight: 850;
    letter-spacing: .6px;
}
.month-games {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .4px;
}
/* =========================================================
   LIST
========================================================= */
.schedule-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}
/* =========================================================
   GAME CARD
========================================================= */
.game-card {
    overflow: hidden;
    border:
        1px solid var(--line);
    border-radius: 16px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );
    transition:
        transform .15s ease,
        border-color .15s ease;
}
.game-card:active {
    transform: scale(.985);
}
.game-card.win {
    border-left:
        3px solid var(--red);
}
.game-card.loss {
    border-left:
        3px solid #59677d;
}
/* =========================================================
   CARD TOP
========================================================= */
.game-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding:
        10px 13px 4px;
}
.date {
    display: flex;
    align-items: baseline;
    gap: 6px;
}
.date-day {
    font-size: 23px;
    font-weight: 850;
    line-height: 1;
}
.date-weekday {
    color: var(--muted);
    font-size: 8px;
    font-weight: 700;
}
.result-label {
    font-size: 8px;
    font-weight: 850;
    letter-spacing: .6px;
    color: var(--muted);
}
.result-label.win {
    color: var(--red);
}
/* =========================================================
   MATCHUP
========================================================= */
.matchup {
    display: grid;
    grid-template-columns:
        1fr 72px 1fr;
    align-items: center;
    padding:
        5px 13px 12px;
}
.team {
    min-width: 0;
}
.team.away {
    text-align: left;
}
.team.home {
    text-align: right;
}
.team-code {
    font-size: 25px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.5px;
}
.team-name {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 7px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
/* =========================================================
   CENTER
========================================================= */
.game-center {
    text-align: center;
}
.score {
    font-size: 25px;
    line-height: 1;
    font-weight: 900;
}
.result {
    display: block;
    margin-top: 4px;
    font-size: 8px;
    font-weight: 850;
}
.result.win {
    color: var(--red);
}
.result.loss {
    color: #8d99aa;
}
.start-time {
    font-size: 15px;
    font-weight: 850;
}
.start-caption {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 7px;
    font-weight: 700;
}
/* =========================================================
   VENUE
========================================================= */
.venue {
    display: flex;
    align-items: center;
    gap: 8px;
    padding:
        9px 13px;
    border-top:
        1px solid
        var(--line);
}
.venue-mark {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background:
        rgba(227,25,55,.10);
    color: var(--red);
    font-size: 9px;
}
.venue-info {
    min-width: 0;
}
.venue-name {
    font-size: 9px;
    font-weight: 750;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.venue-location {
    margin-top: 2px;
    color: var(--muted);
    font-size: 7px;
}
/* =========================================================
   DETAILS
========================================================= */
.game-details {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition:
        max-height .25s ease,
        opacity .2s ease;
}
.game-card.open
.game-details {
    max-height: 800px;
    opacity: 1;
}
/* =========================================================
   DETAILS INNER
========================================================= */
.details-inner {
    padding:
        0 13px 14px;
}
/* =========================================================
   DETAIL TITLE
========================================================= */
.detail-title {
    margin:
        13px 0 8px;
    color: var(--muted);
    font-size: 8px;
    font-weight: 850;
    letter-spacing: .8px;
}
/* =========================================================
   INNING SCORE
========================================================= */
.score-table-wrap {
    overflow-x: auto;
    border:
        1px solid var(--line);
    border-radius: 10px;
}
.score-table {
    width: 100%;
    min-width: 300px;
    border-collapse: collapse;
}
.score-table th,
.score-table td {
    height: 28px;
    padding: 0 4px;
    text-align: center;
    font-size: 8px;
}
.score-table th {
    color: var(--muted);
    background:
        rgba(255,255,255,.025);
    font-weight: 700;
}
.score-table td {
    border-top:
        1px solid
        rgba(255,255,255,.04);
    font-weight: 750;
}
.score-table .team-cell {
    width: 42px;
    text-align: left;
    padding-left: 7px;
    font-weight: 900;
}
.score-table .runs {
    font-weight: 900;
    background:
        rgba(227,25,55,.07);
}
/* =========================================================
   PITCHING
========================================================= */
.pitching-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.pitcher {
    display: flex;
    align-items: center;
    gap: 5px;
    padding:
        6px 8px;
    border-radius: 8px;
    background:
        rgba(255,255,255,.045);
}
.pitcher-index {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background:
        var(--red);
    font-size: 7px;
    font-weight: 900;
}
.pitcher-name {
    font-size: 9px;
    font-weight: 750;
}
/* =========================================================
   UPCOMING
========================================================= */
.upcoming-note {
    color: var(--muted);
    font-size: 8px;
}
/* =========================================================
   EMPTY / ERROR
========================================================= */
.message {
    padding:
        45px 15px;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
}
/* =========================================================
   BOTTOM NAV
   Home / Player と統一
========================================================= */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 200;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 5px
        env(safe-area-inset-bottom);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
.nav-item {
    flex: 1;
    min-width: 0;
    height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    color: var(--muted);
    border-radius: 13px;
    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}
.nav-item:active {
    transform: scale(.94);
}
.nav-item.active {
    color: white;
    background:
        rgba(227,25,55,.13);
}
.nav-icon {
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
}
.nav-item.active
.nav-icon {
    color: var(--red);
}
.nav-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .45px;
    white-space: nowrap;
}
/* =========================================================
   SMALL IPHONE
========================================================= */
@media (max-width: 360px) {
    .header {
        height: 68px;
    }
    main {
        padding-top: 68px;
    }
    .page {
        padding-left: 11px;
        padding-right: 11px;
    }
    .nav-label {
        font-size: 9px;
    }
}
</style>
</head>
<body>
<header class="header"></header>
<main>
<section class="page">
    <div class="page-heading">
        <h1>
            Schedule
        </h1>
        <p>
            PHILADELPHIA PHILLIES
        </p>
    </div>
    <div class="month-selector">
        <button
            class="month-button"
            id="prev-month"
            aria-label="Previous month">
            ‹
        </button>
        <div class="month-current">
            <span
                class="month-name"
                id="month-name">
                —
            </span>
            <span
                class="month-games"
                id="month-games">
                —
            </span>
        </div>
        <button
            class="month-button"
            id="next-month"
            aria-label="Next month">
            ›
        </button>
    </div>
    <div
        class="schedule-list"
        id="schedule-list">
        <div class="message">
            Loading...
        </div>
    </div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
===================================================== -->
<nav class="bottom-nav">
    <a
        href="index.html"
        class="nav-item">
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <a
        href="player.html"
        class="nav-item">
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <a
        href="stats.html"
        class="nav-item">
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
    <a
        href="fact.html"
        class="nav-item">
        <div class="nav-icon">
            ◆
        </div>
        <div class="nav-label">
            FACT
        </div>
    </a>
    <a
        href="schedule.html"
        class="nav-item active">
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
</nav>
<script>
/* =========================================================
   CONFIG
========================================================= */
const DATA_URL =
    "data/schedule.json";
const MONTH_NAMES = [
    "",
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
];
let games = [];
/* =========================================================
   初期月
========================================================= */
const now =
    new Date();
let currentYear =
    2026;
let currentMonth =
    now.getFullYear() === 2026
        ? now.getMonth() + 1
        : 1;
/* =========================================================
   ELEMENTS
========================================================= */
const list =
    document.getElementById(
        "schedule-list"
    );
const monthName =
    document.getElementById(
        "month-name"
    );
const monthGames =
    document.getElementById(
        "month-games"
    );
/* =========================================================
   ESCAPE
========================================================= */
function escapeHtml(value) {
    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
/* =========================================================
   DATE
========================================================= */
function getDateInfo(
    dateString
) {
    const date =
        new Date(dateString);
    return {
        year:
            date.getFullYear(),
        month:
            date.getMonth() + 1,
        day:
            date.getDate(),
        weekday:
            date.toLocaleDateString(
                "en-US",
                {
                    weekday: "short"
                }
            ),
        time:
            date.toLocaleTimeString(
                "en-US",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            )
    };
}
/* =========================================================
   INNING SCORE
========================================================= */
function renderScoreTable(
    game
) {
    const innings =
        game.inningScores || [];
    if (!innings.length) {
        return `
            <div class="upcoming-note">
                Inning score unavailable
            </div>
        `;
    }
    const philliesHome =
        game.homeAway === "HOME";
    const inningHeaders =
        innings.map(
            inning =>
                `<th>${inning.inning}</th>`
        ).join("");
    const philliesRuns =
        innings.map(
            inning => {
                const runs =
                    philliesHome
                        ? inning.homeRuns
                        : inning.awayRuns;
                return `
                    <td>
                        ${runs ?? "—"}
                    </td>
                `;
            }
        ).join("");
    const opponentRuns =
        innings.map(
            inning => {
                const runs =
                    philliesHome
                        ? inning.awayRuns
                        : inning.homeRuns;
                return `
                    <td>
                        ${runs ?? "—"}
                    </td>
                `;
            }
        ).join("");
    const opponent =
        game.opponent || {};
    return `
        <div class="score-table-wrap">
            <table class="score-table">
                <thead>
                    <tr>
                        <th></th>
                        ${inningHeaders}
                        <th>R</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td
                            class="team-cell">
                            PHI
                        </td>
                        ${philliesRuns}
                        <td class="runs">
                            ${
                                game.philliesScore
                                ?? "—"
                            }
                        </td>
                    </tr>
                    <tr>
                        <td
                            class="team-cell">
                            ${
                                escapeHtml(
                                    opponent.abbreviation
                                    || "OPP"
                                )
                            }
                        </td>
                        ${opponentRuns}
                        <td class="runs">
                            ${
                                game.opponentScore
                                ?? "—"
                            }
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
}
/* =========================================================
   PITCHING
========================================================= */
function renderPitching(
    game
) {
    const pitchers =
        game.philliesPitching || [];
    if (!pitchers.length) {
        return "";
    }
    const pitcherHtml =
        pitchers.map(
            (pitcher, index) => `
                <div class="pitcher">
                    <span
                        class="pitcher-index">
                        ${index + 1}
                    </span>
                    <span
                        class="pitcher-name">
                        ${
                            escapeHtml(
                                pitcher.lastName
                            )
                        }
                    </span>
                </div>
            `
        ).join("");
    return `
        <div>
            <div class="detail-title">
                PHILLIES PITCHING
            </div>
            <div class="pitching-list">
                ${pitcherHtml}
            </div>
        </div>
    `;
}
/* =========================================================
   CARD
========================================================= */
function renderGame(
    game
) {
    const date =
        getDateInfo(
            game.gameDate
        );
    const opponent =
        game.opponent || {};
    const isFinal =
        game.status?.abstract ===
        "Final";
    let cardClass = "";
    let resultText =
        game.status?.detailed
        || "UPCOMING";
    if (
        game.result === "W"
    ) {
        cardClass = "win";
        resultText = "WIN";
    }
    else if (
        game.result === "L"
    ) {
        cardClass = "loss";
        resultText = "LOSS";
    }
    else if (isFinal) {
        resultText = "FINAL";
    }
    let centerHtml;
    if (isFinal) {
        centerHtml = `
            <div class="game-center">
                <div class="score">
                    ${
                        game.philliesScore
                        ?? "—"
                    }
                    —
                    ${
                        game.opponentScore
                        ?? "—"
                    }
                </div>
                <span
                    class="result ${
                        game.result === "W"
                            ? "win"
                            : game.result === "L"
                                ? "loss"
                                : ""
                    }">
                    ${resultText}
                </span>
            </div>
        `;
    }
    else {
        centerHtml = `
            <div class="game-center">
                <div class="start-time">
                    ${date.time}
                </div>
                <span
                    class="start-caption">
                    FIRST PITCH
                </span>
            </div>
        `;
    }
    const venue =
        game.venue || {};
    const location = [
        venue.city,
        venue.state,
        venue.country
    ]
    .filter(Boolean)
    .join(", ");
    return `
        <article
            class="game-card ${cardClass}"
            data-game-pk="${
                game.gamePk
            }">
            <div class="game-top">
                <div class="date">
                    <span
                        class="date-day">
                        ${date.day}
                    </span>
                    <span
                        class="date-weekday">
                        ${date.weekday}
                    </span>
                </div>
                <span
                    class="result-label ${
                        game.result === "W"
                            ? "win"
                            : ""
                    }">
                    ${escapeHtml(
                        resultText
                    )}
                </span>
            </div>
            <div class="matchup">
                ${
                    game.homeAway === "AWAY"
                        ? `
                            <div
                                class="team away">
                                <div
                                    class="team-code">
                                    PHI
                                </div>
                                <span
                                    class="team-name">
                                    PHILADELPHIA
                                </span>
                            </div>
                        `
                        : `
                            <div
                                class="team away">
                                <div
                                    class="team-code">
                                    ${
                                        escapeHtml(
                                            opponent.abbreviation
                                            || "OPP"
                                        )
                                    }
                                </div>
                                <span
                                    class="team-name">
                                    ${
                                        escapeHtml(
                                            opponent.name
                                            || ""
                                        )
                                    }
                                </span>
                            </div>
                        `
                }
                ${centerHtml}
                ${
                    game.homeAway === "HOME"
                        ? `
                            <div
                                class="team home">
                                <div
                                    class="team-code">
                                    PHI
                                </div>
                                <span
                                    class="team-name">
                                    PHILADELPHIA
                                </span>
                            </div>
                        `
                        : `
                            <div
                                class="team home">
                                <div
                                    class="team-code">
                                    ${
                                        escapeHtml(
                                            opponent.abbreviation
                                            || "OPP"
                                        )
                                    }
                                </div>
                                <span
                                    class="team-name">
                                    ${
                                        escapeHtml(
                                            opponent.name
                                            || ""
                                        )
                                    }
                                </span>
                            </div>
                        `
                }
            </div>
            <div class="venue">
                <div class="venue-mark">
                    ◆
                </div>
                <div class="venue-info">
                    <div class="venue-name">
                        ${
                            escapeHtml(
                                venue.name
                                || "Venue TBD"
                            )
                        }
                    </div>
                    <div
                        class="venue-location">
                        ${
                            escapeHtml(
                                location
                            )
                        }
                    </div>
                </div>
            </div>
            ${
                isFinal
                    ? `
                        <div
                            class="game-details">
                            <div
                                class="details-inner">
                                <div
                                    class="detail-title">
                                    INNING SCORE
                                </div>
                                ${renderScoreTable(
                                    game
                                )}
                                ${renderPitching(
                                    game
                                )}
                            </div>
                        </div>
                    `
                    : ""
            }
        </article>
    `;
}
/* =========================================================
   RENDER MONTH
========================================================= */
function render() {
    const filtered =
        games.filter(
            game => {
                const date =
                    getDateInfo(
                        game.gameDate
                    );
                return (
                    date.year ===
                        currentYear
                    &&
                    date.month ===
                        currentMonth
                );
            }
        );
    monthName.textContent =
        `${MONTH_NAMES[currentMonth]} ${currentYear}`;
    monthGames.textContent =
        `${filtered.length} GAMES`;
    if (!filtered.length) {
        list.innerHTML = `
            <div class="message">
                NO GAMES THIS MONTH
            </div>
        `;
        return;
    }
    list.innerHTML =
        filtered
            .map(renderGame)
            .join("");
    /*
     * 終了試合だけタップで展開
     */
    document
        .querySelectorAll(
            ".game-card"
        )
        .forEach(
            card => {
                const details =
                    card.querySelector(
                        ".game-details"
                    );
                if (!details) {
                    return;
                }
                card.addEventListener(
                    "click",
                    () => {
                        card.classList.toggle(
                            "open"
                        );
                    }
                );
            }
        );
}
/* =========================================================
   LOAD
========================================================= */
async function loadSchedule() {
    try {
        const response =
            await fetch(
                `${DATA_URL}?t=${Date.now()}`
            );
        if (!response.ok) {
            throw new Error(
                "Failed to load schedule"
            );
        }
        const data =
            await response.json();
        games =
            Array.isArray(
                data.games
            )
                ? data.games
                : [];
        render();
    }
    catch (error) {
        console.error(
            error
        );
        list.innerHTML = `
            <div class="message">
                SCHEDULE DATA ERROR
            </div>
        `;
    }
}
/* =========================================================
   MONTH BUTTONS
========================================================= */
document
    .getElementById(
        "prev-month"
    )
    .addEventListener(
        "click",
        () => {
            currentMonth--;
            if (
                currentMonth < 1
            ) {
                currentMonth = 12;
                currentYear--;
            }
            render();
        }
    );
document
    .getElementById(
        "next-month"
    )
    .addEventListener(
        "click",
        () => {
            currentMonth++;
            if (
                currentMonth > 12
            ) {
                currentMonth = 1;
                currentYear++;
            }
            render();
        }
    );
/* =========================================================
   START
========================================================= */
loadSchedule();
</script>
</body>
</html>
