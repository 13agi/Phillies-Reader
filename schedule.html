<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
>
<title>Schedule</title>
<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>
<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>
<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --navy: #07152b;
    --navy-2: #0b1c38;
    --red: #e31937;
    --white: #ffffff;
    --muted: #64748b;
    --line:
        rgba(255,255,255,.075);
}
/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color:
        transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background:
        var(--navy);
}
body {
    color:
        var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =========================================================
   HEADER
   INDEX / PLAYER と統一
========================================================= */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    overflow: hidden;
    background:
        linear-gradient(
            115deg,
            #b90f2e 0%,
            #e31937 38%,
            #ef233c 65%,
            #c8102e 100%
        );
    box-shadow:
        0 7px 22px
        rgba(0,0,0,.30);
}
.header::before {
    content: "";
    position: absolute;
    top: -120px;
    right: -55px;
    width: 300px;
    height: 300px;
    transform:
        rotate(27deg);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.015)
        );
    border-left:
        1px solid
        rgba(255,255,255,.16);
    pointer-events:
        none;
}
.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background:
        linear-gradient(
            90deg,
            #07152b 0%,
            #07152b 18%,
            rgba(7,21,43,.35) 45%,
            rgba(255,255,255,.28) 72%,
            transparent 100%
        );
    pointer-events:
        none;
}
.header-navy-shape {
    position: absolute;
    top: -20px;
    left: 43%;
    width: 130px;
    height: 130px;
    transform:
        rotate(25deg);
    background:
        rgba(7,21,43,.16);
    pointer-events:
        none;
}
.header-line-one {
    position: absolute;
    left: -20px;
    bottom: 14px;
    width: 55%;
    height: 2px;
    transform:
        skewX(-35deg);
    background:
        rgba(255,255,255,.34);
    pointer-events:
        none;
}
.header-line-two {
    position: absolute;
    left: 4%;
    bottom: 8px;
    width: 35%;
    height: 1px;
    transform:
        skewX(-35deg);
    background:
        rgba(255,255,255,.18);
    pointer-events:
        none;
}
.header-light {
    position: absolute;
    top: -85px;
    right: 20px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,.06) 35%,
            transparent 72%
        );
    pointer-events:
        none;
}
/* =========================================================
   MAIN
========================================================= */
main {
    min-height:
        100vh;
    padding-top:
        72px;
}
.page {
    width: 100%;
    padding:
        21px 14px 35px;
}
/* =========================================================
   PAGE HEADING
========================================================= */
.page-heading {
    margin-bottom:
        17px;
}
.page-heading h1 {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        31px;
    font-weight:
        800;
    line-height:
        .95;
    letter-spacing:
        -.5px;
}
.page-heading p {
    margin-top:
        6px;
    color:
        var(--muted);
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        1.4px;
}
/* =========================================================
   MONTH SELECTOR
========================================================= */
.month-selector {
    width: 100%;
    height: 59px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    padding:
        0 7px;
    margin-bottom:
        19px;
    border:
        1px solid
        var(--line);
    border-radius:
        15px;
    background:
        rgba(255,255,255,.035);
}
.month-button {
    width: 43px;
    height: 43px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border: 0;
    border-radius:
        11px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.70);
    font-size:
        25px;
}
.month-button:active {
    transform:
        scale(.92);
}
.month-center {
    flex: 1;
    text-align:
        center;
}
.month {
    display:
        block;
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        20px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.month-sub {
    display:
        block;
    margin-top:
        2px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        700;
    letter-spacing:
        1.2px;
}
/* =========================================================
   SCHEDULE LIST
========================================================= */
.schedule-list {
    display:
        flex;
    flex-direction:
        column;
    gap:
        11px;
}
/* =========================================================
   GAME CARD
========================================================= */
.game-card {
    position:
        relative;
    overflow:
        hidden;
    width:
        100%;
    border:
        1px solid
        var(--line);
    border-radius:
        16px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );
    box-shadow:
        0 8px 24px
        rgba(0,0,0,.12);
    cursor:
        pointer;
    transition:
        transform .15s ease,
        border-color .15s ease;
}
.game-card:active {
    transform:
        scale(.985);
}
.game-card.expanded {
    border-color:
        rgba(227,25,55,.35);
}
.game-card::before {
    content: "";
    position:
        absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width:
        4px;
    background:
        rgba(255,255,255,.10);
}
.game-card.win::before {
    background:
        var(--red);
}
.game-card.loss::before {
    background:
        #64748b;
}
/* =========================================================
   GAME TOP
========================================================= */
.game-top {
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    padding:
        13px 14px 7px 16px;
}
.game-date {
    display:
        flex;
    align-items:
        baseline;
    gap:
        7px;
}
.game-day {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        25px;
    font-weight:
        800;
    line-height:
        1;
}
.game-weekday {
    color:
        var(--muted);
    font-size:
        9px;
    font-weight:
        700;
    letter-spacing:
        .7px;
}
.game-status {
    padding:
        4px 8px;
    border-radius:
        6px;
    background:
        rgba(255,255,255,.05);
    color:
        rgba(255,255,255,.50);
    font-size:
        7px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.game-card.win
.game-status {
    color:
        var(--red);
    background:
        rgba(227,25,55,.10);
}
.game-card.loss
.game-status {
    color:
        #94a3b8;
}
/* =========================================================
   MATCHUP
========================================================= */
.matchup {
    display:
        grid;
    grid-template-columns:
        1fr auto 1fr;
    align-items:
        center;
    gap:
        10px;
    padding:
        7px 16px 13px;
}
.team {
    min-width:
        0;
}
.team.away {
    text-align:
        left;
}
.team.home {
    text-align:
        right;
}
.team-code {
    display:
        block;
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        27px;
    font-weight:
        900;
    line-height:
        .95;
}
.team-name {
    display:
        block;
    margin-top:
        4px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        700;
    white-space:
        nowrap;
    overflow:
        hidden;
    text-overflow:
        ellipsis;
}
/* =========================================================
   SCORE
========================================================= */
.score {
    min-width:
        61px;
    text-align:
        center;
}
.score-main {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        28px;
    font-weight:
        900;
    letter-spacing:
        1px;
}
.score-divider {
    color:
        rgba(255,255,255,.18);
    font-size:
        12px;
    margin:
        0 2px;
}
.result {
    display:
        inline-block;
    margin-top:
        4px;
    font-size:
        8px;
    font-weight:
        900;
    letter-spacing:
        1px;
}
.result.win {
    color:
        var(--red);
}
.result.loss {
    color:
        #94a3b8;
}
/* =========================================================
   FUTURE GAME
========================================================= */
.future-time {
    text-align:
        center;
}
.future-time strong {
    display:
        block;
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        23px;
    font-weight:
        900;
}
.future-time span {
    display:
        block;
    margin-top:
        3px;
    color:
        var(--muted);
    font-size:
        7px;
    font-weight:
        700;
    letter-spacing:
        .8px;
}
/* =========================================================
   VENUE
========================================================= */
.venue {
    display:
        flex;
    align-items:
        center;
    gap:
        8px;
    padding:
        10px 16px 13px;
    border-top:
        1px solid
        rgba(255,255,255,.045);
}
.venue-icon {
    width:
        25px;
    height:
        25px;
    flex-shrink:
        0;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border-radius:
        7px;
    background:
        rgba(255,255,255,.04);
    color:
        var(--red);
    font-size:
        11px;
}
.venue-info {
    min-width:
        0;
}
.venue-name {
    display:
        block;
    font-size:
        10px;
    font-weight:
        800;
    white-space:
        nowrap;
    overflow:
        hidden;
    text-overflow:
        ellipsis;
}
.venue-location {
    display:
        block;
    margin-top:
        2px;
    color:
        var(--muted);
    font-size:
        8px;
}
/* =========================================================
   HOME / AWAY LABEL
========================================================= */
.game-label {
    position:
        absolute;
    top: 0;
    right: 0;
    padding:
        4px 8px;
    border-radius:
        0 0 0 8px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.30);
    font-size:
        6px;
    font-weight:
        800;
    letter-spacing:
        1px;
}
/* =========================================================
   DETAIL
========================================================= */
.game-detail {
    display:
        none;
    border-top:
        1px solid
        rgba(255,255,255,.07);
    background:
        rgba(0,0,0,.10);
}
.game-card.expanded
.game-detail {
    display:
        block;
}
.detail-section {
    padding:
        13px 15px;
}
.detail-title {
    margin-bottom:
        9px;
    color:
        rgba(255,255,255,.45);
    font-size:
        8px;
    font-weight:
        800;
    letter-spacing:
        1.2px;
}
/* =========================================================
   INNING SCORE
========================================================= */
.inning-table {
    width:
        100%;
    overflow-x:
        auto;
}
.inning-row {
    display:
        grid;
    grid-template-columns:
        40px repeat(
            var(--innings),
            minmax(24px, 1fr)
        ) 34px;
    min-width:
        max-content;
    align-items:
        center;
}
.inning-row + .inning-row {
    margin-top:
        5px;
}
.inning-cell {
    text-align:
        center;
    color:
        rgba(255,255,255,.65);
    font-size:
        8px;
    font-weight:
        700;
}
.inning-row.header
.inning-cell {
    color:
        rgba(255,255,255,.30);
    font-size:
        7px;
}
.inning-row.total
.inning-cell {
    color:
        var(--white);
    font-size:
        9px;
    font-weight:
        900;
}
/* =========================================================
   PITCHERS
========================================================= */
.pitcher-list {
    display:
        flex;
    flex-wrap:
        wrap;
    gap:
        6px;
}
.pitcher {
    padding:
        7px 9px;
    border:
        1px solid
        rgba(255,255,255,.06);
    border-radius:
        8px;
    background:
        rgba(255,255,255,.035);
    font-size:
        9px;
    font-weight:
        700;
}
.no-data {
    color:
        rgba(255,255,255,.30);
    font-size:
        9px;
}
/* =========================================================
   BOTTOM NAV
   INDEX / PLAYER と統一
   並び順固定
========================================================= */
.bottom-nav {
    position:
        fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index:
        999;
    height:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
    padding:
        7px 5px
        env(safe-area-inset-bottom);
    display:
        flex;
    align-items:
        flex-start;
    justify-content:
        space-between;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
.nav-item {
    flex:
        1;
    min-width:
        0;
    height:
        60px;
    display:
        flex;
    flex-direction:
        column;
    align-items:
        center;
    justify-content:
        center;
    gap:
        5px;
    text-decoration:
        none;
    color:
        #64748b;
    border-radius:
        13px;
    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}
.nav-item:active {
    transform:
        scale(.94);
}
.nav-item.active {
    color:
        #ffffff;
    background:
        rgba(227,25,55,.13);
}
.nav-icon {
    width:
        25px;
    height:
        25px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        18px;
    font-weight:
        700;
    line-height:
        1;
}
.nav-item.active
.nav-icon {
    color:
        #e31937;
}
.nav-label {
    font-family:
        "Barlow Condensed",
        sans-serif;
    font-size:
        10px;
    font-weight:
        700;
    line-height:
        1;
    letter-spacing:
        .45px;
    white-space:
        nowrap;
}
/* =========================================================
   EMPTY
========================================================= */
.empty {
    padding:
        50px 20px;
    text-align:
        center;
    color:
        var(--muted);
    font-size:
        11px;
}
/* =========================================================
   SMALL IPHONE
========================================================= */
@media (
    max-width: 360px
) {
    .header {
        height:
            68px;
    }
    main {
        padding-top:
            68px;
    }
    .page {
        padding-left:
            11px;
        padding-right:
            11px;
    }
    .team-code {
        font-size:
            25px;
    }
    .score-main {
        font-size:
            26px;
    }
    .game-day {
        font-size:
            23px;
    }
    .nav-label {
        font-size:
            9px;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     HEADER
===================================================== -->
<header class="header">
    <div class="header-navy-shape"></div>
    <div class="header-line-one"></div>
    <div class="header-line-two"></div>
    <div class="header-light"></div>
</header>
<!-- =====================================================
     MAIN
===================================================== -->
<main>
<section class="page">
    <div class="page-heading">
        <h1>
            Schedule
        </h1>
        <p>
            2026 REGULAR SEASON
        </p>
    </div>
    <div class="month-selector">
        <button
            type="button"
            class="month-button"
            id="prev-month"
        >
            ‹
        </button>
        <div class="month-center">
            <span
                class="month"
                id="month-name"
            >
                AUGUST 2026
            </span>
            <span class="month-sub">
                REGULAR SEASON
            </span>
        </div>
        <button
            type="button"
            class="month-button"
            id="next-month"
        >
            ›
        </button>
    </div>
    <div
        class="schedule-list"
        id="schedule-list"
    ></div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
     順番は絶対固定
===================================================== -->
<nav class="bottom-nav">
    <!-- 1 SCHEDULE -->
    <a
        href="schedule.html"
        class="nav-item active"
    >
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
    <!-- 2 SCORE -->
    <a
        href="score.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ●
        </div>
        <div class="nav-label">
            SCORE
        </div>
    </a>
    <!-- 3 HOME -->
    <a
        href="index.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <!-- 4 PLAYER -->
    <a
        href="player.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <!-- 5 STATS -->
    <a
        href="stats.html"
        class="nav-item"
    >
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
</nav>
<script>
/* =========================================================
   CONFIG
========================================================= */
const DATA_URL =
    "data/update-schedule.json";
/* =========================================================
   ELEMENTS
========================================================= */
const scheduleList =
    document.getElementById(
        "schedule-list"
    );
const monthName =
    document.getElementById(
        "month-name"
    );
const previousButton =
    document.getElementById(
        "prev-month"
    );
const nextButton =
    document.getElementById(
        "next-month"
    );
/* =========================================================
   STATE
========================================================= */
let scheduleData = [];
const now =
    new Date();
let currentYear =
    now.getFullYear();
let currentMonth =
    now.getMonth();
/* =========================================================
   MONTH NAMES
========================================================= */
const monthNames = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
];
/* =========================================================
   WEEKDAYS
========================================================= */
const weekdays = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
];
/* =========================================================
   ESCAPE
========================================================= */
function escapeHTML(value) {
    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }
    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
/* =========================================================
   LOAD JSON
========================================================= */
async function loadSchedule() {
    try {
        const response =
            await fetch(
                DATA_URL,
                {
                    cache:
                        "no-store"
                }
            );
        if (
            !response.ok
        ) {
            throw new Error(
                "Schedule JSON could not be loaded."
            );
        }
        const data =
            await response.json();
        if (
            Array.isArray(data)
        ) {
            scheduleData =
                data;
        }
        else if (
            Array.isArray(
                data.games
            )
        ) {
            scheduleData =
                data.games;
        }
        else {
            scheduleData =
                [];
        }
        renderSchedule();
    }
    catch (error) {
        console.error(
            error
        );
        scheduleList.innerHTML = `
            <div class="empty">
                Schedule data could not be loaded.
            </div>
        `;
    }
}
/* =========================================================
   MONTH TITLE
========================================================= */
function updateMonthTitle() {
    monthName.textContent =
        `${monthNames[currentMonth]} ${currentYear}`;
}
/* =========================================================
   DATE
========================================================= */
function parseGameDate(game) {
    if (
        !game ||
        !game.date
    ) {
        return null;
    }
    const date =
        new Date(
            `${game.date}T12:00:00`
        );
    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }
    return date;
}
/* =========================================================
   MONTH FILTER
========================================================= */
function getGamesForMonth() {
    return scheduleData
        .filter(
            game => {
                const date =
                    parseGameDate(
                        game
                    );
                if (!date) {
                    return false;
                }
                return (
                    date.getFullYear()
                    ===
                    currentYear
                    &&
                    date.getMonth()
                    ===
                    currentMonth
                );
            }
        )
        .sort(
            (
                a,
                b
            ) => {
                return String(
                    a.date
                ).localeCompare(
                    String(
                        b.date
                    )
                );
            }
        );
}
/* =========================================================
   GAME TIME
========================================================= */
function formatGameTime(game) {
    if (
        !game.gameDate
    ) {
        return "";
    }
    const date =
        new Date(
            game.gameDate
        );
    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }
    return date.toLocaleTimeString(
        "en-US",
        {
            hour:
                "numeric",
            minute:
                "2-digit",
            hour12:
                true,
            timeZone:
                "America/New_York"
        }
    );
}
/* =========================================================
   VENUE LOCATION
========================================================= */
function formatVenueLocation(venue) {
    if (!venue) {
        return "";
    }
    const parts = [];
    if (
        venue.city
    ) {
        parts.push(
            venue.city
        );
    }
    if (
        venue.stateAbbrev
    ) {
        parts.push(
            venue.stateAbbrev
        );
    }
    else if (
        venue.state
    ) {
        parts.push(
            venue.state
        );
    }
    return parts.join(
        ", "
    );
}
/* =========================================================
   OPPONENT
========================================================= */
function getOpponent(game) {
    return (
        game.opponent ||
        {}
    );
}
function getOpponentCode(game) {
    return (
        getOpponent(game)
            .abbreviation
        ||
        getOpponent(game)
            .code
        ||
        ""
    );
}
function getOpponentName(game) {
    return (
        getOpponent(game)
            .name
        ||
        ""
    );
}
/* =========================================================
   SCORE
========================================================= */
function getPhilliesScore(game) {
    return (
        game.phillies?.score
        ??
        game.philliesScore
        ??
        "-"
    );
}
function getOpponentScore(game) {
    return (
        game.opponent?.score
        ??
        game.opponentScore
        ??
        "-"
    );
}
/* =========================================================
   STATUS
========================================================= */
function getStatus(game) {
    const raw =
        String(
            game.status ||
            ""
        ).toLowerCase();
    if (
        raw === "final"
        ||
        raw === "completed"
        ||
        raw === "gameover"
    ) {
        return "FINAL";
    }
    if (
        raw === "live"
        ||
        raw === "in progress"
    ) {
        return "LIVE";
    }
    return "UPCOMING";
}
/* =========================================================
   LOCATION
========================================================= */
function getLocation(game) {
    const value =
        String(
            game.location ||
            game.homeAway ||
            ""
        ).toUpperCase();
    if (
        value === "HOME"
    ) {
        return "HOME";
    }
    return "AWAY";
}
/* =========================================================
   INNING SCORES
========================================================= */
function renderInningScores(game) {
    const innings =
        Array.isArray(
            game.inningScores
        )
            ? game.inningScores
            : [];
    if (
        innings.length === 0
    ) {
        return `
            <div class="detail-section">
                <div class="detail-title">
                    INNING SCORE
                </div>
                <div class="no-data">
                    No inning data available.
                </div>
            </div>
        `;
    }
    const count =
        innings.length;
    let header = `
        <div
            class="inning-row header"
            style="--innings:${count}"
        >
            <div class="inning-cell"></div>
    `;
    innings.forEach(
        (
            inning,
            index
        ) => {
            header += `
                <div class="inning-cell">
                    ${escapeHTML(
                        inning.inning
                        ??
                        index + 1
                    )}
                </div>
            `;
        }
    );
    header += `
            <div class="inning-cell">
                R
            </div>
        </div>
    `;
    const location =
        getLocation(
            game
        );
    let opponentRow = `
        <div
            class="inning-row"
            style="--innings:${count}"
        >
            <div class="inning-cell">
                ${escapeHTML(
                    getOpponentCode(
                        game
                    ) ||
                    "OPP"
                )}
            </div>
    `;
    let philliesRow = `
        <div
            class="inning-row"
            style="--innings:${count}"
        >
            <div class="inning-cell">
                PHI
            </div>
    `;
    let opponentTotal = 0;
    let philliesTotal = 0;
    innings.forEach(
        inning => {
            const away =
                Number(
                    inning.away ??
                    0
                );
            const home =
                Number(
                    inning.home ??
                    0
                );
            let opponentRuns;
            let philliesRuns;
            if (
                location === "HOME"
            ) {
                opponentRuns =
                    away;
                philliesRuns =
                    home;
            }
            else {
                opponentRuns =
                    home;
                philliesRuns =
                    away;
            }
            opponentTotal +=
                opponentRuns;
            philliesTotal +=
                philliesRuns;
            opponentRow += `
                <div class="inning-cell">
                    ${opponentRuns}
                </div>
            `;
            philliesRow += `
                <div class="inning-cell">
                    ${philliesRuns}
                </div>
            `;
        }
    );
    opponentRow += `
            <div class="inning-cell">
                ${opponentTotal}
            </div>
        </div>
    `;
    philliesRow += `
            <div class="inning-cell">
                ${philliesTotal}
            </div>
        </div>
    `;
    return `
        <div class="detail-section">
            <div class="detail-title">
                INNING SCORE
            </div>
            <div class="inning-table">
                ${header}
                ${
                    location === "HOME"
                    ? philliesRow
                    : opponentRow
                }
                ${
                    location === "HOME"
                    ? opponentRow
                    : philliesRow
                }
            </div>
        </div>
    `;
}
/* =========================================================
   PHILLIES PITCHERS
========================================================= */
function renderPitchers(game) {
    const pitchers =
        Array.isArray(
            game.philliesPitchers
        )
            ? game.philliesPitchers
            : [];
    if (
        pitchers.length === 0
    ) {
        return `
            <div class="detail-section">
                <div class="detail-title">
                    PHILLIES PITCHING
                </div>
                <div class="no-data">
                    No pitching data available.
                </div>
            </div>
        `;
    }
    const html =
        pitchers
            .map(
                pitcher => {
                    let name = "";
                    if (
                        typeof pitcher ===
                        "string"
                    ) {
                        name =
                            pitcher;
                    }
                    else {
                        name =
                            pitcher.name
                            ||
                            pitcher.fullName
                            ||
                            pitcher.playerName
                            ||
                            "";
                    }
                    return `
                        <div class="pitcher">
                            ${escapeHTML(
                                name
                            )}
                        </div>
                    `;
                }
            )
            .join("");
    return `
        <div class="detail-section">
            <div class="detail-title">
                PHILLIES PITCHING
            </div>
            <div class="pitcher-list">
                ${html}
            </div>
        </div>
    `;
}
/* =========================================================
   DETAIL
========================================================= */
function renderDetail(game) {
    return `
        <div class="game-detail">
            ${renderInningScores(
                game
            )}
            ${renderPitchers(
                game
            )}
        </div>
    `;
}
/* =========================================================
   GAME CARD
========================================================= */
function renderGame(game) {
    const date =
        parseGameDate(
            game
        );
    if (!date) {
        return null;
    }
    const day =
        date.getDate();
    const weekday =
        weekdays[
            date.getDay()
        ];
    const location =
        getLocation(
            game
        );
    const status =
        getStatus(
            game
        );
    const result =
        String(
            game.result ||
            ""
        ).toUpperCase();
    let cardClass = "";
    if (
        result === "W"
    ) {
        cardClass =
            "win";
    }
    else if (
        result === "L"
    ) {
        cardClass =
            "loss";
    }
    const isCompleted =
        status === "FINAL";
    let centerHTML;
    if (
        isCompleted ||
        status === "LIVE"
    ) {
        centerHTML = `
            <div class="score">
                <span class="score-main">
                    ${escapeHTML(
                        getPhilliesScore(
                            game
                        )
                    )}
                    <span class="score-divider">
                        —
                    </span>
                    ${escapeHTML(
                        getOpponentScore(
                            game
                        )
                    )}
                </span>
                ${
                    result === "W"
                    ?
                    `
                    <span class="result win">
                        WIN
                    </span>
                    `
                    :
                    result === "L"
                    ?
                    `
                    <span class="result loss">
                        LOSS
                    </span>
                    `
                    :
                    ""
                }
            </div>
        `;
    }
    else {
        centerHTML = `
            <div class="future-time">
                <strong>
                    ${escapeHTML(
                        formatGameTime(
                            game
                        ) ||
                        "--:--"
                    )}
                </strong>
                <span>
                    FIRST PITCH
                </span>
            </div>
        `;
    }
    const card =
        document.createElement(
            "article"
        );
    card.className =
        `game-card ${cardClass}`;
    card.innerHTML = `
        <div class="game-label">
            ${location}
        </div>
        <div class="game-top">
            <div class="game-date">
                <span class="game-day">
                    ${day}
                </span>
                <span class="game-weekday">
                    ${weekday}
                </span>
            </div>
            <div class="game-status">
                ${status}
            </div>
        </div>
        <div class="matchup">
            <div class="team away">
                <span class="team-code">
                    ${
                        location === "AWAY"
                        ? "PHI"
                        : escapeHTML(
                            getOpponentCode(
                                game
                            )
                        )
                    }
                </span>
                <span class="team-name">
                    ${
                        location === "AWAY"
                        ? "PHILADELPHIA"
                        : escapeHTML(
                            getOpponentName(
                                game
                            )
                        )
                    }
                </span>
            </div>
            ${centerHTML}
            <div class="team home">
                <span class="team-code">
                    ${
                        location === "HOME"
                        ? "PHI"
                        : escapeHTML(
                            getOpponentCode(
                                game
                            )
                        )
                    }
                </span>
                <span class="team-name">
                    ${
                        location === "HOME"
                        ? "PHILADELPHIA"
                        : escapeHTML(
                            getOpponentName(
                                game
                            )
                        )
                    }
                </span>
            </div>
        </div>
        <div class="venue">
            <div class="venue-icon">
                ◆
            </div>
            <div class="venue-info">
                <span class="venue-name">
                    ${escapeHTML(
                        game.venue?.name
                        ||
                        game.venueName
                        ||
                        "Venue"
                    )}
                </span>
                <span class="venue-location">
                    ${escapeHTML(
                        formatVenueLocation(
                            game.venue
                        )
                        ||
                        game.venueLocation
                        ||
                        ""
                    )}
                </span>
            </div>
        </div>
        ${renderDetail(
            game
        )}
    `;
    card.addEventListener(
        "click",
        function () {
            card.classList.toggle(
                "expanded"
            );
        }
    );
    return card;
}
/* =========================================================
   RENDER
========================================================= */
function renderSchedule() {
    updateMonthTitle();
    scheduleList.innerHTML =
        "";
    const games =
        getGamesForMonth();
    if (
        games.length === 0
    ) {
        scheduleList.innerHTML = `
            <div class="empty">
                No games scheduled
                for this month.
            </div>
        `;
        return;
    }
    games.forEach(
        game => {
            const card =
                renderGame(
                    game
                );
            if (card) {
                scheduleList.appendChild(
                    card
                );
            }
        }
    );
}

   PREVIOUS MONTH
========================================================= */
previousButton.addEventListener(
    "click",
    function () {
        if (
            currentMonth === 0
        ) {
            currentMonth =
                11;
            currentYear--;
        }
        else {
            currentMonth--;
        }
        renderSchedule();
    }
);

        if (
            currentMonth === 11
        ) {
            currentMonth =
                0;
            currentYear++;
        }
        else {
            currentMonth++;
        }
