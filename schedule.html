<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">
<title>Schedule</title>
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --navy: #07152b;
    --navy-2: #0b1c38;
    --red: #e31937;
    --white: #ffffff;
    --muted: #718096;
    --line:
        rgba(255,255,255,.075);
}
/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color:
        transparent;
}
html,
body {
    width: 100%;
    min-height: 100%;
    background:
        var(--navy);
}
body {
    color:
        var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );
}
/* =========================================================
   TOP HEADER
========================================================= */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 76px;
    background:
        var(--red);
}
/* =========================================================
   MAIN
========================================================= */
main {
    min-height:
        100vh;
    padding-top:
        76px;
}
.page {
    width: 100%;
    padding:
        21px 14px 35px;
}
/* =========================================================
   PAGE TITLE
========================================================= */
.page-heading {
    margin-bottom:
        17px;
}
.page-heading h1 {
    font-size:
        31px;
    font-weight:
        800;
    line-height:
        .95;
    letter-spacing:
        -.5px;
}
.page-heading p {
    margin-top:
        6px;
    color:
        var(--muted);
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        1.4px;
}
/* =========================================================
   MONTH SELECTOR
========================================================= */
.month-selector {
    width: 100%;
    height: 59px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    padding:
        0 7px;
    margin-bottom:
        19px;
    border:
        1px solid
        var(--line);
    border-radius:
        15px;
    background:
        rgba(255,255,255,.035);
}
.month-button {
    width: 43px;
    height: 43px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border:
        0;
    border-radius:
        11px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.70);
    font-size:
        25px;
    cursor:
        pointer;
}
.month-button:active {
    transform:
        scale(.92);
}
.month-center {
    flex:
        1;
    text-align:
        center;
}
.month {
    display:
        block;
    font-size:
        20px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.month-sub {
    display:
        block;
    margin-top:
        2px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        700;
    letter-spacing:
        1.2px;
}
/* =========================================================
   SCHEDULE LIST
========================================================= */
.schedule-list {
    display:
        flex;
    flex-direction:
        column;
    gap:
        11px;
}
/* =========================================================
   GAME CARD
========================================================= */
.game-card {
    position:
        relative;
    overflow:
        hidden;
    width:
        100%;
    border:
        1px solid
        var(--line);
    border-radius:
        16px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );
    box-shadow:
        0 8px 24px
        rgba(0,0,0,.12);
}
.game-card::before {
    content: "";
    position:
        absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background:
        rgba(255,255,255,.10);
}
.game-card.win::before {
    background:
        var(--red);
}
.game-card.loss::before {
    background:
        #64748b;
}
/* =========================================================
   GAME TOP
========================================================= */
.game-top {
    display:
        flex;
    align-items:
        center;
    justify-content:
        space-between;
    padding:
        13px 14px 7px 16px;
}
.game-date {
    display:
        flex;
    align-items:
        baseline;
    gap:
        7px;
}
.game-day {
    font-size:
        25px;
    font-weight:
        800;
    line-height:
        1;
}
.game-weekday {
    color:
        var(--muted);
    font-size:
        9px;
    font-weight:
        700;
    letter-spacing:
        .7px;
}
.game-status {
    padding:
        4px 8px;
    border-radius:
        6px;
    background:
        rgba(255,255,255,.05);
    color:
        rgba(255,255,255,.50);
    font-size:
        7px;
    font-weight:
        800;
    letter-spacing:
        .8px;
}
.game-card.win
.game-status {
    color:
        var(--red);
    background:
        rgba(227,25,55,.10);
}
.game-card.loss
.game-status {
    color:
        #94a3b8;
}
/* =========================================================
   MATCHUP
========================================================= */
.matchup {
    display:
        grid;
    grid-template-columns:
        1fr auto 1fr;
    align-items:
        center;
    gap:
        10px;
    padding:
        7px 16px 13px;
}
.team {
    min-width:
        0;
}
.team.away {
    text-align:
        left;
}
.team.home {
    text-align:
        right;
}
.team-code {
    display:
        block;
    font-size:
        29px;
    font-weight:
        900;
    line-height:
        .95;
}
.team-name {
    display:
        block;
    margin-top:
        4px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        700;
    white-space:
        nowrap;
    overflow:
        hidden;
    text-overflow:
        ellipsis;
}
/* =========================================================
   SCORE
========================================================= */
.score {
    min-width:
        61px;
    text-align:
        center;
}
.score-main {
    font-size:
        30px;
    font-weight:
        900;
    letter-spacing:
        1px;
}
.score-divider {
    color:
        rgba(255,255,255,.18);
    font-size:
        12px;
    margin:
        0 2px;
}
.result {
    display:
        inline-block;
    margin-top:
        4px;
    font-size:
        8px;
    font-weight:
        900;
    letter-spacing:
        1px;
}
.result.win {
    color:
        var(--red);
}
.result.loss {
    color:
        #94a3b8;
}
/* =========================================================
   FUTURE GAME
========================================================= */
.future-time {
    text-align:
        center;
}
.future-time strong {
    display:
        block;
    font-size:
        24px;
    font-weight:
        900;
}
.future-time span {
    display:
        block;
    margin-top:
        3px;
    color:
        var(--muted);
    font-size:
        7px;
    font-weight:
        700;
    letter-spacing:
        .8px;
}
/* =========================================================
   VENUE
========================================================= */
.venue {
    display:
        flex;
    align-items:
        center;
    gap:
        8px;
    padding:
        10px 16px 13px;
    border-top:
        1px solid
        rgba(255,255,255,.045);
}
.venue-icon {
    width:
        25px;
    height:
        25px;
    flex-shrink:
        0;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border-radius:
        7px;
    background:
        rgba(255,255,255,.04);
    color:
        var(--red);
    font-size:
        11px;
}
.venue-info {
    min-width:
        0;
}
.venue-name {
    display:
        block;
    font-size:
        10px;
    font-weight:
        800;
    white-space:
        nowrap;
    overflow:
        hidden;
    text-overflow:
        ellipsis;
}
.venue-location {
    display:
        block;
    margin-top:
        2px;
    color:
        var(--muted);
    font-size:
        8px;
}
/* =========================================================
   HOME / AWAY
========================================================= */
.game-label {
    position:
        absolute;
    top: 0;
    right: 0;
    padding:
        4px 8px;
    border-radius:
        0 0 0 8px;
    background:
        rgba(255,255,255,.035);
    color:
        rgba(255,255,255,.30);
    font-size:
        6px;
    font-weight:
        800;
    letter-spacing:
        1px;
}
/* =========================================================
   GAME DETAILS
========================================================= */
.game-details {
    display:
        none;
    padding:
        0 14px 15px;
}
.game-card.open
.game-details {
    display:
        block;
}
.detail-section {
    margin-top:
        13px;
}
.detail-title {
    margin-bottom:
        8px;
    color:
        var(--muted);
    font-size:
        8px;
    font-weight:
        800;
    letter-spacing:
        1px;
}
/* =========================================================
   INNING SCORE
========================================================= */
.inning-wrap {
    width:
        100%;
    overflow-x:
        auto;
    border:
        1px solid
        var(--line);
    border-radius:
        10px;
}
.inning-table {
    width:
        100%;
    min-width:
        300px;
    border-collapse:
        collapse;
}
.inning-table th,
.inning-table td {
    height:
        27px;
    padding:
        0 4px;
    text-align:
        center;
    font-size:
        8px;
}
.inning-table th {
    color:
        var(--muted);
    background:
        rgba(255,255,255,.025);
    font-weight:
        700;
}
.inning-table td {
    border-top:
        1px solid
        rgba(255,255,255,.04);
    font-weight:
        750;
}
.inning-table .team-cell {
    width:
        42px;
    text-align:
        left;
    padding-left:
        7px;
    font-weight:
        900;
}
.inning-table .total {
    font-weight:
        900;
    background:
        rgba(227,25,55,.07);
}
/* =========================================================
   PITCHING
========================================================= */
.pitching-list {
    display:
        flex;
    flex-wrap:
        wrap;
    gap:
        6px;
}
.pitcher {
    display:
        flex;
    align-items:
        center;
    gap:
        6px;
    padding:
        6px 8px;
    border-radius:
        8px;
    background:
        rgba(255,255,255,.045);
}
.pitcher-number {
    width:
        16px;
    height:
        16px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    border-radius:
        50%;
    background:
        var(--red);
    font-size:
        7px;
    font-weight:
        900;
}
.pitcher-name {
    font-size:
        9px;
    font-weight:
        750;
}
/* =========================================================
   BOTTOM NAV
   サイズをHome / Player基準に調整
========================================================= */
.bottom-nav {
    position:
        fixed;
    left:
        0;
    right:
        0;
    bottom:
        0;
    z-index:
        999;
    height:
        calc(
            72px +
            env(safe-area-inset-bottom)
        );
    padding:
        5px 6px
        env(safe-area-inset-bottom);
    display:
        flex;
    align-items:
        flex-start;
    justify-content:
        space-between;
    background:
        rgba(5,16,34,.97);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    border-top:
        1px solid
        rgba(255,255,255,.08);
}
/* =========================================================
   NAV ITEM
========================================================= */
.nav-item {
    flex:
        1;
    max-width:
        88px;
    height:
        58px;
    display:
        flex;
    flex-direction:
        column;
    align-items:
        center;
    justify-content:
        center;
    gap:
        4px;
    text-decoration:
        none;
    color:
        #64748b;
    border-radius:
        12px;
    cursor:
        pointer;
}
.nav-item:active {
    transform:
        scale(.94);
}
.nav-item.active {
    color:
        var(--white);
    background:
        rgba(227,25,55,.13);
}
.nav-icon {
    width:
        23px;
    height:
        23px;
    display:
        flex;
    align-items:
        center;
    justify-content:
        center;
    font-size:
        17px;
    font-weight:
        700;
}
.nav-item.active
.nav-icon {
    color:
        var(--red);
}
.nav-label {
    font-size:
        10px;
    font-weight:
        700;
    letter-spacing:
        .55px;
    white-space:
        nowrap;
}
/* =========================================================
   SMALL IPHONE
========================================================= */
@media (
    max-width: 360px
) {
    .header {
        height:
            70px;
    }
    main {
        padding-top:
            70px;
    }
    .page {
        padding-left:
            11px;
        padding-right:
            11px;
    }
    .team-code {
        font-size:
            26px;
    }
    .score-main {
        font-size:
            27px;
    }
    .game-day {
        font-size:
            23px;
    }
    .nav-item {
        max-width:
            72px;
    }
    .nav-label {
        font-size:
            9px;
    }
}
/* =========================================================
   NO DATA
========================================================= */
.no-data {
    padding:
        45px 15px;
    text-align:
        center;
    color:
        var(--muted);
    font-size:
        10px;
    font-weight:
        700;
}
</style>
</head>
<body>
<header class="header"></header>
<main>
<section class="page">
    <div class="page-heading">
        <h1>
            Schedule
        </h1>
        <p>
            2026 REGULAR SEASON
        </p>
    </div>
    <div class="month-selector">
        <button
            type="button"
            class="month-button"
            id="prev-month">
            ‹
        </button>
        <div class="month-center">
            <span
                class="month"
                id="month-name">
                AUGUST 2026
            </span>
            <span
                class="month-sub">
                REGULAR SEASON
            </span>
        </div>
        <button
            type="button"
            class="month-button"
            id="next-month">
            ›
        </button>
    </div>
    <div
        class="schedule-list"
        id="schedule-list">
        <div class="no-data">
            Loading...
        </div>
    </div>
</section>
</main>
<!-- =====================================================
     BOTTOM NAV
===================================================== -->
<nav class="bottom-nav">
    <a
        href="schedule.html"
        class="nav-item active">
        <div class="nav-icon">
            ▣
        </div>
        <div class="nav-label">
            SCHEDULE
        </div>
    </a>
    <a
        href="score.html"
        class="nav-item">
        <div class="nav-icon">
            ●
        </div>
        <div class="nav-label">
            SCORE
        </div>
    </a>
    <a
        href="index.html"
        class="nav-item">
        <div class="nav-icon">
            ⌂
        </div>
        <div class="nav-label">
            HOME
        </div>
    </a>
    <a
        href="player.html"
        class="nav-item">
        <div class="nav-icon">
            ♟
        </div>
        <div class="nav-label">
            PLAYER
        </div>
    </a>
    <a
        href="stats.html"
        class="nav-item">
        <div class="nav-icon">
            ▥
        </div>
        <div class="nav-label">
            STATS
        </div>
    </a>
</nav>
<script>
/* =========================================================
   CONFIG
========================================================= */
const DATA_URL =
    "data/schedule.json";
/* =========================================================
   STATE
========================================================= */
const today =
    new Date();
let currentYear =
    2026;
let currentMonth =
    8;
let games = [];
/* =========================================================
   ELEMENT
========================================================= */
const list =
    document.getElementById(
        "schedule-list"
    );
const monthName =
    document.getElementById(
        "month-name"
    );
/* =========================================================
   MONTHS
========================================================= */
const months = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
];
/* =========================================================
   SAFE TEXT
========================================================= */
function safe(
    value,
    fallback = ""
) {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }
    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
/* =========================================================
   DATE
========================================================= */
function parseDate(
    game
) {
    const value =
        game.gameDate ||
        game.date ||
        game.dateTime;
    if (!value) {
        return null;
    }
    const date =
        new Date(value);
    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }
    return date;
}
function weekday(
    date
) {
    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "short"
        }
    );
}
function timeString(
    date
) {
    return date.toLocaleTimeString(
        "en-US",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );
}
/* =========================================================
   GAME STATUS
========================================================= */
function isFinal(
    game
) {
    const status =
        String(
            game.status ||
            game.statusCode ||
            game.abstractGameState ||
            ""
        ).toLowerCase();
    return (
        status === "final" ||
        status === "f" ||
        status.includes("final")
    );
}
function getResult(
    game
) {
    if (
        game.result === "W" ||
        game.result === "L"
    ) {
        return game.result;
    }
    const result =
        String(
            game.result ||
            game.outcome ||
            ""
        ).toUpperCase();
    if (
        result === "W" ||
        result === "L"
    ) {
        return result;
    }
    return "";
}
/* =========================================================
   TEAM
========================================================= */
function teamInfo(
    game,
    side
) {
    const team =
        game[side] ||
        game[
            side === "away"
                ? "awayTeam"
                : "homeTeam"
        ] ||
        {};
    return {
        abbreviation:
            team.abbreviation ||
            team.abbr ||
            team.code ||
            "",
        name:
            team.name ||
            team.teamName ||
            ""
    };
}
/* =========================================================
   VENUE
========================================================= */
function venueInfo(
    game
) {
    const venue =
        game.venue ||
        {};
    const name =
        typeof venue === "string"
            ? venue
            : (
                venue.name ||
                venue.venueName ||
                game.venueName ||
                ""
            );
    const city =
        typeof venue === "object"
            ? (
                venue.city ||
                ""
            )
            : "";
    const state =
        typeof venue === "object"
            ? (
                venue.state ||
                venue.stateAbbreviation ||
                ""
            )
            : "";
    return {
        name,
        location:
            [city, state]
                .filter(Boolean)
                .join(", ")
    };
}
/* =========================================================
   SCORE
========================================================= */
function scoreValue(
    game,
    side
) {
    const team =
        game[side] ||
        game[
            side === "away"
                ? "awayTeam"
                : "homeTeam"
        ] ||
        {};
    const value =
        team.score ??
        game[
            side === "away"
                ? "awayScore"
                : "homeScore"
        ];
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }
    return Number(value);
}
/* =========================================================
   PHILLIES SIDE
========================================================= */
function getPhilliesSide(
    game
) {
    const away =
        teamInfo(
            game,
            "away"
        );
    const home =
        teamInfo(
            game,
            "home"
        );
    const awayIsPhillies =
        (
            away.abbreviation ||
            ""
        ).toUpperCase() === "PHI"
        ||
        (
            away.name ||
            ""
        ).toLowerCase()
            .includes("philadelphia");
    return awayIsPhillies
        ? "away"
        : "home";
}
/* =========================================================
   PITCHERS
========================================================= */
function getPitchers(
    game
) {
    const candidates =
        game.philliesPitching ||
        game.philliesPitchers ||
        game.pitchers ||
        game.pitching ||
        [];
    if (
        !Array.isArray(
            candidates
        )
    ) {
        return [];
    }
    return candidates.map(
        pitcher => {
            if (
                typeof pitcher ===
                "string"
            ) {
                return pitcher;
            }
            return (
                pitcher.lastName ||
                pitcher.last_name ||
                pitcher.lastname ||
                pitcher.name ||
                ""
            );
        }
    )
    .filter(Boolean);
}
/* =========================================================
   INNING SCORES
========================================================= */
function getInnings(
    game
) {
    return (
        game.inningScores ||
        game.innings ||
        game.linescore ||
        []
    );
}
/* =========================================================
   RENDER INNING TABLE
========================================================= */
function renderInnings(
    game
) {
    const innings =
        getInnings(game);
    if (
        !Array.isArray(
            innings
        ) ||
        !innings.length
    ) {
        return "";
    }
    const philliesSide =
        getPhilliesSide(
            game
        );
    const opponentSide =
        philliesSide === "away"
            ? "home"
            : "away";
    const phillies =
        innings.map(
            inning => {
                const value =
                    philliesSide === "away"
                        ? (
                            inning.awayRuns ??
                            inning.away ??
                            inning.awayScore ??
                            0
                        )
                        : (
                            inning.homeRuns ??
                            inning.home ??
                            inning.homeScore ??
                            0
                        );
                return `
                    <td>
                        ${safe(value)}
                    </td>
                `;
            }
        )
        .join("");
    const opponent =
        innings.map(
            inning => {
                const value =
                    opponentSide === "away"
                        ? (
                            inning.awayRuns ??
                            inning.away ??
                            inning.awayScore ??
                            0
                        )
                        : (
                            inning.homeRuns ??
                            inning.home ??
                            inning.homeScore ??
                            0
                        );
                return `
                    <td>
                        ${safe(value)}
                    </td>
                `;
            }
        )
        .join("");
    const headers =
        innings.map(
            (inning, index) => {
                const number =
                    inning.inning ??
                    inning.num ??
                    inning.number ??
                    index + 1;
                return `
                    <th>
                        ${safe(number)}
                    </th>
                `;
            }
        )
        .join("");
    const phiTotal =
        scoreValue(
            game,
            philliesSide
        );
    const oppTotal =
        scoreValue(
            game,
            opponentSide
        );
    const opponentTeam =
        teamInfo(
            game,
            opponentSide
        );
    return `
        <div class="detail-section">
            <div class="detail-title">
                INNING SCORE
            </div>
            <div class="inning-wrap">
                <table
                    class="inning-table">
                    <thead>
                        <tr>
                            <th></th>
                            ${headers}
                            <th>R</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td
                                class="team-cell">
                                PHI
                            </td>
                            ${phillies}
                            <td class="total">
                                ${safe(
                                    phiTotal,
                                    "—"
                                )}
                            </td>
                        </tr>
                        <tr>
                            <td
                                class="team-cell">
                                ${safe(
                                    opponentTeam.abbreviation,
                                    "OPP"
                                )}
                            </td>
                            ${opponent}
                            <td class="total">
                                ${safe(
                                    oppTotal,
                                    "—"
                                )}
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    `;
}
/* =========================================================
   RENDER PITCHING
========================================================= */
function renderPitching(
    game
) {
    const pitchers =
        getPitchers(game);
    if (
        !pitchers.length
    ) {
        return "";
    }
    return `
        <div class="detail-section">
            <div class="detail-title">
                PHILLIES PITCHING
            </div>
            <div class="pitching-list">
                ${
                    pitchers.map(
                        (
                            name,
                            index
                        ) => `
                            <div
                                class="pitcher">
                                <span
                                    class="pitcher-number">
                                    ${
                                        index + 1
                                    }
                                </span>
                                <span
                                    class="pitcher-name">
                                    ${safe(name)}
                                </span>
                            </div>
                        `
                    ).join("")
                }
            </div>
        </div>
    `;
}
/* =========================================================
   RENDER GAME
========================================================= */
function renderGame(
    game
) {
    const date =
        parseDate(game);
    if (!date) {
        return "";
    }
    const away =
        teamInfo(
            game,
            "away"
        );
    const home =
        teamInfo(
            game,
            "home"
        );
    const final =
        isFinal(game);
    const result =
        getResult(game);
    const awayScore =
        scoreValue(
            game,
            "away"
        );
    const homeScore =
        scoreValue(
            game,
            "home"
        );
    const venue =
        venueInfo(game);
    const philliesSide =
        getPhilliesSide(game);
    const cardClass =
        result === "W"
            ? "win"
            : result === "L"
                ? "loss"
                : "";
    let centerHtml = "";
    if (final) {
        centerHtml = `
            <div class="score">
                <span
                    class="score-main">
                    ${safe(
                        awayScore,
                        "—"
                    )}
                    <span
                        class="score-divider">
                        —
                    </span>
                    ${safe(
                        homeScore,
                        "—"
                    )}
                </span>
                ${
                    result
                        ? `
                            <span
                                class="result ${
                                    result === "W"
                                        ? "win"
                                        : "loss"
                                }">
                                ${
                                    result === "W"
                                        ? "WIN"
                                        : "LOSS"
                                }
                            </span>
                        `
                        : ""
                }
            </div>
        `;
    }
    else {
        centerHtml = `
            <div
                class="future-time">
                <strong>
                    ${safe(
                        timeString(date),
                        "TBD"
                    )}
                </strong>
                <span>
                    FIRST PITCH
                </span>
            </div>
        `;
    }
    const details =
        final
            ? `
                <div
                    class="game-details">
                    ${renderInnings(game)}
                    ${renderPitching(game)}
                </div>
            `
            : "";
    return `
        <article
            class="game-card ${cardClass}"
            data-game-id="${
                safe(
                    game.gamePk ||
                    game.id ||
                    ""
                )
            }">
            <div class="game-label">
                ${
                    philliesSide === "away"
                        ? "AWAY"
                        : "HOME"
                }
            </div>
            <div class="game-top">
                <div class="game-date">
                    <span
                        class="game-day">
                        ${date.getDate()}
                    </span>
                    <span
                        class="game-weekday">
                        ${weekday(date)}
                    </span>
                </div>
                <div class="game-status">
                    ${
                        final
                            ? (
                                result === "W"
                                    ? "FINAL · W"
                                    : result === "L"
                                        ? "FINAL · L"
                                        : "FINAL"
                            )
                            : "UPCOMING"
                    }
                </div>
            </div>
            <div class="matchup">
                <div class="team away">
                    <span class="team-code">
                        ${safe(
                            away.abbreviation,
                            "—"
                        )}
                    </span>
                    <span class="team-name">
                        ${safe(
                            away.name
                        )}
                    </span>
                </div>
                ${centerHtml}
                <div class="team home">
                    <span class="team-code">
                        ${safe(
                            home.abbreviation,
                            "—"
                        )}
                    </span>
                    <span class="team-name">
                        ${safe(
                            home.name
                        )}
                    </span>
                </div>
            </div>
            <div class="venue">
                <div class="venue-icon">
                    ◆
                </div>
                <div class="venue-info">
                    <span class="venue-name">
                        ${safe(
                            venue.name,
                            "Venue TBD"
                        )}
                    </span>
                    <span class="venue-location">
                        ${safe(
                            venue.location
                        )}
                    </span>
                </div>
            </div>
            ${details}
        </article>
    `;
}
/* =========================================================
   FILTER
========================================================= */
function renderSchedule() {
    const filtered =
        games
            .filter(
                game => {
                    const date =
                        parseDate(game);
                    if (!date) {
                        return false;
                    }
                    return (
                        date.getFullYear()
                            ===
                            currentYear
                        &&
                        date.getMonth() + 1
                            ===
                            currentMonth
                    );
                }
            )
            .sort(
                (
                    a,
                    b
                ) => {
                    return (
                        parseDate(a) -
                        parseDate(b)
                    );
                }
            );
    monthName.textContent =
        `${
            months[
                currentMonth - 1
            ]
        } ${currentYear}`;
    if (
        !filtered.length
    ) {
        list.innerHTML = `
            <div class="no-data">
                NO GAMES
            </div>
        `;
        return;
    }
    list.innerHTML =
        filtered
            .map(renderGame)
            .join("");
    /*
     * 終了試合だけ展開可能
     */
    document
        .querySelectorAll(
            ".game-card"
        )
        .forEach(
            card => {
                const details =
                    card.querySelector(
                        ".game-details"
                    );
                if (!details) {
                    return;
                }
                card.addEventListener(
                    "click",
                    () => {
                        card.classList.toggle(
                            "open"
                        );
                    }
                );
            }
        );
}
/* =========================================================
   LOAD JSON
========================================================= */
async function loadSchedule() {
    try {
        const response =
            await fetch(
                `${DATA_URL}?t=${Date.now()}`
            );
        if (
            !response.ok
        ) {
            throw new Error(
                "Schedule JSON could not be loaded."
            );
        }
        const data =
            await response.json();
        if (
            Array.isArray(data)
        ) {
            games = data;
        }
        else if (
            Array.isArray(
                data.games
            )
        ) {
            games =
                data.games;
        }
        else if (
            Array.isArray(
                data.schedule
            )
        ) {
            games =
                data.schedule;
        }
        else {
            games = [];
        }
        renderSchedule();
    }
    catch (error) {
        console.error(
            error
        );
        list.innerHTML = `
            <div class="no-data">
                SCHEDULE DATA ERROR
            </div>
        `;
    }
}
/* =========================================================
   MONTH BUTTON
========================================================= */
document
    .getElementById(
        "prev-month"
    )
    .addEventListener(
        "click",
        function () {
            currentMonth--;
            if (
                currentMonth < 1
            ) {
                currentMonth = 12;
                currentYear--;
            }
            renderSchedule();
        }
    );
document
    .getElementById(
        "next-month"
    )
    .addEventListener(
        "click",
        function () {
            currentMonth++;
            if (
                currentMonth > 12
            ) {
                currentMonth = 1;
                currentYear++;
            }
            renderSchedule();
        }
    );
/* =========================================================
   START
========================================================= */
loadSchedule();
</script>
